<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141416">
<title>传文件 · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* 收件页：客户用项目的收件链接（/up/#令牌）把分轨、参考、压缩包直接传给刀大厨，分块直传到 stats.cumusic.work */
:root{--bg:#141416;--fill:rgba(236,234,230,.05);--fill-2:rgba(236,234,230,.09);--hair:rgba(236,234,230,.1);--text:#e3e0da;--text-2:#a5a29c;--text-3:#77746f;--ok:#9cc4a4;--warn:#e2b07a;--red:#e9a19a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:radial-gradient(120vw 60vh at 50% -10vh,rgba(236,234,230,.06),transparent 60%),var(--bg);color:var(--text);font:16px/1.7 var(--font);-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;padding:calc(44px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(44px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.kind{font-size:12px;letter-spacing:.16em;color:var(--text-3)}
h1{font-size:24px;line-height:1.35;font-weight:600;margin-top:4px;text-wrap:balance}
.by{color:var(--text-2);margin-top:2px}
label{display:flex;flex-direction:column;gap:6px;color:var(--text-2);font-size:14px}
input[type=text],textarea{font:16px/1.5 var(--font);color:var(--text);background:var(--fill);border:1px solid var(--hair);border-radius:12px;padding:11px 14px;outline:none;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:rgba(236,234,230,.28)}
.drop{border:1.5px dashed rgba(236,234,230,.22);border-radius:16px;padding:30px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;transition:background .15s,border-color .15s}
.drop.on{background:var(--fill-2);border-color:rgba(236,234,230,.45)}
.drop b{font-size:18px;font-weight:600}
.drop span{color:var(--text-3);font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:600 16px/1 var(--font);border-radius:999px;padding:13px 20px;border:0;cursor:pointer;color:#141416;background:var(--text);transition:transform .12s,opacity .15s}
button:active{transform:scale(.97)}
button.ghost{background:var(--fill-2);color:var(--text)}
button:disabled{opacity:.4;cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.f{background:var(--fill);border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;gap:6px}
.f .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.f .n{overflow-wrap:anywhere}
.f .s{color:var(--text-3);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.f .s.ok{color:var(--ok)}.f .s.bad{color:var(--red)}
.bar{height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--text-2);transition:width .2s}
.f.done .bar{display:none}
.tip{color:var(--text-2);text-align:center}
.tip.ok{color:var(--ok);font-weight:600}
.bad{color:var(--red)}
.foot{color:var(--text-3);font-size:13px;text-align:center;letter-spacing:.12em;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <div class="kind">CU MUSIC · 传文件</div>
    <h1 id="t">…</h1>
    <div class="by" id="a"></div>
  </header>
  <section id="box" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <label>你的名字<input type="text" id="who" maxlength="30" placeholder="方便对上是谁传的"></label>
      <div class="drop" id="drop">
        <b>把文件拖到这里</b>
        <span>分轨、参考、压缩包都可以，一次可选多个</span>
        <div class="btns"><button type="button" id="pick">选文件</button><button type="button" class="ghost" id="pickD">选文件夹</button></div>
      </div>
      <label>备注（可不填）<textarea id="note" rows="2" maxlength="300" placeholder="例如：第 3 首的人声分轨，BPM 92"></textarea></label>
      <div class="list" id="list"></div>
      <p class="tip" id="tip"></p>
    </div>
  </section>
  <p class="tip bad" id="err" hidden></p>
  <div class="foot">CU MUSIC</div>
</main>
<input type="file" id="fi" multiple hidden>
<input type="file" id="fd" webkitdirectory multiple hidden>
<script>
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://stats.cumusic.work';
const T = location.hash.slice(1).replace(/[^a-z0-9]/g, '').slice(0, 12), $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sz = n => n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : n >= 1048576 ? Math.round(n / 1048576) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const fail = m => { $('box').hidden = true; $('err').hidden = false; $('err').textContent = m; };
try { $('who').value = localStorage.getItem('up:who') || ''; } catch (e) {}
$('who').oninput = () => { try { localStorage.setItem('up:who', $('who').value.trim()); } catch (e) {} };

(async () => {
  if (!T) return fail('链接不完整，请向刀大厨要一条新的');
  const j = await fetch(API + '/inbox/info?t=' + T).then(r => r.json()).catch(() => null);
  if (!j) return fail('网络连不上，刷新再试');
  if (!j.ok) { $('t').textContent = '链接已失效'; return fail('请向刀大厨要一条新的上传链接'); }
  $('t').textContent = j.title; $('a').textContent = j.artist; document.title = '传文件 · ' + j.title; $('box').hidden = false;
})();

const Q = []; let running = false, sent = 0;
const add = files => {
  for (const f of files) {
    if (!f.size || /^\./.test(f.name) || f.name === 'Thumbs.db') continue;   // 跳过 .DS_Store 这类系统文件
    const el = document.createElement('div'); el.className = 'f';
    const name = (f.webkitRelativePath || f.name);
    el.innerHTML = `<div class="r"><span class="n">${esc(name)}</span><span class="s">${sz(f.size)} · 等待</span></div><div class="bar"><i></i></div>`;
    $('list').appendChild(el); Q.push({ f, name, el });
  }
  run();
};
const put = (url, blob, onp) => new Promise((ok, no) => { const x = new XMLHttpRequest(); x.open('PUT', url);
  x.upload.onprogress = e => e.lengthComputable && onp(e.loaded);
  x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} x.status === 200 && j.etag ? ok(j.etag) : no(new Error(x.status)); };
  x.onerror = () => no(new Error('net')); x.send(blob); });
const post = (p, b) => fetch(API + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.json()).catch(() => ({ ok: false, e: 'net' }));

async function one(it, last) {
  const st = it.el.querySelector('.s'), bar = it.el.querySelector('.bar i'), f = it.f;
  const s = await post('/inbox/start', { t: T, name: it.name, size: f.size, who: $('who').value.trim() });
  if (!s.ok) { st.className = 's bad'; st.textContent = s.e === 'full' ? '空间满了，请联系刀大厨' : s.e === 'link' ? '链接已失效' : '没传上，稍后再试'; return false; }
  const n = Math.ceil(f.size / s.part), parts = [];
  try {
    for (let i = 0; i < n; i++) {
      const blob = f.slice(i * s.part, Math.min(f.size, (i + 1) * s.part)); let etag = null;
      for (let k = 0; k < 4 && !etag; k++) {   // 网络抖一下：同一块最多重试 3 次
        try { etag = await put(API + '/inbox/part?t=' + T + '&id=' + s.id + '&u=' + encodeURIComponent(s.uploadId) + '&n=' + (i + 1), blob,
          b => { const p = (i * s.part + b) / f.size; bar.style.width = (p * 100).toFixed(1) + '%'; st.textContent = sz(f.size) + ' · ' + Math.floor(p * 100) + '%'; }); }
        catch (e) { if (k === 3) throw e; await new Promise(r => setTimeout(r, 1500 * (k + 1))); }
      }
      parts.push({ partNumber: i + 1, etag });
    }
    const d = await post('/inbox/done', { t: T, id: s.id, uploadId: s.uploadId, parts, note: $('note').value.trim(), last });
    if (!d.ok) throw new Error('done');
    it.el.classList.add('done'); st.className = 's ok'; st.textContent = sz(f.size) + ' · 已送达'; return true;
  } catch (e) {
    post('/inbox/done', { t: T, id: s.id, uploadId: s.uploadId, parts: [], abort: 1 });
    st.className = 's bad'; st.textContent = '断了，没传上'; return false;
  }
}
async function run() {
  if (running) return; running = true; let bad = 0;
  $('tip').className = 'tip'; $('tip').textContent = '上传中，传完之前别关这个页面';
  while (Q.length) { const it = Q.shift(); if (await one(it, !Q.length)) sent++; else bad++; }
  running = false;
  $('tip').className = bad ? 'tip bad' : 'tip ok';
  $('tip').textContent = bad ? bad + ' 个没传上，可以重新选一次' : '全部送达 ✓ 共 ' + sent + ' 个文件，刀大厨会收到通知';
}
$('pick').onclick = () => $('fi').click(); $('pickD').onclick = () => $('fd').click();
$('fi').onchange = () => { add([...$('fi').files]); $('fi').value = ''; };
$('fd').onchange = () => { add([...$('fd').files]); $('fd').value = ''; };
const dz = $('drop');
['dragenter', 'dragover'].forEach(k => dz.addEventListener(k, e => { e.preventDefault(); dz.classList.add('on'); }));
['dragleave', 'drop'].forEach(k => dz.addEventListener(k, e => { e.preventDefault(); dz.classList.remove('on'); }));
// 拖进来的是文件夹：一层层读出里面的文件，保留文件夹结构
const walk = (en, pre) => new Promise(ok => {
  if (en.isFile) return en.file(f => { try { Object.defineProperty(f, 'webkitRelativePath', { value: pre + f.name }); } catch (e) {} ok([f]); }, () => ok([]));
  const rd = en.createReader(), all = [];
  const next = () => rd.readEntries(async es => { if (!es.length) { const out = []; for (const e of all) out.push(...await walk(e, pre + en.name + '/')); return ok(out); } all.push(...es); next(); }, () => ok([]));
  next();
});
dz.addEventListener('drop', async e => {
  const items = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (items.length) { const fs = []; for (const en of items) fs.push(...await walk(en, '')); add(fs); }
  else add([...e.dataTransfer.files]);
});
window.addEventListener('beforeunload', e => { if (running) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
