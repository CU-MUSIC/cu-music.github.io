<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>Chef's Table · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap">
<style>
/* 沿用 price 页的设计系统：#080808 黑底、#f0f0f0 浅色主按钮、墨绿只做点缀。
   交互的主角是 CU 标：开场画出来 → 退成底纹 → 外圈跟着表单填写长出来 → 内圈是上传进度 → 画满后轻轻一弹 */
:root{
  --bg:#080808; --surface:#111111; --lift:#151515; --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.2);
  --text:#f0f0f0; --text-2:#9a9a9a; --text-3:#7d7d7d;
  --cta-bg:#f0f0f0; --cta-fg:#0a0a0a;
  --green-soft:#8fc3a9; --green-line:rgba(96,176,134,.35); --green-fill:rgba(96,176,134,.14);
  --warn:#d99;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.36,.64,1); --r:14px;
  --font:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;caret-color:var(--green-soft);
  padding:0 max(20px,env(safe-area-inset-left)) calc(72px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
main{max-width:400px;margin:0 auto}

/* CU 标：底纹 b / 开场线 d / 进度 p */
.cumark{display:block;width:100%;height:100%;overflow:visible}
.cumark path{fill:none;stroke-width:30;stroke-linecap:round;stroke-dasharray:1 2}   /* 间隔留足，隐藏时线的圆头不会残留成一个点 */
.cumark .b{stroke:rgba(255,255,255,.07);stroke-dashoffset:0}
.cumark .d{stroke:var(--text);stroke-dashoffset:1.06;opacity:0}
.drawing .cumark .d{opacity:1;animation:draw 1.9s cubic-bezier(.45,.05,.15,1) .1s forwards}
.drawing .cumark .d2{animation-delay:.5s}
.cumark .p{stroke:var(--text);stroke-dashoffset:1.06;transition:stroke-dashoffset 1.1s var(--ease)}
.settled .cumark .d{opacity:0;transition:opacity 1.2s var(--ease)}
@keyframes draw{from{stroke-dashoffset:1.06}to{stroke-dashoffset:0}}

.hero{position:relative;overflow-x:clip;padding:calc(11vh + env(safe-area-inset-top)) 0 48px;text-align:center}
/* 光晕：同 CU 主页，标题出来后才淡入 */
.hero::before{content:"";position:absolute;left:50%;top:calc(11vh + env(safe-area-inset-top) + 80px);width:min(150vw,760px);height:min(150vw,760px);pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,252,248,.075) 0%,rgba(255,252,248,.022) 34%,transparent 68%);transform:translate(-50%,-50%) translateZ(0)}
.titled .hero::before{animation:glow 1.8s ease .3s forwards}
@keyframes glow{to{opacity:1}}
.hero .mark{width:clamp(136px,40vw,184px);height:clamp(136px,40vw,184px);margin:0 auto;will-change:transform;backface-visibility:hidden}
.hero .mark svg{transition:transform .9s var(--spring)}
body.intro{overflow:hidden}
.hero .mark.pop svg{transform:scale(1.08)}
.hero h1{position:relative;z-index:3;margin-top:calc(34px - .2em);padding-top:.2em;padding-bottom:.12em;font-size:clamp(28px,8.2vw,54px);line-height:1;font-weight:600;letter-spacing:-.028em;white-space:nowrap}
.hero h1 .it{font-family:"Instrument Serif","Times New Roman",serif;font-style:italic;font-weight:400;font-size:1.3em;line-height:.8;letter-spacing:-.005em;margin-right:.03em;color:#1f8a5b}
.hero h1 .it{display:inline-block;padding:0 .14em 0 .08em;margin:0 -.1em 0 -.06em;opacity:0;transform:translateY(.35em);filter:blur(8px)}
.titled .hero h1 .it{animation:letter 1s var(--ease) .05s forwards}
.hero h1 span:not(.it){display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(8px)}
.titled .hero h1 span:not(.it){animation:letter 1s var(--ease) forwards;animation-delay:calc(var(--i) * 45ms)}
.hero h1 span.sp{width:.26em}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
.status{height:20px;margin-top:14px;font:500 11px/20px var(--mono);letter-spacing:.24em;color:var(--text-3);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .4s var(--ease)}
.status.on{opacity:1}

/* 表单逐行浮起 */
#form .row,#form .go{opacity:0;transform:translateY(10px)}
.ready #form .row,.ready #form .go{animation:rise 1s var(--ease) forwards;animation-delay:calc(var(--k) * 70ms)}
@keyframes rise{to{opacity:1;transform:none}}
#form .group{opacity:0}
.ready #form .group{animation:fadein .8s var(--ease) forwards}
@keyframes fadein{to{opacity:1}}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .4s var(--ease)}
.group:focus-within{border-color:rgba(255,255,255,.14)}
.row{position:relative;display:flex;align-items:center;min-height:56px;padding:0 16px;width:100%;text-align:left;transition:background .3s var(--ease)}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--border)}
.row:focus-within{background:var(--lift)}
.fl{flex:1;position:relative;display:block;height:56px}
.fl input{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;font:inherit;font-size:16px;color:var(--text);background:transparent;border:0;outline:0;padding:22px 0 6px}
.fl span{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;transition:top .35s var(--ease),transform .35s var(--ease),font-size .35s var(--ease),color .3s}
.fl input:focus+span,.fl input:not(:placeholder-shown)+span{top:9px;transform:none;font-size:11px;color:var(--text-2)}
.fl input:focus+span{color:var(--green-soft)}
.row .lab{flex:1}
.switch{position:relative;width:46px;height:28px;border-radius:28px;background:rgba(255,255,255,.14);transition:background .3s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#f0f0f0;transition:transform .45s var(--spring),background .3s}
.switch:active::after{width:26px}
.switch[aria-checked=true]{background:#1f8a5b}
.switch[aria-checked=true]::after{transform:translateX(18px);background:#f0f0f0}
.switch[aria-checked=true]:active::after{transform:translateX(14px)}

/* 音频行：选完变成可试听的波形 */
.file{flex-wrap:wrap;padding-top:0;padding-bottom:0}
.file{position:relative;cursor:pointer}
.file input[type=file]{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.file .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .lab.empty{color:var(--text-3)}
.file:hover .lab.empty{color:var(--text-2)}
.file em{font-style:normal;font-size:12px;color:var(--text-3);margin-left:12px;flex:none;letter-spacing:.04em;font-variant-numeric:tabular-nums}

.go{display:block;width:100%;margin-top:16px;height:52px;border-radius:var(--r);background:var(--cta-bg);color:var(--cta-fg);font-size:16px;font-weight:600;letter-spacing:.02em;transition:transform .15s var(--ease),opacity .4s var(--ease),background .3s}
.go:active{transform:scale(.985)}
.go.idle,.go[disabled]{background:rgba(240,240,240,.28);color:rgba(10,10,10,.75)}
.go[disabled]{cursor:default}
.err{min-height:1.4em;margin-top:12px;text-align:center;font-size:13px;color:var(--warn)}
.shake{animation:shake .42s var(--ease)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* 拖文件进窗口 */
#dropzone{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;display:grid;place-items:center;background:rgba(8,8,8,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
#dropzone::before{content:"";position:absolute;top:16px;right:16px;bottom:16px;left:16px;border:1px dashed var(--green-line);border-radius:24px}
#dropzone p{font-size:15px;color:var(--text-2);letter-spacing:.02em}
.dragging #dropzone{opacity:1}

/* 完成 */
.done{text-align:center;opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease),transform .9s var(--ease)}
.done.on{opacity:1;transform:none}
.done h2{font-size:26px;font-weight:700;letter-spacing:-.03em}
.done p{margin-top:6px;font-size:14px;color:var(--text-2)}
.link{display:flex;gap:8px;align-items:center;margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px 6px 6px 14px}
.link span{flex:1;min-width:0;font:12px var(--mono);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.link button{flex:none;font-size:13px;font-weight:600;color:var(--cta-fg);background:var(--cta-bg);border-radius:10px;padding:8px 14px;transition:background .3s}
.link button.ok{background:var(--green-soft)}
.again{margin-top:20px;font-size:14px;color:var(--text-2)}
.find{display:block;margin:22px auto 0;font-size:13px;color:var(--text-3);transition:color .2s}
.find:hover{color:var(--text)}
.fbox{margin-top:16px}
.fbox .go{margin-top:12px}
.fbox .err{margin-top:10px}
.notice{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 18px;padding:12px 16px;border-radius:var(--r);background:rgba(31,138,91,.14);border:1px solid rgba(31,138,91,.4);color:var(--green-soft);font-size:14px;font-weight:600;transition:background .2s}
.notice:hover{background:rgba(31,138,91,.22)}
.notice::before{content:"";width:7px;height:7px;border-radius:50%;background:#1f8a5b;box-shadow:0 0 0 4px rgba(31,138,91,.25)}
.again:hover{color:var(--text)}
.fade-out{opacity:0!important;transform:translateY(-6px);transition:opacity .45s var(--ease),transform .45s var(--ease)}

.mine{margin-top:56px}
.mine h3{font-size:12px;font-weight:500;color:var(--text-3);letter-spacing:.08em;margin:0 0 10px 4px}
.card{padding:14px 16px}
.card+.card{border-top:1px solid var(--border)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ch b{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.chip{flex:none;font-size:12px;color:var(--text-3)}
.chip.ok{color:var(--green-soft)}
button.chip.ok{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:rgba(31,138,91,.16);border:1px solid rgba(31,138,91,.45);font-size:12px;font-weight:600;transition:background .2s}
button.chip.ok:hover{background:rgba(31,138,91,.26)}
button.chip.ok::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .3s var(--ease)}
button.chip.ok[aria-expanded=true]::after{transform:rotate(-135deg) translate(-1px,-1px)}
.fbp{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.fbp[hidden]{display:none}
.sbar{margin:2px 0 14px}
.sbar .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--text-3)}
.sbar .sh b{font:600 26px var(--mono);letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.sbar .sh b small{font-size:13px;color:var(--text-3);font-weight:500;margin-left:3px}
.sbar .tr{position:relative;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.sbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#1f8a5b,#5fd0a0);width:0;transition:width 1s var(--ease)}
.rdr{display:block;width:252px;height:220px;max-width:100%;margin:6px auto 12px;overflow:visible}
.rdr text{font:500 11px var(--font);fill:var(--text-2)}
.rdr text.v{font:600 11px var(--mono);fill:var(--text)}
.rdr polygon.g{fill:none;stroke:var(--border-hover);stroke-width:1}
.rdr polygon.g.o{stroke:rgba(255,255,255,.3)}
.rdr line{stroke:var(--border);stroke-width:1}
.rdr polygon.d{fill:rgba(31,138,91,.28);stroke:#2fae7a;stroke-width:2;stroke-linejoin:round}
.rdr circle{fill:#2fae7a;stroke:#080808;stroke-width:2}
.fbp h4{font:500 11px var(--mono);letter-spacing:.18em;color:var(--text-3);margin-bottom:10px}
/* 卡片播放器：播放键 + 波形 + 时间；波形可点、可拖 */
.cp{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;margin-top:14px}
.cp .pb{width:40px;height:40px;border-radius:50%;background:var(--cta-bg);color:#0a0a0a;display:grid;place-items:center;transition:transform .2s var(--ease),opacity .2s}
.cp .pb:active{transform:scale(.92)}
.cp .pb[disabled]{opacity:.35}
.cp .pb svg{width:14px;height:14px;fill:currentColor}
.cp .wv{min-width:0}
/* 进度条：外层加高方便手指点，里面细线 */
.cp .bar{position:relative;height:22px;cursor:pointer;touch-action:none}
.cp .bar::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.cp .bar .fill{position:absolute;left:0;top:9px;height:4px;border-radius:4px;background:var(--text);width:0}
.cp .tm{display:flex;justify-content:space-between;margin-top:0;font:500 11px var(--mono);color:var(--text-3);font-variant-numeric:tabular-nums}
.cp .tm i{font-style:normal}
.ov{margin-top:12px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.tl{margin-top:8px}
.tl button{display:grid;grid-template-columns:44px 1fr;gap:10px;width:100%;text-align:left;font-size:14px;line-height:1.6;padding:7px 0}
.tl time{font:500 11px/2 var(--mono);color:var(--text-3)}
.tl button.on time{color:var(--green-soft)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero::before{opacity:1}.hero h1 .it,.hero h1 span:not(.it),#form .row,#form .go,#form .group{opacity:1;transform:none;filter:none}.cumark .d{stroke-dashoffset:0;opacity:1}}
</style>
</head>
<body>
<section class="hero" id="hero">
  <div class="mark" id="mark"><svg class="cumark" viewBox="272 164 456 456" aria-hidden="true">
    <path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/>
    <path class="d" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="d d2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/>
    <path class="p" id="p1" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="p" id="p2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/>
  </svg></div>
  <h1 id="h1" aria-label="Chef’s Table"><span class="it">Chef’s</span> Table</h1>
  <div class="status" id="status"></div>
</section>

<main>
  <button class="notice" id="notice" type="button" hidden></button>
  <form id="form" autocomplete="off" novalidate>
    <div class="group">
      <div class="row" style="--k:0"><label class="fl"><input id="n" maxlength="20" placeholder=" "><span>艺名</span></label></div>
      <div class="row" style="--k:1"><label class="fl"><input id="t" maxlength="60" placeholder=" "><span>歌名</span></label></div>
      <div class="row" style="--k:2"><label class="fl"><input id="l" maxlength="200" inputmode="url" placeholder=" "><span>主页链接（选填）</span></label></div>
      <div class="row" style="--k:3"><span class="lab" id="memLab">刀门会员</span><button type="button" class="switch" id="mem" role="switch" aria-checked="false" aria-labelledby="memLab"></button></div>
      <div class="row file" style="--k:4"><input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.amr,.wma,.aif,.aiff,.mp4" aria-label="选择音频"><span class="lab empty" id="fl">选择音频</span><em id="fmeta">MP3 · M4A · WAV</em></div>
    </div>
    <button class="go idle" id="go" type="submit" style="--k:5">投递</button>
    <div class="err" id="err" role="alert"></div>
    <button class="find" id="findBtn" type="button">已经投递过？查看反馈</button>
    <div class="fbox" id="fbox" hidden>
      <div class="group">
        <div class="row"><label class="fl"><input id="fn" maxlength="20" placeholder=" "><span>投递时的艺名</span></label></div>
        <div class="row"><label class="fl"><input id="ft" maxlength="60" placeholder=" "><span>投递时的歌名</span></label></div>
      </div>
      <button class="go" id="fgo" type="button" style="opacity:1">查看反馈</button>
      <div class="err" id="ferr" role="alert"></div>
    </div>
  </form>

  <div class="done" id="ok" hidden>
    <h2>收到了。</h2>
    <p>反馈会出现在这个链接里。</p>
    <div class="link"><span id="lk"></span><button id="cp" type="button">复制</button></div>
    <button class="again" id="again" type="button">再投一首</button>
  </div>

  <section class="mine" id="mine" hidden><h3>我的投递</h3><div class="group" id="list"></div></section>
</main>

<div id="dropzone" aria-hidden="true"><p>松手即可放入</p></div>
<script>
(() => {
'use strict';
const API = 'https://stats.cumusic.work', $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const MAX = 24 * 1024 * 1024;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const clock = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

const LID = (() => { let v = store.get('demo:lid'); if (!/^[A-Z0-9]{6}$/.test(v || '')) { v = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join(''); store.set('demo:lid', v); } return v; })();
const DEV = (() => { const u = navigator.userAgent; const d = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '其他'; return d + (/MicroMessenger/.test(u) ? ' · 微信' : ''); })();
try { fetch(API + '/demo/v', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lid: LID, device: DEV, ref: (new URLSearchParams(location.search).get('from') || (document.referrer ? new URL(document.referrer).host : '')).slice(0, 60) }), keepalive: true }); } catch (e) {}

/* 开场：标画出来 → 字母逐个从模糊里浮出 → 标退成底纹，表单逐行浮起 */
// 逐字母拆开，保留“Chef’s”的斜体衬线
const h1 = $('#h1'); let li = 0;
const split = (node, into) => { [...node.textContent].forEach(c => { const s = el('span', c === ' ' ? 'sp' : '', c === ' ' ? '' : c); s.style.setProperty('--i', li++); s.setAttribute('aria-hidden', 'true'); into.append(s); }); };
const parts = [...h1.childNodes]; h1.textContent = '';
parts.forEach(nd => { if (nd.nodeType === 1) { const w = el('span', nd.className, nd.textContent); w.setAttribute('aria-hidden', 'true'); h1.append(w); } else split(nd, h1); });
// 动画一结束就把 filter / transform 彻底清掉：留着会让 Safari 给每个字母单独建图层，斜体字探出去的部分（Chef’s 的撇号）被图层边界切掉
h1.addEventListener('animationend', e => { const t = e.target; if (t === h1) return; t.style.animation = 'none'; t.style.opacity = '1'; t.style.transform = 'none'; t.style.filter = 'none'; });
// 开场编排：标在屏幕正中、微微转着画出来（同 CU 主页）→ 移到标题上方 → 标题浮出 → 表单最后出来 → 标退成底纹等你填写
const B = document.body, mark = $('#mark');
// 点开反馈链接的人（?t=）不看开场：直接落在自己的投递和反馈上，投递表单排在后面
const FB = new URLSearchParams(location.search).get('t');
if (FB) { $('main').insertBefore($('#mine'), $('#notice')); $('#mine').style.marginTop = '0'; $('#mine').style.marginBottom = '36px'; }
if (REDUCE || FB || !mark.animate) { B.classList.add('drawing', 'titled', 'ready'); $('#hero').classList.add('settled'); setTimeout(progress, 0); $('#hero').style.paddingBottom = '28px'; }   // progress 用到后面才声明的变量，放到下一拍再调
else {
  B.classList.add('intro'); scrollTo(0, 0);
  const r = mark.getBoundingClientRect(), dy = innerHeight / 2 - (r.top + r.height / 2), sc = Math.min(1.55, (innerWidth * .62) / r.width);
  const from = `translateY(${dy}px) scale(${sc}) rotate(-18deg)`, mid = `translateY(${dy}px) scale(${sc}) rotate(0deg)`;
  mark.style.transform = from;
  requestAnimationFrame(() => {
    B.classList.add('drawing');
    const spin = mark.animate([{ transform: from }, { transform: mid }], { duration: 2400, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
    spin.finished.then(() => {
      const move = mark.animate([{ transform: mid }, { transform: 'none' }], { duration: 1100, easing: 'cubic-bezier(.65,0,.2,1)', fill: 'forwards' });
      setTimeout(() => B.classList.add('titled'), 650);
      move.finished.then(() => { mark.style.transform = ''; move.cancel(); spin.cancel(); B.classList.remove('intro');
        setTimeout(() => B.classList.add('ready'), 700);
        setTimeout(() => { $('#hero').classList.add('settled'); progress(); }, 1900); });
    });
  });
}

/* 外圈 = 必填完成度（艺名 / 歌名 / 音频），内圈 = 上传进度 */
window.addEventListener('error', e => { const x = document.getElementById('err'); if (x && !x.textContent) x.textContent = '页面出错：' + (e.message || '未知') ; });
let file = null, busy = false;
const p1 = $('#p1'), p2 = $('#p2');
const off = p => p <= 0.002 ? 1.06 : 1 - p;
const filled = () => [$('#n').value.trim(), $('#t').value.trim(), file].filter(Boolean).length;
function progress() {
  if (!$('#hero').classList.contains('settled') || busy) return;
  const f = filled(); p1.style.strokeDashoffset = off(f / 3);
  $('#go').classList.toggle('idle', f < 3);
}
['n', 't'].forEach(id => $('#' + id).addEventListener('input', progress));

const sw = $('#mem');
sw.onclick = () => { sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true')); if (navigator.vibrate) navigator.vibrate(8); };

/* 音频：点这一行选择（透明的文件输入盖在行上，安卓/微信里直接触发系统选择器）或拖进窗口 */
// 安卓（尤其华为浏览器 / 微信内核）常常把 accept 当成「只能录音」或根本弹不出选择器，所以安卓上去掉 accept，选完再自己按文件头判断是不是音频
if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) $('#file').removeAttribute('accept');
$('#file').onchange = e => { const f = e.target.files && e.target.files[0]; if (f) setFile(f); };
let depth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { depth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) document.body.classList.remove('dragging'); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); depth = 0; document.body.classList.remove('dragging'); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) setFile(f); });

const AUDIO_EXT = /\.(mp3|m4a|aac|wav|wave|flac|ogg|oga|opus|amr|awb|wma|aif|aiff|aifc|mp4|3gp|caf|m4b|ape)$/i;
const readHead = f => new Promise(res => { try { const r = new FileReader(); r.onload = () => res(new Uint8Array(r.result)); r.onerror = () => res(new Uint8Array(0)); r.readAsArrayBuffer(f.slice(0, 16)); } catch (e) { res(new Uint8Array(0)); } });
const isAudioHead = u => { const at = (a, o) => { o = o || 0; for (let i = 0; i < a.length; i++) if (u[o + i] !== a[i]) return false; return true; };
  return at([82, 73, 70, 70]) || at([73, 68, 51]) || (u[0] === 255 && (u[1] & 224) === 224) || at([102, 116, 121, 112], 4) || at([102, 76, 97, 67]) || at([79, 103, 103, 83]) || at([70, 79, 82, 77]) || at([35, 33, 65, 77, 82]) || at([48, 38, 178, 117]) || at([26, 69, 223, 163]); };
let prev = null;
async function setFile(f) {
  const err = $('#err'); err.textContent = '';
  if (!f || !f.size) { err.textContent = '没有读到文件，请重新选择。'; return; }
  if (f.size > MAX) { err.textContent = '文件超过 24MB，请导出 mp3。'; return; }
  // 类型、扩展名、文件头，任意一个像音频就放行（华为等手机选出来的文件 type 常常是空的）
  const ok = /^audio\//.test(f.type || '') || AUDIO_EXT.test(f.name || '') || isAudioHead(await readHead(f));
  if (!ok) { err.textContent = '这个文件看起来不是音频（' + (f.name || '未命名') + '）。请选 mp3、m4a、wav 等音频文件。'; return; }
  file = f;
  $('#fl').textContent = (f.name || '音频').replace(/\.[^.]+$/, ''); $('#fl').classList.remove('empty'); $('#fmeta').textContent = fmtSize(f.size);
  if (!$('#t').value.trim()) $('#t').value = (f.name || '').replace(/\.[^.]+$/, '').slice(0, 60);
  try { if (prev) { URL.revokeObjectURL(prev.src); } prev = new Audio(URL.createObjectURL(f)); prev.preload = 'metadata'; prev.onloadedmetadata = () => { if (isFinite(prev.duration)) $('#fmeta').textContent = clock(prev.duration) + ' · ' + fmtSize(f.size); }; } catch (e) {}
  progress();
}
const fmtSize = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

/* 投递：标的内圈变成上传进度；完成后两圈画满、轻弹一下 */
let shown = 0, goal = 0;
const loop = () => { shown += (goal - shown) * .12; if (Math.abs(goal - shown) < .002) shown = goal; p2.style.strokeDashoffset = off(shown); if (busy) $('#status').textContent = Math.round(shown * 100) + '%'; if (busy || shown < goal) requestAnimationFrame(loop); };
const ERR = { quota: '今天已经投过了，明天再来。', full: '今天的投递已满，明天再来。', size: '文件超过 24MB，请导出 mp3。', rate: '操作太频繁，稍后再试。', who: '请填写艺名。', title: '请填写歌名。' };
const nudge = () => { const g = $('#go'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); };
$('#form').addEventListener('submit', e => {
  e.preventDefault(); if (busy) return;
  const n = $('#n').value.trim(), t = $('#t').value.trim(), err = $('#err');
  if (!n) { err.textContent = '请填写艺名。'; $('#n').focus(); return nudge(); }
  if (!t) { err.textContent = '请填写歌名。'; $('#t').focus(); return nudge(); }
  if (!file) { err.textContent = '请选择音频。'; return nudge(); }
  let link = $('#l').value.trim(); if (link && !/^https?:\/\//i.test(link)) { const m = link.match(/https?:\/\/\S+/i); link = m ? m[0] : ''; }
    err.textContent = ''; busy = true; $('#go').disabled = true; shown = goal = 0;
  p1.style.strokeDashoffset = 0; p2.style.transition = 'none'; $('#status').classList.add('on'); $('#status').textContent = '0%';
  if ($('#mark').getBoundingClientRect().bottom < 40) window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' });
  loop();
  const q = new URLSearchParams({ n, mem: sw.getAttribute('aria-checked') === 'true' ? '1' : '0', lid: LID, title: t, l: link, ct: file.type || 'audio/mpeg' });
  const x = new XMLHttpRequest();
  x.open('POST', API + '/demo/up?' + q);
  x.upload.onprogress = ev => { if (ev.lengthComputable) goal = Math.min(.97, ev.loaded / ev.total); };
  const fail = msg => { busy = false; $('#go').disabled = false; p2.style.transition = ''; p2.style.strokeDashoffset = 1.06; $('#status').classList.remove('on'); err.textContent = msg; nudge(); progress(); };
  x.onload = () => {
    let j = {}; try { j = JSON.parse(x.responseText); } catch (er) {}
    if (!(j.ok && j.token)) return fail(ERR[j.e] || '投递没有成功，请稍后再试。');
    goal = 1;
    setTimeout(() => { busy = false; $('#go').disabled = false; p2.style.transition = ''; $('#status').textContent = 'RECEIVED'; const m = $('#mark'); m.classList.add('pop'); setTimeout(() => m.classList.remove('pop'), 420); if (navigator.vibrate) navigator.vibrate([10, 40, 14]); done(j.token); }, 900);
  };
  x.onerror = () => fail('网络不稳，请稍后再试。');
  x.send(file);
});

const tokens = () => { try { return JSON.parse(store.get('demo:tokens') || '[]'); } catch (e) { return []; } };
function done(tok) {
  const ts = tokens(); if (!ts.includes(tok)) ts.unshift(tok); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10)));
  const url = location.origin + location.pathname + '?t=' + tok;
  $('#lk').textContent = url.replace(/^https?:\/\//, ''); $('#cp').textContent = '复制'; $('#cp').classList.remove('ok');
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(url); $('#cp').textContent = '已复制'; $('#cp').classList.add('ok'); } catch (e) { const r = document.createRange(); r.selectNodeContents($('#lk')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  const f = $('#form'); f.classList.add('fade-out');
  setTimeout(() => { f.hidden = true; f.classList.remove('fade-out'); const o = $('#ok'); o.hidden = false; requestAnimationFrame(() => o.classList.add('on')); }, 450);
  file = null; $('#t').value = ''; $('#l').value = ''; $('#fl').textContent = '选择音频'; $('#fl').classList.add('empty'); $('#fmeta').textContent = 'MP3 · WAV'; $('#file').value = '';
  load();
}
$('#again').onclick = () => {
  const o = $('#ok'); o.classList.remove('on');
  setTimeout(() => { o.hidden = true; $('#form').hidden = false; $('#status').classList.remove('on'); p2.style.strokeDashoffset = 1.06; progress(); $('#n').focus({ preventScroll: true }); }, 400);
};

/* 找回反馈：换设备、清了浏览器、没存链接，都能用投递时的艺名 + 歌名找回（只能找回已发布的） */
$('#findBtn').onclick = () => { const b = $('#fbox'); b.hidden = !b.hidden; if (!b.hidden) setTimeout(() => $('#fn').focus({ preventScroll: true }), 50); };
const doFind = async () => {
  const n = $('#fn').value.trim(), t = $('#ft').value.trim(), err = $('#ferr'); err.textContent = '';
  if (!n || !t) { err.textContent = '请填写艺名和歌名。'; return; }
  $('#fgo').disabled = true;
  try {
    const j = await (await fetch(API + '/demo/find?' + new URLSearchParams({ n, t }))).json();
    if (j.ok && j.token) { const ts = tokens(); if (!ts.includes(j.token)) ts.unshift(j.token); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10))); $('#fbox').hidden = true; await load(); $('#mine').scrollIntoView({ behavior: 'smooth' }); }
    else err.textContent = j.e === 'rate' ? '操作太频繁，稍后再试。' : '没有找到已发布的反馈。艺名和歌名需与投递时一致；如果还没收到反馈，说明还没发布。';
  } catch (e) { err.textContent = '网络不稳，请稍后再试。'; }
  $('#fgo').disabled = false;
};
$('#fgo').onclick = doFind; [$('#fn'), $('#ft')].forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); doFind(); } }));

/* 我的投递 */
const STATUS = { new: '已收到', heard: '已收到', done: '反馈已发布' };
async function load() {
  const all = new Set(tokens()); const q = new URLSearchParams(location.search).get('t'); if (q) all.add(q);
  const rows = [];
  for (const t of all) { try { const j = await (await fetch(API + '/demo/me?t=' + encodeURIComponent(t), { cache: 'no-store' })).json(); if (j.ok) j.demos.forEach(d => rows.push({ ...d, tok: t })); } catch (e) {} }
  if (q && !tokens().includes(q) && rows.length) { const ts = tokens(); ts.unshift(q); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10))); }
  rows.sort((a, b) => b.ts - a.ts);
  const box = $('#list'); box.textContent = ''; rows.forEach(d => box.append(card(d)));
  $('#mine').hidden = !rows.length;
  const pubN = rows.filter(d => d.pub).length, nt = $('#notice');
  nt.hidden = !pubN || !!FB; if (pubN && !FB) { nt.textContent = '你有 ' + pubN + ' 条反馈已发布，点这里查看'; nt.onclick = () => $('#mine').scrollIntoView({ behavior: 'smooth' }); }
}
function sniff(u) {
  const at = (a, o = 0) => a.every((v, i) => u[o + i] === v);
  if (at([82, 73, 70, 70])) return 'audio/wav'; if (at([73, 68, 51]) || (u[0] === 255 && (u[1] & 224) === 224)) return 'audio/mpeg';
  if (at([102, 116, 121, 112], 4)) return 'audio/mp4'; if (at([102, 76, 97, 67])) return 'audio/flac'; if (at([79, 103, 103, 83])) return 'audio/ogg'; if (at([70, 79, 82, 77])) return 'audio/aiff'; return '';
}
// 先把音频整个取下来、按文件头认格式再播：这样不管当初上传时格式标成什么，都放得出来；也能画出波形
function player(src) {
  const box = el('div', 'cp'), pb = el('button', 'pb'); pb.type = 'button'; pb.disabled = true; pb.setAttribute('aria-label', '播放');
  const ICON_PLAY = '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
  pb.innerHTML = ICON_PLAY;
  const wv = el('div', 'wv'), bar = el('div', 'bar'), fill = el('i', 'fill'), tm = el('div', 'tm'), t1 = el('i', '', '加载中…'), t2 = el('i', '', '');
  bar.append(fill); tm.append(t1, t2); wv.append(bar, tm); box.append(pb, wv);
  let a = null, raf = 0;
  const draw = () => { const dur = a && isFinite(a.duration) ? a.duration : 0; fill.style.width = (dur ? a.currentTime / dur * 100 : 0) + '%'; if (dur) { t1.textContent = clock(a.currentTime); t2.textContent = clock(dur); } };
  const tick = () => { draw(); if (a && !a.paused) raf = requestAnimationFrame(tick); };
  const fail = () => { t1.textContent = '音频加载失败，请刷新重试'; };
  (async () => {
    try {
      // 整个取下来，按文件头认格式再播，这样当初上传时格式标成什么都放得出来
      const r = await fetch(src); if (!r.ok) throw new Error('http');
      const buf = await r.arrayBuffer(), type = sniff(new Uint8Array(buf.slice(0, 12))) || (r.headers.get('content-type') || 'audio/mpeg');
      a = new Audio(URL.createObjectURL(new Blob([buf], { type }))); a.preload = 'auto';
      a.onloadedmetadata = draw; a.onended = () => { pb.innerHTML = ICON_PLAY; draw(); };
      a.onplay = () => { pb.innerHTML = ICON_PAUSE; cancelAnimationFrame(raf); tick(); }; a.onpause = () => { pb.innerHTML = ICON_PLAY; cancelAnimationFrame(raf); draw(); };
      a.onerror = fail; pb.disabled = false; t1.textContent = '0:00'; draw();
    } catch (e) { fail(); }
  })();
  pb.onclick = () => { if (!a) return; if (a.paused) { const p = a.play(); if (p && p.catch) p.catch(() => {}); } else a.pause(); };
  let drag = false; const frac = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const go = e => { if (a && isFinite(a.duration)) { a.currentTime = frac(e) * a.duration; draw(); } };
  bar.onpointerdown = e => { drag = true; try { bar.setPointerCapture(e.pointerId); } catch (x) {} go(e); }; bar.onpointermove = e => { if (drag) go(e); }; bar.onpointerup = () => { drag = false; };
  box.seek = t => { if (!a) return; a.currentTime = t; const p = a.play(); if (p && p.catch) p.catch(() => {}); };
  box.audio = () => a;
  return box;
}
// 这首歌的多边形（只有发布时选了「评分条 + 六边形」才会带上）
const SONGK = [['m', '旋律'], ['l', '歌词'], ['s', '演唱'], ['k', '伴奏匹配'], ['a', '编曲'], ['p', '传播性']];
function radar(sc) {
  const NS = 'http://www.w3.org/2000/svg', mk = (t, at, tx) => { const e = document.createElementNS(NS, t); for (const k in at) e.setAttribute(k, at[k]); if (tx != null) e.textContent = tx; return e; };
  const C = 110, R = 70, n = SONGK.length, pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C + Math.cos(a) * r, C + Math.sin(a) * r]; };
  const svg = mk('svg', { viewBox: '-16 0 252 220', class: 'rdr' }), val = i => Math.max(0, Math.min(10, +sc[SONGK[i][0]] || 0));
  for (let lv = 1; lv <= 5; lv++) svg.appendChild(mk('polygon', { class: 'g' + (lv === 5 ? ' o' : ''), points: SONGK.map((_, i) => pt(i, R * lv / 5).join(',')).join(' ') }));
  SONGK.forEach((_, i) => { const p = pt(i, R); svg.appendChild(mk('line', { x1: C, y1: C, x2: p[0], y2: p[1] })); });
  svg.appendChild(mk('polygon', { class: 'd', points: SONGK.map((_, i) => pt(i, R * Math.max(.3, val(i)) / 10).join(',')).join(' ') }));
  SONGK.forEach((_, i) => { if (val(i) > 0) { const p = pt(i, R * val(i) / 10); svg.appendChild(mk('circle', { cx: p[0], cy: p[1], r: 3.2 })); } });
  SONGK.forEach((k, i) => { const p = pt(i, R + 24), an = Math.abs(p[0] - C) < 4 ? 'middle' : p[0] > C ? 'start' : 'end', ax = p[0] + (an === 'start' ? -2 : an === 'end' ? 2 : 0);
    svg.appendChild(mk('text', { x: ax, y: p[1] + 4, 'text-anchor': an }, k[1])); if (val(i) > 0) svg.appendChild(mk('text', { x: ax, y: p[1] + 16, 'text-anchor': an, class: 'v' }, String(val(i)))); });
  return svg;
}
function card(d) {
  const c = el('div', 'card'), h = el('div', 'ch'), n = d.notes ? d.notes.length : 0;
  let chip;
  if (d.pub) { chip = el('button', 'chip ok', '反馈已发布' + (n ? ' · ' + n + ' 条' : '')); chip.type = 'button'; chip.setAttribute('aria-expanded', 'true'); }
  else chip = el('span', 'chip', STATUS[d.status] || '已收到');
  h.append(el('b', '', d.title), chip); c.append(h);
  const pl = player(API + '/demo/a?id=' + d.id + '&t=' + encodeURIComponent(d.tok)); c.append(pl);
  if (d.pub) {
    const box = el('div', 'fbp'); box.append(el('h4', '', 'FEEDBACK · 点时间可以跳到那一刻'));
    if (d.ascore > 0) { const sb = el('div', 'sbar'), sh = el('div', 'sh'), b = el('b', '', String(d.ascore)); b.append(el('small', '', '/ 10')); sh.append(el('span', '', 'SCORE'), b); const tr = el('div', 'tr'), fi = el('i'); tr.append(fi); sb.append(sh, tr); box.append(sb); setTimeout(() => { fi.style.width = (d.ascore / 10 * 100) + '%'; }, 120); }
    if (d.radar) box.append(radar(d.radar));
    if (d.overall) box.append(el('div', 'ov', d.overall));
    if (n) {
      const tl = el('div', 'tl');
      d.notes.forEach(x => { const b = el('button'); b.type = 'button'; b.append(el('time', '', clock(x.t)), el('span', '', x.text)); b.onclick = () => pl.seek(x.t); tl.append(b); });
      setInterval(() => { const a = pl.audio(); if (!a) return; let on = -1; d.notes.forEach((x, i) => { if (a.currentTime >= x.t - .2) on = i; }); [...tl.children].forEach((b, i) => b.classList.toggle('on', i === on)); }, 250);
      box.append(tl);
    }
    if (!d.overall && !n) box.append(el('div', 'ov', '已发布，暂时没有文字内容。'));
    c.append(box);
    chip.onclick = () => { const open = chip.getAttribute('aria-expanded') !== 'true'; chip.setAttribute('aria-expanded', String(open)); box.hidden = !open; };
  }
  return c;
}
load();
})();
