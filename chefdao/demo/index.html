<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>主厨之选 · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* 一屏一件事：首屏是会自己画出来的 CU 标；投递是一问一答，CU 标的外圈记步数、内圈记上传 */
:root{
  --bg:#000; --text:#f5f5f7; --gray:#86868b; --gray-2:#6e6e73; --line:rgba(255,255,255,.14); --fill:rgba(255,255,255,.06);
  --mint:#8fbfa6; --red:#ff8a7a;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.2,.9,.25,1.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);height:100%}
body{color:var(--text);font:17px/1.47 var(--font);letter-spacing:-.022em;-webkit-font-smoothing:antialiased;caret-color:var(--mint);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}

.top{position:fixed;inset:0 0 auto;z-index:10;display:flex;justify-content:space-between;align-items:center;
  padding:calc(18px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) 0 max(22px,env(safe-area-inset-left));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;gap:8px;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.32em;color:var(--gray)}
.brand i{width:15px;height:15px;display:block}
.brand .cumark path{stroke-width:44;stroke:var(--text)}
.toplink{font-size:13px;color:var(--gray);letter-spacing:0;transition:color .2s}
.toplink:hover{color:var(--text)}

/* CU 标 */
.cumark{display:block;width:100%;height:100%;overflow:visible}
.cumark path{fill:none;stroke-width:30;stroke-linecap:round;stroke-dasharray:1}
.cumark .b{stroke:rgba(255,255,255,.12);stroke-dashoffset:0}
.cumark .f{stroke:var(--text);stroke-dashoffset:1;transition:stroke-dashoffset .9s var(--ease)}
.cumark.draw .f{animation:draw 1.6s cubic-bezier(.45,.05,.15,1) .2s both}
.cumark.draw .f2{animation-delay:.6s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* 视图：叠在一起，交叉淡入 */
.stage{position:relative;min-height:100svh}
.view{position:absolute;inset:0;min-height:100svh;display:grid;place-items:center;padding:calc(90px + env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .6s var(--ease),transform .7s var(--ease),visibility 0s .6s}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s var(--ease) .08s,transform .8s var(--ease) .08s,visibility 0s}
.inner{width:100%;max-width:520px;text-align:center}

/* 首屏 */
.hero .mark{width:148px;height:148px;margin:0 auto}
.hero h1{margin-top:44px;font-size:clamp(40px,9vw,64px);line-height:1.06;font-weight:600;letter-spacing:-.01em}
.hero .en{margin-top:14px;font:500 12px/1 var(--mono);letter-spacing:.42em;color:var(--gray);padding-left:.42em}
.seats{display:flex;justify-content:center;gap:10px;margin-top:44px}
.seats i{width:7px;height:7px;border-radius:50%;border:1px solid var(--gray-2)}
.seats i.on{background:var(--mint);border-color:var(--mint)}
.offer{margin-top:16px;font-size:17px;color:var(--gray);letter-spacing:-.01em}
.cta{display:inline-block;margin-top:40px;font-size:17px;font-weight:500;color:#000;background:var(--text);border-radius:999px;padding:13px 30px;transition:transform .18s var(--ease),opacity .2s}
.cta:active{transform:scale(.97)}
.cta:hover{opacity:.9}
.date{margin-top:18px;font:500 11px/1 var(--mono);letter-spacing:.24em;color:var(--gray-2)}
.fade-up{opacity:0;transform:translateY(12px);transition:opacity .9s var(--ease),transform 1s var(--ease)}
.lit .fade-up{opacity:1;transform:none}
.lit .d1{transition-delay:1.3s}.lit .d2{transition-delay:1.45s}.lit .d3{transition-delay:1.6s}.lit .d4{transition-delay:1.75s}.lit .d5{transition-delay:1.9s}

/* 一问一答 */
.flow .mark{width:56px;height:56px;margin:0 auto}
.flow .num{margin-top:28px;font:500 11px/1 var(--mono);letter-spacing:.3em;color:var(--gray-2)}
.flow h2{margin-top:14px;font-size:clamp(30px,6.4vw,44px);line-height:1.12;font-weight:600;letter-spacing:-.012em}
.flow .sub{margin-top:10px;font-size:17px;color:var(--gray)}
.ans{margin-top:40px}
.ans input[type=text]{width:100%;font:inherit;font-size:clamp(22px,4.6vw,28px);font-weight:500;letter-spacing:-.01em;text-align:center;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0 14px;outline:0;transition:border-color .3s var(--ease)}
.ans input[type=text]:focus{border-bottom-color:var(--gray)}
.ans ::placeholder{color:#3a3a3c}
.pair{display:flex;justify-content:center;gap:12px}
.pill{min-width:120px;font-size:17px;font-weight:500;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:13px 26px;transition:background .2s,border-color .2s,transform .15s var(--ease)}
.pill:hover{border-color:var(--gray)}
.pill:active{transform:scale(.97)}
.pill.solid{background:var(--text);color:#000;border-color:var(--text)}
.pill[disabled]{opacity:.3;cursor:default}
.file small{display:block;margin-top:14px;font:500 11px/1 var(--mono);letter-spacing:.22em;color:var(--gray-2)}
.fname{margin-top:18px;font-size:15px;color:var(--gray);overflow-wrap:anywhere}
.nav{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:44px}
.back{font-size:15px;color:var(--gray);padding:10px 6px;transition:color .2s}
.back:hover{color:var(--text)}
.err{margin-top:16px;min-height:1.4em;font-size:14px;color:var(--red)}
.pc{margin-top:22px;font:500 12px/1 var(--mono);letter-spacing:.28em;color:var(--gray);font-variant-numeric:tabular-nums}

/* 完成 */
.link{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:30px;font:12px/1.4 var(--mono);color:var(--gray-2);letter-spacing:0}
.link span{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link button{font-size:13px;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--font)}

/* 我的投递 */
.mine{text-align:left;align-self:start}
.mine h2{text-align:center;font-size:32px;font-weight:600;margin-bottom:28px}
.card{padding:20px 0;border-top:1px solid var(--line)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ch b{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.chip{flex:none;font-size:12px;color:var(--gray)}
.chip.ok{color:var(--mint)}
.meta{color:var(--gray-2);font-size:13px;margin-top:2px}
audio{display:block;width:100%;height:36px;margin-top:12px;color-scheme:dark}
.ov{margin-top:14px;font-size:15px;line-height:1.7;white-space:pre-wrap}
.tl{margin-top:10px;display:grid;gap:2px}
.tl button{display:grid;grid-template-columns:48px 1fr;gap:10px;text-align:left;font-size:15px;line-height:1.6;border-radius:10px;padding:8px;margin:0 -8px}
.tl button:hover{background:var(--fill)}
.tl time{font:500 12px/1.9 var(--mono);color:var(--gray-2)}
.tl button.on time{color:var(--mint)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.fade-up{opacity:1;transform:none}.cumark.draw .f{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i><svg class="cumark" viewBox="272 164 456 456"><path pathLength="1" style="stroke-dasharray:none" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path pathLength="1" style="stroke-dasharray:none" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></i>CU MUSIC</div>
  <button class="toplink" id="mineBtn" type="button" hidden>我的投递</button>
</header>

<main class="stage">
  <!-- 首屏 -->
  <section class="view hero on" id="vHero"><div class="inner">
    <div class="mark"><svg class="cumark draw" viewBox="272 164 456 456" aria-hidden="true"><path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/><path class="f" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="f f2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></div>
    <h1 class="fade-up d1">主厨之选</h1>
    <div class="en fade-up d2">CHEF'S TABLE</div>
    <div class="seats fade-up d3" id="seats" aria-label="5 席"><i></i><i></i><i></i><i></i><i></i></div>
    <p class="offer fade-up d3">免费混音一首，全年混音五折。</p>
    <button class="cta fade-up d4" id="start" type="button">投递 Demo</button>
    <div class="date fade-up d5">26.11 — 27.11</div>
  </div></section>

  <!-- 一问一答 -->
  <section class="view flow" id="vFlow"><div class="inner">
    <div class="mark"><svg class="cumark" viewBox="272 164 456 456" aria-hidden="true"><path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/><path class="f" id="r1" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="f" id="r2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></div>
    <div class="num" id="num"></div>
    <h2 id="q"></h2>
    <p class="sub" id="sub" hidden></p>
    <div class="ans" id="ans"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="nav" id="nav"></div>
  </div></section>

  <!-- 完成 -->
  <section class="view flow" id="vDone"><div class="inner">
    <div class="mark"><svg class="cumark" viewBox="272 164 456 456" aria-hidden="true"><path class="f" style="stroke-dashoffset:0" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="f" style="stroke-dashoffset:0" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></div>
    <h2 style="margin-top:36px">收到了。</h2>
    <p class="sub">反馈会出现在这个链接里。</p>
    <div class="link"><span id="lk"></span><button id="cp" type="button">复制</button></div>
    <div class="nav"><button class="back" id="home" type="button">回到首页</button></div>
  </div></section>

  <!-- 我的投递 -->
  <section class="view" id="vMine"><div class="inner mine">
    <h2>我的投递</h2>
    <div id="list"></div>
    <div class="nav"><button class="back" id="home2" type="button">回到首页</button></div>
  </div></section>
</main>
<script>
(() => {
'use strict';
const API = 'https://stats.cumusic.work', $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const MAX = 24 * 1024 * 1024;
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmt = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const clock = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const day = ts => { const d = new Date(ts); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; };

const LID = (() => { let v = store.get('demo:lid'); if (!/^[A-Z0-9]{6}$/.test(v || '')) { v = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join(''); store.set('demo:lid', v); } return v; })();
const DEV = (() => { const u = navigator.userAgent; const d = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '其他'; return d + (/MicroMessenger/.test(u) ? ' · 微信' : ''); })();
try { fetch(API + '/demo/v', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lid: LID, device: DEV, ref: document.referrer ? new URL(document.referrer).host : '' }), keepalive: true }); } catch (e) {}

/* 视图切换 */
const views = ['vHero', 'vFlow', 'vDone', 'vMine'];
const show = id => { views.forEach(v => $('#' + v).classList.toggle('on', v === id)); window.scrollTo(0, 0); };
requestAnimationFrame(() => document.body.classList.add('lit'));

/* 入选席位 */
fetch(API + '/demo/wall').then(r => r.json()).then(j => { const dots = [...document.querySelectorAll('#seats i')]; (j.seats || []).forEach((w, i) => { if (dots[i]) { dots[i].classList.add('on'); dots[i].title = w; } }); }).catch(() => {});

/* 一问一答 */
const A = { n: '', mem: null, t: '', l: '', file: null };
const STEPS = [
  { k: 'n', q: '你的艺名', type: 'text', ph: '艺名', max: 20 },
  { k: 'mem', q: '你是刀门会员吗', type: 'pair', opts: [['1', '是'], ['0', '不是']] },
  { k: 't', q: '这首歌叫什么', type: 'text', ph: '歌名', max: 60 },
  { k: 'l', q: '你的主页', sub: '抖音、小红书或网易云，可以跳过', type: 'text', ph: '粘贴链接', max: 200, opt: true },
  { k: 'file', q: '选择这首 demo', type: 'file' },
];
let step = 0, busy = false;
const r1 = $('#r1'), r2 = $('#r2');
const ring = () => { r1.style.strokeDashoffset = 1 - step / STEPS.length; };
function render() {
  const s = STEPS[step]; ring(); r2.style.strokeDashoffset = 1;
  $('#num').textContent = String(step + 1).padStart(2, '0') + ' / ' + String(STEPS.length).padStart(2, '0');
  $('#q').textContent = s.q; $('#sub').hidden = !s.sub; $('#sub').textContent = s.sub || ''; $('#err').textContent = '';
  const ans = $('#ans'), nav = $('#nav'); ans.textContent = ''; nav.textContent = '';
  const back = el('button', 'back', step ? '上一步' : '返回'); back.type = 'button'; back.onclick = () => { if (busy) return; if (step) { step--; render(); } else show('vHero'); };
  if (s.type === 'text') {
    const i = el('input'); i.type = 'text'; i.maxLength = s.max; i.placeholder = s.ph; i.value = A[s.k] || ''; i.autocomplete = 'off'; i.enterKeyHint = 'next';
    ans.append(i); setTimeout(() => i.focus({ preventScroll: true }), 450);
    const go = el('button', 'pill solid', s.opt ? '继续' : '继续'); go.type = 'button';
    const next = () => { const v = i.value.trim(); if (!v && !s.opt) { $('#err').textContent = s.k === 'n' ? '请填写艺名。' : '请填写歌名。'; return; }
      if (s.k === 'l' && v && !/^https?:\/\//i.test(v)) { const m = v.match(/https?:\/\/\S+/i); A.l = m ? m[0] : ''; } else A[s.k] = v; step++; render(); };
    go.onclick = next; i.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); next(); } });
    nav.append(back, go);
    if (s.opt) { const skip = el('button', 'back', '跳过'); skip.type = 'button'; skip.onclick = () => { A.l = ''; step++; render(); }; nav.append(skip); }
  } else if (s.type === 'pair') {
    const p = el('div', 'pair');
    s.opts.forEach(([v, label]) => { const b = el('button', 'pill' + (A.mem === (v === '1') ? ' solid' : ''), label); b.type = 'button'; b.onclick = () => { A.mem = v === '1'; step++; render(); }; p.append(b); });
    ans.append(p); nav.append(back);
  } else {
    const f = el('div', 'file'), inp = el('input'); inp.type = 'file'; inp.accept = 'audio/*,.mp3,.m4a,.wav,.aif,.aiff,.flac'; inp.hidden = true;
    const pick = el('button', 'pill' + (A.file ? '' : ' solid'), A.file ? '换一首' : '选择音频'); pick.type = 'button'; pick.onclick = () => inp.click();
    f.append(inp, pick, el('small', '', 'MP3 · M4A · WAV'));
    if (A.file) f.append(el('div', 'fname', A.file.name + ' · ' + fmt(A.file.size)));
    inp.onchange = () => { const x = inp.files[0]; if (!x) return; if (x.size > MAX) { $('#err').textContent = '文件超过 24MB，请导出 mp3。'; return; } A.file = x; render(); };
    ans.append(f);
    const go = el('button', 'pill solid', '投递'); go.type = 'button'; go.disabled = !A.file; go.onclick = submit;
    nav.append(back); if (A.file) { pick.className = 'pill'; nav.append(go); }
  }
}
$('#start').onclick = () => { step = 0; render(); show('vFlow'); };

/* 上传：CU 标内圈 = 上传进度 */
const ERR = { quota: '今天已经投过了，明天再来。', full: '今天的投递已满，明天再来。', size: '文件超过 24MB，请导出 mp3。', rate: '操作太频繁，稍后再试。', who: '请填写艺名。', title: '请填写歌名。' };
let shown = 0, goal = 0;
const loop = () => { shown += (goal - shown) * .12; r2.style.strokeDashoffset = 1 - shown; const pc = $('#pcv'); if (pc) pc.textContent = Math.round(shown * 100) + '%'; if (busy || Math.abs(goal - shown) > .002) requestAnimationFrame(loop); };
function submit() {
  if (busy || !A.file) return;
  busy = true; r1.style.strokeDashoffset = 0; shown = goal = 0; r2.style.transition = 'none';
  $('#q').textContent = '正在上传'; $('#sub').hidden = true; $('#err').textContent = '';
  $('#ans').textContent = ''; const pc = el('div', 'pc', '0%'); pc.id = 'pcv'; $('#ans').append(pc); $('#nav').textContent = ''; loop();
  const q = new URLSearchParams({ n: A.n, mem: A.mem ? '1' : '0', lid: LID, title: A.t, l: A.l, ct: A.file.type || 'audio/mpeg' });
  const x = new XMLHttpRequest();
  x.open('POST', API + '/demo/up?' + q);
  x.upload.onprogress = e => { if (e.lengthComputable) goal = Math.min(.97, e.loaded / e.total); };
  const fail = msg => { busy = false; r2.style.transition = ''; render(); $('#err').textContent = msg; };
  x.onload = () => {
    let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
    if (!(j.ok && j.token)) return fail(ERR[j.e] || '投递没有成功，请稍后再试。');
    goal = 1; setTimeout(() => { busy = false; r2.style.transition = ''; done(j.token); }, 900);
  };
  x.onerror = () => fail('网络不稳，请稍后再试。');
  x.send(A.file);
}
const tokens = () => { try { return JSON.parse(store.get('demo:tokens') || '[]'); } catch (e) { return []; } };
function done(tok) {
  const ts = tokens(); if (!ts.includes(tok)) ts.unshift(tok); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10)));
  const url = location.origin + location.pathname + '?t=' + tok;
  $('#lk').textContent = url.replace(/^https?:\/\//, '');
  $('#cp').textContent = '复制';
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(url); $('#cp').textContent = '已复制'; } catch (e) { const r = document.createRange(); r.selectNodeContents($('#lk')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  A.t = ''; A.l = ''; A.file = null;
  show('vDone'); load();
}
$('#home').onclick = () => show('vHero'); $('#home2').onclick = () => show('vHero');
$('#mineBtn').onclick = () => show('vMine');

/* 我的投递 */
const STATUS = { new: '已收到', heard: '已收到', done: '反馈已发布' };
async function load() {
  const all = new Set(tokens()); const q = new URLSearchParams(location.search).get('t'); if (q) all.add(q);
  const rows = [];
  for (const t of all) {
    try { const j = await (await fetch(API + '/demo/me?t=' + encodeURIComponent(t), { cache: 'no-store' })).json(); if (j.ok) j.demos.forEach(d => rows.push({ ...d, tok: t })); } catch (e) {}
  }
  if (q && !tokens().includes(q) && rows.length) { const ts = tokens(); ts.unshift(q); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10))); }
  rows.sort((a, b) => b.ts - a.ts);
  const box = $('#list'); box.textContent = ''; rows.forEach(d => box.append(card(d)));
  $('#mineBtn').hidden = !rows.length;
  return rows.length;
}
function card(d) {
  const c = el('div', 'card'), h = el('div', 'ch');
  h.append(el('b', '', d.title), el('span', 'chip' + (d.pub ? ' ok' : ''), d.pub ? STATUS.done : STATUS[d.status] || '已收到'));
