<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e0f">
<title>Demo · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
:root{
  --bg:#0e0e0f; --fill:rgba(236,234,230,.05); --fill-2:rgba(236,234,230,.09); --hair:rgba(236,234,230,.1);
  --text:#e8e6e2; --text-2:#a3a19d; --text-3:#74726f; --pearl:#ebe9e5; --ink:#121213; --red:#e9a19a; --ok:#a9c9b4;
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:radial-gradient(120% 50% at 50% -10%,rgba(236,234,230,.06),transparent 60%),var(--bg);color:var(--text);font:17px/1.7 var(--font);
  -webkit-font-smoothing:antialiased;min-height:100vh;padding:0 max(20px,env(safe-area-inset-left)) calc(80px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right))}
main{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(28px + env(safe-area-inset-top)) 0 0;font:500 12px/1 var(--mono);letter-spacing:.28em;color:var(--text-3)}
h1{font-size:34px;line-height:1.25;font-weight:600;letter-spacing:-.02em;margin:56px 0 14px;text-wrap:balance}
.sec{margin-top:44px}
.sec>h2{font:500 12px/1 var(--mono);letter-spacing:.22em;color:var(--text-3);text-transform:uppercase;margin-bottom:16px}
.field{display:block;margin-top:18px}
.field>span{display:block;font-size:13px;color:var(--text-2);margin-bottom:8px;letter-spacing:.02em}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--fill);border:1px solid transparent;border-radius:12px;padding:13px 14px;outline:0;transition:border-color .2s var(--ease),background .2s var(--ease)}
input[type=text]:focus,textarea:focus{border-color:var(--hair);background:var(--fill-2)}
textarea{resize:vertical;min-height:84px;line-height:1.6}
::placeholder{color:var(--text-3)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--fill);border-radius:12px}
.seg button{font:inherit;font-size:15px;color:var(--text-2);background:transparent;border:0;border-radius:9px;padding:10px 8px;cursor:pointer;transition:all .25s var(--ease)}
.seg button[aria-pressed=true]{background:var(--pearl);color:var(--ink);font-weight:500}
.drop{display:block;margin-top:18px;border:1px dashed rgba(236,234,230,.22);border-radius:14px;padding:26px 16px;text-align:center;color:var(--text-2);font-size:15px;cursor:pointer;transition:all .25s var(--ease)}
.drop:hover,.drop.on{border-color:rgba(236,234,230,.5);background:var(--fill);color:var(--text)}
.drop small{display:block;margin-top:6px;color:var(--text-3);font-size:13px}
.drop.has{border-style:solid;border-color:var(--hair);background:var(--fill);color:var(--text)}
.btn{display:block;width:100%;margin-top:26px;font:inherit;font-size:17px;font-weight:500;color:var(--ink);background:var(--pearl);border:0;border-radius:14px;padding:15px;cursor:pointer;transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;cursor:default}
.bar{height:2px;background:var(--fill-2);border-radius:2px;margin-top:14px;overflow:hidden;opacity:0;transition:opacity .2s}
.bar.on{opacity:1}.bar i{display:block;height:100%;width:0;background:var(--pearl);transition:width .15s linear}
.err{margin-top:14px;color:var(--red);font-size:14px;min-height:1.4em}
.fine{margin-top:22px;color:var(--text-3);font-size:13px;line-height:1.8}
.done{margin-top:44px;padding:26px 22px;background:var(--fill);border-radius:16px}
.done h3{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.done p{color:var(--text-2);font-size:15px}
.link{display:flex;gap:8px;margin-top:16px}
.link input{flex:1;min-width:0;font-size:14px;font-family:var(--mono)}
.link button{font:inherit;font-size:14px;color:var(--ink);background:var(--pearl);border:0;border-radius:12px;padding:0 16px;cursor:pointer}
.card{padding:20px 0;border-top:1px solid var(--hair)}
.card:first-of-type{border-top:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ch b{font-size:18px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.chip{flex:none;font-size:12px;color:var(--text-2);padding:3px 10px;border-radius:99px;background:var(--fill-2);letter-spacing:.04em}
.chip.ok{color:var(--ink);background:var(--ok)}
.meta{color:var(--text-3);font-size:13px;margin-top:2px}
audio{display:block;width:100%;height:40px;margin-top:14px;color-scheme:dark}
.ov{margin-top:16px;color:var(--text);font-size:16px;line-height:1.8;white-space:pre-wrap}
.tl{margin-top:14px;display:grid;gap:2px}
.tl button{display:grid;grid-template-columns:54px 1fr;gap:12px;text-align:left;font:inherit;font-size:15px;line-height:1.7;color:var(--text);background:transparent;border:0;border-radius:10px;padding:9px 8px;margin:0 -8px;cursor:pointer}
.tl button:hover{background:var(--fill)}
.tl time{font:500 13px/1.9 var(--mono);color:var(--text-3)}
.tl button.on time{color:var(--text)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top"><span>CU MUSIC</span><span>DEMO</span></div>

  <div id="mine" hidden>
    <div class="sec" style="margin-top:56px"><h2>我的投递</h2><div id="list"></div></div>
  </div>

  <h1 id="h1">投递 Demo</h1>
  
  <section id="formsec" class="sec" style="margin-top:36px">
    <label class="field" style="margin-top:0"><span>艺名</span><input id="n" type="text" maxlength="20" placeholder="你的艺名" autocomplete="off"></label>
    <div class="field"><span>是否为刀门会员</span>
      <div class="seg" id="seg"><button type="button" data-v="1" aria-pressed="false">是</button><button type="button" data-v="0" aria-pressed="false">不是</button></div>
    </div>
    <label class="field"><span>歌名</span><input id="t" type="text" maxlength="60" placeholder="这首歌叫什么" autocomplete="off"></label>
    <label class="field"><span>备注（选填）</span><textarea id="note" maxlength="400" placeholder="想让我重点听什么"></textarea></label>
    <label class="drop" id="drop"><input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aif,.aiff,.flac" hidden>
      <span id="dt">选择音频，或拖到这里</span><small>mp3 · m4a · wav</small></label>
    <button class="btn" id="go" type="button">投递</button>
    <div class="bar" id="bar"><i></i></div>
    <div class="err" id="err" role="alert"></div>
  </section>

  <section id="ok" class="done" hidden>
    <h3>收到了。</h3>
    <p>反馈会出现在这个链接里。</p>
    <div class="link"><input id="lk" type="text" readonly><button id="cp" type="button">复制</button></div>
  </section>
</main>
<script>
(() => {
'use strict';
const API = 'https://stats.cumusic.work', $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const MAX = 24 * 1024 * 1024;
let mem = null, file = null, busy = false;
const LID = (() => { let v = store.get('demo:lid'); if (!/^[A-Z0-9]{6}$/.test(v || '')) { v = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join(''); store.set('demo:lid', v); } return v; })();
const DEV = (() => { const u = navigator.userAgent; const d = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '其他'; return d + (/MicroMessenger/.test(u) ? ' · 微信' : ''); })();
try { fetch(API + '/demo/v', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lid: LID, device: DEV, ref: document.referrer ? new URL(document.referrer).host : '' }), keepalive: true }); } catch (e) {}

const fmt = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const clock = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const day = ts => { const d = new Date(ts); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; };
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* 表单 */
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
  mem = b.dataset.v === '1';
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  $('#err').textContent = '';
});
const setFile = f => {
  if (!f) return;
  if (f.size > MAX) { $('#err').textContent = '文件超过 24MB，请导出 mp3 再投递。'; return; }
  file = f; $('#err').textContent = '';
  $('#drop').classList.add('has'); $('#dt').textContent = f.name + ' · ' + fmt(f.size);
  if (!$('#t').value.trim()) $('#t').value = f.name.replace(/\.[^.]+$/, '').slice(0, 60);
};
$('#drop').addEventListener('click', e => { if (e.target !== $('#file')) { e.preventDefault(); $('#file').click(); } });
$('#file').onchange = e => setFile(e.target.files[0]);
['dragenter', 'dragover'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('on'); }));
['dragleave', 'drop'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('on'); }));
$('#drop').addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

const ERR = { quota: () => '今天已经投过了，明天再来。', full: () => '今天的投递已满，明天再来。', size: () => '文件超过 24MB，请导出 mp3。', rate: () => '操作太频繁，稍后再试。', who: () => '请填写艺名。', title: () => '请填写歌名。' };
$('#go').onclick = () => {
  if (busy) return;
  const n = $('#n').value.trim(), t = $('#t').value.trim(), err = $('#err');
  if (!n) return err.textContent = '请填写艺名。';
  if (mem === null) return err.textContent = '请选择是否为刀门会员。';
  if (!t) return err.textContent = '请填写歌名。';
  if (!file) return err.textContent = '请选择要投递的音频。';
  err.textContent = ''; busy = true; $('#go').disabled = true; $('#bar').classList.add('on');
  const q = new URLSearchParams({ n, mem: mem ? '1' : '0', lid: LID, title: t, note: $('#note').value.trim(), ct: file.type || 'audio/mpeg' });
  const x = new XMLHttpRequest();
  x.open('POST', API + '/demo/up?' + q);
  x.upload.onprogress = e => { if (e.lengthComputable) $('#bar i').style.width = (e.loaded / e.total * 100) + '%'; };
  x.onload = () => {
    busy = false; $('#go').disabled = false; $('#bar').classList.remove('on');
    let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
    if (j.ok && j.token) return success(j.token);
    err.textContent = (ERR[j.e] ? ERR[j.e](mem) : '投递没有成功，请稍后再试。');
  };
  x.onerror = () => { busy = false; $('#go').disabled = false; $('#bar').classList.remove('on'); err.textContent = '网络不稳，请稍后再试。'; };
  x.send(file);
};
const tokens = () => { try { return JSON.parse(store.get('demo:tokens') || '[]'); } catch (e) { return []; } };
function success(tok) {
  const ts = tokens(); if (!ts.includes(tok)) ts.unshift(tok); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10)));
  const url = location.origin + location.pathname + '?t=' + tok;
  $('#lk').value = url; $('#ok').hidden = false; $('#formsec').hidden = true;
  $('#h1').hidden = true; $('#mine').before($('#ok')); $('#ok').style.marginTop = '56px'; window.scrollTo({ top: 0, behavior: 'smooth' });
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(url); } catch (e) { $('#lk').select(); } $('#cp').textContent = '已复制'; };
  load();
}

/* 我的投递 */
const STATUS = { new: '已收到', heard: '已收到', done: '反馈已发布' };
async function load() {
  const all = new Set(tokens()); const q = new URLSearchParams(location.search).get('t'); if (q) all.add(q);
  const rows = [];
  for (const t of all) {
    try { const j = await (await fetch(API + '/demo/me?t=' + encodeURIComponent(t), { cache: 'no-store' })).json(); if (j.ok) j.demos.forEach(d => rows.push({ ...d, tok: t })); } catch (e) {}
  }
  if (q && !tokens().includes(q) && rows.length) { const ts = tokens(); ts.unshift(q); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10))); }
  rows.sort((a, b) => b.ts - a.ts);
  const box = $('#list'); box.textContent = '';
  $('#mine').hidden = !rows.length;
  if (rows.length) $('#mine .sec').style.marginTop = '56px';
  rows.forEach(d => box.append(card(d)));
}
function card(d) {
  const c = el('div', 'card'), h = el('div', 'ch');
  h.append(el('b', '', d.title), el('span', 'chip' + (d.pub ? ' ok' : ''), d.pub ? STATUS.done : STATUS[d.status] || '已收到'));
  c.append(h, el('div', 'meta', day(d.ts) + ' · ' + fmt(d.size)));
  const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = API + '/demo/a?id=' + d.id + '&t=' + encodeURIComponent(d.tok); c.append(a);
  if (d.pub) {
    if (d.overall) c.append(el('div', 'ov', d.overall));
    if (d.notes && d.notes.length) {
      const tl = el('div', 'tl');
      d.notes.forEach(n => { const b = el('button'); b.type = 'button'; b.append(el('time', '', clock(n.t)), el('span', '', n.text));
        b.onclick = () => { a.currentTime = n.t; a.play().catch(() => {}); }; tl.append(b); });
      a.addEventListener('timeupdate', () => { let on = -1; d.notes.forEach((n, i) => { if (a.currentTime >= n.t - .2) on = i; }); [...tl.children].forEach((b, i) => b.classList.toggle('on', i === on)); });
      c.append(tl);
    }
  }
  return c;
}
load();
})();
</script>
</body>
</html>
