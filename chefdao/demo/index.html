<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#18392b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Noto+Sans+SC:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>主厨之选 · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
:root{
  /* 刀大厨视觉：深绿底、米白细字、薄荷绿点缀、发丝线，中英双语 */
  --bg:#18392b; --fill:rgba(238,238,230,.06); --fill-2:rgba(238,238,230,.1); --fill-3:rgba(238,238,230,.16); --hair:rgba(238,238,230,.18);
  --text:#eeeee6; --text-2:rgba(238,238,230,.68); --text-3:rgba(238,238,230,.46); --pearl:#eeeee6; --ink:#18392b; --mint:#9cc9b2; --red:#f2b4a4; --ok:#9cc9b2;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.2,.9,.25,1.08);
  --font:"Inter","Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  --cjk:"Noto Sans SC","PingFang SC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:radial-gradient(1100px 700px at 12% -10%,rgba(156,201,178,.13),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font:17px/1.65 var(--font);
  -webkit-font-smoothing:antialiased;min-height:100vh;padding:0 max(22px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-right))}
body.lock{overflow:hidden}
main{max-width:560px;margin:0 auto}

/* CU 标：两道弧线 */
.cumark{display:block;width:100%;height:100%;overflow:visible}
.cumark path{fill:none;stroke-width:36;stroke-linecap:round;stroke-dasharray:1}
.cumark .b{stroke:rgba(238,238,230,.16);stroke-dashoffset:0}
.cumark .f{stroke:var(--text);stroke-dashoffset:1}

/* 开场 */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .7s var(--ease),transform .9s var(--ease),filter .7s var(--ease)}
#intro .m{width:104px;height:104px}
#intro .b{animation:cuDraw 1.5s cubic-bezier(.45,.05,.15,1) .1s both}
#intro .b2{animation-delay:.45s}
#intro.out{opacity:0;transform:scale(1.14);filter:blur(10px);pointer-events:none}
@keyframes cuDraw{from{stroke-dashoffset:1;stroke:var(--text)}60%{stroke:var(--text)}to{stroke-dashoffset:0;stroke:rgba(238,238,230,.5)}}

/* 页面入场：逐层浮起 */
.rise{opacity:0;transform:translateY(14px);transition:opacity .8s var(--ease),transform .9s var(--ease)}
.ready .rise{opacity:1;transform:none}
.ready .rise:nth-child(2){transition-delay:.08s}.ready .rise:nth-child(3){transition-delay:.16s}.ready .rise:nth-child(4){transition-delay:.24s}.ready .rise:nth-child(5){transition-delay:.32s}.ready .rise:nth-child(6){transition-delay:.4s}

/* 顶栏：半透明材质 */
.top{position:sticky;top:0;z-index:5;margin:0 calc(-1 * max(22px,env(safe-area-inset-left)));padding:calc(18px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-left)) 14px;display:flex;justify-content:space-between;align-items:center;
  background:rgba(24,57,43,.7);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.top .lg{display:flex;gap:10px;align-items:center;font:500 12px/1 var(--mono);letter-spacing:.28em;color:var(--text-2)}
.top .lg i{display:block;width:20px;height:20px}
.top .lg i .cumark path{stroke-width:44}
.top .lg i .cumark .b{stroke:var(--text)}
.top span.r{font:500 12px/1 var(--mono);letter-spacing:.28em;color:var(--text-3)}

h1{font-family:var(--cjk);font-size:72px;line-height:1.05;font-weight:200;letter-spacing:.02em;margin:6px 0 4px}
h1 small{display:block;margin-top:14px;font-family:var(--font);font-size:17px;font-weight:300;letter-spacing:.24em;color:var(--text-2)}
.kick{font:500 12px/1 var(--mono);letter-spacing:.28em;color:var(--text-3);text-transform:uppercase}
.sec{margin-top:40px}
.sec>h2{font:500 12px/1 var(--mono);letter-spacing:.22em;color:var(--text-3);text-transform:uppercase;margin-bottom:16px}
.field{display:block;margin-top:22px}
.field>span{display:block;font-size:14px;color:var(--text);margin-bottom:9px;letter-spacing:.04em}
.field>span i{font-style:normal;font-size:12px;color:var(--text-3);margin-left:10px;letter-spacing:.1em}
input[type=text]{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--fill);border:1px solid transparent;border-radius:14px;padding:15px 16px;outline:0;transition:border-color .25s var(--ease),background .25s var(--ease)}
input[type=text]:focus{border-color:var(--hair);background:var(--fill-2)}
::placeholder{color:var(--text-3)}

/* 分段选择：滑动的珍珠色滑块 */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;background:var(--fill);border-radius:14px}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:10px;background:var(--pearl);
  transform:translateX(calc(var(--i,0) * 100%));opacity:0;transition:transform .5s var(--spring),opacity .25s}
.seg.set::before{opacity:1}
.seg button{position:relative;z-index:1;font:inherit;font-size:16px;color:var(--text-2);background:transparent;border:0;border-radius:10px;padding:13px 6px;cursor:pointer;transition:color .25s var(--ease),transform .15s var(--ease)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed=true]{color:var(--ink);font-weight:500}

.drop{display:block;margin-top:22px;border:1px dashed rgba(238,238,230,.22);border-radius:18px;padding:34px 16px;text-align:center;color:var(--text-2);font-size:16px;cursor:pointer;transition:all .35s var(--ease)}
.drop:hover,.drop.on{border-color:rgba(238,238,230,.5);background:var(--fill);color:var(--text)}
.drop small{display:block;margin-top:6px;color:var(--text-3);font-size:13px}
.drop.has{border-style:solid;border-color:var(--hair);background:var(--fill);color:var(--text)}
.btn{display:block;width:100%;margin-top:28px;font:inherit;font-size:18px;font-weight:500;letter-spacing:-.005em;color:var(--ink);background:var(--pearl);border:0;border-radius:16px;padding:17px;cursor:pointer;transition:transform .18s var(--ease),opacity .2s}
.btn:active{transform:scale(.975)}
.btn[disabled]{opacity:.4;cursor:default}
.err{margin-top:14px;color:var(--red);font-size:15px;min-height:1.5em}

/* 上传：CU 标当进度环 */
#up{position:fixed;inset:0;z-index:40;display:grid;place-items:center;align-content:center;gap:22px;background:rgba(24,57,43,.78);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
#up.on{opacity:1;pointer-events:auto}
#up .m{width:128px;height:128px;transform:scale(.92);transition:transform .7s var(--spring)}
#up.on .m{transform:none}
#up.fin .m{transform:scale(1.06)}
#up .pc{font:500 15px/1 var(--mono);letter-spacing:.2em;color:var(--text-2);font-variant-numeric:tabular-nums}

.done{margin-top:28px;padding:28px 24px;background:var(--fill);border-radius:22px}
.done h3{font-size:28px;font-weight:600;letter-spacing:-.025em;margin-bottom:6px}
.done p{color:var(--text-2);font-size:15px}
.link{display:flex;gap:8px;margin-top:18px}
.link input{flex:1;min-width:0;font-size:14px;font-family:var(--mono)}
.link button{font:inherit;font-size:15px;color:var(--ink);background:var(--pearl);border:0;border-radius:14px;padding:0 18px;cursor:pointer;transition:transform .18s var(--ease)}
.link button:active{transform:scale(.95)}
.card{padding:22px 0;border-top:1px solid var(--hair)}
.card:first-of-type{border-top:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ch b{font-size:20px;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.chip{flex:none;font-size:12px;color:var(--text-2);padding:3px 11px;border-radius:99px;background:var(--fill-2);letter-spacing:.04em}
.chip.ok{color:var(--ink);background:var(--ok)}
.meta{color:var(--text-3);font-size:13px;margin-top:2px}
audio{display:block;width:100%;height:40px;margin-top:14px;color-scheme:dark}
.ov{margin-top:16px;color:var(--text);font-size:16px;line-height:1.8;white-space:pre-wrap}
.tl{margin-top:14px;display:grid;gap:2px}
.tl button{display:grid;grid-template-columns:54px 1fr;gap:12px;text-align:left;font:inherit;font-size:15px;line-height:1.7;color:var(--text);background:transparent;border:0;border-radius:12px;padding:10px 10px;margin:0 -10px;cursor:pointer;transition:background .2s}
.tl button:hover{background:var(--fill)}
.tl time{font:500 13px/1.9 var(--mono);color:var(--text-3)}
.tl button.on time{color:var(--text)}
/* 三个事实：大数字，不写解释 */
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:30px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.facts div{padding:18px 0 16px 14px;text-align:left;border-left:1px solid var(--hair)}.facts div:first-child{border-left:0;padding-left:0}
.facts b{display:block;font-size:40px;line-height:1;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.facts b small{font-size:15px;font-weight:300;letter-spacing:0;margin-left:2px;color:var(--text-2)}
.facts span{display:block;margin-top:6px;font-size:13px;color:var(--text-3);line-height:1.4}
/* 入选墙：5 个席位 */
.wall{margin-top:56px}
.wall h2{display:flex;justify-content:space-between;align-items:baseline;font:500 12px/1 var(--mono);letter-spacing:.22em;color:var(--text-3);text-transform:uppercase;margin-bottom:16px}
.wall h2 em{font-style:normal;letter-spacing:.12em;text-transform:none}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.seat{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px dashed rgba(238,238,230,.24);display:grid;place-items:center;font:500 12px/1 var(--mono);color:var(--text-3);letter-spacing:.06em;text-align:center;padding:4px;overflow:hidden}
.seat.on{border:1px solid var(--mint);color:var(--text);font:400 12px/1.25 var(--font);letter-spacing:0;background:rgba(156,201,178,.08)}
@media (max-width:420px){.facts b{font-size:34px}}
[hidden]{display:none!important}
@media (max-width:420px){h1{font-size:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rise{opacity:1;transform:none}#intro{display:none}}
@media (prefers-reduced-transparency:reduce){.top,#up{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}}
</style>
</head>
<body class="lock">
<div id="intro" aria-hidden="true"><div class="m"><svg class="cumark" viewBox="272 164 456 456"><path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b b2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></div></div>

<div id="up" aria-live="polite"><div class="m"><svg class="cumark" viewBox="272 164 456 456"><path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/><path class="f" id="r1" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="f" id="r2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></div><div class="pc" id="pc">0%</div></div>

<main>
  <div class="top"><div class="lg"><i><svg class="cumark" viewBox="272 164 456 456"><path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></i>CU MUSIC</div><span class="r">DEMO</span></div>

  <div id="mine" hidden><div class="sec" style="margin-top:44px"><h2>我的投递</h2><div id="list"></div></div></div>

  <div class="rise" id="head" style="margin-top:56px"><div class="kick" style="margin-bottom:14px">ChefDao Audio · 2026</div><h1 id="h1">主厨之选<small>CHEF'S TABLE</small></h1>
    <div class="facts"><div><b>5<small>席</small></b><span>席位<br>Seats</span></div><div><b>1<small>首</small></b><span>免费混音<br>Free mix</span></div><div><b>5<small>折</small></b><span>全年混音<br>26.12–27.12</span></div></div></div>

  <section id="formsec" class="sec" style="margin-top:30px">
    <label class="field rise" style="margin-top:0"><span>艺名<i>Name</i></span><input id="n" type="text" maxlength="20" placeholder="你的艺名" autocomplete="off"></label>
    <div class="field rise"><span>身份<i>Role</i></span>
      <div class="seg" id="role" style="--n:3"><button type="button" data-v="singer" aria-pressed="false">歌手</button><button type="button" data-v="rap" aria-pressed="false">说唱</button><button type="button" data-v="other" aria-pressed="false">其他</button></div>
    </div>
    <div class="field rise"><span>刀门会员<i>Member</i></span>
      <div class="seg" id="seg" style="--n:2"><button type="button" data-v="1" aria-pressed="false">是</button><button type="button" data-v="0" aria-pressed="false">不是</button></div>
    </div>
    <label class="field rise"><span>歌名<i>Title</i></span><input id="t" type="text" maxlength="60" placeholder="这首歌叫什么" autocomplete="off"></label>
    <label class="field rise"><span>主页<i>Profile · 选填</i></span><input id="l" type="text" inputmode="url" maxlength="200" placeholder="抖音 / 小红书 / 网易云主页链接" autocomplete="off"></label>
    <label class="drop rise" id="drop"><input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aif,.aiff,.flac" hidden>
      <span id="dt">选择音频，或拖到这里</span><small>mp3 · m4a · wav</small></label>
    <div class="rise"><button class="btn" id="go" type="button">投递 Submit</button><div class="err" id="err" role="alert"></div></div>
  </section>

  <section class="wall rise" id="wall"><h2>入选 Selected<em>首批 2026.12 公布</em></h2>
    <div class="seats"><div class="seat">01</div><div class="seat">02</div><div class="seat">03</div><div class="seat">04</div><div class="seat">05</div></div></section>

  <section id="ok" class="done" hidden>
    <h3>收到了。</h3>
    <p>反馈会出现在这个链接里。</p>
    <div class="link"><input id="lk" type="text" readonly><button id="cp" type="button">复制</button></div>
  </section>
</main>
<script>
(() => {
'use strict';
const API = 'https://stats.cumusic.work', $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const MAX = 24 * 1024 * 1024;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
let mem = null, role = null, file = null, busy = false;
const LID = (() => { let v = store.get('demo:lid'); if (!/^[A-Z0-9]{6}$/.test(v || '')) { v = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join(''); store.set('demo:lid', v); } return v; })();
const DEV = (() => { const u = navigator.userAgent; const d = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '其他'; return d + (/MicroMessenger/.test(u) ? ' · 微信' : ''); })();
try { fetch(API + '/demo/v', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lid: LID, device: DEV, ref: document.referrer ? new URL(document.referrer).host : '' }), keepalive: true }); } catch (e) {}

const fmt = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const clock = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const day = ts => { const d = new Date(ts); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; };
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* 开场：CU 标画出来 → 放大淡去 → 页面逐层浮起。点一下可跳过 */
let started = false;
const reveal = () => { if (started) return; started = true; $('#intro').classList.add('out'); document.body.classList.remove('lock'); requestAnimationFrame(() => document.body.classList.add('ready')); setTimeout(() => { const i = $('#intro'); if (i) i.remove(); }, 1000); };
if (REDUCE) { document.body.classList.remove('lock'); document.body.classList.add('ready'); } else { setTimeout(reveal, 1900); $('#intro').addEventListener('pointerdown', reveal); }

/* 分段选择 */
function seg(id, on) {
  const box = $(id), btns = [...box.querySelectorAll('button')];
  btns.forEach((b, i) => b.addEventListener('click', () => { box.style.setProperty('--i', i); box.classList.add('set'); btns.forEach(x => x.setAttribute('aria-pressed', x === b)); $('#err').textContent = ''; on(b.dataset.v); }));
}
seg('#role', v => { role = v; });
seg('#seg', v => { mem = v === '1'; });

/* 选文件 */
const setFile = f => {
  if (!f) return;
  if (f.size > MAX) { $('#err').textContent = '文件超过 24MB，请导出 mp3。'; return; }
  file = f; $('#err').textContent = '';
  $('#drop').classList.add('has'); $('#dt').textContent = f.name + ' · ' + fmt(f.size);
  if (!$('#t').value.trim()) $('#t').value = f.name.replace(/\.[^.]+$/, '').slice(0, 60);
};
$('#drop').addEventListener('click', e => { if (e.target !== $('#file')) { e.preventDefault(); $('#file').click(); } });
$('#file').onchange = e => setFile(e.target.files[0]);
['dragenter', 'dragover'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.add('on'); }));
['dragleave', 'drop'].forEach(ev => $('#drop').addEventListener(ev, e => { e.preventDefault(); $('#drop').classList.remove('on'); }));
$('#drop').addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

/* 上传进度环：外圈走前半，内圈走后半；显示值向真实进度平滑追赶 */
let shown = 0, goal = 0, raf = 0;
const paint = p => { $('#r1').style.strokeDashoffset = 1 - Math.min(1, p * 2); $('#r2').style.strokeDashoffset = 1 - Math.max(0, p * 2 - 1); $('#pc').textContent = Math.round(p * 100) + '%'; };
const loop = () => { shown += (goal - shown) * .14; if (Math.abs(goal - shown) < .002) shown = goal; paint(shown); if (busy || shown < goal) raf = requestAnimationFrame(loop); };
const upShow = on => { $('#up').classList.toggle('on', on); $('#up').classList.remove('fin'); if (on) { shown = goal = 0; paint(0); cancelAnimationFrame(raf); loop(); } };

const ERR = { quota: () => '今天已经投过了，明天再来。', full: () => '今天的投递已满，明天再来。', size: () => '文件超过 24MB，请导出 mp3。', rate: () => '操作太频繁，稍后再试。', who: () => '请填写艺名。', title: () => '请填写歌名。' };
$('#go').onclick = () => {
  if (busy) return;
  const n = $('#n').value.trim(), t = $('#t').value.trim(), err = $('#err');
  if (!n) return err.textContent = '请填写艺名。';
  if (!role) return err.textContent = '请选择身份。';
  if (mem === null) return err.textContent = '请选择是否为刀门会员。';
  if (!t) return err.textContent = '请填写歌名。';
  if (!file) return err.textContent = '请选择要投递的音频。';
  err.textContent = ''; busy = true; $('#go').disabled = true; upShow(true);
  let link = $('#l').value.trim(); if (link && !/^https?:\/\//i.test(link)) { const m = link.match(/https?:\/\/\S+/i); link = m ? m[0] : ''; }
  const q = new URLSearchParams({ n, r: role, mem: mem ? '1' : '0', lid: LID, title: t, l: link, ct: file.type || 'audio/mpeg' });
  const x = new XMLHttpRequest();
  x.open('POST', API + '/demo/up?' + q);
  x.upload.onprogress = e => { if (e.lengthComputable) goal = Math.min(.98, e.loaded / e.total); };
  const end = () => { busy = false; $('#go').disabled = false; };
  x.onload = () => {
    let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
    if (j.ok && j.token) { goal = 1; end(); setTimeout(() => $('#up').classList.add('fin'), 500); setTimeout(() => { upShow(false); success(j.token); }, 1100); loop(); return; }
    end(); upShow(false); err.textContent = (ERR[j.e] ? ERR[j.e]() : '投递没有成功，请稍后再试。');
  };
  x.onerror = () => { end(); upShow(false); err.textContent = '网络不稳，请稍后再试。'; };
  x.send(file);
};
const tokens = () => { try { return JSON.parse(store.get('demo:tokens') || '[]'); } catch (e) { return []; } };
function success(tok) {
  const ts = tokens(); if (!ts.includes(tok)) ts.unshift(tok); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10)));
  const url = location.origin + location.pathname + '?t=' + tok;
  $('#lk').value = url; $('#ok').hidden = false; $('#formsec').hidden = true; $('#head').hidden = true;
  $('#mine').before($('#ok')); $('#ok').style.marginTop = '48px'; window.scrollTo({ top: 0, behavior: 'smooth' });
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(url); } catch (e) { $('#lk').select(); } $('#cp').textContent = '已复制'; };
  load();
}

/* 我的投递 */
const STATUS = { new: '已收到', heard: '已收到', done: '反馈已发布' };
async function load() {
  const all = new Set(tokens()); const q = new URLSearchParams(location.search).get('t'); if (q) all.add(q);
  const rows = [];
  for (const t of all) {
    try { const j = await (await fetch(API + '/demo/me?t=' + encodeURIComponent(t), { cache: 'no-store' })).json(); if (j.ok) j.demos.forEach(d => rows.push({ ...d, tok: t })); } catch (e) {}
  }
  if (q && !tokens().includes(q) && rows.length) { const ts = tokens(); ts.unshift(q); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10))); }
  rows.sort((a, b) => b.ts - a.ts);
  const box = $('#list'); box.textContent = '';
  $('#mine').hidden = !rows.length;
  rows.forEach(d => box.append(card(d)));
}
function card(d) {
  const c = el('div', 'card'), h = el('div', 'ch');
  h.append(el('b', '', d.title), el('span', 'chip' + (d.pub ? ' ok' : ''), d.pub ? STATUS.done : STATUS[d.status] || '已收到'));
  c.append(h, el('div', 'meta', day(d.ts) + ' · ' + fmt(d.size)));
  const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = API + '/demo/a?id=' + d.id + '&t=' + encodeURIComponent(d.tok); c.append(a);
  if (d.pub) {
    if (d.overall) c.append(el('div', 'ov', d.overall));
    if (d.notes && d.notes.length) {
      const tl = el('div', 'tl');
      d.notes.forEach(n => { const b = el('button'); b.type = 'button'; b.append(el('time', '', clock(n.t)), el('span', '', n.text));
        b.onclick = () => { a.currentTime = n.t; a.play().catch(() => {}); }; tl.append(b); });
      a.addEventListener('timeupdate', () => { let on = -1; d.notes.forEach((n, i) => { if (a.currentTime >= n.t - .2) on = i; }); [...tl.children].forEach((b, i) => b.classList.toggle('on', i === on)); });
      c.append(tl);
    }
  }
  return c;
}
load();
fetch(API + '/demo/wall').then(r => r.json()).then(j => { (j.seats || []).forEach((who, i) => { const s = document.querySelectorAll('.seat')[i]; if (s) { s.textContent = who; s.classList.add('on'); } }); if ((j.seats || []).length) { const e = document.querySelector('#wall h2 em'); if (e) e.textContent = j.seats.length + ' / 5'; } }).catch(() => {});
})();
