<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>主厨之选 · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* 首屏只有 CU 标和名字；往下是一组 iOS 式分组输入，一页填完 */
:root{
  --bg:#000; --group:#1c1c1e; --sep:rgba(84,84,88,.55); --text:#f5f5f7; --gray:#8e8e93; --gray-2:#636366;
  --mint:#8fbfa6; --red:#ff6961;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.2,.9,.25,1.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:17px/1.47 var(--font);letter-spacing:-.022em;-webkit-font-smoothing:antialiased;caret-color:var(--mint);
  padding:0 max(20px,env(safe-area-inset-left)) calc(64px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.cumark{display:block;width:100%;height:100%;overflow:visible}
.cumark path{fill:none;stroke-width:30;stroke-linecap:round;stroke-dasharray:1}
.cumark .b{stroke:rgba(255,255,255,.1);stroke-dashoffset:0}
.cumark .f{stroke:var(--text);stroke-dashoffset:0}
.hero .f{animation:draw 1.8s cubic-bezier(.45,.05,.15,1) .2s both}
.hero .f2{animation-delay:.65s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

.hero{min-height:64svh;display:grid;place-items:center;align-content:center;padding-top:env(safe-area-inset-top)}
.hero .mark{width:112px;height:112px;margin:0 auto}
.hero h1{margin-top:36px;text-align:center;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:.02em;opacity:0;transform:translateY(8px);animation:up .9s var(--ease) 1.5s forwards}
@keyframes up{to{opacity:1;transform:none}}

main{max-width:420px;margin:0 auto}
.group{background:var(--group);border-radius:14px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;min-height:56px;padding:0 16px;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.fl{flex:1;position:relative;display:block;height:56px}
.fl input{position:absolute;inset:0;width:100%;font:inherit;font-size:17px;color:var(--text);background:transparent;border:0;outline:0;padding:22px 0 6px}
.fl span{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none;transition:transform .25s var(--ease),font-size .25s var(--ease),top .25s var(--ease)}
.fl input:focus+span,.fl input:not(:placeholder-shown)+span{top:9px;transform:none;font-size:12px}
.row .lab{flex:1}
.switch{position:relative;width:51px;height:31px;border-radius:31px;background:#39393d;transition:background .25s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.switch[aria-checked=true]{background:var(--mint)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.file .lab{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .lab.empty{color:var(--gray)}
.file em{font-style:normal;font-size:15px;color:var(--gray-2);margin-left:12px;flex:none}
.submit{display:block;width:100%;margin-top:22px;height:52px;border-radius:14px;background:var(--text);color:#000;font-size:17px;font-weight:600;transition:transform .15s var(--ease),opacity .2s}
.submit:active{transform:scale(.98)}
.submit[disabled]{opacity:.4}
.err{min-height:1.4em;margin-top:12px;text-align:center;font-size:14px;color:var(--red)}
.foot{margin-top:8px;text-align:center;font-size:13px;line-height:1.6;color:var(--gray-2)}

#up{position:fixed;inset:0;z-index:40;display:grid;place-items:center;align-content:center;gap:20px;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#up.on{opacity:1;pointer-events:auto}
#up .mark{width:88px;height:88px}
#up .f{stroke-dashoffset:1}
#up .pc{font:500 12px/1 var(--mono);letter-spacing:.24em;color:var(--gray);font-variant-numeric:tabular-nums}

.done{text-align:center;padding:8px 0 4px}
.done h2{font-size:28px;font-weight:600}
.done p{margin-top:8px;color:var(--gray);font-size:15px}
.link{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:22px}
.link span{font:13px var(--mono);color:var(--gray-2);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link button{font-size:14px;color:var(--text);background:var(--group);border-radius:999px;padding:7px 16px}
.again{margin-top:26px;font-size:15px;color:var(--gray)}

.mine{margin-top:56px}
.mine h3{font-size:13px;font-weight:400;color:var(--gray);text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px 16px}
.card{padding:14px 16px}
.card+.card{border-top:.5px solid var(--sep)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ch b{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.chip{flex:none;font-size:13px;color:var(--gray)}
.chip.ok{color:var(--mint)}
audio{display:block;width:100%;height:34px;margin-top:10px;color-scheme:dark}
.ov{margin-top:12px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.tl{margin-top:8px}
.tl button{display:grid;grid-template-columns:44px 1fr;gap:10px;width:100%;text-align:left;font-size:15px;line-height:1.55;padding:7px 0}
.tl time{font:500 12px/1.9 var(--mono);color:var(--gray-2)}
.tl button.on time{color:var(--mint)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1{opacity:1;transform:none}}
</style>
</head>
<body>
<section class="hero">
  <div class="mark"><svg class="cumark" viewBox="272 164 456 456" aria-hidden="true"><path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/><path class="f" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="f f2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></div>
  <h1>主厨之选</h1>
</section>

<main>
  <form id="form" autocomplete="off" novalidate>
    <div class="group">
      <div class="row"><label class="fl"><input id="n" maxlength="20" placeholder=" "><span>艺名</span></label></div>
      <div class="row"><label class="fl"><input id="t" maxlength="60" placeholder=" "><span>歌名</span></label></div>
      <div class="row"><label class="fl"><input id="l" maxlength="200" inputmode="url" placeholder=" "><span>主页链接（选填）</span></label></div>
      <div class="row"><span class="lab" id="memLab">刀门会员</span><button type="button" class="switch" id="mem" role="switch" aria-checked="false" aria-labelledby="memLab"></button></div>
      <button type="button" class="row file" id="pick"><span class="lab empty" id="fl">选择音频</span><em>MP3 · WAV</em></button>
    </div>
    <input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aif,.aiff,.flac" hidden>
    <button class="submit" id="go" type="submit">投递</button>
    <div class="err" id="err" role="alert"></div>
    <p class="foot">入选可获免费混音一首，以及 26.11 – 27.11 全年混音五折。</p>
  </form>

  <div class="done" id="ok" hidden>
    <h2>收到了。</h2>
    <p>反馈会出现在这个链接里。</p>
    <div class="link"><span id="lk"></span><button id="cp" type="button">复制</button></div>
    <button class="again" id="again" type="button">再投一首</button>
  </div>

  <section class="mine" id="mine" hidden><h3>我的投递</h3><div class="group" id="list"></div></section>
</main>

<div id="up" aria-live="polite"><div class="mark"><svg class="cumark" viewBox="272 164 456 456" aria-hidden="true"><path class="b" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="b" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/><path class="f" id="r1" pathLength="1" d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path class="f" id="r2" pathLength="1" d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg></div><div class="pc" id="pc">0%</div></div>
<script>
(() => {
'use strict';
const API = 'https://stats.cumusic.work', $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const MAX = 24 * 1024 * 1024;
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const fmt = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const clock = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const day = ts => { const d = new Date(ts); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日'; };

const LID = (() => { let v = store.get('demo:lid'); if (!/^[A-Z0-9]{6}$/.test(v || '')) { v = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join(''); store.set('demo:lid', v); } return v; })();
const DEV = (() => { const u = navigator.userAgent; const d = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : '其他'; return d + (/MicroMessenger/.test(u) ? ' · 微信' : ''); })();
try { fetch(API + '/demo/v', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lid: LID, device: DEV, ref: document.referrer ? new URL(document.referrer).host : '' }), keepalive: true }); } catch (e) {}

let file = null, busy = false;
const sw = $('#mem');
sw.onclick = () => sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'));
$('#pick').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if (!f) return; if (f.size > MAX) { $('#err').textContent = '文件超过 24MB，请导出 mp3。'; return; }
  file = f; $('#err').textContent = ''; $('#fl').textContent = f.name; $('#fl').classList.remove('empty');
  if (!$('#t').value.trim()) $('#t').value = f.name.replace(/\.[^.]+$/, '').slice(0, 60); };

/* 上传进度：CU 标两道弧依次画满 */
let shown = 0, goal = 0;
const paint = p => { $('#r1').style.strokeDashoffset = 1 - Math.min(1, p * 2); $('#r2').style.strokeDashoffset = 1 - Math.max(0, p * 2 - 1); $('#pc').textContent = Math.round(p * 100) + '%'; };
const loop = () => { shown += (goal - shown) * .12; if (Math.abs(goal - shown) < .002) shown = goal; paint(shown); if (busy || shown < goal) requestAnimationFrame(loop); };

const ERR = { quota: '今天已经投过了，明天再来。', full: '今天的投递已满，明天再来。', size: '文件超过 24MB，请导出 mp3。', rate: '操作太频繁，稍后再试。', who: '请填写艺名。', title: '请填写歌名。' };
$('#form').addEventListener('submit', e => {
  e.preventDefault(); if (busy) return;
  const n = $('#n').value.trim(), t = $('#t').value.trim(), err = $('#err');
  if (!n) { err.textContent = '请填写艺名。'; $('#n').focus(); return; }
  if (!t) { err.textContent = '请填写歌名。'; $('#t').focus(); return; }
  if (!file) { err.textContent = '请选择音频。'; return; }
  let link = $('#l').value.trim(); if (link && !/^https?:\/\//i.test(link)) { const m = link.match(/https?:\/\/\S+/i); link = m ? m[0] : ''; }
  err.textContent = ''; busy = true; $('#go').disabled = true; shown = goal = 0; paint(0); $('#up').classList.add('on'); loop();
  const q = new URLSearchParams({ n, mem: sw.getAttribute('aria-checked') === 'true' ? '1' : '0', lid: LID, title: t, l: link, ct: file.type || 'audio/mpeg' });
  const x = new XMLHttpRequest();
  x.open('POST', API + '/demo/up?' + q);
  x.upload.onprogress = ev => { if (ev.lengthComputable) goal = Math.min(.97, ev.loaded / ev.total); };
  const end = () => { busy = false; $('#go').disabled = false; };
  x.onload = () => {
    let j = {}; try { j = JSON.parse(x.responseText); } catch (er) {}
    if (j.ok && j.token) { goal = 1; setTimeout(() => { end(); $('#up').classList.remove('on'); done(j.token); }, 1000); return; }
    end(); $('#up').classList.remove('on'); err.textContent = ERR[j.e] || '投递没有成功，请稍后再试。';
  };
  x.onerror = () => { end(); $('#up').classList.remove('on'); err.textContent = '网络不稳，请稍后再试。'; };
  x.send(file);
});

const tokens = () => { try { return JSON.parse(store.get('demo:tokens') || '[]'); } catch (e) { return []; } };
function done(tok) {
  const ts = tokens(); if (!ts.includes(tok)) ts.unshift(tok); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10)));
  const url = location.origin + location.pathname + '?t=' + tok;
  $('#lk').textContent = url.replace(/^https?:\/\//, ''); $('#cp').textContent = '复制';
  $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(url); $('#cp').textContent = '已复制'; } catch (e) { const r = document.createRange(); r.selectNodeContents($('#lk')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  $('#form').hidden = true; $('#ok').hidden = false;
  file = null; $('#t').value = ''; $('#l').value = ''; $('#fl').textContent = '选择音频'; $('#fl').classList.add('empty'); $('#file').value = '';
  load();
}
$('#again').onclick = () => { $('#ok').hidden = true; $('#form').hidden = false; };

/* 我的投递 */
const STATUS = { new: '已收到', heard: '已收到', done: '反馈已发布' };
async function load() {
  const all = new Set(tokens()); const q = new URLSearchParams(location.search).get('t'); if (q) all.add(q);
  const rows = [];
  for (const t of all) { try { const j = await (await fetch(API + '/demo/me?t=' + encodeURIComponent(t), { cache: 'no-store' })).json(); if (j.ok) j.demos.forEach(d => rows.push({ ...d, tok: t })); } catch (e) {} }
  if (q && !tokens().includes(q) && rows.length) { const ts = tokens(); ts.unshift(q); store.set('demo:tokens', JSON.stringify(ts.slice(0, 10))); }
  rows.sort((a, b) => b.ts - a.ts);
  const box = $('#list'); box.textContent = ''; rows.forEach(d => box.append(card(d)));
  $('#mine').hidden = !rows.length;
  if (q && rows.length) setTimeout(() => $('#mine').scrollIntoView({ behavior: 'smooth' }), 600);
}
function card(d) {
  const c = el('div', 'card'), h = el('div', 'ch');
  h.append(el('b', '', d.title), el('span', 'chip' + (d.pub ? ' ok' : ''), d.pub ? STATUS.done : STATUS[d.status] || '已收到'));
  c.append(h);
  const a = document.createElement('audio'); a.controls = true; a.preload = 'none'; a.src = API + '/demo/a?id=' + d.id + '&t=' + encodeURIComponent(d.tok); c.append(a);
  if (d.pub) {
    if (d.overall) c.append(el('div', 'ov', d.overall));
    if (d.notes && d.notes.length) {
      const tl = el('div', 'tl');
      d.notes.forEach(n => { const b = el('button'); b.type = 'button'; b.append(el('time', '', clock(n.t)), el('span', '', n.text)); b.onclick = () => { a.currentTime = n.t; a.play().catch(() => {}); }; tl.append(b); });
      a.addEventListener('timeupdate', () => { let on = -1; d.notes.forEach((n, i) => { if (a.currentTime >= n.t - .2) on = i; }); [...tl.children].forEach((b, i) => b.classList.toggle('on', i === on)); });
      c.append(tl);
    }
  }
  return c;
}
load();
})();
</script>
</body>
</html>
