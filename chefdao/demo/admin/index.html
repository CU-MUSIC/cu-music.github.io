<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>Chef's Table 收件箱 · CU MUSIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap">
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<style>
/* 与已确认的投递页同一套设计：#080808 黑底、#111 面、1px 淡白边、14px 圆角、#f0f0f0 浅色主按钮、Rolex 绿只做"选中/入选"，琥珀色只做反馈点 */
:root{
  --bg:#080808; --surface:#111111; --lift:#151515; --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.2);
  --text:#f0f0f0; --text-2:#9a9a9a; --text-3:#7d7d7d; --fill:rgba(255,255,255,.05); --fill-2:rgba(255,255,255,.09); --fill-3:rgba(255,255,255,.16); --hair:rgba(255,255,255,.08);
  --cta-bg:#f0f0f0; --cta-fg:#0a0a0a; --pearl:#f0f0f0; --ink:#0a0a0a;
  --green:#1f8a5b; --green-soft:#8fc3a9; --amber:#d9c08a; --red:#dd9999; --ok:#8fc3a9;
  --ease:cubic-bezier(.16,1,.3,1); --r:14px;
  --font:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:radial-gradient(900px 420px at 70% -140px,rgba(255,252,248,.06),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;caret-color:var(--green-soft)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit}

/* 顶栏 */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));background:rgba(8,8,8,.78);-webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);border-bottom:1px solid var(--border)}
.brand{display:flex;gap:11px;align-items:center;font-size:15px;font-weight:600;letter-spacing:-.02em}
.brand svg{width:22px;height:22px;overflow:visible}
.brand svg path{fill:none;stroke:var(--text);stroke-width:46;stroke-linecap:round}
.brand i{font-family:"Instrument Serif","Times New Roman",serif;font-style:italic;font-weight:400;font-size:1.28em;color:var(--green);margin-right:-.15em}
.brand small{font:500 10px var(--mono);letter-spacing:.2em;color:var(--text-3);margin-left:6px}
#cnt{font-size:13px;color:var(--text-2)}
#cnt b{color:var(--text);font-weight:600}

/* 布局 */
.wrap{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 56px)}
.side{border-right:1px solid var(--border);padding:16px 14px 40px;overflow-y:auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.tabs button{flex:1 1 auto;font-size:13px;color:var(--text-3);border-radius:9px;padding:6px 8px;transition:background .25s var(--ease),color .25s}
.tabs button:hover{color:var(--text)}
.tabs button[aria-pressed=true]{background:var(--fill-2);color:var(--text)}
#list{display:grid;gap:6px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;transition:border-color .25s var(--ease),background .25s}
.item:hover{border-color:var(--border-hover)}
.item.on{background:var(--lift);border-color:rgba(255,255,255,.22)}
.item b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>span{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:12px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}.dot.heard{background:var(--text-3)}.dot.done{background:var(--green)}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--fill-3);color:var(--text);letter-spacing:.02em}
.tag.g{background:transparent;border:1px solid var(--border-hover);color:var(--text-2)}
.main{padding:32px max(24px,env(safe-area-inset-right)) 96px 36px;min-width:0;max-width:780px}
.empty{color:var(--text-3);padding:64px 0;text-align:center;font-size:14px}

/* 详情 */
h1{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere}
.sub{margin-top:8px;color:var(--text-2);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub button{font-size:12px;color:var(--text-2);background:var(--fill);border-radius:99px;padding:3px 11px;transition:background .2s,color .2s}
.sub button:hover{background:var(--fill-2);color:var(--text)}
.lnk{font-size:12px;color:var(--text-2);text-underline-offset:3px}
.brief{margin-top:14px;color:var(--text-2);font-size:14px;white-space:pre-wrap;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.pl{margin-top:24px;padding:22px 22px 20px;background:var(--surface);border:1px solid var(--border);border-radius:18px}
.clock{font:500 36px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:14px;color:var(--text-3);margin-left:8px;letter-spacing:0}

/* 波形 */
.wf{position:relative;height:132px;margin-top:18px;cursor:pointer;touch-action:none;user-select:none}
.wf canvas{display:block;width:100%;height:112px}
.wf .axis{position:relative;height:20px;font:500 10px/20px var(--mono);color:var(--text-3);letter-spacing:.04em}
.wf .axis span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.wf .axis span:first-child{transform:none}
.wf .tip{position:absolute;top:-6px;max-width:260px;padding:5px 10px;border-radius:9px;background:rgba(24,24,24,.96);border:1px solid var(--border-hover);font-size:12px;line-height:1.5;color:var(--text);pointer-events:none;opacity:0;transform:translate(-50%,-100%);transition:opacity .15s;white-space:normal;z-index:3}
.wf .tip b{font:500 11px var(--mono);color:var(--amber);margin-right:6px}
.wf.hv .tip{opacity:1}
.wf .wl{position:absolute;top:0;width:1px;height:112px;background:rgba(255,255,255,.3);pointer-events:none;opacity:0}
.wf.hv .wl{opacity:1}
.wf .ldw{position:absolute;inset:0 0 20px;display:grid;place-items:center;font:500 11px var(--mono);letter-spacing:.2em;color:var(--text-3);pointer-events:none;transition:opacity .4s}
.wf .ldw.off{opacity:0}
.ctl{display:flex;align-items:center;gap:10px;margin-top:6px}
.play{width:48px;height:48px;border-radius:50%;background:var(--cta-bg);color:var(--ink);display:grid;place-items:center;transition:transform .2s var(--ease)}
.play:active{transform:scale(.93)}
.play svg{width:19px;height:19px;fill:currentColor}
.sk{background:var(--fill);border-radius:99px;padding:7px 14px;font-size:13px;color:var(--text-2);transition:background .2s,color .2s}
.sk:hover{background:var(--fill-2);color:var(--text)}
.ld{color:var(--text-3);font-size:12px;margin-top:10px;min-height:1.2em;font-variant-numeric:tabular-nums}
.lbox{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.lbox em{font:500 10px var(--mono);color:var(--text-3);font-style:normal;letter-spacing:.06em}
.lbox select{padding:4px 8px;font-size:12px;border-radius:8px}
.lsw{position:relative;width:36px;height:22px;border-radius:22px;background:var(--fill-3);transition:background .25s var(--ease);flex:none}
.lsw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#f0f0f0;transition:transform .3s var(--ease)}
.lsw[aria-checked=true]{background:var(--green)}
.lsw[aria-checked=true]::after{transform:translateX(14px)}

/* 分区 */
.sec{margin-top:32px}
.sec>h2{font:500 11px/1 var(--mono);letter-spacing:.2em;color:var(--text-3);text-transform:uppercase;margin-bottom:12px}
textarea{width:100%;font:inherit;font-size:15px;line-height:1.6;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;outline:0;resize:vertical;min-height:76px;transition:border-color .25s var(--ease)}
textarea:focus{border-color:var(--border-hover)}
::placeholder{color:var(--text-3)}
.row{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{border-radius:12px;padding:10px 20px;font-size:14px;font-weight:600;background:var(--cta-bg);color:var(--cta-fg);transition:transform .15s var(--ease),opacity .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--fill-2);color:var(--text)}
.btn.ghost:hover{background:var(--fill-3)}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--text-3);font-size:12px}
.notes{display:grid;margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.notes:empty{display:none}
.note{display:grid;grid-template-columns:52px 1fr 28px;gap:10px;align-items:start;padding:11px 14px}
.note+.note{border-top:1px solid var(--border)}
.note:hover{background:var(--lift)}
.note time{font:500 12px/1.9 var(--mono);color:var(--amber);cursor:pointer}
.note p{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.note button.x{color:var(--text-3);font-size:18px;line-height:1.5;opacity:0;transition:opacity .2s}
.note:hover button.x{opacity:1}
select{font:inherit;font-size:14px;color:var(--text);background:var(--fill-2);border:0;border-radius:10px;padding:8px 12px;color-scheme:dark}
.danger{color:var(--red);font-size:12px;margin-top:40px}
.login{max-width:360px;margin:22vh auto;padding:0 24px}
.login p{color:var(--text-2)}
.login input{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;outline:0;margin:14px 0}
.login input:focus{border-color:var(--border-hover)}

/* 打分 / 入选 */
.score{display:grid;gap:6px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.srow{display:flex;align-items:center;gap:14px}
.sname{width:4.5em;color:var(--text-2);font-size:13px}
.dots{display:flex;gap:6px}
.dot5{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-hover);color:var(--text-3);font:500 12px/1 var(--mono);transition:background .2s,color .2s,border-color .2s}
.dot5:hover{border-color:var(--text-2)}
.dot5.on{background:var(--pearl);color:var(--ink);border-color:var(--pearl)}
.stotal{margin-top:6px;color:var(--text-2);font:500 12px var(--mono)}
#pick:not(.ghost){background:var(--green);color:#fff}

/* 访问 */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:4px 12px}
.chips span b{color:var(--text);font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.vis{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.v{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:13px 16px}
.v+.v{border-top:1px solid var(--border)}
.v b{font-size:15px;font-weight:600}
.v.no b{color:var(--text-3);font-weight:500}
.v .src{grid-column:1;font-size:13px;color:var(--text)}
.v .src i{font-style:normal;font-size:11px;color:var(--green-soft);background:var(--fill);border-radius:99px;padding:1px 9px;margin-right:8px}
.v .src i.u{color:var(--text-3)}
.v span{grid-column:1;color:var(--text-3);font-size:12px}
.v em{grid-column:2;grid-row:1/4;align-self:center;font-style:normal;color:var(--text-2);font-size:12px;text-align:right}
[hidden]{display:none!important}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--border);max-height:42vh}.main{padding:22px 20px 80px}.note button.x{opacity:1}.clock{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="brand"><svg viewBox="272 164 456 456"><path d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg><span><i>Chef’s</i> Table</span><small>INBOX</small></div><span id="cnt"></span></div>

<div class="login" id="login" hidden>
  <p style="color:var(--text-2)">粘贴看板钥匙（和 Insights 同一个）。</p>
  <input id="key" type="password" placeholder="看板钥匙" autocomplete="off">
  <button class="btn" id="keygo" type="button">进入</button>
</div>

<div class="wrap" id="app" hidden>
  <aside class="side">
    <div class="tabs" id="tabs">
      <button data-f="all" aria-pressed="true">全部</button><button data-f="mem" aria-pressed="false">刀门</button><button data-f="pub" aria-pressed="false">访客</button><button data-f="new" aria-pressed="false">待听</button><button data-f="pick" aria-pressed="false">入选</button><button data-f="vis" aria-pressed="false">访问</button>
    </div>
    <div id="list"></div>
  </aside>
  <section class="main" id="main"><div class="empty">选一首开始听</div></section>
</div>

<script src="/chefdao/review/lufs.js"></script>
<script>
(() => {
'use strict';
const API = 'https://stats.cumusic.work', $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }, del(k) { try { localStorage.removeItem(k) } catch (e) {} } };
let KEY = store.get('insights:key'), D = [], cur = null, filter = 'all';
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ROLE = { singer: '歌手', rap: '说唱', other: '其他', artist: '艺人', mixer: '混音师', beat: 'Beatmaker' };
const CRIT = [['w', '作品力'], ['o', '产出'], ['i', '影响力'], ['c', '配合度']];
const total = sc => CRIT.reduce((t, [k]) => t + (+(sc || {})[k] || 0), 0);
const clock = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const ago = ts => { const m = Math.floor((Date.now() - ts) / 6e4); return m < 60 ? Math.max(1, m) + ' 分钟前' : m < 1440 ? Math.floor(m / 60) + ' 小时前' : Math.floor(m / 1440) + ' 天前'; };
async function api(path, body) {
  const r = await fetch(API + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) } : { headers: { Authorization: 'Bearer ' + KEY }, cache: 'no-store' });
  if (r.status === 401) { store.del('insights:key'); KEY = null; start(); throw new Error('401'); }
  return r;
}
function start() {
  if (!KEY) { $('#login').hidden = false; $('#app').hidden = true; return; }
  $('#login').hidden = true; $('#app').hidden = false; load();
}
$('#keygo').onclick = () => { const v = $('#key').value.trim(); if (v) { KEY = v; store.set('insights:key', v); start(); } };
$('#key').onkeydown = e => { if (e.key === 'Enter') $('#keygo').click(); };

async function load(keep) {
  const j = await (await api('/demo/all')).json();
  if (!j.ok) return;
  D = j.demos; $('#cnt').textContent = D.filter(d => d.status === 'new').length ? D.filter(d => d.status === 'new').length + ' 首待听' : '';
  renderList();
  if (keep && cur) { const d = D.find(x => x.id === cur.id); if (d) { cur.d = d; renderNotes(); renderMeta(); renderScore(); } }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (filter === 'vis') return showVisits(); renderList(); });
function renderList() {
  const box = $('#list'); box.textContent = '';
  if (filter === 'vis') return;
  const rows = D.filter(d => filter === 'all' || (filter === 'new' ? d.status === 'new' : filter === 'pick' ? d.pick > 0 : d.kind === filter));
  if (!rows.length) box.append(el('div', 'empty', '还没有投递'));
  rows.forEach(d => {
    const b = el('button', 'item' + (cur && cur.id === d.id ? ' on' : '')); b.type = 'button';
    b.append(el('b', '', d.title));
    const s = el('span'); s.append(el('i', 'dot ' + (d.pub ? 'done' : d.status === 'heard' ? 'heard' : '')), el('span', 'tag' + (d.kind === 'mem' ? '' : ' g'), d.kind === 'mem' ? '刀门' : '访客'), document.createTextNode((d.pick ? '★ ' : '') + d.who + (d.role ? ' · ' + ROLE[d.role] : '') + ' · ' + ago(d.ts) + (total(d.scores) ? ' · ' + total(d.scores) + ' 分' : '') + (d.notes.length ? ' · ' + d.notes.length + ' 条' : '')));
    b.append(s); b.onclick = () => open(d); box.append(b);
  });
}


/* 访问：谁打开过投递页（按设备），投没投 */
function srcOf(v) {
  const r = (v.ref || '').toLowerCase(), dev = v.device || '';
  if (r === 'moments') return ['朋友圈', true];
  if (/douyin|iesdouyin/.test(r)) return ['抖音', true];
  if (/xiaohongshu|xhslink/.test(r)) return ['小红书', true];
  if (/weixin|wechat|qq\.com/.test(r)) return ['微信', true];
  if (/cumusic\.work/.test(r)) return ['站内跳转', true];
  if (r) return [r, true];
  return [/微信/.test(dev) ? '微信内打开（来源未记）' : '直接打开', false];
}
async function showVisits() {
  $('#list').textContent = ''; cur = null; if (audio) audio.pause();
  const m = $('#main'); m.textContent = ''; m.append(el('h1', '', '访问'));
  const j = await (await api('/demo/visits')).json();
  const rows = j.visits || [];
  const sub = el('div', 'sub'); sub.textContent = rows.length + ' 台设备打开过 · ' + rows.filter(v => v.who).length + ' 台投过'; m.append(sub);
  if (!rows.length) { m.append(el('div', 'empty', '还没有人打开过')); return; }
  const by = {}; rows.forEach(v => { const k = srcOf(v)[0]; by[k] = (by[k] || 0) + 1; });
  const chips = el('div', 'chips'); Object.entries(by).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => { const c = el('span', '', k); c.append(el('b', '', String(n))); chips.append(c); }); m.append(chips);
  const box = el('div', 'vis');
  rows.forEach(v => {
    const r = el('div', 'v' + (v.who ? '' : ' no')), [label, known] = srcOf(v);
    r.append(el('b', '', v.who || '未投递'));
    const src = el('div', 'src'); src.append(el('i', known ? '' : 'u', label)); r.append(src);
    r.append(el('span', '', [v.device, [v.country, v.city].filter(Boolean).join(' ')].filter(Boolean).join(' · ')));
    r.append(el('em', '', (v.n > 1 ? v.n + ' 次 · ' : '') + ago(v.last)));
    box.append(r);
  });
  m.append(box);
}
/* 播放器：带钥匙取音频 → blob */
let audio = null, url = null, raf = 0;
async function open(d) {
  cur = { id: d.id, d };
  renderList();
  const m = $('#main'); m.textContent = '';
  m.append(el('h1', '', d.title));
  const sub = el('div', 'sub'); sub.id = 'meta'; m.append(sub);
  m.append(el('div', 'brief', d.note || '')); if (!d.note) m.lastChild.hidden = true; m.lastChild.id = 'brief';
  const pl = el('div', 'pl');
  pl.innerHTML = '<div class="clock"><span id="cur">0:00</span><small id="dur">/ 0:00</small></div><div class="wf" id="track"><canvas id="wfc"></canvas><div class="wl" id="wl"></div><div class="tip" id="tip"></div><div class="ldw" id="ldw">解析波形…</div><div class="axis" id="axis"></div></div><div class="ctl"><button class="play" id="play" type="button" aria-label="播放"><svg viewBox="0 0 24 24" id="ico"></svg></button><button class="sk" data-s="-5" type="button">−5 秒</button><button class="sk" data-s="5" type="button">+5 秒</button><label class="lbox"><button type="button" class="lsw" id="lb" role="switch" aria-checked="true" aria-label="响度平衡"></button><span>响度平衡</span><select id="lt" aria-label="目标响度"><option value="-16">−16</option><option value="-14">−14</option><option value="-12">−12</option><option value="-10">−10</option><option value="-8">−8</option></select><em>LUFS</em></label></div><div class="ld" id="ld">加载音频…</div>';
  m.append(pl);
