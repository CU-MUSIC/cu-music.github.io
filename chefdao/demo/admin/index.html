<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e0f">
<title>Demo 收件箱 · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<style>
:root{
  --bg:#0e0e0f; --bg2:#151516; --fill:rgba(236,234,230,.05); --fill-2:rgba(236,234,230,.09); --fill-3:rgba(236,234,230,.15); --hair:rgba(236,234,230,.1);
  --text:#e8e6e2; --text-2:#a3a19d; --text-3:#74726f; --pearl:#ebe9e5; --ink:#121213; --red:#e9a19a; --ok:#a9c9b4; --amber:#d9c08a;
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:16px/1.65 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(22px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 18px max(20px,env(safe-area-inset-left));font:500 12px/1 var(--mono);letter-spacing:.26em;color:var(--text-3);border-bottom:1px solid var(--hair)}
.wrap{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--hair);padding:14px 0 40px;overflow-y:auto}
.tabs{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
.tabs button{font-size:13px;color:var(--text-2);background:transparent;border:0;border-radius:99px;padding:6px 13px}
.tabs button[aria-pressed=true]{background:var(--fill-2);color:var(--text)}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;padding:13px 20px;border-top:1px solid var(--hair);transition:background .2s}
.item:hover{background:var(--fill)}.item.on{background:var(--fill-2)}
.item b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>span{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:13px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}.dot.heard{background:var(--text-3)}.dot.done{background:var(--ok)}
.tag{font-size:11px;letter-spacing:.06em;padding:1px 7px;border-radius:99px;background:var(--fill-3);color:var(--text)}
.tag.g{background:transparent;border:1px solid var(--hair);color:var(--text-2)}
.main{padding:28px max(24px,env(safe-area-inset-right)) 80px 32px;min-width:0;max-width:760px}
.vis{margin-top:22px}.v{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:12px 0;border-top:1px solid var(--hair)}.v b{font-weight:600;font-size:16px}.v.no b{color:var(--text-3);font-weight:500}.v span{grid-column:1;color:var(--text-3);font-size:13px}.v em{grid-column:2;grid-row:1/3;align-self:center;font-style:normal;color:var(--text-2);font-size:13px;text-align:right}
.score{display:grid;gap:8px}.srow{display:flex;align-items:center;gap:14px}.sname{width:4.5em;color:var(--text-2);font-size:15px}.dots{display:flex;gap:6px}.dot5{width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:transparent;color:var(--text-3);font:500 13px/1 var(--mono)}.dot5.on{background:var(--pearl);color:var(--ink);border-color:var(--pearl)}.stotal{margin-top:4px;color:var(--text-2);font:500 14px var(--mono)}.lnk{color:var(--text);font-size:13px}
.empty{color:var(--text-3);padding:60px 0;text-align:center}
h1{font-size:28px;line-height:1.3;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.sub{margin-top:6px;color:var(--text-2);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sub button{font-size:12px;color:var(--text-2);background:var(--fill);border:0;border-radius:99px;padding:3px 10px}
.brief{margin-top:14px;color:var(--text-2);font-size:15px;white-space:pre-wrap;padding:12px 14px;background:var(--fill);border-radius:12px}
.pl{margin-top:26px;padding:22px 22px 18px;background:var(--bg2);border:1px solid var(--hair);border-radius:18px}
.clock{font:500 38px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock small{font-size:16px;color:var(--text-3);margin-left:8px}
.track{position:relative;height:36px;margin-top:16px;cursor:pointer;touch-action:none}
.track::before{content:"";position:absolute;left:0;right:0;top:17px;height:3px;border-radius:3px;background:var(--fill-3)}
.fillbar{position:absolute;left:0;top:17px;height:3px;border-radius:3px;background:var(--pearl);width:0}
.knob{position:absolute;top:11px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--pearl);left:0;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.mk{position:absolute;top:6px;width:2px;height:10px;margin-left:-1px;border-radius:1px;background:var(--amber)}
.ctl{display:flex;align-items:center;gap:10px;margin-top:6px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--pearl);color:var(--ink);display:grid;place-items:center;transition:transform .2s var(--ease)}
.play:active{transform:scale(.94)}
.play svg{width:20px;height:20px;fill:currentColor}
.sk{border:0;background:var(--fill);border-radius:99px;padding:8px 14px;font-size:14px;color:var(--text-2)}
.sk:hover{background:var(--fill-2);color:var(--text)}
.ld{color:var(--text-3);font-size:13px;margin-top:10px;min-height:1.3em}
.sec{margin-top:34px}
.sec>h2{font:500 12px/1 var(--mono);letter-spacing:.22em;color:var(--text-3);text-transform:uppercase;margin-bottom:12px}
textarea{width:100%;font:inherit;font-size:16px;line-height:1.6;color:var(--text);background:var(--fill);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:0;resize:vertical;min-height:72px;transition:border-color .2s,background .2s}
textarea:focus{border-color:var(--hair);background:var(--fill-2)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:500;background:var(--pearl);color:var(--ink)}
.btn.ghost{background:var(--fill-2);color:var(--text)}
.btn:disabled{opacity:.45}
.hint{color:var(--text-3);font-size:13px}
.notes{display:grid;gap:2px;margin-top:14px}
.note{display:grid;grid-template-columns:56px 1fr 28px;gap:10px;align-items:start;padding:9px 8px;margin:0 -8px;border-radius:10px}
.note:hover{background:var(--fill)}
.note time{font:500 14px/1.7 var(--mono);color:var(--amber);background:transparent;border:0;text-align:left;padding:0}
.note p{font-size:15.5px;line-height:1.7;overflow-wrap:anywhere}
.note button.x{border:0;background:transparent;color:var(--text-3);font-size:18px;line-height:1.5;opacity:0}
.note:hover button.x{opacity:1}
select{font:inherit;font-size:15px;color:var(--text);background:var(--fill-2);border:0;border-radius:10px;padding:9px 12px;color-scheme:dark}
.danger{color:var(--red);background:transparent;border:0;font-size:13px;margin-top:40px;padding:0}
.login{max-width:380px;margin:20vh auto;padding:0 24px}
.login input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--fill);border:0;border-radius:12px;padding:13px 14px;outline:0;margin:14px 0}
[hidden]{display:none!important}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--hair);max-height:38vh}.main{padding:22px 20px 80px}.note button.x{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><span>CU MUSIC · DEMO</span><span id="cnt"></span></div>

<div class="login" id="login" hidden>
  <p style="color:var(--text-2)">粘贴看板钥匙（和 Insights 同一个）。</p>
  <input id="key" type="password" placeholder="看板钥匙" autocomplete="off">
  <button class="btn" id="keygo" type="button">进入</button>
</div>

<div class="wrap" id="app" hidden>
  <aside class="side">
    <div class="tabs" id="tabs">
      <button data-f="all" aria-pressed="true">全部</button><button data-f="mem" aria-pressed="false">刀门</button><button data-f="pub" aria-pressed="false">访客</button><button data-f="new" aria-pressed="false">待听</button><button data-f="pick" aria-pressed="false">入选</button><button data-f="vis" aria-pressed="false">访问</button>
    </div>
    <div id="list"></div>
  </aside>
  <section class="main" id="main"><div class="empty">选一首开始听</div></section>
</div>

<script>
(() => {
'use strict';
const API = 'https://stats.cumusic.work', $ = s => document.querySelector(s);
const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }, del(k) { try { localStorage.removeItem(k) } catch (e) {} } };
let KEY = store.get('insights:key'), D = [], cur = null, filter = 'all';
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ROLE = { singer: '歌手', rap: '说唱', other: '其他', artist: '艺人', mixer: '混音师', beat: 'Beatmaker' };
const CRIT = [['w', '作品力'], ['o', '产出'], ['i', '影响力'], ['c', '配合度']];
const total = sc => CRIT.reduce((t, [k]) => t + (+(sc || {})[k] || 0), 0);
const clock = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const ago = ts => { const m = Math.floor((Date.now() - ts) / 6e4); return m < 60 ? Math.max(1, m) + ' 分钟前' : m < 1440 ? Math.floor(m / 60) + ' 小时前' : Math.floor(m / 1440) + ' 天前'; };
async function api(path, body) {
  const r = await fetch(API + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) } : { headers: { Authorization: 'Bearer ' + KEY }, cache: 'no-store' });
  if (r.status === 401) { store.del('insights:key'); KEY = null; start(); throw new Error('401'); }
  return r;
}
function start() {
  if (!KEY) { $('#login').hidden = false; $('#app').hidden = true; return; }
  $('#login').hidden = true; $('#app').hidden = false; load();
}
$('#keygo').onclick = () => { const v = $('#key').value.trim(); if (v) { KEY = v; store.set('insights:key', v); start(); } };
$('#key').onkeydown = e => { if (e.key === 'Enter') $('#keygo').click(); };

async function load(keep) {
  const j = await (await api('/demo/all')).json();
  if (!j.ok) return;
  D = j.demos; $('#cnt').textContent = D.filter(d => d.status === 'new').length ? D.filter(d => d.status === 'new').length + ' 首待听' : '';
  renderList();
  if (keep && cur) { const d = D.find(x => x.id === cur.id); if (d) { cur.d = d; renderNotes(); renderMeta(); renderScore(); } }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b)); if (filter === 'vis') return showVisits(); renderList(); });
function renderList() {
  const box = $('#list'); box.textContent = '';
  if (filter === 'vis') return;
  const rows = D.filter(d => filter === 'all' || (filter === 'new' ? d.status === 'new' : filter === 'pick' ? d.pick > 0 : d.kind === filter));
  if (!rows.length) box.append(el('div', 'empty', '还没有投递'));
  rows.forEach(d => {
    const b = el('button', 'item' + (cur && cur.id === d.id ? ' on' : '')); b.type = 'button';
    b.append(el('b', '', d.title));
    const s = el('span'); s.append(el('i', 'dot ' + (d.pub ? 'done' : d.status === 'heard' ? 'heard' : '')), el('span', 'tag' + (d.kind === 'mem' ? '' : ' g'), d.kind === 'mem' ? '刀门' : '访客'), document.createTextNode((d.pick ? '★ ' : '') + d.who + (d.role ? ' · ' + ROLE[d.role] : '') + ' · ' + ago(d.ts) + (total(d.scores) ? ' · ' + total(d.scores) + ' 分' : '') + (d.notes.length ? ' · ' + d.notes.length + ' 条' : '')));
    b.append(s); b.onclick = () => open(d); box.append(b);
  });
}


/* 访问：谁打开过投递页（按设备），投没投 */
async function showVisits() {
  $('#list').textContent = ''; cur = null; if (audio) audio.pause();
  const m = $('#main'); m.textContent = ''; m.append(el('h1', '', '访问'));
  const j = await (await api('/demo/visits')).json();
  const rows = j.visits || [];
  const sub = el('div', 'sub'); sub.textContent = rows.length + ' 台设备 · ' + rows.filter(v => v.who).length + ' 台投过'; m.append(sub);
  if (!rows.length) { m.append(el('div', 'empty', '还没有人打开过')); return; }
  const box = el('div', 'vis');
  rows.forEach(v => {
    const r = el('div', 'v');
    r.append(el('b', '', v.who || '未投递'), el('span', '', [v.device, [v.country, v.city].filter(Boolean).join(' '), v.ref ? '来自 ' + v.ref : ''].filter(Boolean).join(' · ')), el('em', '', (v.n > 1 ? v.n + ' 次 · ' : '') + ago(v.last)));
    if (!v.who) r.classList.add('no'); box.append(r);
  });
  m.append(box);
}

/* 播放器：带钥匙取音频 → blob */
let audio = null, url = null, raf = 0;
async function open(d) {
  cur = { id: d.id, d };
  renderList();
  const m = $('#main'); m.textContent = '';
  m.append(el('h1', '', d.title));
  const sub = el('div', 'sub'); sub.id = 'meta'; m.append(sub);
  m.append(el('div', 'brief', d.note || '')); if (!d.note) m.lastChild.hidden = true; m.lastChild.id = 'brief';
  const pl = el('div', 'pl');
  pl.innerHTML = '<div class="clock"><span id="cur">0:00</span><small id="dur">/ 0:00</small></div><div class="track" id="track"><div class="fillbar" id="fillbar"></div><div class="knob" id="knob"></div></div><div class="ctl"><button class="play" id="play" type="button" aria-label="播放"><svg viewBox="0 0 24 24" id="ico"></svg></button><button class="sk" data-s="-5" type="button">−5 秒</button><button class="sk" data-s="5" type="button">+5 秒</button></div><div class="ld" id="ld">加载音频…</div>';
  m.append(pl);
  const sec = el('div', 'sec'); sec.innerHTML = '<h2>时间点反馈</h2><textarea id="nt" placeholder="写在当前这一刻（Enter 添加，Shift+Enter 换行，快捷键 N）"></textarea><div class="row"><button class="btn" id="add" type="button">在 0:00 添加</button><span class="hint">按 N 会把光标放到输入框，并记住当下的时间</span></div><div class="notes" id="notes"></div>';
  m.append(sec);
  const pk = el('div', 'sec'); pk.innerHTML = '<h2>主厨之选</h2><div class="score" id="score"></div><div class="row"><button class="btn ghost" id="pick" type="button"></button><span class="hint" id="pickh"></span></div>';
  m.append(pk);
  const ov = el('div', 'sec'); ov.innerHTML = '<h2>整体感受</h2><textarea id="ov" placeholder="整体评价（发布后和时间点反馈一起给对方看）"></textarea><div class="row"><button class="btn" id="pub" type="button"></button><span class="hint" id="pubh"></span></div><button class="danger" id="del" type="button">删除这首</button>';
  m.append(ov);
  $('#ov').value = d.overall || '';
  renderMeta(); renderNotes(); renderScore(); bindPlayer(d);
  m.scrollTop = 0; window.scrollTo(0, 0);
}
const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';
function bindPlayer(d) {
  if (audio) { audio.pause(); cancelAnimationFrame(raf); } if (url) URL.revokeObjectURL(url);
  audio = new Audio(); audio.preload = 'auto'; url = null;
  const ico = $('#ico'); const setIco = p => ico.innerHTML = '<path d="' + p + '"/>'; setIco(PLAY);
  api('/demo/a?id=' + d.id).then(r => r.blob()).then(b => { if (!cur || cur.id !== d.id) return; url = URL.createObjectURL(b); audio.src = url; $('#ld').textContent = ''; }).catch(() => { $('#ld').textContent = '音频加载失败'; });
  audio.onloadedmetadata = () => { $('#dur').textContent = '/ ' + clock(audio.duration); drawMarks(); };
  const tick = () => { const t = audio.currentTime || 0, f = audio.duration ? t / audio.duration : 0; $('#cur').textContent = clock(t); $('#fillbar').style.width = f * 100 + '%'; $('#knob').style.left = f * 100 + '%'; $('#add').textContent = '在 ' + clock(t) + ' 添加'; raf = requestAnimationFrame(tick); };
  audio.onplay = () => { setIco(PAUSE); cancelAnimationFrame(raf); tick(); }; audio.onpause = () => { setIco(PLAY); cancelAnimationFrame(raf); tick(); cancelAnimationFrame(raf); };
  audio.onended = () => setIco(PLAY);
  $('#play').onclick = toggle;
  document.querySelectorAll('.sk').forEach(b => b.onclick = () => skip(+b.dataset.s));
  const tr = $('#track'); let drag = false;
  const seekTo = e => { const r = tr.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); if (audio.duration) { audio.currentTime = f * audio.duration; $('#fillbar').style.width = f * 100 + '%'; $('#knob').style.left = f * 100 + '%'; $('#cur').textContent = clock(audio.currentTime); } };
  tr.onpointerdown = e => { drag = true; tr.setPointerCapture(e.pointerId); seekTo(e); }; tr.onpointermove = e => { if (drag) seekTo(e); }; tr.onpointerup = () => { drag = false; };
  $('#add').onclick = addNote;
  $('#nt').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); addNote(); } };
  $('#pub').onclick = publish; $('#del').onclick = remove;
}
const toggle = () => { if (!audio || !audio.src) return; audio.paused ? audio.play() : audio.pause(); };
const skip = s => { if (audio && audio.duration) audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + s)); };
function drawMarks() {
  document.querySelectorAll('.mk').forEach(x => x.remove());
  if (!audio || !audio.duration || !cur) return;
  cur.d.notes.forEach(n => { const m = el('i', 'mk'); m.style.left = n.t / audio.duration * 100 + '%'; $('#track').append(m); });
}
let noteT = null;
async function addNote() {
  const ta = $('#nt'), text = ta.value.trim(); if (!text) return;
  const t = noteT != null ? noteT : (audio ? audio.currentTime : 0); noteT = null;
  $('#add').disabled = true;
  try { const j = await (await api('/demo/note', { id: cur.id, t: Math.round(t * 10) / 10, text })).json(); if (j.ok) { ta.value = ''; await load(true); drawMarks(); } } catch (e) {}
  $('#add').disabled = false;
}
function renderNotes() {
  const box = $('#notes'); if (!box) return; box.textContent = '';
  cur.d.notes.slice().sort((a, b) => a.t - b.t).forEach(n => {
    const r = el('div', 'note'); const tm = el('time', '', clock(n.t)); tm.style.cursor = 'pointer';
    tm.onclick = () => { if (audio) { audio.currentTime = n.t; audio.play().catch(() => {}); } };
    const x = el('button', 'x', '×'); x.type = 'button'; x.title = '删除'; x.onclick = async () => { await api('/demo/notedel', { nid: n.nid }); load(true).then(drawMarks); };
    r.append(tm, el('p', '', n.text), x); box.append(r);
  });
}
function renderMeta() {
  const d = cur.d, s = $('#meta'); if (!s) return; s.textContent = '';
  s.append(el('span', 'tag' + (d.kind === 'mem' ? '' : ' g'), d.kind === 'mem' ? '刀门' : '访客'), document.createTextNode(d.who + (d.role ? ' · ' + ROLE[d.role] : '') + ' · ' + ago(d.ts)));
  if (d.link) { const a = el('a', '', '主页 ↗'); a.href = d.link; a.target = '_blank'; a.rel = 'noopener'; a.className = 'lnk'; s.append(a); }
  const sw = el('button', '', d.kind === 'mem' ? '改为访客' : '改为刀门会员'); sw.type = 'button'; sw.onclick = async () => { await api('/demo/kind', { id: d.id, mem: d.kind === 'mem' ? 0 : 1 }); load(true); };
  s.append(sw);
  const b = $('#brief'); if (b) { b.textContent = d.note || ''; b.hidden = !d.note; }
  const pub = $('#pub'); pub.textContent = d.pub ? '撤回发布' : '发布给对方'; pub.className = 'btn' + (d.pub ? ' ghost' : '');
  $('#pubh').textContent = d.pub ? '对方现在能看到你的反馈' : '发布前对方看不到任何内容';
}

/* 主厨之选：四项 1–5 分 + 入选（最多 5 席） */
function renderScore() {
  const box = $('#score'); if (!box || !cur) return; box.textContent = '';
  const d = cur.d, sc = { ...(d.scores || {}) };
  CRIT.forEach(([k, name]) => {
    const r = el('div', 'srow'); r.append(el('span', 'sname', name));
    const dots = el('div', 'dots');
    for (let v = 1; v <= 5; v++) { const b = el('button', 'dot5' + ((sc[k] || 0) >= v ? ' on' : ''), String(v)); b.type = 'button';
      b.onclick = async () => { sc[k] = sc[k] === v ? 0 : v; d.scores = sc; renderScore(); await api('/demo/score', { id: d.id, scores: sc }); load(true); };
      dots.append(b); }
    r.append(dots); box.append(r);
  });
  box.append(el('div', 'stotal', '合计 ' + total(sc) + ' / 20'));
  const used = D.filter(x => x.pick > 0).length, pb = $('#pick');
  pb.textContent = d.pick ? '★ 已入选 · 取消' : '入选主厨之选'; pb.className = 'btn' + (d.pick ? '' : ' ghost');
  pb.disabled = !d.pick && used >= 5;
  $('#pickh').textContent = '已用 ' + used + ' / 5 席' + (!d.pick && used >= 5 ? '，席位已满' : '');
  pb.onclick = async () => { pb.disabled = true; const r = await api('/demo/pick', { id: d.id, on: d.pick ? 0 : 1 }); if (r.status === 409) $('#pickh').textContent = '席位已满'; await load(true); };
}
async function publish() {
  const d = cur.d; $('#pub').disabled = true;
  await api('/demo/pub', { id: d.id, overall: $('#ov').value.trim(), pub: d.pub ? 0 : 1 });
  await load(true); $('#pub').disabled = false;
}
async function remove() {
  if (!confirm('删除这首投递和音频？')) return;
  await api('/demo/del', { id: cur.id }); cur = null; if (audio) audio.pause(); $('#main').textContent = ''; $('#main').append(el('div', 'empty', '已删除')); load();
}
document.addEventListener('keydown', e => {
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
  if (typing || e.metaKey || e.ctrlKey || !cur) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') skip(-5); else if (e.key === 'ArrowRight') skip(5);
  else if (e.key.toLowerCase() === 'n') { e.preventDefault(); noteT = audio ? audio.currentTime : 0; $('#nt').focus(); $('#add').textContent = '在 ' + clock(noteT) + ' 添加'; }
});
start();
})();
</script>
