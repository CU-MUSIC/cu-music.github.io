<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e0f">
<title>Insights</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* 审听 Insights 看板：和审听页同一套黑白 token */
:root{
  --bg:#0e0e0f; --bg-2:#151516;
  --fill:rgba(236,234,230,.05); --fill-2:rgba(236,234,230,.085); --fill-3:rgba(236,234,230,.14);
  --hair:rgba(236,234,230,.09);
  --text:#e8e6e2; --text-2:#a3a19d; --text-3:#74726f;
  --red:#e9a19a; --ink:#121213; --pearl:#ebe9e5;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(236,234,230,.06),transparent 60%),var(--bg);
  color:var(--text);font:17px/1.6 var(--font);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;
  padding:calc(28px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.eyebrow{font-size:13px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.022em}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;flex-shrink:0}
.seg button{font-size:14px;padding:5px 11px;border-radius:8px;color:var(--text-2)}
.seg button.on{background:var(--fill-3);color:var(--text)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 18px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;font-size:15px;padding:6px 14px;border-radius:999px;background:var(--fill);color:var(--text-2);white-space:nowrap}
.chips button.on{background:var(--pearl);color:var(--ink)}
.pmbox{margin:0 0 16px;padding:12px 14px;border-radius:14px;background:var(--fill)}
.pmbox summary{font-size:15px;font-weight:600;cursor:pointer}
.pmr{padding:10px 0;border-top:.5px solid var(--hair);margin-top:10px}.pmr.off{opacity:.55}
.pmh{display:flex;align-items:baseline;gap:10px}.pmh b{font-size:17px;letter-spacing:.04em}.pmh span{font-size:13px;color:var(--text-2)}.pmh em{margin-left:auto;font-style:normal;font-size:12px;color:var(--text-3)}
.pmm{font-size:12.5px;color:var(--text-3);margin-top:3px}
.pma{display:flex;gap:6px;margin-top:8px}.pma button,.pmnew{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--fill-2);color:var(--text)}
.pma .dz{color:var(--red)}.pmnew{margin-top:12px}
.acc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--fill);font-size:14px}
.acc span{font-size:11px;color:var(--text-3);border:.5px solid var(--hair);border-radius:6px;padding:0 6px;white-space:nowrap}
.acc b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc em{font-style:normal;flex-basis:100%;font-size:12.5px;color:var(--text-3)}
.acc.v em{color:var(--text)}
.chips button.mem:not(.on){color:var(--text);box-shadow:0 0 0 1px var(--fill-3) inset}
.chips button.dim:not(.on){opacity:.45}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px}
.card{background:var(--fill);border-radius:16px;padding:16px 16px 12px;min-width:0}
.card .lb{font-size:14px;color:var(--text-2)}
.card .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.card .d{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
.card svg{display:block;width:100%;height:44px;margin-top:8px;overflow:visible}

.sect{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;letter-spacing:-.015em;margin-bottom:10px}
.sect span{font-size:14px;font-weight:400;color:var(--text-3)}
.feed{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:14px 0;border-top:.5px solid var(--hair)}
.av{width:40px;height:40px;border-radius:50%;background:var(--fill-2);display:grid;place-items:center;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--text)}
.body{min-width:0}
.who{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.who b{font-weight:600}
.who time{color:var(--text-3);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dev{font-size:14px;color:var(--text-3)}
.ver{margin-top:8px;background:var(--fill);border-radius:12px;padding:10px 12px}
.ver .t{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.ver .t span{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.heat{display:flex;gap:1px;height:18px;margin:8px 0 6px;align-items:flex-end}
.heat i{flex:1;background:var(--text);border-radius:1px;min-height:2px}
.facts{font-size:14px;color:var(--text-2);line-height:1.6}
.facts b{color:var(--text);font-weight:600}
.pins{position:relative;height:6px;margin:-2px 0 6px}
.pins i{position:absolute;top:0;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--text)}
.cm{margin-top:10px;padding-top:10px;border-top:.5px solid var(--hair);display:flex;flex-direction:column;gap:6px}
.cmh{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text-3)}
.cmh span.sent{color:var(--text-2)}
.cmr{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:15px;line-height:1.55}
.cmr b,.cmr a{font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2);font-size:14px;padding-top:1px}
.cmr a{color:var(--text);text-decoration:underline;text-decoration-color:var(--fill-3);text-underline-offset:3px}
.cmr span{min-width:0;overflow-wrap:anywhere}
.cmr.done{opacity:.45}
.cmr.done:hover{opacity:.8}
.cmsep{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);margin:4px 0 0}
.cmsep::before,.cmsep::after{content:"";flex:1;height:.5px;background:var(--hair)}
.cmr .dn{font-style:normal;font-size:12px;color:var(--text-2);background:var(--fill-2);padding:1px 7px;border-radius:999px;margin-left:4px}
.cmr .rp{display:block;font-style:normal;margin-top:4px;padding:6px 9px;border-radius:9px;background:var(--fill-2);font-size:14px;color:var(--text)}
.cmr .cma{display:flex;gap:6px;margin-top:5px}
.cmr[data-go]{cursor:pointer;border-radius:8px;transition:background-color .15s}
.cmr[data-go]:hover{background:var(--fill)}
.cmr .cma .golink{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--pearl);color:var(--ink);text-decoration:none;font-weight:600}
.cmr .cma button{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--fill-2);color:var(--text-2)}
.cmr .cma button.on{background:var(--pearl);color:var(--ink)}

.bt{padding:12px 0;border-top:.5px solid var(--hair)}
.bt-h{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.bt-h b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt-h span{color:var(--text-2);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bt-m{font-size:14px;color:var(--text-3);font-variant-numeric:tabular-nums}
.bt-bar{height:4px;border-radius:2px;background:var(--fill-2);margin:6px 0 4px;overflow:hidden}
.bt-bar i{display:block;height:100%;background:var(--text-2);border-radius:2px}
.blink{font-size:14px;color:var(--text-2);text-decoration:underline;text-underline-offset:3px}
.empty,.msg{color:var(--text-3);font-size:15px;padding:24px 0;text-align:center}
.login{max-width:340px;margin:18vh auto 0;text-align:center;display:flex;flex-direction:column;gap:14px}
.login input{background:var(--fill-2);border-radius:12px;padding:12px 14px;text-align:center;font-size:16px}
.login button{background:var(--pearl);color:var(--ink);border-radius:12px;padding:12px;font-weight:600}
.login p{color:var(--text-3);font-size:14px}

/* 顶部三个分区：审听 / 价格页 / 订单 */
.lbar{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 16px;font-size:14px;color:var(--text-3)}
.lbar .go{background:var(--pearl);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px;margin-bottom:26px}
.lcard{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.lcard b{font-size:15px;font-weight:600;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard span{font-size:13px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc{width:100%;aspect-ratio:1;border-radius:12px;background:#0b0b0b center/cover;display:grid;place-items:center;box-shadow:0 0 0 .5px rgba(255,255,255,.08) inset;transition:transform .2s}
.lcard:hover .lc{transform:scale(1.02)}
.lc svg{width:42%;height:42%}.lc svg path{fill:none;stroke:#e8e6e2;stroke-width:36;stroke-linecap:round}
.lloose{display:flex;flex-direction:column;gap:6px;font-size:15px;margin-bottom:24px}
.lloose div{display:flex;justify-content:space-between}.lloose a{color:var(--text-2);font-size:13px}
.pjs{gap:12px}
.pjtop{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.pjcv{position:relative;display:block;padding:0}.pjcv .lc{width:120px}
.pjcv span{position:absolute;left:0;right:0;bottom:6px;font-size:11px;color:#e8e6e2;text-align:center;opacity:.8}
.pjf{display:flex;flex-direction:column;gap:8px;min-width:0}
.pjlink{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.pjlink code{flex:1 1 100%;color:var(--text-2);overflow-wrap:anywhere}
.pjlink button,.pjlink a{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--fill-2);color:var(--text);text-decoration:none}
.pjlink button{background:var(--pearl);color:var(--ink);font-weight:600}
.pjtr{display:flex;flex-direction:column}
.pjtr>div{display:grid;grid-template-columns:24px 1fr auto auto auto auto auto;gap:6px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--hair);font-size:15px}
.pjtr .n{color:var(--text-3);font-size:13px;font-variant-numeric:tabular-nums}
.pjtr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pjtr .t i{font-style:normal;color:var(--text-3);font-size:12px}
.pjtr button{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--fill-2);color:var(--text-2)}
.pjtr button:disabled{opacity:.3}
.up .ghost{background:var(--fill-2);color:var(--text);border-radius:12px;padding:11px;font-size:15px}
.up .ghost.danger{color:var(--red)}
.up .dim{color:var(--text-3);font-size:14px;padding:8px 0}
.rsm{background:var(--fill);border-radius:14px;margin:-8px 0 14px;padding:0 14px}
.rsm summary{list-style:none;cursor:pointer;padding:12px 0;font-size:16px;font-weight:600;display:flex;justify-content:space-between}
.rsm summary::-webkit-details-marker{display:none}
.rsm summary span{font-size:13px;font-weight:400;color:var(--text-3)}
.rs{border-top:.5px solid var(--hair);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.rs-h{display:flex;align-items:baseline;gap:10px;font-size:16px}
.rs-h span{font-size:13px;color:var(--text-2)}
.rs-h span.dim{color:var(--text-3)}
.rs-m,.rs-l{font-size:13px;color:var(--text-3);overflow-wrap:anywhere}
.rs-l b{color:var(--text-2)}
.rs-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rs-a button,.rs-a a{font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--fill-2);color:var(--text-2);text-decoration:none}
.rs-a button:first-child{background:var(--pearl);color:var(--ink);font-weight:600}
.rs-a .danger{color:var(--red)}
.upbtn{display:block;width:100%;margin:-8px 0 22px;padding:12px;border-radius:12px;background:var(--fill);color:var(--text);font-size:16px;font-weight:600}
.upbtn:active{background:var(--fill-2)}
.up{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
.up-s{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:#161617;border-radius:18px 18px 0 0;
  padding:18px max(20px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
@media (min-width:600px){.up{align-items:center}.up-s{border-radius:18px}}
.up-h{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
.up-h button{font-size:15px;color:var(--text-2);font-weight:400}
.up label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
.up select,.up input[type=text],.up input[type=tel]{background:var(--fill-2);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--text);border:0;width:100%}
.up .file{background:var(--fill);border:1px dashed var(--fill-3);border-radius:12px;padding:18px;text-align:center;color:var(--text-2);font-size:15px;cursor:pointer}
.up .file b{color:var(--text);display:block;margin-bottom:2px;overflow-wrap:anywhere}
.up .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up .go{background:var(--pearl);color:var(--ink);border-radius:12px;padding:13px;font-size:16px;font-weight:600}
.up .go:disabled{opacity:.45}
.up .msg2{font-size:14px;color:var(--text-2);min-height:1.4em;line-height:1.6}
.up .msg2.err{color:var(--red)}
.up .bar2{height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden}
.up .bar2 i{display:block;height:100%;width:0;background:var(--text);transition:width .25s}
.up .done{background:var(--fill);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.up .done code{font-size:13px;overflow-wrap:anywhere;color:var(--text)}
.up .done button{align-self:flex-start;background:var(--fill-2);border-radius:999px;padding:6px 14px;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:22px}
.tabs button{flex:1;font-size:15px;padding:8px 6px;border-radius:9px;color:var(--text-2);position:relative}
.tabs button.on{background:var(--fill-3);color:var(--text);font-weight:600}
.tabs .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:var(--ink);font-size:12px;font-weight:700;padding:0 5px;margin-left:5px;vertical-align:1px}
.cards.three{grid-template-columns:1fr 1fr}
.blk{margin-bottom:30px}
.funnel{display:flex;flex-direction:column;gap:10px}
.fn .t{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:5px}
.fn .t span{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--text)}
.rank{display:flex;flex-direction:column}
.rk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 0;border-top:.5px solid var(--hair);font-size:15px}
.rk b{font-weight:600}
.rk span{color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rk .bar{grid-column:1/-1;height:6px}
.rk .bar i{opacity:.7}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--fill-2);color:var(--text-2);margin:4px 4px 0 0}
.tag.hot{background:var(--pearl);color:var(--ink)}
.order{padding:16px 0;border-top:.5px solid var(--hair)}
.order .who{align-items:baseline}
.order .wx{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:15px;color:var(--text-2)}
.order .wx button{font-size:13px;padding:2px 9px;border-radius:7px;background:var(--fill-2);color:var(--text)}
.order .plan{margin-top:8px;background:var(--fill);border-radius:12px;padding:10px 12px;font-size:15px}
.order .plan b{font-weight:600}
.order .note{margin-top:8px;font-size:15px;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.order details{margin-top:8px;font-size:14px;color:var(--text-3)}
.order summary{cursor:pointer}
.order pre{white-space:pre-wrap;font:13px/1.6 var(--font);color:var(--text-2);background:var(--fill);border-radius:10px;padding:10px 12px;margin-top:6px}
.stg{margin-top:12px;background:var(--fill);border-radius:14px;padding:12px 12px 14px}
.stg-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:17px}
.stg-h b{font-weight:700}
button.av{cursor:pointer;padding:0}
.ln{cursor:pointer}
.ln .lid{font-size:12px;font-weight:500;color:var(--text-3);margin-left:4px}
.ln .lid.add{opacity:.0;transition:opacity .2s}
.item:hover .ln .lid.add,.ln:focus .lid.add{opacity:1}
@media (hover:none){.ln .lid.add{opacity:.6}}
.stg-h em{font-style:normal;font-size:13px;font-weight:500;color:var(--text-2);margin-left:6px}
.stg-h em.soon{color:var(--text)}
.stg-h em.late{color:var(--red)}
.stg-h span{font-size:13px;color:var(--text-3);text-align:right}
.segs{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:4px;margin-top:10px}
.segs i{height:3px;border-radius:2px;background:var(--fill-3)}
.segs i.on{background:var(--text)}
.segs i.cur{background:linear-gradient(90deg,var(--text) 50%,var(--fill-3) 50%)}
.segl{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:4px;margin-top:5px;font-size:11px;color:var(--text-3)}
.segl span.on{color:var(--text-2)}
.stg-t{margin-top:8px;font-size:13px;color:var(--text-3);line-height:1.6}
.link{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--text-2)}
.link span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link button,.link a{flex-shrink:0;font-size:13px;padding:3px 10px;border-radius:7px;background:var(--fill-2);color:var(--text);text-decoration:none}
.flds{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.flds label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--text-3)}
.flds input,.flds select{background:var(--fill-2);border:0;border-radius:9px;padding:8px 10px;font:inherit;font-size:16px;color:var(--text);min-width:0;width:100%;-webkit-appearance:none;appearance:none}
.flds select{background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.flds select option{background:#1a1a1b;color:var(--text)}
.flds input::placeholder{color:var(--text-3)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acts button{font-size:14px;padding:8px 12px;border-radius:9px;background:var(--fill-2);color:var(--text-2)}
.acts button.go{flex:1 1 100%;background:var(--pearl);color:var(--ink);font-weight:600;font-size:15px;padding:11px 12px}
.warn{margin-top:8px;font-size:13px;color:var(--red)}

</head>
<body>
<div class="wrap" id="root"></div>
<script src="../upload.js?v=20261024"></script>
<script>
(() => {
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://stats.cumusic.work';
const store = {
  get(k) { try { return localStorage.getItem(k) } catch (e) { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} },
  del(k) { try { localStorage.removeItem(k) } catch (e) {} },
};
const root = document.getElementById('root');
const esc = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const mins = s => s < 60 ? Math.round(s) + ' 秒' : Math.floor(s / 60) + ' 分 ' + Math.round(s % 60) + ' 秒';

// 打开过看板的设备就是刀大厨自己的，审听页不再统计这台设备
store.set('review:me', '1');

const m = /[#&]k=([\w-]+)/.exec(location.hash);
if (m) { store.set('insights:key', m[1]); history.replaceState(null, '', location.pathname); }
if (/orders/.test(location.hash)) store.set('insights:tab', 'orders');
let KEY = store.get('insights:key');
let days = +store.get('insights:days') || 30, song = '', lis = '', data = null, pdata = null;
let tab = store.get('insights:tab') || 'listen', ofilter = '';
const TABS = [['lib', 'Library'], ['listen', '审听'], ['beat', '伴奏'], ['home', '主页'], ['price', '价格页'], ['orders', '订单']];
// 订单阶段（和客户进度页 cumusic.work/p/ 一致）：每单自己的 steps，选了音频编辑才有「音频编辑」
const SNAME = { pay: '待付款', prep: '准备中', edit: '音频编辑', mix: '混音中', review: '待审听', done: '已交付' };
// 推进按钮上写的是「进入这一步」的动作
const SGO = { prep: '已收款，开始准备', edit: '开始音频编辑', mix: '开始混音', review: '发第一版审听', done: '已交付' };
const OLDSTEPS = ['pay', 'prep', 'mix', 'review', 'done'];
const stepsOf = o => { try { const x = JSON.parse(o.steps || 'null'); if (Array.isArray(x) && x.length) return x; } catch (e) {} return OLDSTEPS; };
const datesOf = o => { let d = {}; try { d = JSON.parse(o.dates || '{}') || {}; } catch (e) {} if (o.eta && !d.mix) d.mix = o.eta; return d; };
const isDone = o => (o.stage || 0) >= stepsOf(o).length - 1;
const LANE = { std: '标准', member: '会员', rush: '加急' };
const OFILTERS = [['pay', '待付款', o => !o.cancelled && !(o.stage > 0)], ['doing', '进行中', o => !o.cancelled && o.stage >= 1 && !isDone(o)],
  ['done', '已交付', o => !o.cancelled && o.stage > 0 && isDone(o)], ['cancel', '已取消', o => !!o.cancelled]];
const TRACK = 'https://cumusic.work/p/#';

function login(err) {
  root.innerHTML = `<form class="login" id="f"><div class="eyebrow">CU MUSIC · ChefDao</div><h1>Insights</h1>
    <input id="k" placeholder="管理钥匙" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button>进入</button><p>${err ? '钥匙不对，再试一次' : '钥匙在 chefdao/review/_secret/stats-admin'}</p></form>`;
  document.getElementById('f').onsubmit = e => {
    e.preventDefault(); KEY = document.getElementById('k').value.trim(); if (!KEY) return;
    store.set('insights:key', KEY); load();
  };
}

// 正在看板里打字时，自动刷新先不重画，免得输入被冲掉
const typing = () => { const a = document.activeElement; return a && root.contains(a) && /INPUT|TEXTAREA/.test(a.tagName); };
async function load() {
  if (!KEY) return login();
  if (!data) root.innerHTML = '<div class="msg">正在读取…</div>';
  try {
    const auth = { headers: { Authorization: 'Bearer ' + KEY } };
    const [r, r2, r3] = await Promise.all([fetch(API + '/q?days=90', auth), fetch(API + '/pq?days=90', auth).catch(() => null), fetch(API + '/radm/list', auth).catch(() => null)]);
    const j3 = r3 && r3.ok ? await r3.json().catch(() => null) : null;
    try { const jl = await (await fetch(API + '/lib', auth)).json(); if (jl.ok) { LIB = jl; setTimeout(ensureWraps, 1500); } } catch (e) {}
    if (j3 && j3.ok) RSONGS = j3.songs;
    if (r.status === 401) { store.del('insights:key'); KEY = null; return login(true); }
    const j = await r.json(); if (!j.ok) throw new Error();
    j.rows.forEach(x => { try { x.bins = JSON.parse(x.bins || 'null'); } catch (e) { x.bins = null; } });
    j.replyMap = new Map((j.replies || []).map(r => [rkey(r.slug, r.ver, r.t, r.m), r]));
    const fb = new Map((j.feedback || []).map(f => { try { f.comments = JSON.parse(f.comments || '[]'); } catch (e) { f.comments = []; } return [f.sid + '|' + f.ver, f]; }));
    j.rows.forEach(x => { x.fb = fb.get(x.sid + '|' + x.ver) || null; });
    const j2 = r2 && r2.ok ? await r2.json().catch(() => null) : null;
    if (j2 && j2.ok) pdata = j2;
    GEO = new Map([...(j.geo || []), ...((pdata && pdata.geo) || [])].map(g => [g.sid, g]));
    data = j; if (!typing()) render();
    if (tab === 'beat') loadBeat();
  } catch (e) { if (!data) root.innerHTML = '<div class="msg">读不到数据，检查网络后下拉刷新</div>'; }
}

// 每天的播放 / 听众，画迷你折线
function series(rows, now) {
  const day0 = new Date(now); day0.setHours(0, 0, 0, 0);
  const start = day0.getTime() - (days - 1) * 864e5;
  const plays = new Array(days).fill(0), lids = Array.from({ length: days }, () => new Set());
  rows.forEach(x => { const i = Math.floor((x.started - start) / 864e5); if (i >= 0 && i < days) { plays[i]++; lids[i].add(x.lid); } });
  return { plays, listeners: lids.map(s => s.size) };
}
function spark(vals) {
  const W = 100, H = 40, max = Math.max(1, ...vals), n = vals.length;
  const pts = vals.map((v, i) => [n === 1 ? W : i / (n - 1) * W, H - v / max * (H - 4) - 2]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${line}L${W} ${H}L0 ${H}Z" fill="rgba(236,234,230,.08)" stroke="none"/>
    <path d="${line}" fill="none" stroke="#e8e6e2" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="#e8e6e2" vector-effect="non-scaling-stroke"/></svg>`;
}
function when(t, now) {
  const d = (now - t) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  const a = new Date(t), b = new Date(now), hm = a.toTimeString().slice(0, 5);
  if (a.toDateString() === b.toDateString()) return '今天 ' + hm;
  if (new Date(now - 864e5).toDateString() === a.toDateString()) return '昨天 ' + hm;
  return (a.getMonth() + 1) + '月' + a.getDate() + '日 ' + hm;
}
function verBlock(x) {
  const len = x.dur / 60, b = x.bins || [];
  const cover = b.length ? Math.round(b.filter(v => v >= len * .5).length / 60 * 100) : 0;
  let top = 0; b.forEach((v, j) => { if (v > b[top]) top = j; });
  const reps = b.length && len ? b[top] / len : 0;
  let lo = top, hi = top;
  while (lo > 0 && b[lo - 1] >= b[top] * .75) lo--;
  while (hi < 59 && b[hi + 1] >= b[top] * .75) hi++;
  const mx = Math.max(len, ...b) || 1;
  const facts = [];
  facts.push('听了 <b>' + mins(x.sec) + '</b>');
  if (b.length) facts.push('覆盖 <b>' + cover + '%</b>');
  if (x.ends) facts.push('完整听完 <b>' + x.ends + '</b> 次');
  let rep = reps >= 1.8 && (hi - lo + 1) * len >= 3 ? '<br>反复听最多：<b>' + fmt(lo * len) + '–' + fmt((hi + 1) * len) + '</b>（约 ' + Math.round(reps) + ' 遍）' : '';
  return `<div class="ver"><div class="t"><b>《${esc(x.title || x.slug)}》${esc(x.ver)}</b><span>${fmt(x.dur)}</span></div>
    ${b.length ? '<div class="heat">' + b.map(v => `<i style="height:${Math.max(8, v / mx * 100)}%;opacity:${v > 0 ? .25 + .75 * Math.min(1, v / mx) : .08}"></i>`).join('') + '</div>' : ''}
    ${x.fb && x.fb.comments.length && x.dur ? '<div class="pins">' + x.fb.comments.map(c => `<i style="left:${Math.min(100, c.t / x.dur * 100)}%"></i>`).join('') + '</div>' : ''}
    <div class="facts">${facts.join(' · ')}${rep}</div>${cmts(x)}</div>`;
}
// 刀大厨的回复 / 完成标记（审听页客户能看到）
const rkey = (slug, ver, t, m) => slug + '|' + ver + '|' + (Math.round(t * 10) / 10) + '|' + m;
function reply(slug, ver, t, m) { return ((data && data.replyMap) || new Map()).get(rkey(slug, ver, t, m)) || null; }
async function setReply(k, body) {
  const [slug, ver, t, m] = k;
  try {
    const r = await fetch(API + '/cr', { method: 'POST', headers: { Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ slug, ver, t, m, ...body }) });
    const j = await r.json(); if (!j.ok) throw new Error();
    if (!j.reply && !j.done) data.replyMap.delete(rkey(slug, ver, t, m)); else data.replyMap.set(rkey(slug, ver, t, m), { reply: j.reply, done: j.done });
    render();
  } catch (e) { alert('没存上，检查网络再试'); }
}
// 点评论时间点：打开审听页、切到那个版本、跳到那一秒（?at=V1-24）
function atUrl(slug, ver, t) {
  const hit = pdata && (pdata.songs || []).find(x => x.slug === slug && x.url);
  const q = '?at=' + ver + '-' + Math.round(t * 10) / 10;
  if (hit) { const [base, h] = hit.url.split('#'); return base + q + (h ? '#' + h : ''); }
  return 'https://cumusic.work/chefdao/review/' + slug + '/' + q;
}
// 客户写的评论：时间点 + 内容，整体感觉放最后
function cmts(x) {
  const f = x.fb; if (!f || (!f.comments.length && !f.overall)) return x.notes ? '<div class="facts">写了 <b>' + x.notes + '</b> 条评论</div>' : '';
  return `<div class="cm"><div class="cmh">评论 ${f.comments.length} 条<span class="${f.sent ? 'sent' : ''}">${f.sent ? '已发送给你' : '还没点发送'}</span></div>
    ${f.comments.map(c => [c, reply(x.slug, x.ver, c.t, c.m)]).sort((p, q) => (p[1] && p[1].done ? 1 : 0) - (q[1] && q[1].done ? 1 : 0)).map(([c, r], i, arr) => {
      const sep = r && r.done && !(i > 0 && arr[i - 1][1] && arr[i - 1][1].done) ? '<div class="cmsep">已处理</div>' : '';
      return sep + `<div class="cmr${r && r.done ? ' done' : ''}" data-go="${esc(atUrl(x.slug, x.ver, c.t))}"><a href="${esc(atUrl(x.slug, x.ver, c.t))}" target="_blank" rel="noopener" title="在审听页打开这一处">${fmt(c.t)}</a><span>${esc(c.m)}${r && r.done ? ' <i class="dn">✓ 已处理</i>' : ''}${r && r.reply ? `<em class="rp">刀大厨：${esc(r.reply)}</em>` : ''}
        <span class="cma"><a class="golink" href="${esc(atUrl(x.slug, x.ver, c.t))}" target="_blank" rel="noopener">去听 ↗</a><button data-cr="reply" data-k="${esc(JSON.stringify([x.slug, x.ver, c.t, c.m]))}">${r && r.reply ? '改回复' : '回复'}</button><button data-cr="done" class="${r && r.done ? 'on' : ''}" data-k="${esc(JSON.stringify([x.slug, x.ver, c.t, c.m]))}">✓ 完成</button></span></span></div>`; }).join('')}
    ${f.overall ? `<div class="cmr"><b>整体</b><span>${esc(f.overall)}</span></div>` : ''}</div>`;
}

function render() {
  // 每分钟自动刷新时，保留展开着的报价单
  const opened = [...root.querySelectorAll('details[open][data-id]')].map(d => d.dataset.id);
  const nNew = pdata ? pdata.orders.filter(OFILTERS[0][2]).length : 0;
  const head = `<div class="top"><div><div class="eyebrow">CU MUSIC</div><h1>Insights</h1></div>
    ${tab === 'orders' || tab === 'lib' ? '' : `<div class="seg" id="seg">${[7, 30, 90].map(d => `<button data-d="${d}" class="${d === days ? 'on' : ''}">${d} 天</button>`).join('')}</div>`}</div>
    <div class="tabs" id="tabs">${TABS.map(([k, t]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${t}${k === 'orders' && nNew ? '<span class="dot">' + nNew + '</span>' : ''}</button>`).join('')}</div>`;
  root.innerHTML = head + (tab === 'lib' ? renderLib() : tab === 'beat' ? renderBeat() : tab === 'price' ? renderPrice() : tab === 'home' ? renderHome() : tab === 'orders' ? renderOrders() : renderSongs() + '<button class="upbtn" id="upOpen">＋ 上传审听版本</button>' + renderListen());
  const uo = document.getElementById('upOpen'); if (uo) uo.onclick = openUpload;
  opened.forEach(id => { const d = root.querySelector('details[data-id="' + id + '"]'); if (d) d.open = true; });
  document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.t) { tab = b.dataset.t; store.set('insights:tab', tab); render(); scrollTo(0, 0); } };
  const sg = document.getElementById('seg');
  if (sg) sg.onclick = e => { const d = +e.target.dataset.d; if (d) { days = d; store.set('insights:days', d); render(); } };
  const c = document.getElementById('chips');
  if (c) c.onclick = e => { if (e.target.dataset.s !== undefined) { song = e.target.dataset.s; render(); } };
  const lc = document.getElementById('lchips');
  if (lc) lc.onclick = e => { if (e.target.dataset.l !== undefined) { lis = e.target.dataset.l; render(); } };
  root.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => promoAct(b.dataset.pm, b.dataset.code, b));
  const oc = document.getElementById('ochips');
  if (oc) oc.onclick = e => { if (e.target.dataset.f !== undefined) { ofilter = e.target.dataset.f; render(); } };
  root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const o = pdata.orders.find(x => x.id === +b.dataset.id); if (!o) return;
    const a = b.dataset.act, k = o.stage || 0;
    if (a === 'next') stage(o, { stage: k + 1 });
    else if (a === 'prev' && confirm('退回到「' + SNAME[stepsOf(o)[k - 1]] + '」？')) stage(o, { stage: k - 1 });
    else if (a === 'replan' && confirm('按下单时的工期，从今天起重新排三个预计日期？')) stage(o, { replan: true });
    else if (a === 'cancel' && confirm('取消这个订单？客户进度页会显示「已取消」')) stage(o, { cancel: true });
    else if (a === 'restore') stage(o, { cancel: false });
    else if (a === 'make') stage(o, {});
  });
  root.querySelectorAll('[data-f-date]').forEach(el => el.onchange = () => {
    const o = pdata.orders.find(x => x.id === +el.dataset.id); if (!o) return;
    stage(o, { dates: { [el.dataset.fDate]: el.value || '' } });
  });
  root.querySelectorAll('[data-f-eta],[data-f-review],[data-f-deliver]').forEach(el => el.onchange = () => {
    const o = pdata.orders.find(x => x.id === +el.dataset.id); if (!o) return;
    const k = el.dataset.fEta !== undefined ? 'eta' : el.dataset.fReview !== undefined ? 'review' : 'deliver';
    let v = el.value.trim();
    if (v === '__other') {   // 海外客户可以直接给 Samply 链接
      v = (prompt('粘贴审听链接（例如 Samply）') || '').trim();
      if (!v) { el.value = o.review_url || ''; return; }
    }
    if (v && k !== 'eta' && !/^https?:\/\/\S+$/.test(v)) { alert('链接要以 https:// 开头'); return; }
    stage(o, { [k]: v });
  });
  root.querySelectorAll('[data-ln]').forEach(b => b.onclick = () => editNote(b.dataset.ln));
  root.querySelectorAll('.lcard[data-p]').forEach(b => b.onclick = () => openProject(b.dataset.p));
  const ln = document.getElementById('lNew'); if (ln) ln.onclick = newProject;
  const rsm = document.getElementById('rsm'); if (rsm) rsm.ontoggle = () => { songsOpen = rsm.open; };
  root.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => rsAction(b.closest('.rs').dataset.slug, b.dataset.rs, b));
  root.querySelectorAll('.cmr[data-go]').forEach(row => row.onclick = e => {
    if (e.target.closest('a,button')) return;
    window.open(row.dataset.go, '_blank', 'noopener');
  });
  root.querySelectorAll('[data-cr]').forEach(b => b.onclick = () => {
    const k = JSON.parse(b.dataset.k), r = reply(...k);
    if (b.dataset.cr === 'done') return setReply(k, { done: !(r && r.done) });
    const v = prompt('回复这条评论（客户会在审听页看到）：\n「' + k[3] + '」', (r && r.reply) || '');
    if (v !== null) setReply(k, { reply: v });
  });
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const done = () => { b.textContent = '已复制'; setTimeout(() => { b.textContent = '复制'; }, 1500); };
    navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copy).then(done, done) : done();
  });
}

function renderListen() {
  const now = data.now, since = now - days * 864e5;
  const all = data.rows.filter(x => x.started >= since);
  const songs = [...new Map(data.rows.map(x => [x.slug, x.title || x.slug])).entries()];
  const rows = song ? all.filter(x => x.slug === song) : all;
  const s = series(rows, now);
  const listeners = new Set(rows.map(x => x.lid)).size;

  // 听众筛选：只看某个人的动态（按最近听过排）。同一个名字的多台设备合成一个按钮
  const nameOf = l => { const n = lnote(l); return (n && (n.name || n.self)) || l; };
  const keyOf = l => nameOf(l).trim().toLowerCase();
  // 选了某首歌时：这首歌的歌手排前面并高亮，不是这首歌歌手的（同项目别的 Pt 的人）排后面、变淡
  const arts = new Set(song ? String((RSONGS.find(x => x.slug === song) || {}).artist || '').split('、').map(x => x.trim().toLowerCase()).filter(Boolean) : []);
  const people = [...new Map([...rows].sort((p, q) => q.updated - p.updated).map(x => [keyOf(x.lid), nameOf(x.lid)])).entries()]
    .sort((a, b) => arts.has(b[0]) - arts.has(a[0]));
  if (lis && !people.some(([k]) => k === lis)) lis = '';
  // 按一次打开（sid）合并成一条动态
  const groups = new Map();
  rows.filter(x => !lis || keyOf(x.lid) === lis).forEach(x => { if (!groups.has(x.sid)) groups.set(x.sid, []); groups.get(x.sid).push(x); });
  // 没听、只是访问了项目页 / 曲目页的人：打开了（没输密码）、查看了（输了密码）。已经有收听记录的会话不重复列
  const acc = (data.access || []).filter(a => a.updated >= since && !groups.has(a.sid) && (!song || (a.kind === 'song' && a.slug === song)) && (!lis || keyOf(a.lid) === lis))
    .map(a => ({ acc: a, at: a.updated }));
  const feed = [...groups.values()].map(g => g.sort((p, q) => p.started - q.started)).map(g => ({ g, at: Math.max(...g.map(x => x.updated)) }))
    .concat(acc).sort((p, q) => q.at - p.at).slice(0, 60);

  return `
  ${songs.length > 1 ? `<div class="chips" id="chips"><button data-s="" class="${song ? '' : 'on'}">全部</button>${songs.map(([k, t]) =>
    `<button data-s="${esc(k)}" class="${song === k ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>` : ''}
  <div class="cards">
    <div class="card"><div class="lb">播放次数</div><div class="n">${rows.length}</div><div class="d">近 ${days} 天</div>${spark(s.plays)}</div>
    <div class="card"><div class="lb">听众</div><div class="n">${listeners}</div><div class="d">近 ${days} 天</div>${spark(s.listeners)}</div>
  </div>
  <div class="sect">最近动态<span>${feed.length ? '共 ' + (groups.size + acc.length) + ' 次打开' : ''}</span></div>
  ${people.length > 1 ? `<div class="chips" id="lchips"><button data-l="" class="${lis ? '' : 'on'}">所有听众</button>${people.map(([k, n]) =>
    `<button data-l="${esc(k)}" class="${lis === k ? 'on' : ''}${arts.size ? (arts.has(k) ? ' mem' : ' dim') : ''}">${esc(n)}</button>`).join('')}</div>` : ''}
  <div class="feed">${feed.length ? feed.map(f => {
    if (f.acc) { const a = f.acc;

const OPEN = 'cu-open';

// ── 优惠码：建、看、停用、删；链接带 ?code= 客户打开价格页就自动带入 ──

const PRICE_URL = 'https://cumusic.work/chefdao/price/';
const promoRule = p => (p.kind === 'pct' ? ((100 - p.value) / 10) + ' 折' : '立减 ¥' + p.value) + (p.min ? ' · 满 ¥' + p.min : '') + (p.aud === 'mem' ? ' · 会员回购码' : ' · 朋友圈码');

  if (PROMOS === null) { loadPromos(); return '<details class="pmbox"><summary>优惠码</summary><div class="dim" style="padding:8px 0">加载中…</div></details>'; }
  const now = Date.now();

    ${PROMOS.map(p => { const exp = p.expires && now > p.expires, full = p.max && p.used >= p.max, on = p.active && !exp && !full;

      <div class="pmm">已用 ${p.used}${p.max ? ' / ' + p.max : ' 次'}${p.expires ? ' · 到 ' + new Date(p.expires).toLocaleDateString('sv-SE') : ''}${p.note ? ' · ' + esc(p.note) : ''}</div>
      <div class="pma"><button data-pm="copy" data-code="${esc(p.code)}" data-url="${esc(url)}">复制链接</button><button data-pm="toggle" data-code="${esc(p.code)}">${p.active ? '停用' : '启用'}</button><button data-pm="del" data-code="${esc(p.code)}" class="dz">删除</button></div></div>`; }).join('') || '<div class="dim" style="padding:8px 0">还没有优惠码</div>'}
    <button class="pmnew" data-pm="new">＋ 新建优惠码</button></details>`;
}
async function promoAct(act, code, btn) {
  try {
    if (act === 'copy') { const url = PRICE_URL + '?code=' + code; await navigator.clipboard.writeText(url); btn.textContent = '已复制'; setTimeout(() => { btn.textContent = '复制链接'; }, 1500); return; }
    if (act === 'toggle') { const p = PROMOS.find(x => x.code === code); await lib('/promo/save', { ...p, active: !p.active, expires: p.expires ? new Date(p.expires).toLocaleDateString('sv-SE') : '' }); }
    if (act === 'del') { if (!confirm('删除优惠码 ' + code + '？已经用过的订单不受影响')) return; await lib('/promo/del', { code }); }
    if (act === 'new') {
      const v = prompt('格式：码, 立减, 次数, 截止日期, 满额, 类型\n例：NOV, 减80, 5, 2026-11-30, 满500, 朋友圈\n立减写「减80」（只做立减，不做打折）；类型写「朋友圈」（非会员，和新客立减二选一）或「会员」（老会员回购，可叠加 8 折）\n码留空自动生成；次数、截止、满额、类型可以不写（类型默认朋友圈）', ''); if (v === null) return;
      const [c, d, n, e, mn, ty] = v.split(/\s*[,，]\s*/); let value = 0, m;
      if (m = /^(?:减|-)?\s*(\d+)\s*(?:元)?$/.exec(d || '')) value = +m[1];
      if (!(value > 0)) return alert('立减金额没看懂，写「减80」');
      const min = (m = /(\d+)/.exec(mn || '')) ? +m[1] : 0;
      await lib('/promo/save', { code: c || '', kind: 'off', value, min, aud: /会员/.test(ty || '') ? 'mem' : 'std', max: +n || 0, expires: /^\d{4}-\d{2}-\d{2}$/.test(e || '') ? e : '', active: true });
    }
    PROMOS = null; render();
  } catch (e) { alert('没成功，检查网络再试'); }
}
function renderOrders() {

    ${o.code ? `<div class="stg">
      <div class="stg-h"><b>${o.cancelled ? '已取消' : SNAME[st[k]]}${due !== null ? ` <em class="${due < 0 ? 'late' : due <= 2 ? 'soon' : ''}">${due < 0 ? '已超期 ' + -due + ' 天' : due === 0 ? '今天交付' : '距交付 ' + due + ' 天'}</em>` : ''}</b><span>${o.last_view ? '客户最近查看 ' + when(o.last_view, now) + ' · 共 ' + o.views + ' 次' : '客户还没打开过'}</span></div>
      <div class="segs" style="--n:${st.length}">${st.map((n, i) => `<i class="${o.cancelled ? '' : i < k || (k === L && i === L) ? 'on' : i === k ? 'cur' : ''}"></i>`).join('')}</div>
      <div class="segl" style="--n:${st.length}">${st.map((n, i) => `<span class="${i <= k ? 'on' : ''}">${SNAME[n]}</span>`).join('')}</div>
      ${o.lane ? `<div class="stg-t">${LANE[o.lane] || ''}${o.lane === 'rush' && o.target ? ' · 指定 ' + esc(o.target) : o.wd_max ? ' · ' + o.wd_min + '–' + o.wd_max + ' 个工作日' : ''}${st.includes('edit') ? ' · 含音频编辑' : ' · 不含音频编辑'}</div>` : ''}
      ${stepTimes(o) ? `<div class="stg-t">${stepTimes(o)}</div>` : ''}
      <div class="link"><span>${esc(url.replace('https://', ''))}</span><button data-copy="${esc(url)}">复制</button><a href="${esc(url)}" target="_blank" rel="noopener">打开</a></div>
      <div class="flds">
        ${st.includes('edit') ? `<label>预计编辑完成<input type="date" data-f-date="edit" data-id="${o.id}" value="${esc(dt.edit || '')}"></label>` : ''}
        <label>预计交第一版<input type="date" data-f-date="mix" data-id="${o.id}" value="${esc(dt.mix || '')}"></label>

// 推进 / 退回 / 取消 / 改日期和链接：先改本地立刻重画，失败再退回
async function stage(o, body) {
  const keep = { ...o };
  if (body.stage !== undefined) o.stage = body.stage;
  if (body.cancel !== undefined) o.cancelled = body.cancel ? Date.now() : 0;
  render();
  try {
    const r = await fetch(API + '/ostage', { method: 'POST', headers: { Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ id: o.id, ...body }) });
    const j = await r.json(); if (!j.ok) throw new Error(j.e || '');
    Object.assign(o, { code: j.code, stage: j.stage, cancelled: j.cancelled, times: j.times, eta: j.eta, review_url: j.review_url, deliver_url: j.deliver_url,
      steps: j.steps || o.steps, dates: j.dates || o.dates });
    render();
  } catch (e) { Object.assign(o, keep); render(); alert(e.message === 'url' ? '链接格式不对，要以 https:// 开头' : '没改成功，检查网络再试'); }
}

// ── 上传审听版本：浏览器里分析波形、（WAV 先转 MP3）、用审听密码加密，再传到 stats.cumusic.work ──
let upBusy = false;
async function api(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: { Authorization: 'Bearer ' + KEY, ...(opt.headers || {}) } });
  const j = await r.json().catch(() => ({ ok: false }));
  if (!j.ok) throw new Error(j.e || ('HTTP ' + r.status));
  return j;
}
const nameInfo = fn => cuNameInfo(fn);
async function openUpload(opt) {
  if (document.getElementById('up')) return;
  const PJ = opt && opt.project ? opt.project : null;   // 从项目里点「上传新曲目」进来
  const el = document.createElement('div'); el.className = 'up'; el.id = 'up';
  el.innerHTML = `<div class="up-s"><div class="up-h">${PJ ? '上传到《' + esc(PJ.title) + '》' : '上传审听版本'}<button type="button" id="upX">关闭</button></div>
    <label>歌<select id="upSong"><option value="">读取中…</option></select></label>
    <div id="upNew" class="row" hidden><label>歌名<input type="text" id="upTitle" autocomplete="off"></label><label>审听密码（4 位，留空不设密码）<input type="tel" id="upPass" maxlength="4" value="" placeholder="不设密码"></label></div>
    <div class="file" id="upPick"><b id="upFn">选择 bounce</b>m4a / mp3 / wav，手机上可以直接从 iCloud 选</div>
    <input type="file" id="upFile" accept="audio/*,.m4a,.mp3,.wav,.aif,.aiff" hidden>
    <div class="row"><label>版本<input type="text" id="upVer" placeholder="自动"></label><label>日期<input type="text" id="upDate" placeholder="今天"></label></div>
    <div class="bar2"><i id="upBar"></i></div><div class="msg2" id="upMsg"></div>
    <button type="button" class="go" id="upGo" disabled>上传</button><div id="upDone"></div></div>`;
  document.body.appendChild(el);
  const $u = id => document.getElementById(id);
  const close = () => { if (!upBusy) el.remove(); };
  $u('upX').onclick = close; el.onclick = e => { if (e.target === el) close(); };
  let list = [], file = null;
  const syncNew = () => { $u('upNew').hidden = $u('upSong').value !== '__new'; ready(); };
  const ready = () => { $u('upGo').disabled = upBusy || !file || !$u('upSong').value || ($u('upSong').value === '__new' && !$u('upTitle').value.trim()); };
  const fill = sel => {
    $u('upSong').innerHTML = list.map(s => `<option value="${esc(s.slug)}">《${esc(s.title)}》 · 已有 ${s.versions.length} 版</option>`).join('') + '<option value="__new">＋ 新歌</option>';
    $u('upSong').value = sel || (list.length ? list[0].slug : '__new');
  };
  try { list = (await api('/radm/list')).songs; } catch (e) {}
  if (PJ) { const mine = new Set(PJ.tracks.map(t => t.slug)); list = list.filter(x => mine.has(x.slug)); $u('upPass').value = PJ.pass; } else $u('upPass').value = newPass();
  fill(PJ ? '__new' : undefined);
  syncNew();
  $u('upSong').onchange = syncNew; $u('upTitle').oninput = ready;
  $u('upPick').onclick = () => $u('upFile').click();
  $u('upFile').onchange = () => {
    file = $u('upFile').files[0] || null; if (!file) return ready();
    const n = nameInfo(file.name);
    $u('upFn').textContent = file.name + ' · ' + (file.size / 1048576).toFixed(1) + ' MB';
    if (n.ver) $u('upVer').value = n.ver;
    if (n.date) $u('upDate').value = n.date;
    const hit = list.find(s => s.title === n.title);
    if (hit) $u('upSong').value = hit.slug; else if (n.title && $u('upSong').value === '__new') $u('upTitle').value = n.title;

    syncNew();
  };
  $u('upGo').onclick = async () => {
    const msg = (t, err) => { $u('upMsg').textContent = t; $u('upMsg').className = 'msg2' + (err ? ' err' : ''); };
    const bar = p => { $u('upBar').style.width = Math.round(p * 100) + '%'; };
    upBusy = true; ready(); $u('upDone').innerHTML = '';
    try {
      const pick = $u('upSong').value;
      const r = await cuUpload({ api: API, key: KEY, file, slug: pick === '__new' ? '' : pick, title: $u('upTitle').value.trim(), pass: $u('upPass').value.trim(), project: PJ && PJ.slug,
        ver: $u('upVer').value, date: $u('upDate').value.trim(), step: msg, bar });

      $u('upDone').innerHTML = `<div class="done"><b>《${esc(prep.title)}》${esc(ver)} 已上线</b><code>${esc(res.url)}</code><div>${prep.pass ? `密码 <b>${esc(prep.pass)}</b>` : '不设密码'}</div>
        <button type="button" id="upCopy">复制链接和密码</button><div style="font-size:13px;color:var(--text-3)">到「订单」里把审听页选成这首歌，再推进到「待审听」</div></div>`;
      $u('upCopy').onclick = () => { const t = '《' + prep.title + '》' + ver + '\n' + res.url + (prep.pass ? '\n密码 ' + prep.pass : '');
        const done = () => { $u('upCopy').textContent = '已复制'; }; navigator.clipboard ? navigator.clipboard.writeText(t).then(done, done) : done(); };
      file = null; $u('upFn').textContent = '再传一个'; $u('upVer').value = ''; $u('upDate').value = '';
      list = (await api('/radm/list').catch(() => ({ songs: list }))).songs;
      fill(prep.slug); syncNew();
      load();
    } catch (e) { msg(/^[a-z]+$|HTTP/.test(e.message) ? '没传成功（' + e.message + '），检查网络再试' : e.message, true); }
    upBusy = false; ready();
  };
}
