:root{--bg:#0e0e0f;--fill:rgba(236,234,230,.05);--fill-2:rgba(236,234,230,.085);--hair:rgba(236,234,230,.09);--text:#e8e6e2;--text-2:#a3a19d;--text-3:#74726f;--red:#e9a19a;

  min-height:100vh;min-height:100dvh;padding:calc(48px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
/* 封面：近处一层贴身阴影 + 远处一层柔光阴影，顶边一道高光、底边压暗，背后一圈封面色的光晕，看起来浮在页面上 */
.cv{--rx:0;--ry:0;--sx:30%;--sy:15%;position:relative;isolation:isolate;width:min(64vw,260px);aspect-ratio:1;border-radius:18px;
  background:radial-gradient(130% 100% at 28% 12%,#3a3a3d 0%,#1c1c1e 55%,#0e0e0f 100%) center/cover;
  /* 跟着鼠标（电脑）或陀螺仪（手机）微微转动，远处那层阴影往反方向偏，光源始终在同一边 */
  transform:perspective(800px) rotateX(calc(var(--rx) * 1deg)) rotateY(calc(var(--ry) * 1deg));will-change:transform;
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 -1px 0 rgba(0,0,0,.6) inset,0 0 0 .5px rgba(255,255,255,.09) inset,
    0 2px 4px rgba(0,0,0,.35),0 12px 24px -8px rgba(0,0,0,.55),
    calc(var(--ry) * -2.6px) calc(40px + var(--rx) * 2.6px) 80px -28px rgba(0,0,0,.85);
  display:grid;place-items:center}
.cv::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at var(--sx) var(--sy),rgba(255,255,255,.14),transparent 55%),
    linear-gradient(160deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 32%,transparent 50%,rgba(0,0,0,.18) 100%)}
.cv::after{content:"";position:absolute;inset:8% 6% -10%;z-index:-1;border-radius:inherit;background:inherit;filter:blur(36px) saturate(1.3);opacity:.35;transform:translateY(10px)}
/* 浅色封面（白底 emoji 封面）：去掉会泛白雾的高光和封面色光晕，只留更深更实的阴影，让它稳稳坐在深色页面上 */
.cv-light .cv::after{display:none}
.cv-light .cv::before{background:linear-gradient(160deg,rgba(255,255,255,0) 0%,rgba(0,0,0,.05) 100%)}
.cv-light .cv{filter:brightness(.95);box-shadow:0 0 0 .5px rgba(255,255,255,.08) inset,0 2px 6px rgba(0,0,0,.55),0 18px 36px -10px rgba(0,0,0,.75),calc(var(--ry) * -2.6px) calc(40px + var(--rx) * 2.6px) 80px -28px rgba(0,0,0,.9)}

    const t = P.tracks[i], oldS = t.prog ? t.prog.s : -1, rr = rManual !== undefined ? rManual : ((t.prog && t.prog.r) || 0) + (s === 7 && oldS !== 7 ? 1 : 0);   // 每进入一次「修改中」算一轮
    const eta = {}; el.querySelectorAll('input[data-e="' + i + '"]').forEach(x => { if (x.value) eta[x.dataset.k] = x.value; });   // 各环节预计完成，没填就按上一版往后 2 个工作日自动算
    const prog = s < 0 ? null : { s, due, r: rr, at: (t.prog && t.prog.at) || {}, eta };
    try {
      const r = await fetch(API + '/radm/meta', { method: 'POST', headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: t.slug, prog }) });
      if (!(await r.json()).ok) throw 0;
      t.prog = prog && { ...prog, at: { ...prog.at, [s]: (prog.at[s] || Date.now()) } };
      const rn = el.querySelector('input[data-r="' + i + '"]'); if (rn && prog) rn.value = prog.r;
      const row = document.querySelectorAll('.tr')[i], old = row && row.querySelector('.pg');
      if (row) { if (old) old.remove(); row.querySelector('.t').insertAdjacentHTML('beforeend', progTag(t.prog)); }
    } catch (e) { alert('没改成，检查网络再试'); }
  };
  el.querySelectorAll('select[data-i]').forEach(x => x.onchange = () => save(+x.dataset.i, +x.value, el.querySelector('input[data-i="' + x.dataset.i + '"]').value));
  el.querySelectorAll('input[data-i]').forEach(x => x.onchange = () => { const sel = el.querySelector('select[data-i="' + x.dataset.i + '"]'); if (+sel.value >= 0) save(+x.dataset.i, +sel.value, x.value); });
  el.querySelectorAll('input[data-r]').forEach(x => x.onchange = () => { const i = +x.dataset.r, sel = el.querySelector('select[data-i="' + i + '"]'); if (+sel.value < 0) return; save(i, +sel.value, el.querySelector('input[data-i="' + i + '"][type=date]').value, Math.max(0, Math.min(99, Math.round(+x.value) || 0))); });
  el.querySelectorAll('input[data-e]').forEach(x => x.onchange = () => { const i = +x.dataset.e, sel = el.querySelector('select[data-i="' + i + '"]'); if (+sel.value < 0) return; save(i, +sel.value, el.querySelector('input[data-i="' + i + '"][type=date]').value); });
  el.querySelector('#pgAll').onchange = e => { const v = e.target.value; if (v === '') return;
    el.querySelectorAll('select[data-i]').forEach(x => { x.value = v; save(+x.dataset.i, +v, el.querySelector('input[data-i="' + x.dataset.i + '"]').value); }); e.target.value = ''; };
}
// 收款情况：只在你的设备（存了看板钥匙）显示。读每首歌的费用单，按人列出定金 / 尾款，定金收齐才开工
async function payPanel() {
  const qs = await Promise.all(P.tracks.map(t => fetch(API + '/rs?s=' + t.slug + '&tok=' + tok, { cache: 'no-store', headers: { Authorization: 'Bearer ' + ls.get('insights:key') } }).then(r => r.json()).then(j => j.ok && j.song.quote ? { t, q: j.song.quote } : null).catch(() => null)));
  const list = qs.filter(Boolean); if (!list.length) return;
  const price = (q, p) => p.fix != null ? p.fix : q.menu.base + q.menu.vocal[p.v][1] + q.menu.edit[p.e][1];
  const half = (q, p) => { const t = price(q, p), d = Math.min(t, p.da ?? (q.half ? Math.round(t / 2) : Math.ceil(t * (t < 500 ? .8 : t < 1000 ? .7 : .5)))); return [d, t - d]; };
  let total = 0, got = 0, depDue = 0, nPeople = 0, nDep = 0, nOk = 0;
  const blocks = list.map(({ t, q }) => '<div class="pyt"><div class="pyh">' + esc(t.title) + '</div>' + q.people.map(p => {
    const [d, f] = half(q, p), all = d + f;
    total += all; got += (p.dep ? d : 0) + (p.fin ? f : 0); nPeople++; if (p.dep) nDep++; else depDue += d; if (p.ok) nOk++;
    // 每人选了什么：单独报价写服务名；否则列出加了的人声制作 / 编辑，没加就是仅混音
    const opts = p.fix != null ? p.fixn : [p.v ? q.menu.vocal[p.v][0] + '人声' : '', p.e ? q.menu.edit[p.e][0] + '编辑' : ''].filter(Boolean).join(' + ') || '仅混音';
    return '<div class="pyr"><span class="n">' + esc(p.n) + '<i>' + esc(opts) + (p.ok ? '' : ' · 未确认') + '</i></span><span class="a">¥' + all + '</span>'
      + '<span class="' + (p.dep ? 'ok' : 'due') + '">定 ¥' + d + (p.dep ? ' ✓' : '') + '</span><span class="' + (p.fin ? 'ok' : '') + '">尾 ¥' + f + (p.fin ? ' ✓' : '') + '</span></div>';
  }).join('') + '</div>').join('');
  const go = nDep === nPeople;
  const el = document.createElement('section'); el.className = 'pay';
  el.innerHTML = '<div class="pyhd"><span>收款情况</span><i>仅你可见</i></div>'
    + '<div class="pysum"><div><b>¥' + got + '</b><span>已收 / ¥' + total + '</span></div><div><b>' + nDep + ' / ' + nPeople + '</b><span>定金已收（确认 ' + nOk + ' 位）</span></div></div>'
    + '<div class="pygo' + (go ? ' on' : '') + '">' + (go ? '定金已收齐，可以开工' : '还差 ' + (nPeople - nDep) + ' 位定金 ¥' + depDue + '，收齐再开工') + '</div>' + blocks;
  document.getElementById('list').appendChild(el);
}
pin.addEventListener('input', async () => {
  pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
  dots.forEach((d, i) => d.classList.toggle('on', i < pin.value.length));
  ask.classList.remove('err'); ask.textContent = '输入密码收听';
  if (pin.value.length < 4) return;
  const pw = pin.value; pin.blur();
  const key = await ok(pw); if (key) return open(pw, key);
  ask.textContent = '密码不对，再试一次'; ask.classList.add('err');
  const d = document.getElementById('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  setTimeout(() => { pin.value = ''; dots.forEach(x => x.classList.remove('on')); focus(); }, 420);
});
