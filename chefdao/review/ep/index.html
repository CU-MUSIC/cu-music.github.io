<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e0f">
<title>CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* 项目页（EP / 专辑）：封面 + 名称，输一次密码出现曲目；每首歌的审听页自动记住这个密码 */
:root{--bg:#0e0e0f;--fill:rgba(236,234,230,.05);--fill-2:rgba(236,234,230,.085);--hair:rgba(236,234,230,.09);--text:#e8e6e2;--text-2:#a3a19d;--text-3:#74726f;--red:#e9a19a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:radial-gradient(70% 420px at 50% 210px,rgba(236,234,230,.11),rgba(236,234,230,.04) 55%,transparent 100%),radial-gradient(120% 60% at 50% -10%,rgba(236,234,230,.06),transparent 60%),var(--bg);color:var(--text);font:17px/1.6 var(--font);-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;padding:calc(48px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
/* 封面：近处一层贴身阴影 + 远处一层柔光阴影，顶边一道高光、底边压暗，背后一圈封面色的光晕，看起来浮在页面上 */
.cv{--rx:0;--ry:0;--sx:30%;--sy:15%;position:relative;isolation:isolate;width:min(64vw,260px);aspect-ratio:1;border-radius:18px;
  background:radial-gradient(130% 100% at 28% 12%,#3a3a3d 0%,#1c1c1e 55%,#0e0e0f 100%) center/cover;
  /* 跟着鼠标（电脑）或陀螺仪（手机）微微转动，远处那层阴影往反方向偏，光源始终在同一边 */
  transform:perspective(800px) rotateX(calc(var(--rx) * 1deg)) rotateY(calc(var(--ry) * 1deg));will-change:transform;
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 -1px 0 rgba(0,0,0,.6) inset,0 0 0 .5px rgba(255,255,255,.09) inset,
    0 2px 4px rgba(0,0,0,.35),0 12px 24px -8px rgba(0,0,0,.55),
    calc(var(--ry) * -2.6px) calc(40px + var(--rx) * 2.6px) 80px -28px rgba(0,0,0,.85);
  display:grid;place-items:center}
.cv::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at var(--sx) var(--sy),rgba(255,255,255,.14),transparent 55%),
    linear-gradient(160deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 32%,transparent 50%,rgba(0,0,0,.18) 100%)}
.cv::after{content:"";position:absolute;inset:8% 6% -10%;z-index:-1;border-radius:inherit;background:inherit;filter:blur(36px) saturate(1.3);opacity:.35;transform:translateY(10px)}
.cv svg{width:42%;height:42%;filter:drop-shadow(0 1px 0 rgba(255,255,255,.18)) drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.cv svg path{fill:none;stroke:#e8e6e2;stroke-width:36;stroke-linecap:round}
.kind{margin-top:26px;font-size:12px;letter-spacing:.16em;color:var(--text-3);text-transform:uppercase}
h1{margin-top:6px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.ar{margin-top:4px;color:var(--text-2);font-size:15px}
.mename{margin-top:10px;font:inherit;font-size:12.5px;padding:3px 12px;border-radius:999px;border:0;background:rgba(255,255,255,.08);color:var(--text-2);cursor:pointer}
.mename.set{background:none}
.ask{margin-top:34px;color:var(--text-2);font-size:15px;min-height:1.6em}
.ask.err{color:var(--red)}
.dots{display:flex;gap:22px;margin-top:16px;padding:10px;cursor:text}
.dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text-2);transition:background-color .15s,transform .25s}
.dots i.on{background:var(--text);border-color:var(--text);transform:scale(1.08)}
.dots.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin{position:absolute;left:50%;bottom:0;opacity:0;width:1px;height:1px;pointer-events:none;font-size:16px}
#gate{position:relative;display:flex;flex-direction:column;align-items:center}
/* 键盘弹出：封面缩小、上下留白收紧，密码点留在键盘上面 */
body{transition:padding-top .42s cubic-bezier(.32,.72,0,1)}
.cv{transition:width .42s cubic-bezier(.32,.72,0,1),border-radius .42s cubic-bezier(.32,.72,0,1)}
.cv::after{transition:opacity .6s ease}
.cv:not(.ld)::after{opacity:0}   /* 封面图没加载完之前不显示下面的柔光：那时它拿的是灰底渐变，会闪一块怪色 */
.kind,h1,.ask{transition:margin .42s cubic-bezier(.32,.72,0,1),font-size .42s cubic-bezier(.32,.72,0,1)}
body.kb{padding-top:16px}
body.kb .cv{width:96px;border-radius:12px}body.kb .cv::after{opacity:0}
body.kb .kind{margin-top:12px}body.kb h1{font-size:20px}body.kb .ask{margin-top:16px}
#list{width:100%}
.list{width:100%;margin-top:30px;display:flex;flex-direction:column;border-top:.5px solid var(--hair)}
.tr{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:15px 4px;border-bottom:.5px solid var(--hair);color:var(--text);text-decoration:none;text-align:left;
  opacity:0;transform:translateY(8px);animation:in .5s cubic-bezier(.2,.8,.2,1) forwards}
.tr:active{background:var(--fill)}
.tr .n{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:14px}
.tr .t{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t i{display:block;font-style:normal;font-weight:400;font-size:13px;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.tr .m{color:var(--text-3);font-size:13px;font-variant-numeric:tabular-nums}
@keyframes in{to{opacity:1;transform:none}}
.empty{margin-top:30px;color:var(--text-3);font-size:14px}
/* 曲目进度 */
.tr .t em.pg{display:flex;align-items:center;gap:8px;font-style:normal;font-weight:500;font-size:12px;color:var(--text-2);margin-top:6px}
.pg .bar{display:inline-flex;gap:3px}.pg .bar s{width:12px;height:3px;border-radius:2px;background:rgba(236,234,230,.14)}
.pg .bar s.d{background:rgba(236,234,230,.55)}.pg .bar s.c{background:#e8e6e2}
.pgr{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:.5px solid var(--hair);font-size:13.5px}
.pgr .n{color:var(--text);min-width:0;overflow-wrap:anywhere;line-height:1.35}
.pay select,.pay input[type=date]{font:inherit;font-size:13px;color:var(--text);background:var(--fill-2);border:0;border-radius:8px;padding:6px 8px;color-scheme:dark}
.pgall{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--text-3)}
/* 收款情况（仅你可见） */
.pyhd{cursor:pointer;user-select:none}.pyhd span::after{content:' ▾';color:var(--text-3);font-size:11px}.pay.fold>:not(.pyhd){display:none}.pay.fold .pyhd span::after{content:' ▸'}
.pay{margin-top:34px;padding:16px;border-radius:14px;border:1px dashed rgba(236,234,230,.16);text-align:left;font-variant-numeric:tabular-nums}
.pyhd{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--text-2)}.pyhd i{font-style:normal;font-weight:400;font-size:12px;color:var(--text-3)}
.pysum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pysum div{padding:10px 12px;border-radius:10px;background:var(--fill)}.pysum b{display:block;font-size:20px}.pysum span{font-size:12px;color:var(--text-3)}
.pygo{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--fill-2);font-size:14px;color:var(--text-2)}
.pygo.on{background:#e8e6e2;color:#121213;font-weight:600}
.pyt{margin-top:14px}.pyh{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.pyr{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:.5px solid var(--hair);font-size:13.5px;color:var(--text-2)}
.pyr .n{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pyr .n i{display:block;font-style:normal;font-size:11.5px;color:var(--text-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.pyr .a{color:var(--text)}.pyr .ok{color:var(--text)}.pyr .due{color:#e2b26f}
.boot{color:var(--text-3);font-size:15px;margin-top:30vh}
</style>
</head>
<body>
<main id="m"><div class="boot">正在载入…</div></main>
<script>
(async () => {
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://stats.cumusic.work';
// 在独立应用窗口里打开审听页：左上角给一个返回看板的小标签（只有你自己的设备才有）
try { if (matchMedia('(display-mode: standalone)').matches && localStorage.getItem('insights:key')) { const bk = document.createElement('a'); bk.href = '/chefdao/review/insights/'; bk.textContent = '‹ Insights';
  bk.style.cssText = 'position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:12px;z-index:98;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.1);color:#d8d6d2;font:500 13px -apple-system,"PingFang SC",sans-serif;text-decoration:none;backdrop-filter:blur(8px)'; document.body.appendChild(bk); } } catch (e) {}
const slug = location.hash.slice(1).replace(/[^a-z0-9]/g, ''), m = document.getElementById('m');
const esc = x => String(x || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const KIND = { single: 'Single', ep: 'EP', album: 'Album' };
const CU = '<svg viewBox="272 164 456 456"><path d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg>';
const PJ_MSG = { incomplete: ['链接不完整', '请核对链接是否完整，或联系发送方获取新链接。'], missing: ['未找到该项目', '链接可能有误或已失效，请联系发送方确认。'], archived: ['此项目已归档', '该项目已完成交付并归档，如需回看请联系发送方。'] };
function pjErr(k) {
  const x = PJ_MSG[k];
  m.innerHTML = '<div style="text-align:center;max-width:320px;margin:30vh auto 0;padding:0 24px"><div style="color:#d8d6d2;display:flex;justify-content:center;opacity:.9">' + CU.replace('<svg ', '<svg width="52" height="52" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" ') + '</div>'
    + '<div style="margin-top:22px;font-size:17px;font-weight:600;color:#e6e4e0">' + x[0] + '</div><div style="margin-top:8px;font-size:14px;line-height:1.7;color:#8a8886">' + x[1] + '</div></div>';
}
// 申请制项目：客户填 ID 提交申请，等你批准；批准后这页自动进入（每 6 秒问一次）
const apDevice = () => { const x = navigator.userAgent; return (/iPhone|iPad/.test(x) ? 'iPhone' : /Android/.test(x) ? '安卓' : /Mac/.test(x) ? 'Mac' : /Windows/.test(x) ? 'Windows' : '设备') + (/MicroMessenger/i.test(x) ? ' · 微信' : /xhsdiscover|XiaoHongShu/i.test(x) ? ' · 小红书' : /aweme|douyin/i.test(x) ? ' · 抖音' : ''); };
function approvalGate(info) {
  const name0 = ls.get('review:name') || ls.get('review:ap:name') || '', st = info.state;   // 之前自己填过艺名的，直接带入
  const cover = info.project.cover ? ' style="background-image:url(' + API + info.project.cover + ')"' : '';
  const avgTxt = info.avg ? (() => { const m = Math.max(1, Math.round(info.avg / 6e4)); return '平均 ' + (m < 60 ? m + ' 分钟' : m < 1440 ? Math.round(m / 60) + ' 小时' : Math.round(m / 1440) + ' 天') + '内通过'; })() : '';   // 最近几次申请从提交到批准的平均用时
  const avgLine = avgTxt ? '<div style="margin:10px auto 0;font-size:13px;color:var(--text-3)">' + avgTxt + '</div>' : '';
  const stage = (st === 'pending') ? ['申请已提交', '批准后这个页面会自动打开，请保持页面开启，或稍后再回来。']
    : (st === 'denied' || st === 'revoked') ? ['申请未通过', '如有疑问，请联系发送方。'] : null;
  m.innerHTML = '<div class="cv"' + cover + '>' + (info.project.cover ? '' : CU) + '</div><h1>' + esc(info.project.title) + '</h1>'
    + (stage
      ? '<div class="ask" style="margin-top:28px">' + stage[0] + '</div><div style="margin:10px auto 0;max-width:300px;font-size:14px;line-height:1.7;color:var(--text-3)">' + stage[1] + '</div>' + (st === 'pending' ? avgLine : '')
      : '<div class="ask" style="margin-top:28px">此项目需申请后查看</div>'
        + '<form id="apf" style="margin:18px auto 0;max-width:300px;display:flex;flex-direction:column;gap:12px"><input id="apn" maxlength="40" autocomplete="off" placeholder="你的 ID（艺名或微信号）" value="' + esc(name0) + '" style="padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:inherit;font:inherit;font-size:16px;text-align:center">'
        + '<button style="padding:13px;border-radius:12px;border:0;background:#eeeee6;color:#0e0e0f;font:inherit;font-weight:600;font-size:16px;cursor:pointer">申请查看</button><div id="ape" style="min-height:18px;font-size:13px;color:#e8a89a"></div></form>' + avgLine);
  const poll = () => fetch(API + '/pj?s=' + slug + '&tok=' + tok, { cache: 'no-store' }).then(r => r.json()).then(j => { if (j.ok) location.reload(); else if (j.state === 'denied' || j.state === 'revoked') approvalGate(j); }).catch(() => {});
  if (st === 'pending') setInterval(poll, 6000);
  const f = document.getElementById('apf'); if (!f) return;
  f.onsubmit = async ev => {
    ev.preventDefault();
    const n = document.getElementById('apn').value.trim(), err = document.getElementById('ape'); if (!n) { err.textContent = '请填写你的 ID'; return; }
    ls.set('review:ap:name', n); err.textContent = '';
    try {
      const r = await fetch(API + '/ap/req', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ project: slug, tok, name: n, device: apDevice(), lid: ls.get('review:lid') || '' }) });
      const j = await r.json();
      if (!j.ok) { err.textContent = r.status === 429 ? '提交太频繁，请稍后再试' : '提交失败，请检查网络后重试'; return; }
      if (j.state === 'approved') return location.reload();
      approvalGate({ ...info, state: j.state });
    } catch (x) { err.textContent = '提交失败，请检查网络后重试'; }
  };
}
if (!slug) { return pjErr('incomplete'); }
let P;
let archived = false;
// 浏览器凭证：申请制项目靠它认这台设备（批准后才放行），本机随机生成，换设备或清数据要重新申请
const tok = (() => { let t = ls.get('review:tok'); if (!t || !/^[A-Za-z0-9]{24,64}$/.test(t)) { t = ''; const a = crypto.getRandomValues(new Uint8Array(32)); for (const b of a) t += 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]; ls.set('review:tok', t); } return t; })();
let approvalInfo = null;
try { let owner = null; try { owner = localStorage.getItem('insights:key'); } catch (e) {}
  const j = await (await fetch(API + '/pj?s=' + slug + '&tok=' + tok, { cache: 'no-store', headers: owner ? { Authorization: 'Bearer ' + owner } : {} })).json();
  if (j.e === 'archived') archived = true;
  if (j.e === 'approval') approvalInfo = j;
  if (!j.ok) throw 0; P = j.project; }
catch (e) { if (approvalInfo) return approvalGate(approvalInfo); return pjErr(archived ? 'archived' : 'missing'); }
document.title = P.title;
if (P.cover) { const sc = document.createElement('script'); sc.src = '../tint.js?v=20261025d'; sc.onload = () => window.cuTint(API + P.cover); document.head.appendChild(sc); }
if (P.archived) { const d = document.createElement('div'); d.textContent = '已归档 · 客户打不开，只有你的设备能看';
  d.style.cssText = 'position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:99;padding:6px 14px;border-radius:99px;background:rgba(232,201,138,.16);border:1px solid rgba(232,201,138,.4);color:#e8c98a;font:500 13px/1.4 -apple-system,"PingFang SC",sans-serif;white-space:nowrap;pointer-events:none'; document.body.appendChild(d); }
setTimeout(tilt, 0);
// 访问记录：打开了项目页记一次（0 打开了），输对密码再记一次（1 查看了）。你自己的设备（存了看板钥匙）不记
const sid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
let lid = ls.get('review:lid'); if (!lid) { lid = Math.random().toString(36).slice(2, 5).toUpperCase(); ls.set('review:lid', lid); }
const ua = navigator.userAgent, app = /Barcelona/i.test(ua) ? 'Threads' : /Instagram/i.test(ua) ? 'Instagram' : /MicroMessenger/i.test(ua) ? '微信' : /xhsdiscover|XiaoHongShu/i.test(ua) ? '小红书' : /aweme|douyin/i.test(ua) ? '抖音' : / QQ\//.test(ua) ? 'QQ' : /KAKAOTALK/i.test(ua) ? 'KakaoTalk' : '';
const device = (/iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? '安卓' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '设备') + (app ? ' · ' + app : '');
const nv = (+ls.get('review:visits:ep:' + slug) || 0) + 1; ls.set('review:visits:ep:' + slug, nv);
const accessPing = state => {
  if (ls.get('insights:key') || ls.get('review:me') === '1' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  fetch(API + '/v', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true, body: JSON.stringify({ sid, lid, kind: 'ep', slug, state, device, visit: nv }) }).catch(() => {});
};
accessPing(0);
let myName = ls.get('review:name') || '';
const showMe = () => { const b = document.getElementById('meName'); if (!b) return; b.textContent = myName ? '我是 ' + myName : '留个名字'; b.classList.toggle('set', !!myName); };
document.addEventListener('click', ev => { if (!ev.target.closest || !ev.target.closest('#meName')) return;
  const v = prompt('你的名字或 ID', myName); if (v === null) return;
  myName = v.trim().slice(0, 30); ls.set('review:name', myName); showMe();
  fetch(API + '/lself', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug, lid, name: myName }) }).catch(() => {}); });
new MutationObserver(showMe).observe(m, { childList: true });
// 多歌手的项目（Cypher 这类）：进来先填艺名，不填不能往下；你自己的设备不受影响
const singerSet = new Set((P.tracks || []).flatMap(t => String(t.artist || '').split(/[、,，/&]/).map(x => x.trim()).filter(Boolean)));
if (singerSet.size > 1 && !myName && !ls.get('insights:key') && ls.get('review:me') !== '1') {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(14,15,17,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)';
