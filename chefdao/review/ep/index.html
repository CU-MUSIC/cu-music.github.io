<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e0f">
<title>CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* 项目页（EP / 专辑）：封面 + 名称，输一次密码出现曲目；每首歌的审听页自动记住这个密码 */
:root{--bg:#0e0e0f;--fill:rgba(236,234,230,.05);--fill-2:rgba(236,234,230,.085);--hair:rgba(236,234,230,.09);--text:#e8e6e2;--text-2:#a3a19d;--text-3:#74726f;--red:#e9a19a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:radial-gradient(70% 420px at 50% 210px,rgba(236,234,230,.11),rgba(236,234,230,.04) 55%,transparent 100%),radial-gradient(120% 60% at 50% -10%,rgba(236,234,230,.06),transparent 60%),var(--bg);color:var(--text);font:17px/1.6 var(--font);-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;padding:calc(48px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
/* 封面：近处一层贴身阴影 + 远处一层柔光阴影，顶边一道高光、底边压暗，背后一圈封面色的光晕，看起来浮在页面上 */
.cv{--rx:0;--ry:0;--sx:30%;--sy:15%;position:relative;isolation:isolate;width:min(64vw,260px);aspect-ratio:1;border-radius:18px;
  background:radial-gradient(130% 100% at 28% 12%,#3a3a3d 0%,#1c1c1e 55%,#0e0e0f 100%) center/cover;
  /* 跟着鼠标（电脑）或陀螺仪（手机）微微转动，远处那层阴影往反方向偏，光源始终在同一边 */
  transform:perspective(800px) rotateX(calc(var(--rx) * 1deg)) rotateY(calc(var(--ry) * 1deg));will-change:transform;
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 -1px 0 rgba(0,0,0,.6) inset,0 0 0 .5px rgba(255,255,255,.09) inset,
    0 2px 4px rgba(0,0,0,.35),0 12px 24px -8px rgba(0,0,0,.55),
    calc(var(--ry) * -2.6px) calc(40px + var(--rx) * 2.6px) 80px -28px rgba(0,0,0,.85);
  display:grid;place-items:center}
.cv::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at var(--sx) var(--sy),rgba(255,255,255,.14),transparent 55%),
    linear-gradient(160deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,.02) 32%,transparent 50%,rgba(0,0,0,.18) 100%)}
.cv::after{content:"";position:absolute;inset:8% 6% -10%;z-index:-1;border-radius:inherit;background:inherit;filter:blur(36px) saturate(1.3);opacity:.35;transform:translateY(10px)}
.cv svg{width:42%;height:42%;filter:drop-shadow(0 1px 0 rgba(255,255,255,.18)) drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.cv svg path{fill:none;stroke:#e8e6e2;stroke-width:36;stroke-linecap:round}
.kind{margin-top:26px;font-size:12px;letter-spacing:.16em;color:var(--text-3);text-transform:uppercase}
h1{margin-top:6px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.ar{margin-top:4px;color:var(--text-2);font-size:15px}
.ask{margin-top:34px;color:var(--text-2);font-size:15px;min-height:1.6em}
.ask.err{color:var(--red)}
.dots{display:flex;gap:22px;margin-top:16px;padding:10px;cursor:text}
.dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--text-2);transition:background-color .15s,transform .25s}
.dots i.on{background:var(--text);border-color:var(--text);transform:scale(1.08)}
.dots.shake{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
#list{width:100%}
.list{width:100%;margin-top:30px;display:flex;flex-direction:column;border-top:.5px solid var(--hair)}
.tr{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:15px 4px;border-bottom:.5px solid var(--hair);color:var(--text);text-decoration:none;text-align:left;
  opacity:0;transform:translateY(8px);animation:in .5s cubic-bezier(.2,.8,.2,1) forwards}
.tr:active{background:var(--fill)}
.tr .n{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:14px}
.tr .t{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t i{display:block;font-style:normal;font-weight:400;font-size:13px;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.tr .m{color:var(--text-3);font-size:13px;font-variant-numeric:tabular-nums}
@keyframes in{to{opacity:1;transform:none}}
.empty{margin-top:30px;color:var(--text-3);font-size:14px}
/* 收款情况（仅你可见） */
.pay{margin-top:34px;padding:16px;border-radius:14px;border:1px dashed rgba(236,234,230,.16);text-align:left;font-variant-numeric:tabular-nums}
.pyhd{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--text-2)}.pyhd i{font-style:normal;font-weight:400;font-size:12px;color:var(--text-3)}
.pysum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pysum div{padding:10px 12px;border-radius:10px;background:var(--fill)}.pysum b{display:block;font-size:20px}.pysum span{font-size:12px;color:var(--text-3)}
.pygo{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--fill-2);font-size:14px;color:var(--text-2)}
.pygo.on{background:#e8e6e2;color:#121213;font-weight:600}
.pyt{margin-top:14px}.pyh{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.pyr{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:baseline;padding:6px 0;border-bottom:.5px solid var(--hair);font-size:13.5px;color:var(--text-2)}
.pyr .n{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pyr .n i{display:block;font-style:normal;font-size:11.5px;color:var(--text-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.pyr .a{color:var(--text)}.pyr .ok{color:var(--text)}.pyr .due{color:#e2b26f}
.boot{color:var(--text-3);font-size:15px;margin-top:30vh}
</style>
</head>
<body>
<main id="m"><div class="boot">正在载入…</div></main>
<script>
(async () => {
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://stats.cumusic.work';
const slug = location.hash.slice(1).replace(/[^a-z0-9]/g, ''), m = document.getElementById('m');
const esc = x => String(x || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const KIND = { single: 'Single', ep: 'EP', album: 'Album' };
const CU = '<svg viewBox="272 164 456 456"><path d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg>';
if (!slug) { m.innerHTML = '<div class="boot">链接不完整，请向刀大厨要完整链接</div>'; return; }
let P;
try { const j = await (await fetch(API + '/pj?s=' + slug, { cache: 'no-store' })).json(); if (!j.ok) throw 0; P = j.project; }
catch (e) { m.innerHTML = '<div class="boot">找不到这个项目，请向刀大厨确认链接</div>'; return; }
document.title = P.title;
setTimeout(tilt, 0);
m.innerHTML = '<div class="cv"' + (P.cover ? ' style="background-image:url(' + API + P.cover + ')"' : '') + '>' + (P.cover ? '' : CU) + '</div>'
  + '<div class="kind">' + esc(KIND[P.kind] || '') + (P.tracks.length ? ' · ' + P.tracks.length + ' 首' : '') + '</div><h1>' + esc(P.title) + '</h1>' + (P.artist ? '<div class="ar">' + esc(P.artist) + '</div>' : '')
  + '<div id="gate"><div class="ask" id="ask">输入密码收听</div><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>'
  + '<input class="pin" id="pin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="密码"></div><div id="list"></div>';
// 封面立体转动：电脑跟鼠标，手机跟陀螺仪（以拿手机的初始角度为准，慢慢回正）。iPhone 要在第一次点屏幕时允许「运动与方向」
function tilt() {
  const cv = m.querySelector('.cv'); if (!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const MAX = 7; let tx = 0, ty = 0, x = 0, y = 0, raf = 0;
  const step = () => {
    x += (tx - x) * .12; y += (ty - y) * .12;
    cv.style.setProperty('--ry', (x * MAX).toFixed(2)); cv.style.setProperty('--rx', (-y * MAX).toFixed(2));
    cv.style.setProperty('--sx', (30 + x * 35).toFixed(1) + '%'); cv.style.setProperty('--sy', (15 + y * 35).toFixed(1) + '%');
    raf = Math.abs(tx - x) + Math.abs(ty - y) > .002 ? requestAnimationFrame(step) : 0;
  };
  const set = (px, py) => { tx = Math.max(-1, Math.min(1, px)); ty = Math.max(-1, Math.min(1, py)); if (!raf) raf = requestAnimationFrame(step); };
  if (matchMedia('(hover: hover)').matches) {
    cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); set(((e.clientX - r.left) / r.width - .5) * 2, ((e.clientY - r.top) / r.height - .5) * 2); });
    cv.addEventListener('pointerleave', () => set(0, 0));
    return;
  }
  let base = null;
  const ori = e => {
    if (e.beta == null) return;
    if (!base) base = { b: e.beta, g: e.gamma };
    base.b += (e.beta - base.b) * .01; base.g += (e.gamma - base.g) * .01;
    set((e.gamma - base.g) / 18, (e.beta - base.b) / 18);
  };
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function') {
    const ask = () => { removeEventListener('touchend', ask); D.requestPermission().then(s => { if (s === 'granted') addEventListener('deviceorientation', ori); }).catch(() => {}); };
    addEventListener('touchend', ask);
  } else addEventListener('deviceorientation', ori);
}
const pin = document.getElementById('pin'), dots = [...document.querySelectorAll('#dots i')], ask = document.getElementById('ask');
const focus = () => pin.focus({ preventScroll: true });
document.getElementById('dots').onclick = focus; m.onclick = e => { if (!e.target.closest('a')) focus(); };
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const dec = (key, s) => { const c = ub64(s); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: c.subarray(0, 12) }, key, c.subarray(12)); };
async function ok(pw) {   // 密码对就返回项目密钥；不设密码的项目用公开口令
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw || 'cu-open'), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    await dec(key, P.check); return key;
  } catch (e) { return null; }
}
async function open(pw, key) {
  ls.set('review:pj:' + slug, pw);
  // 点进每首歌不用再输密码：用项目密钥解出每首歌自己的密码记下来
  for (const t of P.tracks) {
    let spw = pw; if (t.wrap) try { spw = new TextDecoder().decode(await dec(key, t.wrap)); } catch (e) {}
    ls.set('review:pw:' + t.slug, spw);
  }
  document.getElementById('gate').remove();
  document.getElementById('list').innerHTML = P.tracks.length ? '<div class="list">' + P.tracks.map((t, i) =>
    '<a class="tr" style="animation-delay:' + (i * 60) + 'ms" href="' + esc(t.url) + '"><span class="n">' + String(i + 1).padStart(2, '0') + '</span><span class="t">' + esc(t.title) + (t.artist ? '<i>' + esc(t.artist) + '</i>' : '') + '</span><span class="m">' + fmt(t.dur) + '</span></a>').join('') + '</div>'
    : '<div class="empty">曲目还在准备中</div>';
  if (ls.get('insights:key')) payPanel();
}
// 收款情况：只在你的设备（存了看板钥匙）显示。读每首歌的费用单，按人列出定金 / 尾款，定金收齐才开工
async function payPanel() {
  const qs = await Promise.all(P.tracks.map(t => fetch(API + '/rs?s=' + t.slug, { cache: 'no-store' }).then(r => r.json()).then(j => j.ok && j.song.quote ? { t, q: j.song.quote } : null).catch(() => null)));
  const list = qs.filter(Boolean); if (!list.length) return;
  const price = (q, p) => p.fix != null ? p.fix : q.menu.base + q.menu.vocal[p.v][1] + q.menu.edit[p.e][1];
  const half = (q, p) => { const t = price(q, p), d = Math.min(t, p.da ?? Math.round(t / 2)); return [d, t - d]; };
  let total = 0, got = 0, depDue = 0, nPeople = 0, nDep = 0, nOk = 0;
  const blocks = list.map(({ t, q }) => '<div class="pyt"><div class="pyh">' + esc(t.title) + '</div>' + q.people.map(p => {
    const [d, f] = half(q, p), all = d + f;
    total += all; got += (p.dep ? d : 0) + (p.fin ? f : 0); nPeople++; if (p.dep) nDep++; else depDue += d; if (p.ok) nOk++;
    // 每人选了什么：单独报价写服务名；否则列出加了的人声制作 / 编辑，没加就是仅混音
    const opts = p.fix != null ? p.fixn : [p.v ? q.menu.vocal[p.v][0] + '人声' : '', p.e ? q.menu.edit[p.e][0] + '编辑' : ''].filter(Boolean).join(' + ') || '仅混音';
    return '<div class="pyr"><span class="n">' + esc(p.n) + '<i>' + esc(opts) + (p.ok ? '' : ' · 未确认') + '</i></span><span class="a">¥' + all + '</span>'
      + '<span class="' + (p.dep ? 'ok' : 'due') + '">定 ¥' + d + (p.dep ? ' ✓' : '') + '</span><span class="' + (p.fin ? 'ok' : '') + '">尾 ¥' + f + (p.fin ? ' ✓' : '') + '</span></div>';
  }).join('') + '</div>').join('');
  const go = nDep === nPeople;
  const el = document.createElement('section'); el.className = 'pay';
  el.innerHTML = '<div class="pyhd"><span>收款情况</span><i>仅你可见</i></div>'
    + '<div class="pysum"><div><b>¥' + got + '</b><span>已收 / ¥' + total + '</span></div><div><b>' + nDep + ' / ' + nPeople + '</b><span>定金已收（确认 ' + nOk + ' 位）</span></div></div>'
    + '<div class="pygo' + (go ? ' on' : '') + '">' + (go ? '定金已收齐，可以开工' : '还差 ' + (nPeople - nDep) + ' 位定金 ¥' + depDue + '，收齐再开工') + '</div>' + blocks;
  document.getElementById('list').appendChild(el);
}
pin.addEventListener('input', async () => {
  pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
  dots.forEach((d, i) => d.classList.toggle('on', i < pin.value.length));
  ask.classList.remove('err'); ask.textContent = '输入密码收听';
  if (pin.value.length < 4) return;
  const pw = pin.value; pin.blur();
  const key = await ok(pw); if (key) return open(pw, key);
  ask.textContent = '密码不对，再试一次'; ask.classList.add('err');
  const d = document.getElementById('dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  setTimeout(() => { pin.value = ''; dots.forEach(x => x.classList.remove('on')); focus(); }, 420);
});
const saved = P.open ? '' : ls.get('review:pj:' + slug), sk = saved !== null && await ok(saved);
if (sk) open(saved, sk); else setTimeout(focus, 300);
})();
</script>
</body>
</html>
