<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a1c20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CU 工作台">
<title>CU 工作台</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<style>
/* 助理工作台：共享给他的歌 → 进度 + 要改的评论。一首一张卡，先看还剩几条 */
:root{--bg:#1a1c20;--card:#23262b;--line:#32363d;--text:#d6d3cd;--dim:#8f8c86;--acc:#9fb8a6;--warm:#c9b98a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 -apple-system,"PingFang SC",sans-serif;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px;font-weight:600;color:#ece9e3}
.sub{color:var(--dim);font-size:15px;margin-bottom:22px}
.pj{font-size:14px;color:var(--dim);margin:26px 0 8px;letter-spacing:.04em}
.song{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top b{font-size:18px;color:#ece9e3;flex:1;min-width:0;word-break:break-word}
.st{font-size:13px;border-radius:99px;padding:1px 10px;background:rgba(159,184,166,.14);color:var(--acc)}
.st.w{background:rgba(201,185,138,.14);color:var(--warm)}
.go{font:inherit;font-size:14px;text-decoration:none;color:var(--bg);background:var(--text);border-radius:99px;padding:4px 14px;font-weight:600}
.meta{color:var(--dim);font-size:14px;margin-top:2px}
.vh{font-size:14px;color:var(--acc);margin:14px 0 6px;font-weight:600}
.it{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0}
.it.dn{opacity:.5}.it.dn .m{text-decoration:line-through}
.tm{flex:none;font-variant-numeric:tabular-nums;color:var(--acc);text-decoration:none;font-weight:600}
.m{flex:1;min-width:0;word-break:break-word}
.ct{display:inline-block;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-left:8px;line-height:1.6;vertical-align:2px}
.ck{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:none;color:var(--text);border-radius:99px;padding:3px 12px;cursor:pointer}
.it.dn .ck{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.none{color:var(--dim);font-size:15px;margin-top:8px}
.empty{color:var(--dim);text-align:center;padding:60px 0}
</style>
</head>
<body><main id="app"><div class="empty">加载中…</div></main>
<script>
(() => {
  const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://stats.cumusic.work';
  const app = document.getElementById('app'), ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  // 钥匙从链接里取一次就记在这台设备上；之后从主屏幕打开（链接里没钥匙）也能用
  const fromHash = location.hash.slice(1); if (/^[0-9a-f]{24}$/.test(fromHash)) ls.set('review:hp', fromHash);
  const tok = ls.get('review:hp') || '';
  // 这台设备打开审听页：带助理钥匙取歌（自动解锁），不记收听、不推送
  ls.set('review:me', '1'); ls.set('review:assist', '1');
  const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const STAGE = s => s == null ? ['', ''] : [['准备中', 'w'], ['准备中', 'w'], ['编辑中', ''], ['混音中', ''], ['等客户听', 'w'], ['已交付', 'w'], ['人声制作中', ''], ['修改中', ''], ['交付中', 'w']][s] || ['', ''];
  const rs = u => u.replace('https://cumusic.work', '');
  let D = null;
  const draw = () => {
    const all = D.projects.flatMap(p => p.tracks), left = all.reduce((n, t) => n + t.items.filter(x => !x.done).length, 0);
    let h = `<h1>${esc(D.name)} 的工作台</h1><div class="sub">${all.length} 首歌 · 还剩 ${left} 条要改 · 只显示「${esc(D.cats.join('、'))}」的意见</div>`;
    if (!all.length) h += '<div class="empty">暂时没有共享给你的歌</div>';
    D.projects.forEach(p => {
      h += `<div class="pj">${esc(p.title)}${p.artist ? ' · ' + esc(p.artist) : ''}</div>`;
      p.tracks.forEach(t => {
        const [sn, sc] = STAGE(t.s), todo = t.items.filter(x => !x.done).length;
        h += `<div class="song"><div class="top"><b>${esc(t.title)}</b>${sn ? `<span class="st ${sc}">${sn}</span>` : ''}<a class="go" href="${esc(rs(t.url))}" target="_blank" rel="noopener">试听</a></div>`
          + `<div class="meta">${t.versions} 个版本${t.items.length ? ' · 还剩 ' + todo + ' 条' : ''}</div>`;
        if (!t.items.length) h += '<div class="none">暂时没有分给你的修改意见</div>';
        let lv = '';
        t.items.forEach((x, i) => {
          if (x.ver !== lv) { lv = x.ver; h += `<div class="vh">${esc(x.ver)}</div>`; }
          h += `<div class="it${x.done ? ' dn' : ''}"><a class="tm" href="/chefdao/review/s/?at=${x.ver}-${x.t}#${t.slug}" target="_blank" rel="noopener">${fmt(x.t)}</a><div class="m">${esc(x.m)}<span class="ct">${esc(x.cat)}</span></div><button class="ck" data-s="${t.slug}" data-i="${i}">${x.done ? '已改' : '改好了'}</button></div>`;
        });
        h += '</div>';
      });
    });
    app.innerHTML = h;
    app.querySelectorAll('.ck').forEach(b => b.onclick = async () => {
      const t = all.find(y => y.slug === b.dataset.s), x = t.items[+b.dataset.i], on = !x.done; x.done = on ? 1 : 0; draw();
      try { const r = await fetch(API + '/hp/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tok, slug: t.slug, ver: x.ver, t: x.t, m: x.m, done: on }) }); if (!(await r.json()).ok) throw 0; }
      catch (e) { x.done = on ? 0 : 1; draw(); b.textContent = '没存上，检查网络再试'; }
    });
  };
  const load = async () => {
    if (!tok) { app.innerHTML = '<div class="empty">链接不完整，请向刀大厨要完整链接</div>'; return; }
    try { const r = await fetch(API + '/hp?t=' + tok, { cache: 'no-store' }), j = await r.json(); if (!j.ok) throw 0; D = j; draw(); }
    catch (e) { app.innerHTML = '<div class="empty">链接已失效，请向刀大厨要新链接</div>'; }
  };
  load(); setInterval(() => { if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
