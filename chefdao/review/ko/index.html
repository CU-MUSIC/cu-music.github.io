<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="韩语">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131f24" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>韩语学习</title>
<style>
:root{
  --bg:#fff;--card:#fff;--tx:#3c3c3c;--tx2:#777;--tx3:#afafaf;--bd:#e5e5e5;--bd2:#d0d0d0;--fill:#f7f7f7;
  --g:#58cc02;--gd:#46a302;--gl:#d7ffb8;--gt:#58a700;
  --b:#1cb0f6;--bdk:#1899d6;--bl:#ddf4ff;
  --r:#ff4b4b;--rd:#ea2b2b;--rl:#ffdfe0;--rt:#ea2b2b;
  --o:#ff9600;--p:#ce82ff;--pl:#f8eeff;
  --tile:#fff;--ghost:#e5e5e5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131f24;--card:#1b2b32;--tx:#f1f7fb;--tx2:#a9b8c0;--tx3:#52656d;--bd:#37464f;--bd2:#4b5d66;--fill:#1b2b32;
  --gl:#202f36;--gt:#79d634;--bl:#1d3a4a;--rl:#202f36;--rt:#ff7878;--pl:#2c2440;
  --tile:#131f24;--ghost:#37464f;
}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Apple SD Gothic Neo","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:17px;line-height:1.7;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ko{font-family:"Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif}
.screen{display:none;max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px)}
.screen.on{display:block;animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
.plan{border:2px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px;background:var(--card)}
.plan .ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.plan .ph h2{font-size:20px;font-weight:900}.plan .ph span{font-size:14px;font-weight:800;color:var(--tx3)}
.plan .ph span b{color:var(--gt)}
.pst{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:2px solid transparent;border-radius:14px;margin-bottom:6px;background:none;color:var(--tx);animation:fadeUp .35s both}
.pst:nth-child(2){animation-delay:.05s}.pst:nth-child(3){animation-delay:.1s}.pst:nth-child(4){animation-delay:.15s}
.pst .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;background:var(--bg2,rgba(127,127,127,.12));color:var(--tx3)}
.pst .m{flex:1;min-width:0}.pst b{display:block;font-size:17px;font-weight:800}
.pst small{display:block;font-size:14px;color:var(--tx2);line-height:1.5;margin-top:2px}
.pst em{flex:none;font-style:normal;font-size:13px;font-weight:800;color:var(--tx3)}
.pst.cur{border-color:var(--g);background:var(--gl)}.pst.cur .n{background:var(--g);color:#fff}
.pst.ok{opacity:.55}.pst.ok .n{background:var(--g);color:#fff;animation:planOk .45s both}.pst.ok b{text-decoration:line-through;text-decoration-thickness:2px}
@keyframes planOk{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pbar2{height:6px;border-radius:3px;background:var(--bd);margin-top:6px;overflow:hidden}.pbar2 i{display:block;height:100%;width:0;background:var(--g);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.plan .allok{text-align:center;padding:6px 0 10px;font-size:16px;font-weight:800;color:var(--gt);animation:fadeUp .4s both}
.plan .extra{display:flex;gap:8px;margin-top:8px}.plan .extra .btn{flex:1;font-size:15px;padding:12px}
.nxt{margin:12px 0;border:2px solid var(--g);border-radius:16px;padding:12px 14px;text-align:left;background:var(--gl);animation:fadeUp .4s .2s both}
.nxt small{font-size:13px;font-weight:800;color:var(--gt);letter-spacing:1px}.nxt b{display:block;font-size:18px;margin:2px 0}.nxt span{font-size:14px;color:var(--tx2)}
.fzb{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx2);font-size:14px;font-weight:800;animation:fadeUp .25s .15s both;transition:background .2s,color .2s,border-color .2s}
.fzb.on{border-color:#ff9600;color:#ff9600;background:rgba(255,150,0,.1)}
.gname{font-size:30px;font-weight:900;margin:6px 0 2px}.gzh{font-size:17px;font-weight:800;color:var(--b);margin-bottom:10px}
.gexp{font-size:16px;line-height:1.75;color:var(--tx2);margin-bottom:14px}
.gex>div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd);animation:fadeUp .35s both}
.gex>div:nth-child(2){animation-delay:.08s}.gex>div:nth-child(3){animation-delay:.16s}
.gex .spk{flex:none;width:36px;height:36px}.gex b{display:block;font-size:18px;line-height:1.6}.gex small{display:block;font-size:14px;color:var(--tx3)}
.gpz{font-size:20px;font-weight:800;line-height:1.7}.gpk{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:700;margin-top:12px}.gpk .spk{flex:none;width:36px;height:36px}.gpk[hidden]{display:none}
.gqs{font-size:22px;line-height:1.7;margin-bottom:8px}.ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--b)}
.qi{font-size:18px;font-weight:800}.qi small{display:block;font-size:15px;font-weight:700;color:var(--tx3);margin-top:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* 3D 按钮 */
.btn{display:block;width:100%;padding:13px 16px;border-radius:16px;font-size:16px;font-weight:800;letter-spacing:.5px;text-align:center;transition:transform .08s,box-shadow .08s,background .2s,color .2s}
.btn.green{background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd)}
.btn.blue{background:var(--b);color:#fff;box-shadow:0 4px 0 var(--bdk)}
.btn.red{background:var(--r);color:#fff;box-shadow:0 4px 0 var(--rd)}
.btn.off{background:var(--bd);color:var(--tx3);box-shadow:none;pointer-events:none}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{color:var(--tx3);font-size:14px;letter-spacing:1px;padding:10px}

/* ── 首页 ── */
.hd{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.hd h1{font-size:26px;font-weight:900;flex:1;letter-spacing:.5px}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;font-size:16px;padding:4px 10px;border-radius:12px}
.chip.fire{color:var(--o)}.chip.fire.dim{color:var(--tx3);filter:grayscale(1)}
.chip.xp{color:var(--b)}
.ring{width:38px;height:38px;position:relative}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--bd)}.ring .fgc{stroke:var(--o);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--tx2)}
.hero{border:2px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;background:var(--card)}
.hero.today{border-color:var(--g);background:linear-gradient(160deg,var(--gl),var(--card) 70%)}
.hero h2{font-size:19px;font-weight:900;margin-bottom:2px}
.hero p{color:var(--tx2);font-size:15px;margin-bottom:14px}
.hero .meta{font-size:13px;font-weight:700;color:var(--gt);margin-bottom:4px;letter-spacing:1px}
.hero.rev{border-color:var(--p)}.hero.rev .meta{color:var(--p)}
.sec{font-size:13px;font-weight:800;color:var(--tx3);letter-spacing:1.5px;margin:22px 0 10px}
.path{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lc{border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;padding:12px;text-align:left;background:var(--card);transition:transform .12s}
.lc:active{transform:translateY(2px)}
.lc .ic{font-size:26px;line-height:1.2}
.lc h3{font-size:15px;font-weight:800;margin-top:4px;line-height:1.35}
.lc p{font-size:12px;color:var(--tx2);line-height:1.45;margin-top:2px}
.lc .dots{display:flex;gap:3px;margin-top:8px}
.lc .dots i{width:14px;height:5px;border-radius:3px;background:var(--bd)}
.lc .dots i.on{background:var(--g)}
.lc .lv{font-size:11px;font-weight:800;color:var(--tx3);float:right;margin-top:4px}
.foot{display:flex;justify-content:center;gap:16px;margin-top:26px;font-size:13px;color:var(--tx3)}
.foot button{color:var(--tx3);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.sync{font-size:12px;color:var(--tx3);text-align:center;margin-top:8px;min-height:20px;transition:opacity .3s}

/* ── 练习页 ── */
#lesson{padding-top:calc(env(safe-area-inset-top) + 10px);display:none;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:0}
#lesson.on{display:flex}
.top{display:flex;align-items:center;gap:12px;height:44px}
.x{width:32px;height:32px;display:grid;place-items:center;color:var(--tx3);font-size:26px;line-height:1;flex:none}
.bar{flex:1;height:16px;background:var(--bd);border-radius:8px;overflow:hidden;position:relative}
.fill{height:100%;width:0;background:var(--g);border-radius:8px;transition:width .5s cubic-bezier(.2,.8,.2,1),background .4s;position:relative}
.fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.fill.combo{background:var(--o);box-shadow:0 0 12px rgba(255,150,0,.6)}
.cb{font-weight:900;color:var(--o);font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;max-width:0;opacity:0;transition:max-width .35s,opacity .35s}
.cb.on{max-width:90px;opacity:1}
.stage{flex:1;padding:14px 0 18px;display:flex;flex-direction:column}
.stage.in{animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.tag{font-size:14px;font-weight:800;color:var(--p);letter-spacing:1px;display:flex;align-items:center;gap:6px;min-height:22px;margin-bottom:2px}
.q{font-size:22px;font-weight:900;margin-bottom:18px;line-height:1.4}
.scene{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.ava{font-size:60px;line-height:1;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bub{position:relative;border:2px solid var(--bd);border-radius:16px;padding:10px 14px;margin-top:6px;font-size:19px;line-height:1.8;background:var(--card)}
.bub::before{content:"";position:absolute;left:-9px;top:20px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--bd);border-bottom:2px solid var(--bd);transform:rotate(45deg)}
.spk{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--b);vertical-align:-6px;margin-right:4px;border-radius:8px}
.spk svg{width:24px;height:24px}
.spk.playing{animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.tk{border-bottom:2px dashed var(--bd2);cursor:pointer;position:relative;padding:0 1px}
.tk.new{color:var(--p);border-bottom-color:var(--p)}
.tip{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:6px 12px;font-size:15px;font-weight:700;white-space:nowrap;color:var(--tx);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.12);animation:pop .2s ease-out;font-family:-apple-system,"PingFang SC",sans-serif}
.tip::before{content:"";position:absolute;left:50%;top:-7px;width:10px;height:10px;margin-left:-5px;background:var(--card);border-left:2px solid var(--bd);border-top:2px solid var(--bd);transform:rotate(45deg)}
.zh{font-size:20px;font-weight:700}
/* 拼句 */
.ans{min-height:118px;margin:14px 0 22px;padding:4px 0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 52px,var(--bd) 52px,var(--bd) 54px,transparent 54px,transparent 59px)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:auto;padding-bottom:6px}
.tile{position:relative;border:2px solid var(--bd);border-bottom-width:4px;border-radius:12px;padding:6px 12px;font-size:17px;font-weight:600;background:var(--tile);color:var(--tx);min-height:46px;line-height:1.6;transition:background .15s,border-color .15s,color .15s}
.tile:active{transform:translateY(2px);border-bottom-width:2px;margin-top:2px}
.tile.used{background:var(--ghost);border-color:var(--ghost);color:transparent;pointer-events:none}
/* 选择 */
.chs{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.ch{border:2px solid var(--bd);border-bottom-width:4px;border-radius:14px;padding:12px 16px;font-size:18px;font-weight:600;text-align:left;display:flex;gap:12px;align-items:center;background:var(--card);transition:background .15s,border-color .15s}
.ch .n{width:28px;height:28px;border:2px solid var(--bd);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--tx3);flex:none}
.ch .tx{flex:1;min-width:0}
.ch .x{flex:none;width:30px;height:30px;margin:-4px -6px -4px 0;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--tx3);opacity:.55;transition:opacity .2s,background .2s,transform .2s}
.ch .x:hover{opacity:1;background:var(--bd)}
.ch .x:active{transform:scale(.85)}
.ch .tx{transition:opacity .25s,color .25s;text-decoration:line-through;text-decoration-color:transparent;transition:opacity .25s,text-decoration-color .25s}
.ch.out .tx{opacity:.4;text-decoration-color:currentColor}
.ch.out .n{opacity:.4}
.ch.out .x{opacity:1}
.ch.good .x,.ch.bad .x,.chs.done .x{opacity:0;pointer-events:none}
.ch.sel{border-color:#84d8ff;background:var(--bl);color:var(--bdk)}
.ch.sel .n{border-color:#84d8ff;color:var(--bdk)}
.ch.good{border-color:var(--g);background:var(--gl);color:var(--gt)}
.ch.bad{border-color:var(--r);background:var(--rl);color:var(--rt)}
/* 听力 */
.lis{display:flex;justify-content:center;gap:16px;margin:10px 0 26px}
.big{width:120px;height:110px;border-radius:20px;background:var(--b);box-shadow:0 5px 0 var(--bdk);color:#fff;display:grid;place-items:center}
.big svg{width:56px;height:56px}
.slow{width:76px;height:76px;align-self:flex-end;font-size:34px;border-radius:18px;background:var(--b);box-shadow:0 5px 0 var(--bdk)}
.big:active,.slow:active{transform:translateY(5px);box-shadow:none}
/* 词卡 */
.vc{border:2px solid var(--bd);border-radius:22px;padding:26px 20px;text-align:center;margin:auto 0;background:var(--card)}
.vc .k{font-size:44px;font-weight:800;line-height:1.3;margin:6px 0}
.vc .r{color:var(--tx3);font-size:16px;letter-spacing:1px}
.vc .m{font-size:21px;font-weight:800;margin-top:10px}
.vc .e{color:var(--tx2);font-size:15px;margin-top:12px;padding-top:12px;border-top:2px dashed var(--bd)}
.pts{list-style:none;margin:auto 0;display:flex;flex-direction:column;gap:12px}
.pts li{border:2px solid var(--bd);border-radius:16px;padding:12px 14px 12px 44px;position:relative;font-size:16px;background:var(--card)}
.pts li::before{content:"💡";position:absolute;left:14px;top:12px}
/* 跟读 */
.mic{width:100%;height:72px;border-radius:18px;background:var(--b);box-shadow:0 5px 0 var(--bdk);color:#fff;display:grid;place-items:center;margin-top:auto}
.mic svg{width:30px;height:30px}
.mic.rec{background:var(--r);box-shadow:0 5px 0 var(--rd);animation:pulse .7s ease-in-out infinite alternate}
.heard{text-align:center;color:var(--tx2);font-size:16px;min-height:30px;margin:12px 0}
/* 底部检查栏 + 反馈 */
.dock{position:sticky;bottom:0;margin:0 -18px;padding:14px 18px calc(env(safe-area-inset-bottom) + 18px);border-top:2px solid var(--bd);background:var(--bg);transition:background .25s,border-color .25s}
.ch .cz{display:block;font-size:14px;font-weight:600;color:var(--tx2);margin-top:4px;line-height:1.5;animation:fadeUp .25s ease-out}
.ch.good .cz{color:var(--gt)}.ch.bad .cz{color:var(--rt)}
.tap{cursor:pointer;-webkit-user-select:none;user-select:none}.tap::after{content:'点原文看翻译';display:block;font-size:12px;color:var(--tx3);font-weight:700;margin-top:4px}
.psg.tu{line-height:1.9}.psg .fz{color:var(--gt);border-bottom:2px solid var(--g)}
.tz{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--bl);font-size:16px;line-height:1.8;color:var(--tx)}
.study h2{font-size:24px}.big-go{font-size:20px;padding:18px}
.more-t{display:block;margin:14px auto 0;font-size:14px;font-weight:800;color:var(--tx3);padding:8px 16px}
.more{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s ease,opacity .25s}.more>div{overflow:hidden}.more.on{grid-template-rows:1fr;opacity:1}
.gorow{display:flex;gap:10px}.gorow #go{flex:1}
#idk{flex:0 0 0;max-width:0;padding-left:0;padding-right:0;overflow:hidden;opacity:0;border-width:0;white-space:nowrap;transition:flex-basis .25s,max-width .25s,opacity .2s,padding .25s}
#idk.on{flex:0 0 96px;max-width:96px;padding-left:12px;padding-right:12px;opacity:1;border:2px solid var(--bd);border-bottom-width:4px;border-radius:16px;color:var(--tx2);font-size:16px;letter-spacing:0;background:var(--bg)}
.dock.good{background:var(--gl);border-color:transparent}
.dock.bad{background:var(--rl);border-color:transparent}
.fb{display:none;margin-bottom:12px}
.dock.good .fb,.dock.bad .fb{display:block;animation:fadeUp .25s ease-out}
.fb h4{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.dock.good .fb h4{color:var(--gt)}.dock.bad .fb h4{color:var(--rt)}
.fb .ca{font-size:17px;color:var(--rt);margin-top:2px;line-height:1.6}
.fb .ca b{display:block;font-size:15px}
.fb .ca .ko{font-size:16px;opacity:.85}
/* 完成页 */
#done{text-align:center;padding-top:calc(env(safe-area-inset-top) + 60px)}
#done .big-e{font-size:84px;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
#done h2{font-size:28px;font-weight:900;color:var(--o);margin:10px 0 26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px}
.st{border:2px solid;border-radius:16px;overflow:hidden;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.st:nth-child(2){animation-delay:.12s}.st:nth-child(3){animation-delay:.24s}
.st small{display:block;color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;padding:3px}
.st b{display:block;font-size:22px;padding:10px 4px;background:var(--card)}
.st.a{border-color:var(--o)}.st.a small{background:var(--o)}.st.a b{color:var(--o)}
.st.b{border-color:var(--g)}.st.b small{background:var(--g)}.st.b b{color:var(--g)}
.st.c{border-color:var(--b)}.st.c small{background:var(--b)}.st.c b{color:var(--b)}
.wl{text-align:left;margin-bottom:24px}
.wl div{border:2px solid var(--bd);border-radius:14px;padding:8px 14px;margin-bottom:8px;font-size:16px}
.wl div span{display:block;color:var(--tx2);font-size:14px}
/* 弹窗 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}

    ${L2.lv > lvBefore ? `<div class="burst lvup">⭐ 升到 Lv ${L2.lv}</div>` : ''}
    ${dayBefore < ST.goal && ST.dayXp >= ST.goal ? `<div class="burst goal">🎯 今日目标达成<small>🔥 连续 ${ST.streak} 天</small></div>` : ''}
    <div class="stats"><div class="st a"><small>经验</small><b>+${xp}</b></div><div class="st b"><small>正确率</small><b>${acc}%</b></div><div class="st c"><small>最长连对</small><b>${W.best}</b></div></div>
    <div class="reward"><div class="r"><span>认识 ${m.known} · 掌握 ${m.done} / ${m.all} 词</span><em>${W.newM ? '这轮新掌握 ' + W.newM : ''}</em></div><div class="wbar"><i class="kn" id="wmFill" style="width:${W.knB / m.all * 100}%" data-w="${m.known / m.all * 100}"></i><i class="ms" style="width:${m.done / m.all * 100}%"></i></div><div class="wleg"><span><i class="kn"></i>认识（这轮 +${m.known - W.knB}）</span><span><i class="ms"></i>掌握（隔天还记得）</span>${W.chOk ? `<span>🔥 挑战成功 ${W.chOk} 个</span>` : ''}</div>
    <div class="r" style="margin-top:8px"><span>今日 ${ST.dayXp} / ${ST.goal} XP</span><em>${ST.dayXp >= ST.goal ? '达标 ✓' : '还差 ' + (ST.goal - ST.dayXp)}</em></div></div>
    ${(() => { const okRt = W.log.filter(x => x.ok).map(x => parseFloat(x.a.split(' · ').pop())).filter(v => v < 30), avg = okRt.length ? (okRt.reduce((a, b) => a + b, 0) / okRt.length).toFixed(1) : 0, sl = [...new Map(W.slow.map(x => [x.k, x])).values()]; return `<div class="reward"><div class="r"><span>平均反应 ${avg} 秒</span><em>秒认 = 3 秒内自己翻开</em></div>${sl.length ? `<div class="wslow">${sl.map(x => `<span><b class="ko">${esc(x.k)}</b> ${esc(WBY[x.k].z)} <i>${x.fz ? '蒙的' : (x.rt / 1000).toFixed(1) + 's'}</i></span>`).join('')}</div><small style="color:var(--tx3);font-size:13px">这些是等选项出来才想起来的，10 分钟后会再出</small>` : ''}</div>`; })()}
    ${nextHtml()}
    ${planNext() && planNext().k !== 'w' ? '<button class="btn green" id="wdNx">开始下一步</button><button class="btn ghost" id="wdMore">再刷一轮词</button>' : '<button class="btn green" id="wdMore">' + (planNext() ? `再刷 ${WGOAL - Math.min(WGOAL, ST.wDay.n)} 个完成第 1 步` : '再刷一轮') + '</button>'}<button class="btn ghost" id="back">回首页</button>`;
  W = null; show('done'); sfx(true, L2.lv > lvBefore || (dayBefore < ST.goal && ST.dayXp >= ST.goal) ? 'big' : 'win');
  setTimeout(() => { const e = $('wmFill'); if (e) e.style.width = e.dataset.w + '%'; }, 300);
  $('wdMore').onclick = wdStart; if ($('wdNx')) $('wdNx').onclick = () => planNext().go(); $('back').onclick = () => { show('home'); renderHome(); };
}
$('wdQuit').onclick = wdEnd;
document.addEventListener('keydown', e => {   // 刷词快捷键：1–4 选，回车 / 0 = 不会或继续，空格 = 再听一遍，Esc = 结束
  if (!W || !$('wd').classList.contains('on') || e.metaKey || e.ctrlKey) return;
  if (/^[1-4]$/.test(e.key) && W.cur.hid) { e.preventDefault(); wdReveal(); }
  else if (/^[1-4]$/.test(e.key)) { const b = document.querySelectorAll('.wo')[+e.key - 1]; if (b) { e.preventDefault(); b.click(); } }
  else if (e.key === 'Enter' || e.key === '0') { e.preventDefault(); if (W.cur.hid && e.key === 'Enter') wdReveal(); else $('wdIdk').click(); }
  else if (e.key === ' ') { e.preventDefault(); if (W.cur.done) wdShow(); else if (W.cur.hid) wdReveal(); else if (!W.cur.rev) say(W.cur.k, 1); }   // 空格：答完 = 继续，盖着 = 翻开
  else if (e.key === 'f' || e.key === 'F') { if (W.cur.done) { e.preventDefault(); wdFuzzy(); } }
  else if (e.key === 'Escape') wdEnd();
});

function finish() {
  const sec = Math.round((Date.now() - S.t0) / 1000), firstVals = Object.values(S.first), n = firstVals.length, okN = firstVals.filter(Boolean).length;
  const acc = n ? Math.round(okN / n * 100) : 100, xp = 10 + okN + (n && okN === n ? 5 : 0), t = today();
  // 连续天数
  if (ST.last !== t) { ST.streak = ST.last === today(Date.now() - DAY) ? ST.streak + 1 : 1; ST.last = t; }
  if (ST.day !== t) { ST.day = t; ST.dayXp = 0; }
  const dayBefore = ST.dayXp, lvBefore = lvInfo(ST.xp).lv;
  ST.xp += xp; ST.dayXp += xp;
  const L2 = lvInfo(ST.xp), goalHit = dayBefore < ST.goal && ST.dayXp >= ST.goal, lvUp = L2.lv > lvBefore;
  if (S.mode === 'daily' || S.mode === 'study') { ST.dailyDone = DAILY.date; pDay().s++; }
  else if (/^(sec|type)-/.test(S.mode)) pDay().x++;
  else if (S.mode === 'gram') {
    pDay().g = (pDay().g || 0) + 1;
    const g = S.items[0] && S.items[0].g;
    if (g) { const own = Object.entries(S.first).filter(([id]) => id.startsWith('G:' + g.id + ':')), okc = own.filter(([, v]) => v).length; ST.gm = ST.gm || {}; ST.gm[g.id] = okc + '/' + own.length; if (own.length && okc / own.length >= 0.8 && !(ST.gmPass || []).includes(g.id)) { ST.gmPass = (ST.gmPass || []).concat(g.id); S.gPassed = g.name; } }
  }
  else if (LBY[S.mode]) ST.done[S.mode] = (ST.done[S.mode] || 0) + 1;
  mAdd(sec);
  // 间隔复习：错了马上进复习；复习里答对一次，间隔 1→3→7→14 天，满了就移出
  const GAP = [1, 3, 7, 14];
  for (const [id, ok] of Object.entries(S.first)) {
    const r = ST.srs[id];
    if (!ok) ST.srs[id] = { box: 0, due: Date.now(), n: (r ? r.n : 0) + 1 };
    else if (r) { if (r.box >= GAP.length) delete ST.srs[id]; else ST.srs[id] = { ...r, box: r.box + 1, due: Date.now() + GAP[r.box] * DAY }; }
  }
  const fz = Object.keys(S.fz || {}).filter(id => S.first[id]);
  fz.forEach(id => { const r = ST.srs[id]; ST.srs[id] = { box: 0, due: Date.now() + DAY, n: (r ? r.n : 0) + 1, fz: 1 }; });
  let estHtml = '';
  const predBefore = predict();
  S.log.forEach(x => { if (x.t === 'tq') abAdd(x.id, x.ok); }); predMark();
  const predAfter = predict();
  ST.typ = ST.typ || {};
  S.log.forEach(x => { const q = TBY[x.id]; if (q) ST.typ[q.no] = (ST.typ[q.no] || []).concat(x.ok && !x.fz ? 1 : 0).slice(-10); });   // 模糊的算弱项
  const missNo = {}; S.log.forEach(x => { const q = TBY[x.id]; if (q && !x.ok) missNo[q.no] = (missNo[q.no] || 0) + 1; });
  const focus = Object.entries(missNo).sort((a, b) => b[1] - a[1]).map(([no]) => no).filter(no => TQ.filter(q => q.no === no).length >= 2)[0];
  const before = tier();
  if (S.mode === 'place') {   // 定级：从 1 级往上，哪一级 4 题错 2 题以上就停在那一级
    let lv = 1; for (const L of [1, 2, 3]) { const l = S.log.filter(x => TBY[x.id] && lvOf(TBY[x.id]) === L); if (l.filter(x => x.ok).length >= 3) lv = Math.min(L + 1, maxTier()); else break; }
    ST.tier = lv; ST.placed = t; ST.lvh = [];
    estHtml = `<div class="hero topik" style="text-align:left"><div class="meta">分级测试</div><div class="cd"><b>${lv}</b> 级题起步<span>${TIERS[lv]}　同级 8 题对 7 题自动升级</span></div></div>`;
  } else {
    ST.lvh = (ST.lvh || []).concat(S.log.filter(x => TBY[x.id] && TBY[x.id].sec !== 'W').map(x => ({ lv: lvOf(TBY[x.id]), ok: x.ok ? 1 : 0 }))).slice(-40);
    const cur = ST.lvh.filter(x => x.lv === before).slice(-8), okc = cur.filter(x => x.ok).length;
    if (cur.length >= 8 && okc >= 7 && before < maxTier()) { ST.tier = before + 1; ST.lvh = []; }
    else if (before > 1 && cur.length >= 6 && cur.slice(-6).filter(x => x.ok).length <= 2) { ST.tier = before - 1; ST.lvh = []; }
    if (tier() !== before) estHtml = `<div class="hero topik" style="text-align:left"><div class="meta">${tier() > before ? '升级了' : '先退一级打稳'}</div><div class="cd"><b>${tier()}</b> 级题<span>${TIERS[tier()]}</span></div></div>`;
  }
  if (S.mode === 'mock') {   // 估分：听力 / 阅读按正确率 × 100，写作只算 51–52 的比例（满分 20）再按 53–54 同水平外推
    const acc = sec2 => { const l = S.log.filter(l => TBY[l.id] && TBY[l.id].sec === sec2); return l.length ? l.filter(x => x.ok).length / l.length : 0; };
    const L = Math.round(acc('L') * 100), R = Math.round(acc('R') * 100), W = Math.round(acc('W') * 20 + acc('W') * 25);
    ST.est = { L, R, W, total: L + R + W, day: t };
    estHtml = `<div class="hero topik" style="text-align:left"><div class="meta">估分（16 题，只能当方向）</div><div class="cd"><b>${L + R + W}</b> 分<span>听力 ${L} · 阅读 ${R} · 写作约 ${W}　目标 ${EXAM.goalScore}</span></div></div>`;
  }
  save();
  push({ lesson: S.mode, dur: sec, xp, items: S.log });
  const wrong = S.log.filter(l => !l.ok);
  $('done').innerHTML = `<div class="big-e">${acc === 100 ? '🏆' : acc >= 80 ? '🎉' : '💪'}</div>
    <h2>${acc === 100 ? '全对！' : '这组练完了'}</h2>
    ${lvUp ? `<div class="burst lvup">⭐ 升到 Lv ${L2.lv}<small>下一级还要 ${L2.need} XP</small></div>` : ''}
    ${goalHit ? `<div class="burst goal" style="animation-delay:${lvUp ? '.25s' : '0s'}">🎯 今日目标达成<small>🔥 连续 ${ST.streak} 天</small></div>` : ''}
    <div class="stats"><div class="st a"><small>经验</small><b id="xpUp">+0</b></div><div class="st b"><small>正确率</small><b>${acc}%</b></div><div class="st c"><small>用时</small><b>${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}</b></div></div>
    <div class="reward"><div class="r"><span>今日 ${ST.dayXp} / ${ST.goal} XP</span><em>${ST.dayXp >= ST.goal ? '达标 ✓' : '还差 ' + (ST.goal - ST.dayXp)}</em></div>
      <div class="gbar${ST.dayXp >= ST.goal ? ' full' : ''}"><i id="dgFill" style="width:${Math.min(100, dayBefore / ST.goal * 100)}%" data-w="${Math.min(100, ST.dayXp / ST.goal * 100)}"></i></div>
      <div class="r" style="margin-top:6px"><span>Lv ${L2.lv}</span><em>${L2.cur} / ${L2.need} XP</em></div>
      <div class="lbar"><i id="dlFill" style="width:${lvUp ? 0 : (L2.cur - xp) / L2.need * 100}%" data-w="${L2.cur / L2.need * 100}"></i></div></div>
    ${predAfter && predBefore && predAfter.rank.i > predBefore.rank.i ? `<div class="burst lvup">🏅 升段：${predAfter.rank.name}<small>${predAfter.rank.tag || '离考过更近一步'}</small></div>` : ''}
    ${predAfter ? (() => { const d = predBefore ? predAfter.II - predBefore.II : 0; return `<div class="pdone"><small>TOPIK II 预测分</small><b id="pdN" data-from="${predBefore ? predBefore.II : predAfter.II}" data-to="${predAfter.II}">${predBefore ? predBefore.II : predAfter.II}</b><span class="${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${d > 0 ? '↑ ' + d : d < 0 ? '↓ ' + (-d) : '持平'}</span><em>${predAfter.II >= 150 ? '已到 4 级线' : predAfter.II >= 120 ? '离 4 级还差 ' + (150 - predAfter.II) + ' 分' : '离 3 级还差 ' + (120 - predAfter.II) + ' 分'}</em></div>`; })() : ''}
    ${estHtml}
    ${S.gPassed ? `<div class="burst lvup">📘 语法过关：<span class="ko">${esc(S.gPassed)}</span><small>3 级语法 ${(ST.gmPass || []).length} / ${GR().length} · 明天学下一个</small></div>` : S.mode === 'gram' && S.items[0] && S.items[0].g ? `<div class="sec" style="text-align:left">这课 ${ST.gm[S.items[0].g.id]}，八成对才算过关，明天再来一次</div>` : ''}
    ${fz.length ? `<div class="sec" style="text-align:left">🤔 ${fz.length} 道模糊的题，明天再考一次</div>` : ''}
    ${wrong.length ? `<div class="sec" style="text-align:left">这几题进了错题复习</div><div class="wl">${wrong.map(w => `<div class="ko">${esc(w.k)}</div>`).join('')}</div>` : ''}
    ${focus && !S.mode.startsWith('type-') ? `<div class="hero rev" style="text-align:left"><div class="meta">这组错得最多</div><h2>${esc(NO[focus] || focus)}</h2><p>先看 3 条解题方法，再专门刷这一类</p><button class="btn blue" id="goFocus">专项突破</button></div>` : ''}
    ${nextHtml()}
    <button class="btn green" id="back">继续</button>${planNext() ? '<button class="btn ghost" id="backH">回首页</button>' : ''}`;
  $('back').onclick = () => { S = null; show('home'); renderHome(); };
  bindNext($('back')); if ($('backH')) $('backH').onclick = () => { S = null; show('home'); renderHome(); };
  if ($('goFocus')) $('goFocus').onclick = () => start('type-' + focus, buildType(focus));
  show('done'); sfx(true, lvUp || goalHit || S.gPassed ? 'big' : 'win');
  setTimeout(() => { ['dgFill', 'dlFill'].forEach(id => { const e = $(id); if (e) e.style.width = e.dataset.w + '%'; }); }, 300);
  const t0 = performance.now(), up = now => { const k = Math.min(1, (now - t0) / 700), e = $('xpUp'); if (!e) return; e.textContent = '+' + Math.round(xp * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(up); };
  requestAnimationFrame(up);
  const pd = $('pdN'); if (pd && pd.dataset.from !== pd.dataset.to) { const a = +pd.dataset.from, b = +pd.dataset.to; setTimeout(() => { const t1 = performance.now(), f = now => { const k = Math.min(1, (now - t1) / 900); pd.textContent = Math.round(a + (b - a) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); else pd.classList.add('bump'); }; requestAnimationFrame(f); }, 500); }
}

if (!ST.capInit) { ST.cap = 2; ST.capInit = 1; if ((ST.tier || 1) > 2) ST.tier = 2; try { localStorage.setItem('ko:st', JSON.stringify(ST)); } catch (e) {} }   // 不改 ts，免得盖过云端   // 11-26：先把初级做熟
if (!ST.regFix) { ST.topikReg = 0; ST.regFix = 1; try { localStorage.setItem('ko:st', JSON.stringify(ST)); } catch (e) {} }   // 11/25 误点「我已报名」，清掉一次
if (ST.predV !== 2) { ST.predV = 2; ST.pred = []; }   // 11-26 预测分换成保守版，旧的曲线作废
predMark(); try { localStorage.setItem('ko:st', JSON.stringify(ST)); } catch (e) {}
renderHome(); pull().then(() => { if (pending.length) push(); });
if (/[?&]go=daily/.test(location.search)) { history.replaceState(null, '', location.pathname); (planNext() || { go: () => start('study', buildStudy()) }).go(); }   // 推送点进来直接开始第一题
</script>
