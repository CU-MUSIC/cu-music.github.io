<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>Auto Level · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* 说唱预设的分轨预处理：切无声段 → 每段统一响度 → 和声成对的自动左右 pan → 整体试听 → 主人声 / 伴奏 ±3 dB → 导出。
   全部在浏览器本地算。配色沿用主厨之选（#080808 / 劳力士绿），版式是「分轨列表 + 底部调音条」 */
:root{
  --bg:#080808; --surface:#111; --lift:#161616; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --text:#f0f0f0; --text-2:#9a9a9a; --text-3:#6f6f6f;
  --rolex:#1f8a5b; --rolex-2:#2fae7a; --mint:#8fc3a9; --amber:#d9b36c; --warn:#d99;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.36,.64,1); --r:14px;
  --font:-apple-system,"SF Pro Text","Helvetica Neue","PingFang SC",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:16px/1.7 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding:0 max(18px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right));transition:padding-bottom .5s var(--ease)}
body.mix{padding-bottom:calc(196px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
main{max-width:600px;margin:0 auto}

/* 顶栏 */
.top{display:flex;align-items:center;gap:10px;height:64px;padding-top:env(safe-area-inset-top);animation:fade .8s var(--ease) both}
.top svg{width:22px;height:22px}
.top svg path{fill:none;stroke:var(--text);stroke-width:42;stroke-linecap:round}
.top b{font-size:15px;font-weight:600;letter-spacing:.01em}
.top i{width:6px;height:6px;border-radius:50%;background:var(--rolex-2);box-shadow:0 0 0 4px rgba(47,174,122,.16)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}

/* 拖入区：没文件时是大块，有文件后收成一行 */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-top:28px;height:220px;border-radius:20px;
  border:1px dashed var(--line-2);background:radial-gradient(120% 90% at 50% 0%,rgba(31,138,91,.10),transparent 60%),var(--surface);
  transition:height .55s var(--ease),margin .55s var(--ease),border-color .3s,background-color .3s;animation:up .9s var(--ease) .1s both;cursor:pointer;overflow:hidden}
.drop:hover,.dragging .drop{border-color:rgba(143,195,169,.55)}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop .ring{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:22px;line-height:1;color:var(--text-2);transition:transform .5s var(--spring),border-color .3s,width .55s var(--ease),height .55s var(--ease)}
.drop:hover .ring{transform:rotate(90deg);border-color:var(--mint);color:var(--mint)}
.drop h2{font-size:20px;font-weight:600;letter-spacing:-.01em;transition:font-size .55s var(--ease)}
.drop p{font:500 11px var(--mono);letter-spacing:.2em;color:var(--text-3);transition:opacity .3s}
.has .drop{height:56px;margin-top:8px;flex-direction:row;gap:12px;border-style:solid;border-color:var(--line);background:var(--surface)}
.has .drop .ring{width:26px;height:26px;font-size:15px}
.has .drop h2{font-size:15px;font-weight:500;color:var(--text-2)}
.has .drop p{display:none}
.busy .drop{pointer-events:none;opacity:.5}

/* 分轨 */
.tracks{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.trk{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;animation:up .6s var(--ease) both;animation-delay:calc(var(--k,0) * 50ms);transition:border-color .3s,opacity .3s}
.trk.out{animation:gone .35s var(--ease) forwards}
@keyframes gone{to{opacity:0;transform:scale(.98)}}
.trk.soloed{border-color:rgba(143,195,169,.5)}
.trk.muted{opacity:.45}
.th{display:flex;align-items:center;gap:10px}
.nm{flex:1;min-width:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{margin-top:2px;font:500 11.5px var(--mono);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sub.res{color:var(--text-2);animation:swap .5s var(--ease)}
.sub.res i{font-style:normal;color:var(--amber)}
.sub.bad{color:var(--warn)}
@keyframes swap{from{opacity:0;transform:translateY(3px)}}
.x{flex:none;width:28px;height:28px;border-radius:50%;color:var(--text-3);font-size:18px;line-height:28px;transition:color .2s,background .2s}
.x:hover{color:var(--text);background:rgba(255,255,255,.06)}
.busy .x,.mix .x{display:none}
/* 角色 */
.seg{position:relative;flex:none;display:flex;padding:2px;border-radius:9px;background:rgba(255,255,255,.05);transition:box-shadow .3s}
.seg.need{box-shadow:0 0 0 1px rgba(217,153,153,.6)}
.seg button{position:relative;z-index:1;width:44px;height:26px;border-radius:7px;font:600 10.5px/26px var(--mono);letter-spacing:.06em;color:var(--text-3);transition:color .3s var(--ease)}
.seg button[aria-pressed=true]{color:#fff}
.seg .k{position:absolute;top:2px;left:2px;width:44px;height:26px;border-radius:7px;background:var(--rolex);opacity:0;transform:translateX(calc(var(--n,0) * 44px));transition:transform .45s var(--spring),opacity .3s}
.seg.set .k{opacity:1}
.busy .seg{pointer-events:none}
/* 处理后才出现：声像、独奏 */
.pan,.solo{flex:none;height:26px;border-radius:7px;font:600 10.5px/26px var(--mono);letter-spacing:.06em;color:var(--text-2);background:rgba(255,255,255,.05);
  display:none;animation:pop .4s var(--spring)}
.pan{padding:0 9px}
.solo{width:28px}
.mix .solo{display:block}
.mix .pan.on{display:block}
.pan.on{color:var(--mint)}
.solo[aria-pressed=true]{background:var(--mint);color:#08110c}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
/* 进度细线 */
.pg{position:absolute;left:14px;right:14px;bottom:0;height:2px;overflow:hidden;border-radius:2px}
.pg i{display:block;height:100%;width:0;background:var(--text);transition:width .3s var(--ease)}
.done .pg i{opacity:0;transition:opacity .6s var(--ease) .3s}
/* 波形 + 断点 */
.wv{position:relative;height:0;margin-top:0;opacity:0;cursor:pointer;transition:height .5s var(--ease),margin-top .5s var(--ease),opacity .6s var(--ease) .1s}
.wv.on{height:40px;margin-top:10px;opacity:1}
.wv canvas{display:block;width:100%;height:40px}
.ph{position:absolute;top:-2px;bottom:-2px;left:0;width:1.5px;margin-left:-.75px;background:var(--text);opacity:0;pointer-events:none;transition:opacity .2s}
.playing .ph{opacity:1}
.ct{position:absolute;top:-4px;bottom:-4px;width:15px;margin-left:-7.5px;padding:0;z-index:2}
.ct::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:rgba(143,195,169,.45)}
.ct.join::before{background:none;border-left:1px dashed rgba(143,195,169,.7)}
.ct.frag::before{top:12px;bottom:12px}
.ct::after{content:"";position:absolute;left:5px;top:0;width:5px;height:5px;border-radius:50%;background:var(--mint);opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring)}
.ct:hover::after{opacity:1;transform:none}
.ct.risk::before{background:var(--amber);width:1.5px}
.ct.risk::after{background:var(--amber);opacity:1;transform:none;box-shadow:0 0 0 3px rgba(217,179,108,.2)}

/* 处理按钮：进度直接长在按钮里 */
.go{position:relative;display:block;width:100%;height:52px;margin-top:16px;border-radius:var(--r);background:var(--text);color:#0a0a0a;font-size:16px;font-weight:600;overflow:hidden;
  transition:transform .15s var(--ease),opacity .4s,max-height .5s var(--ease),margin .5s var(--ease);max-height:52px}
.go:active{transform:scale(.985)}
.go[disabled]{opacity:.3;cursor:default}
.go .bar{position:absolute;inset:0;width:0;background:var(--rolex);transition:width .3s var(--ease)}
.go span{position:relative}
.go.run{background:#1a1a1a;color:var(--text);opacity:1}
.mix .go{max-height:0;margin-top:0;opacity:0;pointer-events:none}
.hide{display:none}
.err{min-height:1.4em;margin-top:10px;text-align:center;font-size:13px;color:var(--warn)}

/* 底部调音条 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px max(18px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom));
  background:rgba(12,12,12,.86);-webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px);border-top:1px solid var(--line);
  transform:translateY(110%);transition:transform .6s var(--ease)}
.mix .dock{transform:none}
.dock .in{max-width:600px;margin:0 auto}
.tp{display:flex;align-items:center;gap:12px}
.play{flex:none;width:44px;height:44px;border-radius:50%;background:var(--text);color:#0a0a0a;display:grid;place-items:center;transition:transform .2s var(--spring)}
.play:active{transform:scale(.92)}
.play svg{width:15px;height:15px;fill:currentColor}
.ov{position:relative;flex:1;height:34px;cursor:pointer;touch-action:none}
.ov canvas{display:block;width:100%;height:34px}
.ov .ph{opacity:1}
.tm{flex:none;font:500 11.5px var(--mono);color:var(--text-2);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.ctl{display:grid;grid-template-columns:1fr 1fr auto;gap:18px;align-items:center;margin-top:12px}
.fd{min-width:0}
.fd .lb{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);line-height:1}
.fd .lb b{font:600 11.5px var(--mono);color:var(--text);font-variant-numeric:tabular-nums;transition:color .2s}
.fd .lb b.z{color:var(--text-3)}
.fd input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:24px;margin-top:4px;background:transparent;cursor:pointer;--p:50%}
.fd input::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:
  linear-gradient(to right,transparent calc(50% - 1px),rgba(255,255,255,.35) calc(50% - 1px),rgba(255,255,255,.35) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(to right,rgba(255,255,255,.12) min(50%,var(--p)),var(--rolex-2) min(50%,var(--p)),var(--rolex-2) max(50%,var(--p)),rgba(255,255,255,.12) max(50%,var(--p)))}
.fd input::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.12)}
.fd input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#f0f0f0;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .2s var(--spring)}
.fd input:active::-webkit-slider-thumb{transform:scale(1.15)}
.fd input::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#f0f0f0}
.dl{flex:none;height:40px;padding:0 18px;border-radius:12px;background:var(--rolex);color:#fff;font-size:14px;font-weight:600;transition:transform .15s var(--ease),background .3s}
.dl:active{transform:scale(.97)}
.dl[disabled]{opacity:.5}
@media (max-width:520px){ .ctl{grid-template-columns:1fr 1fr} .dl{grid-column:1/-1;width:100%} body.mix{padding-bottom:calc(244px + env(safe-area-inset-bottom))} }

#dz{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,8,8,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
#dz::before{content:"";position:absolute;inset:16px;border:1px dashed rgba(143,195,169,.5);border-radius:24px}
#dz p{font-size:15px;color:var(--text-2)}
.dragging #dz{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<header class="top">
  <svg viewBox="272 164 456 456" aria-hidden="true"><path d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></svg>
  <b>Auto Level</b><i></i>
</header>

<label class="drop" id="drop"><input type="file" id="pick" multiple accept=".wav,.wave,.aif,.aiff,.aifc,audio/*">
  <span class="ring">+</span><h2>拖入分轨</h2><p>WAV · AIFF</p></label>
<div class="tracks" id="tracks"></div>
<button class="go hide" id="go"><i class="bar"></i><span>处理</span></button>
<p class="err" id="err"></p>
</main>

<div class="dock" id="dock"><div class="in">
  <div class="tp">
    <button class="play" id="play" aria-label="播放"></button>
    <div class="ov" id="ov"><canvas></canvas><i class="ph"></i></div>
    <span class="tm" id="tm">0:00 / 0:00</span>
  </div>
  <div class="ctl">
    <div class="fd"><div class="lb"><span>主人声</span><b id="vLV" class="z">0</b></div><input type="range" id="fLV" min="-3" max="3" step="0.5" value="0"></div>
    <div class="fd"><div class="lb"><span>伴奏</span><b id="vINST" class="z">0</b></div><input type="range" id="fINST" min="-3" max="3" step="0.5" value="0"></div>
    <button class="dl" id="dl">下载</button>
  </div>
</div></div>
<div id="dz"><p>松开即可添加</p></div>

<script>
(() => {
'use strict';
// ── 参数 ──────────────────────────────────────────────────────
const TARGET = { LV: -23, BV: -23, INST: -20 };   // 伴奏比人声大 3 dB
const ROLES = ['LV', 'BV', 'INST'];
const GATE_DB = -50;      // 有声门限的中心值：实际 = 底噪 + 15 dB，夹在 -60…-40
const MIN_GAP = 0.5;      // 无声超过 0.5 秒才切开
const PAD_SAFE = 0.05;    // 尾音真正收干净之后再多留 50ms
const MIN_PHRASE = 0.35;  // 有声不到 0.35 秒算碎片（呼吸、喷麦、咔哒），不单独拉响度
const FADE = 0.01;        // 静音断点 10ms 淡入淡出
const RAMP = 0.02;        // 连接点前后各 20ms 增益渐变
const CEIL = Math.pow(10, -1 / 20);   // 限峰 -1 dBFS
const MAX_GAIN = 30;      // 单段最多提 30 dB
const BV_PAN = 0.5;       // 成对和声左右各 50
const PAIR_SIM = 0.7;     // 两轨和声有声位置重合 70% 以上算一对

const $ = s => document.querySelector(s);
const box = $('#tracks'), go = $('#go'), err = $('#err'), pick = $('#pick'), B = document.body;
const tick = () => new Promise(r => setTimeout(r, 0));
const dbl = d => Math.pow(10, d / 20);
const fmtT = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const ICON_PLAY = '<svg viewBox="0 0 12 12"><path d="M2.5 1l8.5 5-8.5 5z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';
let tracks = [], busy = false, mixed = false;
const off = { LV: 0, INST: 0 };

// ── 命名识别 ──────────────────────────────────────────────────
function guess(name) {
  const n = name.toLowerCase().replace(/\.[^.]+$/, '');
  if (/(^|[^a-z])(bv|bgv|bvs|backing|back|harm|harmony|double|dbl|dub|adlib|ad[\s_-]?lib|hype|stack|oct)([^a-z]|$)|和声|叠|垫|辅唱/.test(n)) return 'BV';
  if (/(^|[^a-z])(inst|instrumental|beat|beats|karaoke|2trk|2mix|伴奏)([^a-z]|$)|伴奏|^beat/.test(n)) return 'INST';
  if (/(^|[^a-z])(lv|lead|main|vox|vocal|vocals|voc|verse|hook|chorus)([^a-z]|$)|主唱|主人声|人声|主歌/.test(n)) return 'LV';
  return null;
}
const sideHint = name => { const n = name.replace(/\.[^.]+$/, ''); return /(^|[\s_\-(.])(l|left|左)([\s_\-).]|$)/i.test(n) ? -1 : /(^|[\s_\-(.])(r|right|右)([\s_\-).]|$)/i.test(n) ? 1 : 0; };

// ── 列表 ──────────────────────────────────────────────────────
function add(files) {
  if (busy) return;
  if (mixed) unmix();
  let k = 0;
  for (const f of files) {
    if (tracks.some(t => t.file.name === f.name && t.file.size === f.size)) continue;
    const t = { file: f, role: guess(f.name), pan: 0, solo: false };
    const el = document.createElement('div');
    el.className = 'trk'; el.style.setProperty('--k', k++);
    el.innerHTML = `<div class="th"><div class="seg"><i class="k"></i>${ROLES.map(r => `<button data-r="${r}" aria-pressed="false">${r}</button>`).join('')}</div>
      <div class="nm"></div><button class="pan" title="左右互换"></button><button class="solo" aria-pressed="false" title="独奏">S</button><button class="x" aria-label="移除">×</button></div>
      <div class="sub">读取中</div><div class="wv"></div><div class="pg"><i></i></div>`;
    el.querySelector('.nm').textContent = f.name;
    el.querySelector('.x').onclick = () => remove(t);
    el.querySelectorAll('.seg button').forEach(b => b.onclick = () => { if (t.role === b.dataset.r) return; t.role = b.dataset.r; setRole(t); if (mixed) unmix(); });
    el.querySelector('.solo').onclick = () => { t.solo = !t.solo; applyGains(); };
    el.querySelector('.pan').onclick = () => swapPan(t);
    t.el = el; setRole(t); box.appendChild(el); tracks.push(t);
    probe(t);
  }
  sync();
}
function setRole(t) {
  const seg = t.el.querySelector('.seg'), n = ROLES.indexOf(t.role);
  seg.classList.toggle('set', n >= 0); seg.classList.remove('need');
  if (n >= 0) seg.style.setProperty('--n', n);
  seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.r === t.role));
}
function remove(t) {
  if (busy) return;
  t.el.classList.add('out');
  setTimeout(() => { t.el.remove(); tracks = tracks.filter(x => x !== t); sync(); }, 340);
}
function sync() {
  B.classList.toggle('has', tracks.length > 0);
  go.classList.toggle('hide', !tracks.length);
  go.disabled = busy || !tracks.length;
  if (!tracks.length) err.textContent = '';
}
async function probe(t) {
  const m = t.el.querySelector('.sub');
  try {
    const h = parseHeader(await t.file.slice(0, 1 << 16).arrayBuffer(), t.file.size);
    t.info = h ? `${fmtT(h.frames / h.sr)} · ${Math.round(h.sr / 100) / 10}k · ${h.ch === 1 ? 'Mono' : h.ch === 2 ? 'Stereo' : h.ch + 'ch'}` : '—';
  } catch { t.info = '—'; }
  m.className = 'sub'; m.textContent = t.info;
}
pick.onchange = () => { add(pick.files); pick.value = ''; };
let dragN = 0;
addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { dragN++; B.classList.add('dragging'); } });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; B.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; B.classList.remove('dragging'); if (e.dataTransfer.files.length) add(e.dataTransfer.files); });

// ── 处理 ──────────────────────────────────────────────────────
const goTxt = go.querySelector('span'), goBar = go.querySelector('.bar');
go.onclick = async () => {
  const miss = tracks.filter(t => !t.role);
  if (miss.length) { miss.forEach(t => t.el.querySelector('.seg').classList.add('need')); err.textContent = `${miss.length} 轨未标记 LV / BV / INST`; return; }
  err.textContent = ''; busy = true; B.classList.add('busy'); go.classList.add('run'); goTxt.textContent = '处理中';
  for (let i = 0; i < tracks.length; i++) {
    const t = tracks[i], m = t.el.querySelector('.sub'), bar = t.el.querySelector('.pg i');
    t.el.classList.remove('done'); t.res = null;
    const step = f => { bar.style.width = (f * 100) + '%'; goBar.style.width = ((i + f) / tracks.length * 100) + '%'; };
    step(.02);
    try {
      const au = await decode(t.file); step(.2);
      const r = await level(au, t.role, f => step(.2 + f * .75));
      t.res = { data: r.data, sr: au.sr, ch: au.ch, n: au.n, dur: au.n / au.sr, cuts: r.cuts || [], segsAt: r.segsAt || [], segs: r.segs };
      t.pk = peaks(r.data, 720);

// ── 读文件：WAV / AIFF 自己解析（保留原采样率和长度，拖回去对得上）；其他格式交给浏览器 ──
