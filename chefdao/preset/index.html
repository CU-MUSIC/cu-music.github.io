<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>Auto Level · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
/* Auto Level：说唱预设的分轨预处理。切无声段 → 每段统一响度 → 试听（成对和声左右分开只用于试听）→ 主人声 / 伴奏 ±3、和声整体 -6/-9/-12 → 导出单声道。
   本地处理不上传；下载时把最终的调整记到 stats Worker（/preset/log）。配色沿用主厨之选 */
:root{
  --bg:#080808; --s1:#0f0f0f; --s2:#141414; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --text:#f2f2f0; --text-2:#a3a3a0; --text-3:#6b6b69;
  --rolex:#1f8a5b; --rolex-2:#2fae7a; --mint:#8fc3a9; --amber:#d9b36c; --warn:#d99;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.36,.64,1);
  --font:-apple-system,"SF Pro Text","Helvetica Neue","PingFang SC",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:16px/1.7 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;letter-spacing:.005em}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.cu{display:block;overflow:visible}
.cu path{fill:none;stroke:currentColor;stroke-width:40;stroke-linecap:round}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}

/* ── 密码 ── */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:var(--bg);transition:opacity .6s var(--ease),visibility .6s}
.gate::before{content:"";position:absolute;left:50%;top:38%;width:640px;height:640px;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(31,138,91,.13),rgba(31,138,91,.03) 40%,transparent 66%)}
.gate.off{opacity:0;visibility:hidden}
.gate .in{position:relative;width:100%;max-width:320px;text-align:center}
.gate .cu{width:48px;height:48px;margin:0 auto;color:var(--text);animation:up 1s var(--ease) both}
.gate h1{margin-top:22px;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;animation:up 1s var(--ease) .08s both}
.gate small{display:block;margin-top:8px;font:500 10.5px var(--mono);letter-spacing:.32em;color:var(--text-3);animation:up 1s var(--ease) .14s both}
.gform{margin-top:40px;animation:up 1s var(--ease) .22s both}
.gbox{background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;transition:border-color .3s}
.gbox:focus-within{border-color:var(--line-2)}
.gbox input{display:block;width:100%;height:54px;padding:0 16px;background:transparent;border:0;outline:0;font-size:16px}
.gbox input+input{border-top:1px solid var(--line)}
.gbox input::placeholder{color:var(--text-3)}
.gbtn{display:block;width:100%;height:52px;margin-top:12px;border-radius:14px;background:var(--text);color:#0a0a0a;font-size:16px;font-weight:600;transition:transform .15s var(--ease),opacity .3s}
.gbtn:active{transform:scale(.985)}
.gerr{height:22px;margin-top:12px;font-size:13px;color:var(--warn);opacity:0;transition:opacity .3s}
.gerr.on{opacity:1}
.shake{animation:shake .42s var(--ease)}

/* ── 主体 ── */
.app{max-width:640px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left)) calc(60px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right));transition:padding-bottom .5s var(--ease)}
.mix .app{padding-bottom:calc(220px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;height:72px;padding-top:env(safe-area-inset-top);animation:fade 1s var(--ease) both}
.top .cu{width:20px;height:20px;color:var(--text)}
.top b{font-size:15px;font-weight:600;letter-spacing:-.005em}
.top .sp{flex:1}
.top .me,.top .lg{height:30px;padding:0 12px;border-radius:99px;font-size:13px;color:var(--text-2);border:1px solid var(--line);transition:color .2s,border-color .2s}
.top .me:hover,.top .lg:hover{color:var(--text);border-color:var(--line-2)}
.top .lg{display:none}
.admin .top .lg{display:block}

/* 拖入区 */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:300px;margin-top:20px;border-radius:22px;cursor:pointer;overflow:hidden;
  background:var(--s1);border:1px solid var(--line);transition:height .6s var(--ease),margin .6s var(--ease),border-radius .6s var(--ease),border-color .3s;animation:up 1s var(--ease) .1s both}
.drop::before{content:"";position:absolute;left:50%;top:0;width:560px;height:420px;transform:translate(-50%,-48%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(31,138,91,.22),rgba(31,138,91,.05) 55%,transparent);transition:opacity .6s var(--ease)}
.drop:hover,.dragging .drop{border-color:rgba(143,195,169,.4)}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.drop .ring{position:relative;width:52px;height:52px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;transition:transform .5s var(--spring),border-color .3s,width .6s var(--ease),height .6s var(--ease)}
.drop .ring::before,.drop .ring::after{content:"";position:absolute;width:16px;height:1.5px;border-radius:2px;background:var(--text-2);transition:background .3s,width .6s var(--ease)}
.drop .ring::after{transform:rotate(90deg)}
.drop:hover .ring{transform:rotate(90deg);border-color:var(--mint)}
.drop:hover .ring::before,.drop:hover .ring::after{background:var(--mint)}
.drop h2{position:relative;font-size:19px;font-weight:600;letter-spacing:-.01em;transition:font-size .6s var(--ease),color .3s}
.drop p{position:relative;font:500 10.5px var(--mono);letter-spacing:.3em;color:var(--text-3);transition:opacity .3s}
.has .drop{flex-direction:row;height:52px;margin-top:4px;border-radius:14px;gap:12px}
.has .drop::before{opacity:0}
.has .drop .ring{width:24px;height:24px}
.has .drop .ring::before,.has .drop .ring::after{width:10px}
.has .drop h2{font-size:14.5px;font-weight:500;color:var(--text-2)}
.has .drop p{display:none}
.busy .drop{pointer-events:none;opacity:.4}

/* 分轨：一张卡片，细分隔线 */
.list{margin-top:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:up .7s var(--ease) both}
.list:empty{display:none}
.trk{position:relative;padding:14px 14px 14px 16px;animation:up .6s var(--ease) both;animation-delay:calc(var(--k,0) * 45ms);transition:opacity .3s,background .3s}
.trk+.trk{border-top:1px solid var(--line)}
.trk.out{animation:gone .32s var(--ease) forwards}
@keyframes gone{to{opacity:0;transform:translateX(10px)}}
.mutedx{opacity:.38}
.th{display:flex;align-items:center;gap:12px}
.role{flex:none;width:46px;height:24px;border-radius:7px;font:600 10.5px/24px var(--mono);letter-spacing:.08em;text-align:center;transition:background .35s var(--ease),color .35s,box-shadow .35s,transform .3s var(--spring)}
.role:active{transform:scale(.92)}
.role[data-r=LV]{background:var(--rolex);color:#fff}
.role[data-r=BV]{box-shadow:inset 0 0 0 1px rgba(143,195,169,.55);color:var(--mint)}
.role[data-r=INST]{box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-2)}
.role[data-r=""]{box-shadow:inset 0 0 0 1px rgba(217,179,108,.6);color:var(--amber)}
.role.flip{animation:flip .35s var(--ease)}
@keyframes flip{from{opacity:.2;transform:translateY(4px)}}
.busy .role{pointer-events:none}
.nmw{flex:1;min-width:0}
.nm{font-size:15px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font:500 11px/1.5 var(--mono);color:var(--text-3);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sub.res{color:var(--text-2);animation:fade .5s var(--ease)}
.sub i{font-style:normal;color:var(--amber)}
.sub em{font-style:normal;color:var(--mint)}
.sub.bad{color:var(--warn)}
.x{flex:none;width:28px;height:28px;border-radius:50%;color:var(--text-3);font-size:18px;line-height:28px;transition:color .2s,background .2s}
.x:hover{color:var(--text);background:rgba(255,255,255,.06)}
.busy .x,.mix .x{display:none}
.lr,.solo{flex:none;display:none;height:24px;border-radius:7px;font:600 10.5px/24px var(--mono);color:var(--text-3);background:rgba(255,255,255,.05);animation:pop .4s var(--spring);transition:background .2s,color .2s}
.lr{width:24px}
.solo{width:24px}
.mix .solo{display:block}
.mix .lr.on{display:block;color:var(--mint)}
.solo[aria-pressed=true]{background:var(--text);color:#0a0a0a}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.pg{position:absolute;left:16px;right:14px;bottom:0;height:1.5px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s var(--ease)}
.done .pg i{opacity:0;transition:opacity .6s var(--ease) .3s}
.wv{position:relative;height:0;margin:0 0 0 58px;opacity:0;cursor:pointer;transition:height .5s var(--ease),margin .5s var(--ease),opacity .6s var(--ease) .1s}
.wv.on{height:30px;margin-top:10px;opacity:1}
.wv canvas{display:block;width:100%;height:30px}
.ph{position:absolute;top:-2px;bottom:-2px;left:0;width:1.5px;margin-left:-.75px;background:var(--text);opacity:0;pointer-events:none;transition:opacity .2s}
.playing .ph{opacity:1}
.ct{position:absolute;top:-4px;bottom:-4px;width:15px;margin-left:-7.5px;padding:0;z-index:2}
.ct::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:1px;background:rgba(143,195,169,.4)}
.ct.join::before{background:none;border-left:1px dashed rgba(143,195,169,.7)}
.ct.frag::before{top:10px;bottom:10px}
.ct::after{content:"";position:absolute;left:5px;top:0;width:5px;height:5px;border-radius:50%;background:var(--mint);opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--spring)}
.ct:hover::after{opacity:1;transform:none}
.ct.risk::before{background:var(--amber);width:1.5px}
.ct.risk::after{background:var(--amber);opacity:1;transform:none;box-shadow:0 0 0 3px rgba(217,179,108,.2)}

.go{position:relative;display:block;width:100%;height:52px;margin-top:14px;border-radius:14px;background:var(--text);color:#0a0a0a;font-size:16px;font-weight:600;overflow:hidden;
  transition:transform .15s var(--ease),opacity .4s,max-height .5s var(--ease),margin .5s var(--ease),background .3s,color .3s;max-height:52px;animation:up .6s var(--ease) both}
.go:active{transform:scale(.985)}
.go .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--rolex);transition:width .3s var(--ease)}
.go span{position:relative}
.go.run{background:var(--s2);color:var(--text)}
.go.hide,.mix .go{max-height:0;margin-top:0;opacity:0;pointer-events:none}
.err{min-height:1.4em;margin-top:10px;text-align:center;font-size:13px;color:var(--warn)}

/* ── 底部调音条 ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px max(20px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom));
  background:rgba(10,10,10,.82);-webkit-backdrop-filter:saturate(1.5) blur(24px);backdrop-filter:saturate(1.5) blur(24px);border-top:1px solid var(--line);
  transform:translateY(105%);transition:transform .7s var(--ease)}
.mix .dock{transform:none}
.dock .in{max-width:640px;margin:0 auto}
.tp{display:flex;align-items:center;gap:14px}
.play{flex:none;width:42px;height:42px;border-radius:50%;background:var(--text);color:#0a0a0a;display:grid;place-items:center;transition:transform .2s var(--spring)}
.play:active{transform:scale(.9)}
.play svg{width:14px;height:14px;fill:currentColor}
.ov{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none}
.ov canvas{display:block;width:100%;height:30px}
.ov .ph{opacity:1}
.tm{flex:none;font:500 11px var(--mono);color:var(--text-3);font-variant-numeric:tabular-nums}
.tm b{font-weight:500;color:var(--text-2)}
.ctl{display:grid;grid-template-columns:1fr auto 1fr auto;gap:22px;align-items:end;margin-top:14px}
.lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--text-3);line-height:1}
.lb b{font:600 11px var(--mono);color:var(--text);font-variant-numeric:tabular-nums;transition:color .2s}
.lb b.z{color:var(--text-3)}
.fd input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin-top:6px;background:transparent;cursor:pointer;--p:50%}
.fd input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:
  linear-gradient(to right,transparent calc(50% - 1px),rgba(255,255,255,.4) calc(50% - 1px),rgba(255,255,255,.4) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(to right,rgba(255,255,255,.1) min(50%,var(--p)),var(--mint) min(50%,var(--p)),var(--mint) max(50%,var(--p)),rgba(255,255,255,.1) max(50%,var(--p)))}
.fd input::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.1)}
.fd input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:#f2f2f0;box-shadow:0 1px 6px rgba(0,0,0,.55);transition:transform .2s var(--spring)}
.fd input:active::-webkit-slider-thumb{transform:scale(1.2)}
.fd input::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#f2f2f0}
.bvs .opts{position:relative;display:flex;margin-top:6px;padding:2px;border-radius:9px;background:rgba(255,255,255,.06)}
.bvs button{position:relative;z-index:1;width:40px;height:24px;border-radius:7px;font:600 11px/24px var(--mono);color:var(--text-3);transition:color .3s}
.bvs button[aria-pressed=true]{color:#0a0a0a}
.bvs .k{position:absolute;top:2px;left:2px;width:40px;height:24px;border-radius:7px;background:var(--mint);transform:translateX(calc(var(--n,1) * 40px));transition:transform .45s var(--spring)}
.dl{height:40px;padding:0 20px;border-radius:12px;background:var(--rolex);color:#fff;font-size:14px;font-weight:600;transition:transform .15s var(--ease),opacity .3s}
.dl:active{transform:scale(.97)}
.dl[disabled]{opacity:.5}
@media (max-width:560px){
  .ctl{grid-template-columns:1fr 1fr;gap:16px 20px}
  .bvs{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
  .bvs .lb{display:block}
  .bvs .opts{margin-top:0}
  .bvs{order:3}.dl{order:4;grid-column:1/-1;width:100%}
  .mix .app{padding-bottom:calc(290px + env(safe-area-inset-bottom))}
}

/* ── 记录（只在你的设备上） ── */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s}
.sheet.on{opacity:1;visibility:visible}
.sheet .pn{width:100%;max-width:640px;max-height:80vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .5s var(--ease)}
.sheet.on .pn{transform:none}
.sheet h3{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;margin-bottom:10px}
.sheet h3 button{font-size:14px;font-weight:500;color:var(--text-2)}
.lgr{padding:12px 0;border-top:1px solid var(--line)}
.lgr .a{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:500}
.lgr .a span{font:500 11px var(--mono);color:var(--text-3);white-space:nowrap}
.lgr .b{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
.lgr .b i{font:600 11px var(--mono);font-style:normal;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.05);color:var(--text-2)}
.lgr .b i.on{background:rgba(143,195,169,.14);color:var(--mint)}
.lgr .c{margin-top:6px;font-size:12px;color:var(--text-3);line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:20px 0;color:var(--text-3);font-size:14px}

#dz{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,8,8,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
#dz::before{content:"";position:absolute;inset:16px;border:1px solid rgba(143,195,169,.4);border-radius:26px}
#dz p{font-size:15px;color:var(--text-2)}
.dragging #dz{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="cu" viewBox="272 164 456 456" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round"><path d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/><path d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/></symbol></svg>

<div class="gate" id="gate"><div class="in">
  <svg class="cu"><use href="#cu"/></svg>
  <h1>Auto Level</h1><small>CU MUSIC</small>
  <form class="gform" id="gform" autocomplete="off">
    <div class="gbox"><input id="gwho" placeholder="艺名" maxlength="30" autocomplete="nickname"><input id="gpw" type="password" inputmode="numeric" placeholder="密码" maxlength="20"></div>
    <button class="gbtn" type="submit">进入</button>
    <p class="gerr" id="gerr"></p>
  </form>
</div></div>

<div class="app">
  <header class="top"><svg class="cu"><use href="#cu"/></svg><b>Auto Level</b><span class="sp"></span><button class="lg" id="lgBtn">记录</button><button class="me" id="me"></button></header>
  <label class="drop" id="drop"><input type="file" id="pick" multiple accept=".wav,.wave,.aif,.aiff,.aifc,audio/*"><span class="ring"></span><h2>拖入分轨</h2><p>WAV · AIFF</p></label>
  <div class="list" id="tracks"></div>
  <button class="go hide" id="go"><i class="bar"></i><span>处理</span></button>
  <p class="err" id="err"></p>
</div>

<div class="dock" id="dock"><div class="in">
  <div class="tp">
    <button class="play" id="play" aria-label="播放"></button>
    <div class="ov" id="ov"><canvas></canvas><i class="ph"></i></div>
    <span class="tm" id="tm"></span>
  </div>
  <div class="ctl">
    <div class="fd"><div class="lb"><span>主人声</span><b id="vLV" class="z">0</b></div><input type="range" id="fLV" min="-3" max="3" step="0.5" value="0"></div>
    <div class="bvs"><div class="lb"><span>和声</span></div><div class="opts" id="bvOpts"><i class="k"></i><button data-v="-6">-6</button><button data-v="-9">-9</button><button data-v="-12">-12</button></div></div>
    <div class="fd"><div class="lb"><span>伴奏</span><b id="vINST" class="z">0</b></div><input type="range" id="fINST" min="-3" max="3" step="0.5" value="0"></div>
    <button class="dl" id="dl">下载</button>
  </div>
</div></div>

<div class="sheet" id="sheet"><div class="pn"><h3>记录 <button id="shClose">完成</button></h3><div id="lgList"></div></div></div>
<div id="dz"><p>松开即可添加</p></div>

<script>
(() => {
'use strict';
// ── 参数 ──────────────────────────────────────────────────────
const PW_HASH = 'eb6492af3b27d1071b436715f993ee6fba928ba2eb808fadc2816051c7eb55b3';   // sha256('cu:' + 密码)，改密码：终端 printf 'cu:新密码' | shasum -a 256
const API = 'https://stats.cumusic.work';
const TARGET = { LV: -23, BV: -23, INST: -20 };   // 伴奏比人声大 3 dB；和声再按 -6 / -9 / -12 整体压
const BV_DEFAULT = -9;
const ROLES = ['LV', 'BV', 'INST'];
const GATE_DB = -50, MIN_GAP = 0.5, PAD_SAFE = 0.05, MIN_PHRASE = 0.35, FADE = 0.01, RAMP = 0.02;
const CEIL = Math.pow(10, -1 / 20), MAX_GAIN = 30;

// ── 命名识别 ──────────────────────────────────────────────────

  if (/(^|[^a-z])(inst|instrumental|beat|beats|karaoke|2trk|2mix|伴奏)([^a-z]|$)|伴奏|^beat/.test(n)) return 'INST';
  if (/(^|[^a-z])(lv|lead|main|vox|vocal|vocals|voc|verse|hook|chorus)([^a-z]|$)|主唱|主人声|人声|主歌/.test(n)) return 'LV';

// ── 假立体声 → 单声道 ───────────────────────────────────────────
function monoize(au) {
  if (au.ch !== 2) return false;
  const [L, R] = au.data; let d = 0, s = 0;
  for (let i = 0; i < au.n; i += 2) { const a = L[i], b = R[i]; d += (a - b) * (a - b); s += (a + b) * (a + b); }
  if (!s || 10 * Math.log10(d / s + 1e-30) > FAKE_ST) return false;
  const M = new Float32Array(au.n); for (let i = 0; i < au.n; i++) M[i] = (L[i] + R[i]) * .5;
  au.data = [M]; au.ch = 1; return true;
}

// ── 处理 ──────────────────────────────────────────────────────
const goTxt = go.querySelector('span'), goBar = go.querySelector('.bar');
go.onclick = async () => {

  err.textContent = ''; busy = true; B.classList.add('busy'); go.classList.add('run'); goTxt.textContent = '处理中';
  for (let i = 0; i < tracks.length; i++) {
    const t = tracks[i], m = t.el.querySelector('.sub'), bar = t.el.querySelector('.pg i');
    const step = f => { bar.style.width = (f * 100) + '%'; goBar.style.width = ((i + f) / tracks.length * 100) + '%'; };
    step(.02);
    try {
      const au = await decode(t.file); t.mono = monoize(au); step(.2);
      const r = await level(au, t.role, f => step(.2 + f * .75));
      t.res = { data: r.data, sr: au.sr, ch: au.ch, n: au.n, dur: au.n / au.sr, cuts: r.cuts || [], segsAt: r.segsAt || [] };
      t.pk = peaks(r.data, 720);

      if (t.role !== 'INST') bits.push(`${r.segs} 段`);
      else bits.push(fmtT(t.res.dur));
      if (t.mono) bits.push('<em>转单声道</em>');
      if (risky) bits.push(`<i>${risky} 处待听</i>`);

    } catch (e) {
      console.error(e); t.res = null;
      m.className = 'sub bad'; m.textContent = e.message === 'fmt' ? '格式不支持，请导出 WAV' : e.message === 'silent' ? '没有声音' : '读取失败';
      bar.style.width = '0';

  }
  busy = false; B.classList.remove('busy'); go.classList.remove('run'); goBar.style.width = '0'; goTxt.textContent = '处理';
  const ok = tracks.filter(t => t.res);
  if (!ok.length) { err.textContent = '没有可处理的分轨'; return; }

// ── 和声配对（只影响试听的声像） ────────────────────────────────────
function activity(t) {
  const { data, sr, n } = t.res, w = Math.round(sr * .05), nw = Math.ceil(n / w), a = new Uint8Array(nw), thr = dbl(-50);
  for (let k = 0; k < nw; k++) { let p = 0; for (const d of data) for (let i = k * w, e = Math.min(n, i + w); i < e; i += 2) { const v = d[i] < 0 ? -d[i] : d[i]; if (v > p) p = v; } a[k] = p > thr ? 1 : 0; }
  return a;
}
function pairBV(list) {
  list.forEach(t => { t.pan = 0; t.mate = null; });
  const bv = list.filter(t => t.role === 'BV'); if (bv.length < 2) return;
  const acts = bv.map(activity), cand = [];
  for (let i = 0; i < bv.length; i++) for (let j = i + 1; j < bv.length; j++) {
    const a = acts[i], b = acts[j], N = Math.max(a.length, b.length); let both = 0, any = 0;
    for (let k = 0; k < N; k++) { const x = a[k] || 0, y = b[k] || 0; both += x & y; any += x | y; }
    const sim = any ? both / any : 0; if (sim >= PAIR_SIM) cand.push([sim, i, j]);
  }
  cand.sort((x, y) => y[0] - x[0]);
  const used = new Set();
  for (const [, i, j] of cand) {
    if (used.has(i) || used.has(j)) continue; used.add(i); used.add(j);
    const A = bv[i], C = bv[j], hA = sideHint(A.file.name), hC = sideHint(C.file.name);
    A.pan = (hA ? hA < 0 : hC ? hC > 0 : true) ? -BV_PAN : BV_PAN; C.pan = -A.pan; A.mate = C; C.mate = A;
  }
}
function swapPan(t) { if (!t.mate) return; t.pan = -t.pan; t.mate.pan = -t.mate.pan; applyGains(); }
function showPan(t) { const p = t.el.querySelector('.lr'); p.classList.toggle('on', !!t.pan); p.textContent = t.pan < 0 ? 'L' : t.pan > 0 ? 'R' : ''; }
function panGains(p, ch) {   // -3 dB 补偿声像律（同 Logic 默认，居中 = 原音量）

  return ch === 1 ? [l, r] : [Math.min(1, l), Math.min(1, r)];
}
const roleGain = t => dbl(t.role === 'BV' ? bvLevel : (off[t.role] || 0));

// ── 试听 ──────────────────────────────────────────────────────
let ctx = null, master = null, playing = null, dur = 0, raf = 0, pos = 0;

  const lim = ctx.createDynamicsCompressor();
  lim.threshold.value = -1; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .002; lim.release.value = .1;
  master = ctx.createGain(); master.connect(lim); lim.connect(ctx.destination);
}
function graph(t) {
  if (t.g) return;
  const r = t.res, buf = ctx.createBuffer(r.ch, r.n, r.sr);
  for (let c = 0; c < r.ch; c++) buf.copyToChannel(r.data[c], c);
  const vol = ctx.createGain(), gl = ctx.createGain(), gr = ctx.createGain(), mg = ctx.createChannelMerger(2);

function applyGains(only) {
  const any = tracks.some(t => t.res && t.solo);
  for (const t of tracks) {
    if (!t.res) continue;
    t.el.querySelector('.solo').setAttribute('aria-pressed', t.solo);
    t.el.classList.toggle('mutedx', any && !t.solo);
    showPan(t);

async function play(from, only, len) {

  (only ? only.el : B).classList.add('playing');
  if (!only) $('#play').innerHTML = ICON_PAUSE;
  const loop = () => {
    if (!playing) return;
    const p = playing.from + (ctx.currentTime - playing.t0);
    if (p >= playing.end) { const was = playing; stop(); if (!was.only) seekTo(0); return; }

  if (p.only) applyGains();

}
function setHead(p, only) {
  if (!only) { pos = p; $('#ov .ph').style.left = (dur ? p / dur * 100 : 0) + '%'; $('#tm').innerHTML = `<b>${fmtT(p)}</b> / ${fmtT(dur)}`; }
  for (const t of only ? [only] : tracks) if (t.res) { const h = t.el.querySelector('.wv .ph'); if (h) h.style.left = Math.min(100, p / t.res.dur * 100) + '%'; }
}
function seekTo(p) { const was = playing && !playing.only; stop(); pos = Math.max(0, Math.min(dur, p)); setHead(pos); if (was) play(pos); }

addEventListener('keydown', e => { if (e.code === 'Space' && mixed && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#play').click(); } });
{ const ov = $('#ov'); let drag = false;
  const at = e => { const r = ov.getBoundingClientRect(); return Math.max(0, Math.min(dur, (e.clientX - r.left) / r.width * dur)); };
  ov.onpointerdown = e => { drag = true; ov.setPointerCapture(e.pointerId); setHead(at(e)); };
  ov.onpointermove = e => { if (drag) setHead(at(e)); };
  ov.onpointerup = e => { if (!drag) return; drag = false; seekTo(at(e)); };
}

// ── 进入试听 ───────────────────────────────────────────────────
function mix(list) {
  mixed = true; dur = Math.max(...list.map(t => t.res.dur)); pos = 0;
  B.classList.add('mix'); $('#play').innerHTML = ICON_PLAY;
  tracks.forEach(t => t.res && showPan(t)); drawOverview(list); setHead(0);
}

function unmix() {   // 改了角色或加了分轨：结果作废，回到「处理」
  stop(); mixed = false; B.classList.remove('mix');
  for (const t of tracks) {
    t.res = null; t.g = null; t.pk = null; t.mate = null; t.pan = 0; t.solo = false; t.el.classList.remove('done', 'mutedx');

// ── 波形 ──────────────────────────────────────────────────────
function peaks(data, N) {
  const n = data[0].length, out = new Float32Array(N), step = n / N;

  return out;
}
function paint(cv, pk, H, segsAt, d, color) {

  for (let k = 0; k < pk.length; k++) { const h = Math.max(1, pk[k] / mx * (H - 4)); g.fillRect(k * bw, (H - h) / 2, Math.max(1, bw - .5), h); }
}

    `<button class="ct ${c.kind}${c.risk ? ' risk' : ''}" style="left:${c.t / d * 100}%" data-i="${i}" title="${fmtT(c.t)}${c.why ? ' · ' + c.why : ''}"></button>`).join('');
  w.classList.add('on');
  requestAnimationFrame(() => paint(w.querySelector('canvas'), t.pk, 30, t.res.segsAt, d, 'rgba(242,242,240,.42)'));
  w.querySelectorAll('.ct').forEach(b => b.onclick = e => { e.stopPropagation(); const c = t.res.cuts[+b.dataset.i]; play(Math.max(0, c.t - 1.5), t, 3); });
