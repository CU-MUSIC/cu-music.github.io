<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141311">

<title>主打盲听 · CU MUSIC</title>
<style>
/* 一屏 app：顶栏进度 → 卡片堆 → 底部三个按钮 */
:root{--bg:#141311;--card:#1d1b18;--card2:#24221e;--fg:#ece6d8;--mute:#9b9384;--line:#2f2b25;--acc:#f2b31b;--no:#d9473c;--dim:#3a362f;color-scheme:dark;
--sans:Inter,"PingFang SC","Noto Sans SC",-apple-system,sans-serif;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.6 var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:30rem;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--mute)}
.prog{height:3px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.stage{position:relative;margin-block:16px;min-height:0}
.card{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:20px;display:grid;grid-template-rows:auto 1fr auto;padding:22px;touch-action:none;will-change:transform,opacity;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s ease,background-color .38s;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.card.back{transform:translateY(14px) scale(.94);opacity:.55;background:var(--card2);box-shadow:none}
.card.enter{transform:translateY(40px) scale(.88);opacity:0}
.card.drag{transition:none}
.card.snap{transition:transform .5s cubic-bezier(.34,1.5,.64,1),opacity .3s}
.card.fly{transition:transform .46s cubic-bezier(.3,.55,.45,1),opacity .46s ease-in}
.card.nudge{transition:transform .12s ease-out}
.card.back .hint,.card.back .stamp{opacity:0!important}
@media (prefers-reduced-motion: reduce){.card,.card.snap,.card.fly{transition:opacity .2s}}
.num{font-weight:300;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.num small{font-size:18px;color:var(--mute);margin-left:6px}
.hint{color:var(--mute);font-size:15px;margin-top:6px}
.wave{display:flex;align-items:center;gap:3px;height:100%;max-height:180px;align-self:center}
.wave span{flex:1;background:var(--dim);border-radius:2px;min-height:4px;transition:background-color .15s}
.wave span.on{background:var(--acc)}
.tbar{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--mute)}
.stamp{position:absolute;top:26px;transition:opacity .12s;padding:4px 14px;border:2px solid;border-radius:8px;font-weight:700;font-size:20px;opacity:0;letter-spacing:.05em}
.stamp.yes{right:22px;color:var(--acc);border-color:var(--acc);transform:rotate(10deg)}
.stamp.no{left:22px;color:var(--no);border-color:var(--no);transform:rotate(-10deg)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.btn{transition:transform .12s,background-color .2s;height:80px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 20px var(--sans);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.sm{height:58px;font:500 17px var(--sans);color:var(--mute);border-radius:18px}
.btn:disabled{opacity:.35}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:focus-visible,.go:focus-visible,.pk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.no{color:var(--no)}
.btn.yes{color:var(--acc);border-color:var(--acc)}
.screen{position:absolute;inset:0;display:grid;align-content:center;gap:18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#pick{align-content:start;padding-block:8px;gap:14px}
.screen h1{font-size:30px;font-weight:400;line-height:1.35;margin:0}
.screen h1 em{font-style:normal;color:var(--acc)}
.screen p{margin:0;color:var(--mute)}
input{font:17px var(--sans);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;outline:none;width:100%;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{border-color:var(--acc)}
textarea{font:16px/1.6 var(--sans);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;width:100%;resize:none;-webkit-user-select:text;user-select:text}
textarea::placeholder,input::placeholder{color:var(--mute)}
.go{height:56px;border-radius:28px;border:0;background:var(--acc);color:#1a1408;font:600 17px var(--sans);cursor:pointer}
.go:disabled{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.go:not(:disabled){box-shadow:0 10px 30px rgba(242,179,27,.22)}
.err{color:var(--no)!important;font-size:15px;min-height:1.4em}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pk{height:60px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:300 22px var(--sans);cursor:pointer}
.pk.sel{border-color:var(--acc);color:var(--acc);background:#2a2414}
.small{font-size:14px;color:var(--mute)}
.tr{display:flex;gap:12px;align-items:center}
#bEnd{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:14px;padding:3px 12px;font:500 13px var(--sans);letter-spacing:0;cursor:pointer}
#bEnd:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lk{color:var(--acc);font-size:12px;letter-spacing:.04em}.lk.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tap{margin-top:6px;height:52px;padding:0 22px;border-radius:26px;border:0;background:var(--acc);color:#1a1408;font:600 17px var(--sans);cursor:pointer}
[hidden]{display:none!important}

/* 开场：封面虚化铺底 + 封面和专辑名并排 */
body::after{content:"";position:fixed;inset:-40px;background:url("https://cumusic-audio.b-cdn.net/cv/43mxcv6g/SHpBPXJb4b.jpg") center 30%/cover;filter:blur(48px) saturate(1.1);opacity:.22;z-index:-1;pointer-events:none}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(20,19,17,.2),var(--bg) 70%);z-index:-1;pointer-events:none}
body{isolation:isolate}
#intro{gap:16px}
.hero{display:flex;gap:18px;align-items:flex-end}
.cover{width:132px;aspect-ratio:4/5;max-width:40%;border-radius:14px;object-fit:cover;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(242,179,27,.35)}
.htx{display:grid;gap:6px;padding-bottom:4px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.album{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:.02em;color:var(--fg)}
#intro h1{font-size:26px;margin-top:6px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r{height:36px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;border-bottom:1px solid var(--line)}
.r.no{color:var(--no)}.r.yes{color:var(--acc)}
.form{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(29,27,24,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.form input{border:0;border-radius:0;background:transparent}
.form input+input{border-top:1px solid var(--line)}
.small.c{text-align:center}
.nrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.say{border:1px solid var(--line);background:rgba(20,19,17,.5);color:var(--fg);border-radius:16px;padding:6px 12px;font:500 14px var(--sans);cursor:pointer;white-space:nowrap;margin-top:6px}
.say.on{border-color:var(--acc);color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sbox{width:100%;max-width:30rem;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.shd{display:grid;gap:2px}.shd b{font-size:18px;font-weight:600}
.sbt{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.sbt .go{height:58px}
.em{font-size:40px;margin-right:12px;vertical-align:10px;line-height:1}
.pk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;height:72px}.pe{font-size:24px;line-height:1.1}
.ttl{font-size:20px;font-weight:600;margin-top:6px;filter:blur(9px);opacity:.75;transition:filter .5s ease,opacity .5s,color .5s;user-select:none;-webkit-user-select:none;min-height:1.4em}
.ttl.show{filter:none;opacity:1;color:var(--acc)}
.card.nudge{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.pk{height:auto;min-height:84px;padding:8px 4px}.pt{font-size:11px;color:var(--mute);line-height:1.3;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ro{height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(29,27,24,.75);color:var(--fg);font:500 16px var(--sans);cursor:pointer}
.ro.on{border-color:var(--acc);color:var(--acc);background:#2a2414}
.ro:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.r2{display:grid;gap:8px;margin-top:10px;padding:16px;border:1px solid rgba(242,179,27,.4);border-radius:16px;background:rgba(29,27,24,.75)}.r2 b{font-size:18px}
#duel{align-content:start;gap:14px}.q{font-size:20px;text-align:center}
.vs{display:grid;gap:12px}
.side{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;transition:border-color .2s,transform .25s,opacity .3s}
.side.playing{border-color:rgba(242,179,27,.6)}.side.win{border-color:var(--acc);transform:scale(1.02)}.side.lose{opacity:.45}
.side .e{font-size:44px;line-height:1;grid-row:span 2}
.side .st{font-size:18px;font-weight:600;filter:blur(8px);opacity:.75;transition:filter .5s,opacity .5s;min-height:1.4em}.side .st.show{filter:none;opacity:1;color:var(--acc)}
.side .meta{font-size:13px;color:var(--mute);font-family:var(--mono)}
.bar2{grid-column:1/-1;height:4px;background:var(--dim);border-radius:2px;overflow:hidden}.bar2 i{display:block;height:100%;width:0;background:var(--acc)}
.acts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:4px}
.pl,.dpk{height:52px;border-radius:14px;font:600 16px var(--sans);cursor:pointer}
.pl{border:1px solid var(--line);background:transparent;color:var(--fg)}
.dpk{border:0;background:var(--acc);color:#1a1408}.dpk:disabled{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
</style>
</head>
<body>
<div class="app">
<div>
<div class="top"><span>CU MUSIC</span><span class="tr"><button type="button" id="bEnd" hidden>提前结束</button><span id="cnt">盲听</span></span></div>
<div class="prog"><i id="bar"></i></div>
</div>

<div class="stage" id="stage">
<div class="screen" id="intro">
<div class="hero">
<img class="cover" src="https://cumusic-audio.b-cdn.net/cv/43mxcv6g/SHpBPXJb4b.jpg" alt="LIFE OF CHENIUS 封面" onerror="this.remove()">
<div class="htx">
<span class="eyebrow">CheezeKkk · 首张专辑</span>
<span class="album">LIFE OF<br>CHENIUS</span>
</div>
</div>
<h1>帮忙选 <em>主打歌</em></h1>
<div class="roles" role="radiogroup" aria-label="你是"><button type="button" class="ro" data-r="fan">🎧 普通听众</button><button type="button" class="ro" data-r="pro">🎚 音乐人</button></div>
<div class="form">
<input id="who" placeholder="名字（可不填）" autocomplete="off" maxlength="20">
<input id="pw" placeholder="密码" inputmode="numeric" autocomplete="off" maxlength="20">
</div>
<p class="err" id="err"></p>
<button class="go" id="start" disabled>开始听</button>
<p class="small c">8 首 · 约 2 分钟 · 建议戴耳机</p>
</div>
<div class="screen" id="pick" hidden>
<h1>最后一个问题：<br>哪首你 <em>最想听完整版</em>？</h1>
<p class="small">点一下可以再听一遍。</p>
<div class="picks" id="picks"></div>
<textarea id="note" maxlength="500" rows="3" placeholder="想说的话（可选）：提到哪首就带上它的 emoji，比如「🔥 副歌很抓耳」"></textarea>
<p class="err" id="err2"></p>
<button class="go" id="send" disabled>提交</button>
<button class="btn sm" id="bBack">↶ 撤回最后一首</button>
</div>
<div class="screen" id="done" hidden>
<h1>收到了，<em>谢谢</em></h1>
<p id="sum"></p>
<button class="go" id="more" hidden>再听剩下的 <span id="moreN"></span> 首</button>
<p class="small" id="moreT" hidden>不想听也没关系，已经交上了。</p>
<div class="r2" id="r2" hidden><b>还有 3 分钟吗？第二轮：二选一</b><span class="small" id="r2T">第一轮选出了几首候选，每次给你两首，选更适合做主打的那首。</span><button class="go" id="r2Go">开始第二轮</button></div>
</div>
<div class="screen" id="duel" hidden>
<div class="q">哪首更适合做主打？</div>
<div class="vs" id="vs"></div>
<p class="small c" id="dtip">两首都听 5 秒以上就能选</p>
</div>
<div class="screen" id="ddone" hidden>
<h1>第二轮也<em>收到了</em></h1>
<p id="dsum"></p>
<p class="small">谢谢你帮忙，可以关掉页面了。</p>
</div>
</div>

<div class="sheet" id="sheet" hidden><div class="sbox"><div class="shd"><b id="shT">说一句</b><span class="small">这句话会记在这首歌上</span></div><textarea id="shX" rows="3" maxlength="300" placeholder="比如：副歌一进来就抓耳 / 前面有点平"></textarea><div class="sbt"><button type="button" class="btn sm" id="shC">取消</button><button type="button" class="go" id="shOk">记下</button></div></div></div>
<div class="btns" id="btns" hidden>
<button class="btn no" id="bNo" aria-label="不适合做主打">✕ 不适合</button>
<button class="btn yes" id="bYes" aria-label="能做主打">能做主打 ✓</button>
<button class="btn sm" id="bUn" aria-label="撤回上一首" disabled>↶ 撤回上一首</button>
<button class="btn sm" id="bRe" aria-label="重听这一段">↺ 重听</button>
</div>
</div>

<script src="clips.js"></script>
<script>
(function(){
  var API="https://stats.cumusic.work", PROJ="lchenius", CDN="https://cumusic-audio.b-cdn.net/ra/hooklc/v2-", MIN=5;
  var HV=window.HV, CLIPS=HV.clips, urls={}, key=null;
  // 每人先听 8 首：从固定的一圈里随机起点连续取 8 首（每首被分到的机会一样），再打乱顺序；听完可以选择再听剩下的
  function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  var FIRST=Math.min(8,CLIPS.length), off=Math.floor(Math.random()*CLIPS.length), first=[], rest=[];
  CLIPS.forEach(function(c,i){var k=(i-off+CLIPS.length)%CLIPS.length;(k<FIRST?first:rest).push(i);});
  var order=shuf(first); rest=shuf(rest);
  var stage=document.getElementById("stage"),bar=document.getElementById("bar"),cnt=document.getElementById("cnt");
  var who=document.getElementById("who"),pw=document.getElementById("pw"),start=document.getElementById("start"),err=document.getElementById("err");
  var audio=new Audio(); audio.preload="auto"; audio.loop=true; audio.setAttribute("playsinline","");
  var pos=0, votes={}, cur=null, raf=0;
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  var lid=ls("hv:lid"); if(!lid){lid=Array.from(crypto.getRandomValues(new Uint8Array(12)),function(b){return("0"+b.toString(16)).slice(-2);}).join("");ls("hv:lid",lid);}
  who.value=ls("hv:who")||""; pw.value=ls("hv:pw")||"";
  var role=ls("hv:role")||"";
  function chk(){start.disabled=!pw.value.trim()||!role; document.querySelectorAll(".ro").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-r")===role);b.setAttribute("aria-checked",b.getAttribute("data-r")===role);});}
  document.querySelectorAll(".ro").forEach(function(b){b.setAttribute("role","radio");b.onclick=function(){role=b.getAttribute("data-r");ls("hv:role",role);chk();};});
  who.addEventListener("input",chk); pw.addEventListener("input",chk); chk();
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});};
  async function derive(p){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(HV.salt),iterations:HV.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }
  async function open(u8){return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8.subarray(0,12)},key,u8.subarray(12)));}
  function load(idx){
    var c=CLIPS[idx]; if(urls[c.id])return urls[c.id];
    // 先走 Bunny CDN（国内快），12 秒没拿到或失败再回 GitHub Pages
    var get=function(u,ms){var ac=window.AbortController?new AbortController():null,t=ac&&setTimeout(function(){ac.abort();},ms);
      return fetch(u,ac?{signal:ac.signal}:{}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();}).finally(function(){t&&clearTimeout(t);});};
    urls[c.id]=get(CDN+c.f,12000).catch(function(){return get("a/"+c.f,30000);}).then(function(b){return open(new Uint8Array(b));})
      .then(function(pt){return URL.createObjectURL(new Blob([pt],{type:"audio/mpeg"}));});
    return urls[c.id];
  }
  start.addEventListener("click",async function(){

    // 只给右滑过的选：左滑的本来就不想要
    order.forEach(function(idx,k){if(votes[CLIPS[idx].id])h+='<button class="pk" data-id="'+CLIPS[idx].id+'" data-i="'+idx+'">'+(CLIPS[idx].e?'<span class="pe">'+CLIPS[idx].e+'</span>':'')+label(k)+'<span class="pt">'+(T[CLIPS[idx].id]||'').replace(/[&<>]/g,'')+'</span></button>';});
    box.innerHTML=h||'<p class="small" style="grid-column:1/-1">你一首都没右滑，直接提交就行。</p>';
    best=null; document.getElementById("send").disabled=!!h;
    box.querySelectorAll(".pk").forEach(function(b){b.onclick=function(){
      box.querySelectorAll(".pk").forEach(function(x){x.classList.remove("sel");});
      b.classList.add("sel"); best=b.getAttribute("data-id"); document.getElementById("send").disabled=false;
      play(+b.getAttribute("data-i"),null);};});
    var only=box.querySelectorAll(".pk"); if(only.length===1)only[0].click();
    document.getElementById("pick").hidden=false;
  }
  document.getElementById("send").onclick=function(){
    var btn=this, e2=document.getElementById("err2"); btn.disabled=true; e2.textContent=""; audio.pause();
    clearTimeout(saveT);
    post(1)
      .then(function(r){return r.json();}).then(function(j){
        if(!j.ok)throw 0; sent=true;
        var yes=Object.keys(votes).filter(function(k){return votes[k];}).length;
        document.getElementById("pick").hidden=true;
        document.getElementById("sum").textContent="你右滑了 "+yes+" 首。再提交一次会覆盖这次的结果。";
        document.getElementById("done").hidden=false;
        checkR2();
        var mb=document.getElementById("more"); mb.hidden=!rest.length; document.getElementById("moreT").hidden=!rest.length; document.getElementById("moreN").textContent=rest.length;
        bar.style.width="100%"; cnt.textContent="完成";
      }).catch(function(){e2.textContent="没提交上，检查一下网络再点一次"; btn.disabled=false;});
  };
})();
</script>
</body>
</html>
