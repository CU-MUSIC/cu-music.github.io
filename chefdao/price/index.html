<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Rates | ChefDao</title>
	<style>
		:root {
			--bg: #080808;
			--surface: #111111;
			--surface-hover: #161616;
			--text-primary: #f0f0f0;
			--text-secondary: #888;
			--text-dim: #555;
			--gold: #c9a227;
			--gold-bg: rgba(201, 162, 39, 0.07);
			--border: rgba(255, 255, 255, 0.08);
			--border-hover: rgba(255, 255, 255, 0.2);
			--font: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
			--ease: cubic-bezier(0.16, 1, 0.3, 1);
			--r: 14px;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
		html { scroll-behavior: smooth; }
		body { background: var(--bg); color: var(--text-primary); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.6; }
		.container { max-width: 960px; margin: 0 auto; padding: 72px 24px; padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
		.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; gap: 12px; }
		.back-nav { display: inline-flex; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; min-height: 44px; flex-shrink: 0; }
		.back-nav:hover { color: var(--text-primary); }
		.lang-switcher { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 100px; padding: 4px; }
		.lang-btn { background: none; border: none; color: var(--text-secondary); font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 6px 12px; border-radius: 100px; cursor: pointer; transition: background 0.2s, color 0.2s; min-height: 32px; white-space: nowrap; }
		.lang-btn:hover { color: var(--text-primary); }
		.lang-btn.active { background: var(--surface-hover); color: var(--text-primary); border: 0.5px solid var(--border-hover); }
		.hero { margin-bottom: 80px; }
		.hero h1 { font-size: clamp(36px, 9vw, 72px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; margin-bottom: 16px; }
		.hero-sub { color: var(--text-secondary); font-size: 15px; max-width: 480px; line-height: 1.7; }
		.service-section { margin-bottom: 64px; }
		.section-head { margin-bottom: 28px; }
		.step-tag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; gap: 6px; }
		.step-tag::before { content: ""; display: block; width: 18px; height: 1px; background: currentColor; opacity: 0.6; }
		.step-tag.gold { color: var(--gold); }
		.step-tag.silver { color: #aaa; }
		.step-tag.gold::before, .step-tag.silver::before { display: none; }
		.section-head h2 { font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: -0.02em; }
		.subsection { margin-bottom: 36px; }
		.subsection:last-child { margin-bottom: 0; }
		.sub-head { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 0.5px solid var(--border); }
		.sub-head h3 { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); }
		.sub-desc { font-size: 11px; color: var(--text-dim); line-height: 1.6; }
		.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: stretch; }
		.card-grid.solo { max-width: 380px; }
		.price-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.3s var(--ease), background 0.3s var(--ease), transform 0.3s var(--ease); cursor: default; position: relative; overflow: hidden; }
		.price-card:hover { border-color: var(--border-hover); background: var(--surface-hover); transform: translateY(-3px); }
		.price-card.featured { border-color: rgba(201, 162, 39, 0.3); }
		.price-card.featured::before { content: ""; position: absolute; inset: 0; background: var(--gold-bg); border-radius: inherit; pointer-events: none; }
		.card-price { display: flex; align-items: baseline; gap: 2px; line-height: 1; }
		.card-price-num { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
		.card-price-unit { font-size: 13px; color: var(--text-secondary); margin-left: 1px; }
		.card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-top: 4px; }
		.card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.65; flex-grow: 1; }
		.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
		.tag { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: 0.5px solid var(--border); color: var(--text-secondary); }
		.tag.gold { border-color: rgba(201, 162, 39, 0.5); color: var(--gold); }
		.partner-box { margin-top: 96px; padding: 56px 40px; background: #0d0d0d; border: 0.5px solid var(--border); border-radius: 20px; text-align: center; }
		.partner-box .step-tag { margin-bottom: 14px; }
		.partner-box h2 { font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
		.partner-intro { font-size: 14px; color: var(--text-secondary); max-width: 380px; margin: 0 auto 40px; line-height: 1.7; }
		.partner-box .card-grid { text-align: left; }
		.section-divider { height: 0.5px; background: var(--border); margin: 64px 0; }
		footer { text-align: center; color: var(--text-dim); font-size: 11px; letter-spacing: 0.06em; padding-bottom: env(safe-area-inset-bottom); }
		.floating-cta { position: fixed; bottom: calc(32px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 100; white-space: nowrap; }
		.floating-btn { display: flex; align-items: center; gap: 10px; background: rgba(17,17,17,0.85); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 0.5px solid var(--border-hover); color: var(--text-primary); padding: 14px 28px; border-radius: 100px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s; min-height: 52px; }
		.floating-btn:hover { background: #fff; color: #000; border-color: #fff; }
		.floating-btn:active { transform: scale(0.97); }
		.btn-dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; flex-shrink: 0; transition: background 0.2s; }
		.floating-btn:hover .btn-dot { background: #000; }
		#services-container { transition: opacity 0.18s ease; }
		#services-container.fading { opacity: 0; }
		@media (max-width: 600px) {
			.container { padding: 40px 16px; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
			.hero { margin-bottom: 48px; }
			.hero-sub { font-size: 13px; }
			.card-grid { grid-template-columns: 1fr; }
			.card-grid.solo { max-width: 100%; }
			.price-card { padding: 18px 16px; }
			.card-price-num { font-size: 24px; }
			.card-price-orig { font-size: 16px; }
			.card-price-row { gap: 6px; }
			.sub-head { padding-bottom: 10px; margin-bottom: 12px; }
			.sub-head h3 { font-size: 11px; }
			.sub-desc { font-size: 10px; }
			.section-head h2 { font-size: 20px; }
			.section-head { margin-bottom: 20px; }
			.subsection { margin-bottom: 28px; }
			.partner-box { padding: 36px 20px; }
			.service-section { margin-bottom: 48px; }
			.section-divider { margin: 48px 0; }
			.lang-btn { padding: 6px 10px; font-size: 10px; }
			.pl-highlights { grid-template-columns: 1fr 1fr; gap: 8px; }
			.pl-highlight-item { padding: 10px 12px; }
			.pl-deposit-num { font-size: 26px; }
			.pl-desc { font-size: 12px; }
			.pl-cta { font-size: 11px; padding: 8px 14px; }
			.ci-chip { font-size: 10px; padding: 2px 7px; }
			.projectlead-card { padding: 18px 16px; }
			.step-tag { font-size: 9px; }
			.step-tag::before { width: 14px; }
		}
		@media (min-width: 601px) and (max-width: 800px) {
			.card-grid { grid-template-columns: repeat(2, 1fr); }
			.card-grid.solo { max-width: 380px; }
		}

		/* ── Bundle Card ──────────────────────────────────── */
		.bundle-card {
			background: var(--surface); border: 0.5px solid rgba(201,162,39,0.35);
			border-radius: var(--r); padding: 28px 32px; position: relative; overflow: hidden;
		}
		.bundle-card::before {
			content: ""; position: absolute; inset: 0;
			background: var(--gold-bg); pointer-events: none;
		}
		.bundle-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
		.bundle-original { font-size: 18px; color: var(--text-dim); text-decoration: line-through; font-weight: 500; }
		.bundle-arrow { font-size: 13px; color: var(--text-dim); }
		.bundle-price { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }
		.bundle-items { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
		.bundle-item {
			font-size: 12px; color: var(--text-secondary); padding: 4px 12px;
			border: 0.5px solid var(--border); border-radius: 100px;
		}
		.bundle-plus { color: var(--text-dim); font-size: 13px; }
		.bundle-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.65; margin-bottom: 14px; }
		.bundle-tip {
			font-size: 12px; color: var(--gold); padding: 10px 14px; line-height: 1.7;
			background: rgba(201,162,39,0.06); border: 0.5px solid rgba(201,162,39,0.2); border-radius: 8px;
		}
		@media (max-width:600px) { .bundle-card { padding: 20px; } }

		/* ── Card orig price (strikethrough) ─────────────── */
		.card-price-orig { font-size: 20px; color: rgba(255,255,255,0.38); text-decoration: line-through; font-weight: 500; align-self: flex-end; margin-bottom: 4px; }
		.card-price-row { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 8px; }

		/* ── Card includes breakdown ──────────────────────── */
		.card-includes {
			margin-top: 12px; padding: 10px 12px;
			background: rgba(255,255,255,0.04); border-radius: 8px;
		}
		.ci-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
		.ci-chip { font-size: 11px; color: var(--text-secondary); padding: 3px 9px; border: 0.5px solid var(--border); border-radius: 100px; white-space: nowrap; }
		.ci-chip strong { color: var(--text-primary); font-weight: 600; }
		.ci-sep { font-size: 11px; color: var(--text-dim); }
		.ci-total-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
		.ci-orig { font-size: 11px; color: var(--text-dim); text-decoration: line-through; }
		.ci-arrow { font-size: 11px; color: var(--text-dim); }
		.ci-saving { font-size: 11px; color: var(--gold); font-weight: 600; padding: 2px 8px; background: rgba(201,162,39,0.1); border-radius: 100px; }

		/* ── Project Lead card ─────────────────────────────── */
		.step-tag.silver { color: #aaa; }
		.projectlead-card {
			background: var(--surface); border: 0.5px solid rgba(255,255,255,0.15);
			border-radius: var(--r); padding: 28px 32px;
		}
		.pl-highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
		.pl-highlight-item { padding: 12px 14px; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; }
		.pl-highlight-label { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 5px; }
		.pl-highlight-value { font-size: 12px; color: var(--text-primary); font-weight: 500; line-height: 1.4; }
		.pl-price-block { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
		.pl-deposit { display: flex; flex-direction: column; gap: 3px; }
		.pl-deposit-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
		.pl-deposit-num { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }
		.pl-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 14px; }
		.pl-cta { display: inline-block; font-size: 12px; font-weight: 600; color: var(--text-primary); letter-spacing: 0.06em; padding: 9px 18px; border: 0.5px solid rgba(255,255,255,0.25); border-radius: 100px; transition: border-color 0.2s, background 0.2s; cursor: pointer; }
		.pl-cta:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.05); }
		@media (max-width:600px) {
			.projectlead-card { padding: 20px; }
			.pl-highlights { grid-template-columns: 1fr 1fr; }
		}

		/* ── FAQ ───────────────────────────────────────────── */
		.faq-section {
			margin-top: 80px;
			padding-top: 72px;
			border-top: 0.5px solid var(--border);
		}
		.faq-head { margin-bottom: 40px; }
		.faq-item {
			border-bottom: 0.5px solid var(--border);
		}
		.faq-question {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 20px;
			padding: 22px 0;
			cursor: pointer;
			user-select: none;
			-webkit-user-select: none;
			min-height: 64px;
			transition: opacity 0.2s;
		}
		.faq-question:hover { opacity: 0.75; }
		.faq-q-inner { display: flex; gap: 18px; align-items: baseline; flex: 1; min-width: 0; }
		.faq-num {
			font-size: 10px;
			font-weight: 700;
			letter-spacing: 0.1em;
			color: var(--gold);
			flex-shrink: 0;
			min-width: 20px;
			padding-top: 1px;
		}
		.faq-q-text {
			font-size: 15px;
			font-weight: 600;
			letter-spacing: -0.01em;
			color: var(--text-primary);
			line-height: 1.55;
		}
		.faq-toggle {
			font-size: 20px;
			font-weight: 300;
			color: var(--text-dim);
			flex-shrink: 0;
			line-height: 1;
			transition: transform 0.35s var(--ease), color 0.2s;
			margin-top: 1px;
		}
		.faq-item.open .faq-toggle {
			transform: rotate(45deg);
			color: var(--text-secondary);
		}
		.faq-answer {
			max-height: 0;
			overflow: hidden;
			transition: max-height 0.45s var(--ease);
		}
		.faq-answer-inner {
			padding: 0 0 28px 38px;
			color: var(--text-secondary);
			font-size: 14px;
			line-height: 1.85;
		}
		.faq-answer-inner p { margin-bottom: 10px; }
		.faq-answer-inner p:last-child { margin-bottom: 0; }
		.faq-answer-inner ul {
			list-style: none;
			padding: 0;
			margin: 10px 0 0;
			display: flex;
			flex-direction: column;
			gap: 5px;
		}
		.faq-answer-inner li::before {
			content: "·";
			color: var(--gold);
			margin-right: 10px;
			font-weight: 700;
		}
		@media (max-width: 600px) {
			.faq-section { margin-top: 56px; padding-top: 56px; }
			.faq-q-text { font-size: 14px; }
			.faq-answer-inner { padding-left: 28px; font-size: 13px; }
			.faq-question { padding: 20px 0; min-height: 56px; }
			.faq-num { font-size: 9px; }
		}
	</style>
</head>

	<div class="top-bar">

function renderCard(item) {
	var fc = item.featured ? " featured" : "";
	var goldClass = item.featured ? " gold" : "";
	var tags = "";
	if (item.tags && item.tags.length) {
		for (var i = 0; i < item.tags.length; i++) {
			tags += "<span class=\"tag" + goldClass + "\">" + item.tags[i] + "</span>";
		}
	}
	var unit = item.unit ? "<span class=\"card-price-unit\">" + item.unit + "</span>" : "";
	var tagsHtml = tags ? "<div class=\"card-tags\">" + tags + "</div>" : "";
	var origHtml = item.originalPrice ? "<span class=\"card-price-orig\">" + item.originalPrice + "</span>" : "";
	var inlineSaving = (item.saving && item.originalPrice) ? "<span class=\"tag gold\">" + item.saving + "</span>" : "";
	var includesHtml = "";
	if (item.includes && item.includes.length) {
		var chips = "";
		for (var k = 0; k < item.includes.length; k++) {
			if (k > 0) chips += "<span class=\"ci-sep\">+</span>";
			var inc = item.includes[k];
			chips += "<span class=\"ci-chip\">" + inc.label + (inc.value ? " <strong>" + inc.value + "</strong>" : "") + "</span>";
		}
		var totalRow = "";
		if (item.valueTotal) {
			totalRow = "<div class=\"ci-total-row\">"
				+ "<span class=\"ci-orig\">" + item.valueTotal + "</span>"
				+ "<span class=\"ci-arrow\">→</span>"
				+ "<span class=\"ci-saving\">" + item.saving + "</span>"
				+ "</div>";
		}
		includesHtml = "<div class=\"card-includes\"><div class=\"ci-chips\">" + chips + "</div>" + totalRow + "</div>";
	}
	return "<div class=\"price-card" + fc + "\">"
		+ "<div class=\"card-price card-price-row\"><span class=\"card-price-num\">" + item.price + "</span>" + unit + origHtml + inlineSaving + "</div>"
		+ "<div class=\"card-title\">" + item.title + "</div>"
		+ "<div class=\"card-desc\">" + item.desc + "</div>"
		+ includesHtml
		+ tagsHtml
		+ "</div>";
}

function renderProjectLead(svc) {
	var tags = svc.tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('');
	var highlightsHtml = '';
	if (svc.highlights) {
		for (var h = 0; h < svc.highlights.length; h++) {
			highlightsHtml += '<div class="pl-highlight-item">'
				+ '<div class="pl-highlight-label">' + svc.highlights[h].label + '</div>'
				+ '<div class="pl-highlight-value">' + svc.highlights[h].value + '</div>'
				+ '</div>';
		}
	}
	return '<div class="service-section">'
		+ '<div class="section-head">'
		+ '<div class="step-tag silver">' + svc.step + '</div>'
		+ '<h2>' + svc.title + '</h2>'
		+ '</div>'
		+ '<div class="projectlead-card">'
		+ (highlightsHtml ? '<div class="pl-highlights">' + highlightsHtml + '</div>' : '')
		+ '<div class="pl-price-block">'
		+ '<div class="pl-deposit">'
		+ '<span class="pl-deposit-label">' + svc.depositLabel + '</span>'
		+ '<span class="pl-deposit-num">' + svc.deposit + '</span>'
		+ '</div>'
		+ '</div>'
		+ '<div class="pl-desc">' + svc.desc + '</div>'
		+ '<div class="card-tags">' + tags + '</div>'
		+ '<div class="pl-cta" style="margin-top:16px">' + svc.cta + '</div>'
		+ '</div>'
		+ '</div>'
		+ '<div class="section-divider"></div>';
}

function renderBundle(svc) {
	var items = svc.bundleItems.map(function(item, i) {
		return (i > 0 ? '<span class="bundle-plus">+</span>' : '') + '<span class="bundle-item">' + item + '</span>';
	}).join('');
	return '<div class="service-section">'
		+ '<div class="section-head">'
		+ '<div class="step-tag gold">' + svc.step + '</div>'
		+ '<h2>' + svc.title + '</h2>'
		+ '</div>'
		+ '<div class="bundle-card">'
		+ '<div class="bundle-price-row">'
		+ '<span class="bundle-original">' + svc.originalPrice + '</span>'
		+ '<span class="bundle-arrow">→</span>'
		+ '<span class="bundle-price">' + svc.price + '</span>'
		+ '<span class="tag gold">' + svc.savings + '</span>'
		+ '</div>'
		+ '<div class="bundle-items">' + items + '</div>'
		+ '<div class="bundle-desc">' + svc.desc + '</div>'
		+ '<div class="bundle-tip">' + svc.tip + '</div>'
		+ '</div>'
		+ '</div>'
		+ '<div class="section-divider"></div>';
}

function renderService(svc, t) {
	var i, html, sub, cards;
	if (svc.type === "bundle") return renderBundle(svc);
	if (svc.type === "projectlead") return renderProjectLead(svc);
	if (svc.type === "partner") {
		cards = "";
		for (i = 0; i < svc.items.length; i++) { cards += renderCard(svc.items[i]); }
		return "<div class=\"partner-box\">"
			+ "<div class=\"step-tag gold\">" + svc.step + "</div>"
			+ "<h2>" + svc.title + "</h2>"
			+ "<p class=\"partner-intro\">" + t.partnerIntro + "</p>"
			+ "<div class=\"card-grid\">" + cards + "</div>"
			+ "</div>";
	}
	var inner = "";
	if (svc.subsections) {
		for (i = 0; i < svc.subsections.length; i++) {
			sub = svc.subsections[i];
			cards = "";
			for (var j = 0; j < sub.items.length; j++) { cards += renderCard(sub.items[j]); }
			var gridCls = sub.items.length === 1 ? "card-grid solo" : "card-grid";
			inner += "<div class=\"subsection\">"
				+ "<div class=\"sub-head\"><h3>" + sub.name + "</h3><span class=\"sub-desc\">" + sub.desc + "</span></div>"
				+ "<div class=\"" + gridCls + "\">" + cards + "</div>"
				+ "</div>";
		}
	} else {
		cards = "";
		for (i = 0; i < svc.items.length; i++) { cards += renderCard(svc.items[i]); }
		inner = "<div class=\"card-grid" + (svc.items.length === 1 ? " solo" : "") + "\">" + cards + "</div>";
	}
	return "<div class=\"service-section\">"
		+ "<div class=\"section-head\">"
		+ "<div class=\"step-tag\">" + svc.step + "</div>"
		+ "<h2>" + svc.title + "</h2>"
		+ "</div>" + inner + "</div>"
		+ "<div class=\"section-divider\"></div>";
}

function renderFAQ(t) {
	if (!t.faqItems || !t.faqItems.length) return "";
	var items = "";
	for (var i = 0; i < t.faqItems.length; i++) {
		var item = t.faqItems[i];
		var num = (i + 1 < 10 ? "0" : "") + (i + 1);
		var bodyHtml = "";
		if (item.a) bodyHtml += "<p>" + item.a + "</p>";
		if (item.list && item.list.length) {
			bodyHtml += "<ul>";
			for (var j = 0; j < item.list.length; j++) {
				bodyHtml += "<li>" + item.list[j] + "</li>";
			}
			bodyHtml += "</ul>";
		}
		items += "<div class=\"faq-item\" id=\"faq-item-" + i + "\">"
			+ "<div class=\"faq-question\" onclick=\"toggleFaq(" + i + ")\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\">"
			+ "<div class=\"faq-q-inner\">"
			+ "<span class=\"faq-num\">" + num + "</span>"
			+ "<span class=\"faq-q-text\">" + item.q + "</span>"
			+ "</div>"
			+ "<span class=\"faq-toggle\">+</span>"
			+ "</div>"
			+ "<div class=\"faq-answer\" id=\"faq-answer-" + i + "\">"
			+ "<div class=\"faq-answer-inner\">" + bodyHtml + "</div>"
			+ "</div>"
			+ "</div>";
	}
	return "<div class=\"faq-section\">"
		+ "<div class=\"faq-head section-head\">"
		+ "<div class=\"step-tag\">" + t.faqStep + "</div>"
		+ "<h2>" + t.faqTitle + "</h2>"
		+ "</div>"
		+ items
		+ "</div>";
}

function toggleFaq(index) {
	var item = document.getElementById("faq-item-" + index);
	var answer = document.getElementById("faq-answer-" + index);
	var inner = answer.querySelector(".faq-answer-inner");
	var isOpen = item.classList.contains("open");
	// Close all
	var allItems = document.querySelectorAll(".faq-item");
	var allAnswers = document.querySelectorAll(".faq-answer");
	for (var i = 0; i < allItems.length; i++) {
		allItems[i].classList.remove("open");
		allAnswers[i].style.maxHeight = "0";
		var btn = allItems[i].querySelector(".faq-question");
		if (btn) btn.setAttribute("aria-expanded", "false");
	}
	// Open clicked if it was closed
	if (!isOpen) {
		item.classList.add("open");
		answer.style.maxHeight = inner.scrollHeight + "px";
		item.querySelector(".faq-question").setAttribute("aria-expanded", "true");
	}
}

function render(lang) {
	var t = I18N[lang];
	var i, html = "";
	document.documentElement.lang = t.lang;
	document.getElementById("hero-title").innerHTML = t.heroTitle;
	document.getElementById("hero-sub").innerHTML = t.heroSub;
	document.getElementById("footer-text").textContent = t.footer;
	document.getElementById("cta-label").textContent = t.ctaLabel;
	document.getElementById("back-link").textContent = t.back;
	for (i = 0; i < t.services.length; i++) { html += renderService(t.services[i], t); }
	document.getElementById("services-container").innerHTML = html;
	document.getElementById("faq-container").innerHTML = renderFAQ(t);
}

function switchLang(lang) {
	if (lang === currentLang) return;
	currentLang = lang;
	var btns = document.querySelectorAll(".lang-btn");
	for (var i = 0; i < btns.length; i++) {
		if (btns[i].getAttribute("data-lang") === lang) {
			btns[i].classList.add("active");
		} else {
			btns[i].classList.remove("active");
		}
	}
	var container = document.getElementById("services-container");
	container.classList.add("fading");
	setTimeout(function() {
		render(lang);
		container.classList.remove("fading");
	}, 160);
}

function copyContact() {
	var t = I18N[currentLang];
	var label = document.getElementById("cta-label");
	navigator.clipboard.writeText(CONTACT.wechat).then(function() {
		label.textContent = t.ctaCopied;
		window.location.href = "weixin://"; 
		setTimeout(function() { label.textContent = t.ctaLabel; }, 2200);
	}).catch(function() {
		label.textContent = CONTACT.wechat;
		window.location.href = "weixin://"; 
		setTimeout(function() { label.textContent = t.ctaLabel; }, 2200);
	});
}

document.addEventListener("DOMContentLoaded", function() { render("zh"); });
