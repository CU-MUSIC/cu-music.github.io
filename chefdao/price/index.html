
<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Rates | ChefDao</title>
	<style>
		/* ── Dark canvas · 黑白极简 + 墨绿只做面（呼应 ChefDao 绿标）── */
		:root {
			color-scheme: dark;
			/* --ink：所有半透明叠加层的底色三元组。深色模式是白、浅色模式是近黑，
			   改这一处，几十个 rgba() 全部跟着翻转。 */
			--ink: 255, 255, 255;
			--veil: 8, 8, 8;
			--well: rgba(0, 0, 0, 0.4);
			--pill-bg: rgba(17, 17, 17, 0.85);
			--warn: #d99;
			--pure: var(--pure);
			--cta-bg: #f0f0f0;
			--cta-fg: #0a0a0a;
			--amber: 232, 201, 138;
			--amber-t: var(--amber-t);
			--green-ink: 96, 176, 134;
			--bg: #080808;
			--surface: #111111;
			--surface-hover: #161616;
			--text-primary: #f0f0f0;
			--text-secondary: #9a9a9a;
			--text-dim: #7d7d7d;
			--green-deep: #0d1f16;
			--green-line: rgba(var(--green-ink), 0.25);
			--green-soft: #8fc3a9;
			--border: rgba(var(--ink), 0.08);
			--border-hover: rgba(var(--ink), 0.2);
			--font: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
			--ease: cubic-bezier(0.16, 1, 0.3, 1);
			--r: 14px;
		}
		/* ── 浅色模式：中性灰底（不用纯白，室外不刺眼也不廉价）+ 深绿呼应 ── */
		:root[data-theme="light"] {
			color-scheme: light;
			--ink: 22, 27, 24;          /* 叠加层改用近黑带一丝绿 */
			--veil: 236, 238, 236;
			--well: rgba(var(--ink), 0.06);
			--pill-bg: rgba(252, 253, 252, 0.9);
			--warn: #a33;
			--pure: #0d100f;
			--cta-bg: #1a1e1c;
			--cta-fg: #f4f6f4;
			--amber: 138, 106, 26;
			--amber-t: #7a5d13;
			--green-ink: 31, 107, 74;
			--bg: #eceeec;
			--surface: #f6f7f5;
			--surface-hover: #e6e9e6;
			--text-primary: #141816;
			--text-secondary: #4f5653;
			--text-dim: #656c68;
			--green-deep: #e7efe9;      /* 报价单面板：极浅绿 */
			--green-line: rgba(var(--green-ink), 0.3);
			--green-soft: #1f6b4a;      /* 深绿，浅底上对比 5:1 */
		}
		/* 浅底上白字会消失，主按钮与总价改用反相色 */
		:root[data-theme="light"] .qb-total { color: var(--text-primary); }
		:root[data-theme="light"] .hero h1 { text-shadow: 1px 2px 0 rgba(var(--green-ink), 0.14); }
		:root[data-theme="light"] .qb-prog-fill { background: var(--green-soft); }
		/* 浅底上药丸接近白色，靠阴影而不是边框立起来 */
		:root[data-theme="light"] .floating-btn { border-color: rgba(var(--ink), 0.1); box-shadow: 0 4px 20px rgba(var(--ink), 0.1), 0 1px 3px rgba(var(--ink), 0.08); }
		:root[data-theme="light"] .sec-nav { box-shadow: 0 1px 12px rgba(var(--ink), 0.05); }
		/* 开关：浅色模式下轨道用深色、滑块用浅色，否则两者同色会看不见 */
		:root[data-theme="light"] .qb-switch { background: rgba(var(--ink), 0.2); }
		:root[data-theme="light"] .qb-switch::after { background: var(--surface); }
		:root[data-theme="light"] .qb-member.on .qb-switch { background: var(--green-soft); }
		:root[data-theme="light"] .qb-producer.on .qb-switch { background: var(--text-primary); }
		:root[data-theme="light"] .qb-member.on .qb-switch::after,
		:root[data-theme="light"] .qb-producer.on .qb-switch::after { background: #f6f7f5; }
		/* 主题切换按钮 */
		.theme-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; margin-left: 8px; border-radius: 100px; border: 0.5px solid var(--border); background: var(--surface); color: var(--text-secondary); font-size: 14px; line-height: 1; cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s; flex-shrink: 0; }
		.theme-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }
		body { transition: background 0.3s var(--ease), color 0.3s var(--ease); }
		* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
		html { scroll-behavior: smooth; }
		body { background: var(--bg); color: var(--text-primary); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.6; }
		.container { max-width: 960px; margin: 0 auto; padding: 72px 24px; padding-bottom: calc(130px + env(safe-area-inset-bottom)); }

		/* reveal animation */
		.reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
		.reveal.in { opacity: 1; transform: none; }
		@media (prefers-reduced-motion: reduce) {
			html { scroll-behavior: auto; }
			.reveal { opacity: 1; transform: none; transition: none; }
			#entry-gate { transition: none !important; }
		}

		/* ── Entry gate (开屏选择) ─────────────────────────── */
		#entry-gate { position: fixed; inset: 0; z-index: 200; background: rgba(var(--veil), 0.94); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 1; transition: opacity 0.55s var(--ease); }
		#entry-gate.leaving { opacity: 0; pointer-events: none; }
		.gate-inner { max-width: 720px; width: 100%; }
		.gate-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 16px; }
		.gate-title { font-size: clamp(30px, 7vw, 52px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; margin-bottom: 12px; }
		.gate-sub { color: var(--text-secondary); font-size: 14px; max-width: 420px; line-height: 1.7; margin-bottom: 36px; }
		.gate-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
		.gate-card { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 24px 22px; cursor: pointer; font-family: var(--font); transition: transform 0.4s var(--ease), border-color 0.3s, background 0.3s; min-height: 120px; opacity: 0; transform: translateY(18px); animation: gateIn 0.7s var(--ease) forwards; }
		.gate-card:nth-child(2) { animation-delay: 0.08s; }
		.gate-card:nth-child(3) { animation-delay: 0.16s; }
		@keyframes gateIn { to { opacity: 1; transform: none; } }
		.gate-card:hover { transform: translateY(-3px); border-color: rgba(var(--ink), 0.3); background: var(--surface-hover); }
		.gate-card:active { transform: translateY(-1px); }
		.gate-card-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
		.gate-card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; flex-grow: 1; }
		.gate-arrow { font-size: 14px; color: var(--text-secondary); transition: transform 0.3s var(--ease); }
		.gate-card:hover .gate-arrow { transform: translateX(4px); }

		/* ── Top bar ───────────────────────────────────────── */
		.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; gap: 12px; }
		.back-nav { display: inline-flex; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; min-height: 44px; flex-shrink: 0; }
		.back-nav:hover { color: var(--text-primary); }
		.lang-switcher { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 100px; padding: 4px; }
		.lang-btn { background: none; border: none; color: var(--text-secondary); font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 6px 12px; border-radius: 100px; cursor: pointer; transition: background 0.2s, color 0.2s; min-height: 32px; white-space: nowrap; }
		.lang-btn:hover { color: var(--text-primary); }
		.lang-btn.active { background: var(--surface-hover); color: var(--text-primary); border: 0.5px solid var(--border-hover); }

		/* ── Hero ──────────────────────────────────────────── */
		.hero { margin-bottom: 80px; }
		/* 品牌锁：中文名主体 + 英文副行 */
		.hero-kicker { margin-bottom: 16px; }
		/* 品牌行只做「署名」，不跟主标题抢焦点：无阴影、字号压到主标题的 ~20% */
		.hk-cn { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: none; color: var(--text-secondary); line-height: 1.35; }
		@media (max-width: 640px) { .hk-cn { font-size: 14px; } }
		/* 大标题只取极淡的一层：字号大，绿边一重就廉价 */
		.hero h1 { font-size: clamp(36px, 9vw, 72px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; margin-bottom: 16px;
			text-shadow: 2px 3px 0 rgba(var(--green-ink), 0.16), 0 0 70px rgba(var(--green-ink), 0.13); }
		.hero-sub { color: var(--text-secondary); font-size: 15px; max-width: 480px; line-height: 1.7; }

		/* ── Schedule line (排期，计算器顶部，克制细线) ─────── */
		.qb-sched { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 0 2px 16px; margin-bottom: 22px; border-bottom: 0.5px solid var(--border); }
		.qb-sched-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-soft); flex-shrink: 0; animation: qpulse 2.6s var(--ease) infinite; }
		@keyframes qpulse { 0% { box-shadow: 0 0 0 0 rgba(var(--green-ink),0.45); } 70% { box-shadow: 0 0 0 5px rgba(var(--green-ink),0); } 100% { box-shadow: 0 0 0 0 rgba(var(--green-ink),0); } }
		.qb-sched-live { font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--green-soft); margin-right: 4px; }
		.qb-sched-item { font-size: 12px; color: var(--text-dim); }
		.qb-sched-item strong { color: var(--text-primary); font-weight: 600; }
		.qb-sched-sep { color: var(--text-dim); opacity: 0.45; font-size: 11px; }
		@media (prefers-reduced-motion: reduce) { .qb-sched-dot { animation: none; } }
		@media (max-width: 640px) { .qb-sched-item { font-size: 11.5px; } .qb-sched-sep { display: none; } }

		/* ── Help "?" (跳转到刀门) ─────────────────────────── */
		.qb-help { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 0.5px solid var(--border-hover); color: var(--text-secondary); font-size: 10px; font-weight: 700; line-height: 1; margin-left: 6px; cursor: pointer; transition: border-color 0.2s, color 0.2s; vertical-align: middle; }
		.qb-help:hover { border-color: var(--green-soft); color: var(--green-soft); }

		/* ── Sections ──────────────────────────────────────── */
		.service-section { margin-bottom: 72px; scroll-margin-top: 72px; }
		.faq-section, .member-card { scroll-margin-top: 72px; }
		.section-head { margin-bottom: 28px; }
		.step-tag { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; gap: 6px; }
		.step-tag::before { content: ""; display: block; width: 18px; height: 1px; background: currentColor; opacity: 0.6; }
		.section-head h2 { font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: -0.02em; }
		.sub-desc { display: block; font-size: 12.5px; color: var(--text-dim); margin-top: 8px; max-width: 560px; line-height: 1.65; }

		/* ── Cards ─────────────────────────────────────────── */
		.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: stretch; }
		.card-grid.solo { max-width: 380px; }
		.price-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.3s var(--ease), background 0.3s var(--ease), transform 0.3s var(--ease); }
		.price-card:hover { border-color: var(--border-hover); background: var(--surface-hover); transform: translateY(-3px); }
		.card-price { display: flex; align-items: baseline; gap: 2px; line-height: 1; }
		.card-price-num { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
		.card-price-unit { font-size: 13px; color: var(--text-secondary); margin-left: 1px; }
		.card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-top: 4px; }
		.card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.65; flex-grow: 1; }
		.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
		.tag { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: 0.5px solid var(--border); color: var(--text-secondary); }

		/* ── Quote Builder ─────────────────────────────────── */
		.quote-builder { background: var(--surface); border: 0.5px solid rgba(var(--ink), 0.12); border-radius: var(--r); padding: 28px; position: relative; overflow: hidden; }
		.quote-builder > * { position: relative; }
		.qb-mode { display: flex; gap: 4px; background: var(--well); border: 0.5px solid var(--border); border-radius: 12px; padding: 4px; }
		.qb-mode-btn { flex: 1; background: none; border: 0.5px solid transparent; border-radius: 9px; padding: 11px 10px; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: background 0.25s, color 0.25s, border-color 0.25s; }
		.qb-mode-btn.active { background: var(--surface-hover); color: var(--text-primary); border-color: var(--border-hover); }
		.qb-row { margin-bottom: 24px; }
		.qb-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; }
		.qb-base-line { display: flex; justify-content: space-between; align-items: baseline; background: rgba(var(--ink), 0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 15px; font-size: 12.5px; color: var(--text-secondary); margin-top: 12px; }

		/* ── Progressive reveal (逐步揭示) ─────────────────── */
		/* 每一步只在上一步作答后才挂载；.qb-in 由 JS 在下一帧加上，
		   已经存在过的步骤（qbMounted）直接给 .qb-in，避免重渲染时整页重播动画。*/
		.qb-step { opacity: 0; transform: translateY(14px); transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); }
		.qb-step.qb-in { opacity: 1; transform: none; }
		.qb-step-idx { display: inline-block; min-width: 18px; color: var(--text-dim); margin-right: 9px; font-variant-numeric: tabular-nums; }
		.qb-step.active .qb-step-idx { color: var(--green-soft); }
		.qb-hint { font-size: 12px; color: var(--text-secondary); line-height: 1.65; margin-top: 12px; padding-left: 12px; border-left: 1px solid var(--green-line); }
		.qb-chips { display: flex; gap: 8px; flex-wrap: wrap; }
		.qb-chip { background: rgba(var(--ink), 0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 20px; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: border-color 0.25s, color 0.25s, background 0.25s; }
		.qb-chip:hover { border-color: var(--border-hover); color: var(--text-primary); }
		.qb-chip.active { border-color: rgba(var(--ink), 0.45); color: var(--text-primary); background: rgba(var(--ink), 0.05); }
		.qb-share { display: block; width: 100%; margin-top: 9px; background: rgba(var(--green-ink), 0.10); border: 0.5px solid var(--green-line); border-radius: 10px; padding: 13px; font-family: var(--font); font-size: 12.5px; font-weight: 600; color: var(--green-soft); cursor: pointer; transition: background 0.2s; }
		.qb-share:hover { background: rgba(var(--green-ink), 0.18); }
		.qb-reset { display: block; width: 100%; margin-top: 10px; background: none; border: none; color: var(--text-dim); font-family: var(--font); font-size: 11.5px; padding: 8px; cursor: pointer; transition: color 0.2s; }
		.qb-reset:hover { color: var(--text-secondary); }
		/* 推荐档：只在该步待作答时呼吸微光，选完就安静下来 */
		.qb-step.active .qb-rec { border-color: var(--green-line); background: rgba(var(--green-ink), 0.06); animation: qbGlow 2.8s var(--ease) infinite; }
		@keyframes qbGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--green-ink),0); } 50% { box-shadow: 0 0 0 4px rgba(var(--green-ink),0.09); } }
		.qb-badge { display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 100px; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; line-height: 1.5; white-space: nowrap; color: var(--green-soft); border: 0.5px solid var(--green-line); background: rgba(var(--green-ink), 0.08); vertical-align: middle; transition: opacity 0.3s; }
		.qb-step:not(.active) .qb-badge { opacity: 0.4; }
		@media (prefers-reduced-motion: reduce) { .qb-step { opacity: 1; transform: none; transition: none; } .qb-step.active .qb-rec { animation: none; } }
		.qb-base-line strong { font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
		.qb-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
		.qb-seg-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; background: rgba(var(--ink), 0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 13px; cursor: pointer; transition: border-color 0.25s, background 0.25s; font-family: var(--font); text-align: left; min-height: 60px; }
		.qb-seg-btn:hover { border-color: var(--border-hover); }
		.qb-seg-btn.active { border-color: rgba(var(--ink), 0.45); background: rgba(var(--ink), 0.04); }
		.qb-seg-name { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
		.qb-seg-price { font-size: 12px; color: var(--text-secondary); }
		.qb-seg-btn.active .qb-seg-price { color: var(--green-soft); font-weight: 600; }
		.qb-tier-desc { font-size: 12px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; }
			.qb-cover-note { font-size: 12px; color: var(--green-soft); line-height: 1.65; margin-top: 12px; padding: 10px 12px; border: 0.5px solid var(--green-line); background: rgba(var(--green-ink), 0.06); border-radius: 9px; }
			/* 建议卡：不拦人，只讲清没有 VP 会失去什么；流行歌可以理直气壮忽略 */
			.qb-advice { margin-top: 12px; padding: 13px 14px; border: 0.5px solid rgba(var(--amber), 0.28); background: rgba(var(--amber), 0.055); border-radius: 10px; }
			.qb-advice-t { font-size: 12.5px; font-weight: 700; color: var(--amber-t); line-height: 1.55; }
			.qb-advice-b { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-top: 7px; }
			.qb-advice-ok { font-size: 11.5px; color: var(--text-dim); line-height: 1.65; margin-top: 8px; padding-top: 8px; border-top: 0.5px solid rgba(var(--amber), 0.16); }
			.qb-advice-btn { margin-top: 11px; background: rgba(var(--amber), 0.12); border: 0.5px solid rgba(var(--amber), 0.36); color: var(--amber-t); font-family: var(--font); font-size: 12px; font-weight: 600; padding: 9px 15px; border-radius: 100px; cursor: pointer; transition: background 0.2s; }
			.qb-advice-btn:hover { background: rgba(var(--amber), 0.2); }
			/* 解释默认收起：一行结论常驻，细节按需展开 */
			.qb-lead { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-top: 11px; }
			/* 决策表：对号入座，替代整段说明文字 */
			/* 标题旁的问号：所有说明收在这里，点开才显示 */
			.qb-q { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-left: 10px; padding: 0; border-radius: 50%; border: 1px solid rgba(var(--ink), 0.32); background: rgba(var(--ink), 0.05); color: var(--text-primary); font-family: var(--font); font-size: 12px; font-weight: 700; line-height: 1; letter-spacing: 0; text-transform: none; cursor: pointer; vertical-align: middle; transition: background 0.2s, border-color 0.2s, color 0.2s; }
			.qb-q:hover { border-color: var(--pure); background: rgba(var(--ink), 0.12); }
			.qb-q.on { background: var(--green-soft); border-color: var(--green-soft); color: var(--green-deep); }

		/* 深绿呼吸光：这是全页唯一持续动的元素，视线自然被吸过去 */
		@keyframes pbBreathe {

		/* 交付提速是会员的第二个卖点，单独给它一层呼吸，和按钮的光错开节奏 */

			0%, 100% { background: rgba(var(--green-ink), 0.10); box-shadow: 0 0 0 0 rgba(var(--green-ink), 0); }

<script>
// 报价计算器价格改各语言的 quote 对象（base / prods / perHead / edits / stems）。
// 分轨与贴唱共用人声维度加价（人声制作/多主唱/音编），只有基础价不同。
// 内部工资·成本·毛利结构见 _internal-pricing.md
// （该文件已在 .gitignore 中忽略，不会发布——此页为公开页面，请勿把内部经济数据写进这里）
var CONTACT = { wechat: "Cookdao" };
var SITE_URL = "cumusic.work/chefdao/price";
// ── 排期设置 ─────────────────────────────────────────────
// 标准：stdMin–stdMax 工作日（周日休息，跳过）；加急：rushMin–rushMax 自然日（含周日，加班）
// 交付日期全自动现算，平时零维护；真排爆了才把 backlogDays 调大几天，标准区间自动整体顺延
// memberMin/Max：刀门加速通道的工作日区间。6 个工作日（跳周日）正好是一周。
var SCHEDULE = { stdMin: 10, stdMax: 12, memberMin: 6, memberMax: 9, rushMin: 3, rushMax: 5, backlogDays: 0 };
function qbAddWorkdays(n) {
	var d = new Date(), added = 0;
	while (added < n) {
		d.setDate(d.getDate() + 1);
		if (d.getDay() !== 0) added++; // 0 = 周日，休息不计
	}
	return d;
}
function qbAddDays(n) { // 自然日，含周日
	var d = new Date();
	d.setDate(d.getDate() + n);
	return d;
}
// 晚 18:00 之后下单，当天已排不进，交付整体顺延一天（标准算工作日，加急算自然日）
var QB_CUTOFF_HOUR = 18;
function qbCutoff() { return new Date().getHours() >= QB_CUTOFF_HOUR ? 1 : 0; }
function qbFmtRange(d1, d2, lang) {
	var m1 = d1.getMonth(), m2 = d2.getMonth(), a = d1.getDate(), b = d2.getDate();
	var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
	if (lang === "en") return m1 === m2 ? MON[m1] + " " + a + "–" + b : MON[m1] + " " + a + " – " + MON[m2] + " " + b;
	if (lang === "ko") return m1 === m2 ? (m1 + 1) + "월 " + a + "–" + b + "일" : (m1 + 1) + "월 " + a + "일 – " + (m2 + 1) + "월 " + b + "일";

// ── Quote Builder state & logic ─────────────────────────────
// mode: 'vocal' | 'stems'; prods: per-vocalist vocal-production index array; edits: per-vocalist edit index array
// prods 索引：0 = 不需要，1 = 执行向（默认，见 QB_PROD_DEFAULT），2 = 创意向（每位主唱各选一档）
// edits 索引：0 = 不需要，1 = 基础编辑（音准/节奏二选一），2 = 标准编辑（节奏+音准），3 = 深度编辑（每位主唱各选一档）
// 纯混音（全员 prods=0）时 qbEnforceFloor 强制至少一位含音编 → 最低单 = 200 + 100 = 300
// null = 尚未作答。逐步揭示：一步作答后下一步才挂载，引导文案随之分批出现。
var qbState = { mode: null, stems: null, prods: [], harmony: null, count: null, edits: [], mem: [], producer: false, lane: null, targetDate: null, moreCount: false, aaOpen: false, fineOpen: false, aaCopy: true, help: {} };
// 制作人附加服务：按混音/制作小计加收的百分比（改这一个数就调价）
var PRODUCER_RATE = 0.5;
// 刀门会员折扣率（8 折 = 省 20%），按主唱逐位计算：只有会员/本单加入的那份享折扣
var MEMBER_OFF = 0.2;
// 每位主唱的混音毛价份额：共同部分（基础/分轨 + 多主唱混音 + 和声）平摊，人声制作与音编各归各
function qbGrossShares(q, count, base, mixExtra, harmPrice) {
	var shared = base + mixExtra + harmPrice, arr = [];
	for (var i = 0; i < count; i++) {
		arr.push(shared / count + q.prods[qbState.prods[i] || 0].price + q.edits[qbState.edits[i] || 0].price);
	}
	return arr;
}
// 会员状态：0 = 非会员，1 = 已是会员，2 = 本单加入（+会员费，同样享折扣）
function qbMemState(i) { return qbState.mem[i] || 0; }
// 已经出现过的步骤名 → 重渲染时直接可见，只有全新的步骤才播放淡入
var qbMounted = {};
// 每一步的推荐档位：该步待作答时呼吸微光 + 挂标签，给犹豫的人一个落点
// 人声制作/音编都按主唱逐位选，不挂推荐徽标，交给下方说明引导
var QB_REC = { mode: "vocal", stems: 1, harmony: 0, lane: 0 };
// 人声制作默认「执行向」：推荐档就是默认档，客户主动点「不需要」才会看到那张建议卡
var QB_PROD_DEFAULT = 1;
// ── 本地记忆（localStorage，纯本机，不上传）────────────────
// 会员身份记住后，老客户不用每次重选；上次配置记住后，回来能接着上次改
var LS_MEMBER = "cd_member", LS_STATE = "cd_quote", LS_THEME = "cd_theme", LS_MAX_AGE = 30 * 86400000;
function qbLsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function qbLsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
// ── 深/浅色 ────────────────────────────────────────────────
// 首次访问跟随系统，之后记住用户的选择
function qbApplyTheme(t) {
	document.documentElement.setAttribute("data-theme", t);
	var b = document.getElementById("theme-btn");
	if (b) { b.textContent = t === "light" ? "\u25D3" : "\u25D2"; b.title = t === "light" ? "Dark" : "Light"; }
	var m = document.querySelector('meta[name="theme-color"]');
	if (m) m.setAttribute("content", t === "light" ? "#eceeec" : "#080808");
}
function qbToggleTheme() {
	var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
	qbLsSet(LS_THEME, next);
	qbApplyTheme(next);
}
function qbInitTheme() {
	// 默认深色；只有用户主动切换过才用他存的偏好
	var t = qbLsGet(LS_THEME);
	qbApplyTheme(t === "light" ? "light" : "dark");
}
function qbIsRemembered() { return qbLsGet(LS_MEMBER) === "1"; }
function qbRememberMember(on) { qbLsSet(LS_MEMBER, on ? "1" : null); }
// 报价存档：点「复制报价」才算一次真订单，草稿不入档。最多留 5 条。
var LS_ORDERS = "cd_orders";
function qbOrders() { try { return JSON.parse(qbLsGet(LS_ORDERS) || "[]"); } catch (e) { return []; } }
function qbArchiveOrder(q, c) {
	var d = new Date(), stems = qbState.mode === "stems";
	var list = qbOrders();
	list.unshift({
		t: d.getTime(),
		dateTxt: (d.getMonth() + 1) + "/" + d.getDate(),
		totalTxt: qbFmt(q, c.total) + (c.from ? "+" : ""),
		label: (stems ? q.modeStems : q.modeVocal) + " · " + c.count + q.countUnit + q.vocalistLabel,
		s: JSON.parse(JSON.stringify(qbState))
	});
	qbLsSet(LS_ORDERS, JSON.stringify(list.slice(0, 5)));
}
function qbLoadOrder() {
	var o = qbOrders()[0];
	if (!o || !o.s) return;
	for (var k in qbState) if (o.s.hasOwnProperty(k)) qbState[k] = o.s[k];
	qbState.help = {};
	renderQuoteBuilder();
	qbScrollTo("svc-mixing");
}
function qbClearOrders() { qbLsSet(LS_ORDERS, null); renderQuoteBuilder(); }
// 多人合作：把配置编码进链接，群里传一次，每个人改自己那行再传回来。
// 纯前端，不需要后端，链接本身就是状态。
function qbEncodeState() {
	try { return btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, s: qbState })))).replace(/=+$/, ""); }
	catch (e) { return ""; }
}
function qbDecodeState(str) {
	try {
		var pad = str.length % 4 ? str + "====".slice(str.length % 4) : str;
		var o = JSON.parse(decodeURIComponent(escape(atob(pad))));
		if (!o || o.v !== 1 || !o.s) return false;
		for (var k in qbState) if (o.s.hasOwnProperty(k)) qbState[k] = o.s[k];
		qbState.help = {};
		return true;
	} catch (e) { return false; }
}
function qbShareLink() {
	var q = I18N[currentLang].quote;
	var url = location.origin + location.pathname + "#q=" + qbEncodeState();
	var btn = document.querySelector(".qb-share");
	var done = function () {
		if (!btn) return;
		btn.textContent = q.shareDone;
		setTimeout(function () { btn.textContent = q.share; }, 2000);
	};
	navigator.clipboard.writeText(url).then(done).catch(done);
}
function qbSaveState() {
	qbLsSet(LS_STATE, JSON.stringify({ v: 1, t: Date.now(), s: qbState }));
}
function qbRestoreState() {
	var raw = qbLsGet(LS_STATE);
	if (!raw) return false;
	try {
		var o = JSON.parse(raw);
		if (!o || o.v !== 1 || !o.s || Date.now() - o.t > LS_MAX_AGE) return false;
		var k, src = o.s;
		for (k in qbState) if (src.hasOwnProperty(k)) qbState[k] = src[k];
		qbState.help = {};
		return true;
	} catch (e) { return false; }
}
function qbBadge(text) { return '<span class="qb-badge">' + text + '</span>'; }
// 一行结论常驻，长解释收进折叠——屏幕上永远是「选项」多过「说明」
function qbWhy(label, body) {
	return '<details class="qb-why"><summary>' + label + '</summary><div class="qb-why-body">' + body + '</div></details>';
}

function qbFmt(q, n) {
	var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
	return q.cur + s;
}
function qbScrollTo(id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
// ── 作答后自动前进 ────────────────────────────────────────
// 点完一步，就把「下一处还要选的地方」送到眼前；顶部留出余量，
// 让上一步的选择结果仍在视野里（看得见自己刚选了什么，才敢往下走）。
// 落点放在视口约 30% 高度处——目标在上半区，上一步的选择还在眼里，不贴着顶边

		if (qbState.count >= q.countMax) countBody += '<div class="qb-more-note">' + q.countMoreNote + '</div>';
		html += qbRow("count", idx.count, q.countLabel, countBody, "", q.hints.count);
	}

	// 人声制作：每位主唱各选一档（人数之后，和音编同样的逐位卡片）
	if (shown >= idx.prod) {
		var prodRows = "", coverBinding = false;
		// 人多时给一排「全部设为」快捷键，全员同档时高亮对应档
		if (qbState.count > 1) {
			var pSame = qbAllSame(qbState.prods, qbState.count), pAllBtns = "";
			for (var pab = 0; pab < q.prods.length; pab++) {
				// 「全部设为 不需要」：只要有人已选免修，整排就会违规，直接禁用
				var pAllOff = false;
				if (qbCoverRuleOn() && pab === 0) {
					for (var pc = 0; pc < qbState.count; pc++) if (qbState.edits[pc] === 0) { pAllOff = true; break; }
				}
				pAllBtns += '<button class="qb-mini-btn' + (pab === pSame ? " active" : "") + (pAllOff ? " disabled" : "") + '"'
					+ (pAllOff ? ' disabled title="' + q.coverNote + '"' : ' onclick="qbSetAllProd(' + pab + ')"') + '>' + q.prods[pab].name + '</button>';
			}
			prodRows += '<div class="qb-voc-row qb-all-row"><span class="qb-voc-name">' + q.allLabel + '</span><div class="qb-mini-seg">' + pAllBtns + '</div></div>';
		}
		for (var pv = 0; pv < qbState.count; pv++) {
			var pchips = "";
			for (var pe = 0; pe < q.prods.length; pe++) {
				var plabel = q.prods[pe].name + (q.prods[pe].price ? " +" + qbFmt(q, q.prods[pe].price) : "");
				// 该主唱已选「免修」时，人声制作就不能再退回「不需要」——否则这个人声全程无处理
				var pOff = qbCoverRuleOn() && pe === 0 && qbState.edits[pv] === 0;
				if (pOff) coverBinding = true;
				pchips += '<button class="qb-mini-btn' + (qbState.prods[pv] === pe ? " active" : "") + (pOff ? " disabled" : "") + '"'
					+ (pOff ? ' disabled title="' + q.coverNote + '"' : ' onclick="qbSetProd(' + pv + ',' + pe + ')"') + '>' + plabel + '</button>';
			}
			prodRows += '<div class="qb-voc-row"><span class="qb-voc-name">' + q.vocalistLabel + ' ' + (pv + 1) + '</span><div class="qb-mini-seg">' + pchips + '</div></div>';
		}
		// 全员都没买人声制作 → 给一张建议卡（只提示，不拦；流行歌可忽略）
		var noVP = qbCoverRuleOn();
		if (noVP) { for (var nv = 0; nv < qbState.count; nv++) if ((qbState.prods[nv] || 0) > 0) { noVP = false; break; } }
		var adviceHtml = "";
		if (noVP) {
			var vpPrice = qbFmt(q, q.prods[1].price);
			var cta = (qbState.count > 1 ? q.vpAdviceCtaN : q.vpAdviceCta1).replace("{p}", vpPrice);
			adviceHtml = '<div class="qb-advice">'
				+ '<div class="qb-advice-t">' + q.vpAdviceTitle + '</div>'
				+ '<div class="qb-advice-b">' + q.vpAdviceBody + '</div>'
				+ '<button class="qb-advice-btn" onclick="qbSetAllProd(1)">' + cta + '</button>'
			+ '</div>';
		}
		// 决策表：档位名与价格从 q.prods 取，改价不用动文案
		var guideRows = "";
		for (var gi = 0; gi < (q.prodGuide || []).length; gi++) {
			var gRow = q.prodGuide[gi], gTier = q.prods[gRow.i];
			guideRows += '<tr><td>' + gRow.t + '</td><td>' + gTier.name
				+ (gTier.price ? " +" + qbFmt(q, gTier.price) : "") + '</td></tr>';
		}
		var prodHelp = '<div class="qb-guide-t">' + q.prodGuideTitle + '</div>'
			+ '<table class="qb-guide"><tbody>' + guideRows + '</tbody></table>'
			+ '<div class="qb-help-ops">' + q.prodNote + '</div>';
		var prodBody = '<div class="qb-voc-list">' + prodRows + '</div>'
			+ (coverBinding ? '<div class="qb-cover-line">' + q.coverShort + '</div>' : "")
			+ adviceHtml;
		html += qbRow("prod", idx.prod, q.prodLabel, prodBody, "", q.hints.prod, prodHelp);
	}

	// 音频编辑：每位主唱各选一档（编号随模式自动排）
	if (shown >= idx.edit) {
		var vocRows = "", floorBinding = false, coverBind2 = false;
		// 和声排在音编之后，此时可能还没选；只加钱不减钱，按 0 算即为最低总价，正是下限判断该用的值
		var harmPrice = qbState.harmony !== null ? q.harmonies[qbState.harmony].price : 0;
		// 人声制作此步已作答（排在音编之前），逐位累加
		var prodSum = 0;
		for (var ps = 0; ps < qbState.count; ps++) prodSum += q.prods[qbState.prods[ps]].price;
		var fixed = (stems ? q.stems[qbState.stems].price : q.base) + prodSum + harmPrice + q.perHead * (qbState.count - 1);
		// 人多时给一排「全部设为」快捷键（n≥2 时最低档 fixed≥minOrder，不触发地板，无需置灰）
		if (qbState.count > 1) {
			var eSame = qbAllSame(qbState.edits, qbState.count), eAllBtns = "";
			for (var eab = 0; eab < q.edits.length; eab++) {
				var eal = q.edits[eab].name + (q.edits[eab].price ? " +" + qbFmt(q, q.edits[eab].price) : "");
				// 「全部设为 免修」：只要有人没买人声制作，整排就会违规，直接禁用
				var eAllOff = false;
				if (qbCoverRuleOn() && eab === 0) {
					for (var ec = 0; ec < qbState.count; ec++) if ((qbState.prods[ec] || 0) === 0) { eAllOff = true; break; }
				}
				eAllBtns += '<button class="qb-mini-btn' + (eab === eSame ? " active" : "") + (eAllOff ? " disabled" : "") + '"'
					+ (eAllOff ? ' disabled title="' + q.coverNote + '"' : ' onclick="qbSetAllEdit(' + eab + ')"') + '>' + eal + '</button>';
			}
			vocRows += '<div class="qb-voc-row qb-all-row"><span class="qb-voc-name">' + q.allLabel + '</span><div class="qb-mini-seg">' + eAllBtns + '</div></div>';
		}
		for (var v = 0; v < qbState.count; v++) {
			// 只有当其余主唱都已定档，才知道这一档会不会把总价压到最低消费以下
			var others = 0, othersSet = true;
			for (var o = 0; o < qbState.count; o++) {
				if (o === v) continue;

				others += q.edits[qbState.edits[o]].price;
			}
			var chips = "";
			for (var e2 = 0; e2 < q.edits.length; e2++) {
				var label = q.edits[e2].name + (q.edits[e2].price ? " +" + qbFmt(q, q.edits[e2].price) : "");
				var off = othersSet && (fixed + others + q.edits[e2].price) < q.minOrder;
				if (off) floorBinding = true;
				// 这位主唱没买人声制作 → 音编不能选「免修」，否则这个人声全程无处理
				if (qbCoverRuleOn() && e2 === 0 && (qbState.prods[v] || 0) === 0) { off = true; coverBind2 = true; }
				chips += '<button class="qb-mini-btn' + (qbState.edits[v] === e2 ? " active" : "") + (off ? " disabled" : "") + '"'
					+ (off ? ' disabled title="' + q.floorNote + '"' : ' onclick="qbSetEdit(' + v + ',' + e2 + ')"') + '>' + label + '</button>';
			}
			vocRows += '<div class="qb-voc-row"><span class="qb-voc-name">' + q.vocalistLabel + ' ' + (v + 1) + '</span><div class="qb-mini-seg">' + chips + '</div></div>';
		}
		// 与人声制作同一套：先给决策表对号入座，再给动作说明
		var eGuideRows = "";
		for (var eg = 0; eg < (q.editGuide || []).length; eg++) {
			var eRow = q.editGuide[eg], eTier = q.edits[eRow.i];
			eGuideRows += '<tr><td>' + eRow.t + '</td><td>' + eTier.name
				+ (eTier.price ? " +" + qbFmt(q, eTier.price) : "") + '</td></tr>';
		}
		var editWhy = '<div class="qb-guide-t">' + q.editGuideTitle + '</div>'
			+ '<table class="qb-guide"><tbody>' + eGuideRows + '</tbody></table>'
			+ '<div class="qb-help-ops">' + q.editNote + '</div>'
			+ (coverBind2 ? '<div class="qb-help-ops">' + q.coverNote + '</div>' : '')
			+ (floorBinding ? '<div class="qb-help-ops">' + q.floorNote + '</div>' : '');
		var editBody = '<div class="qb-voc-list">' + vocRows + '</div>'
			+ (coverBind2 ? '<div class="qb-cover-line">' + q.coverShort + '</div>' : '');
		html += qbRow("edit", idx.edit, q.editLabel, editBody, "", q.hints.edit, editWhy);
	}

	// 和声 / 叠唱密度：靠后选（人数、音编之后，交付之前）。按感觉分档，不数轨道，让和声多的人自己认领更高档
	if (shown >= idx.harmony) {
		var harmBtns = "";
		for (var hh = 0; hh < q.harmonies.length; hh++) {
			var hp = q.harmonies[hh].price ? "+" + qbFmt(q, q.harmonies[hh].price) : "—";
			harmBtns += '<button class="qb-seg-btn' + (hh === QB_REC.harmony ? " qb-rec" : "") + (hh === qbState.harmony ? " active" : "") + '" onclick="qbSet(\'harmony\',' + hh + ')">'
				+ '<span class="qb-seg-name">' + q.harmonies[hh].name + (hh === QB_REC.harmony ? qbBadge(q.recPick) : "") + '</span>'
				+ '<span class="qb-seg-price">' + hp + '</span></button>';
		}
		html += qbRow("harmony", idx.harmony, q.harmonyLabel, '<div class="qb-seg four">' + harmBtns + '</div>',
			qbState.harmony !== null ? q.harmonies[qbState.harmony].desc : "", q.hints.harmony);
	}

	// 交付日期：标准 stdMin–stdMax 工作日（跳周日）+积压；加急 rushMin–rushMax 自然日（含周日）
	// 晚 18:00 后下单当天排不进，cut=1 让整体顺延一天
	var cut = qbCutoff();
	var stdRange = qbFmtRange(qbAddWorkdays(qbStdMinDays()), qbAddWorkdays(qbStdMaxDays()), currentLang);
	var rushRange = qbFmtRange(qbAddDays(SCHEDULE.rushMin + cut), qbAddDays(SCHEDULE.rushMax + cut), currentLang);

	// 交付通道（最后一步）
	if (shown >= idx.lane) {
		var minISO = qbFmtISO(qbAddDays(RUSH_MIN_DAYS + cut));
		var laneBtns = ''
			+ '<button class="qb-seg-btn' + (QB_REC.lane === 0 ? " qb-rec" : "") + (qbState.lane === 0 ? " active" : "") + '" onclick="qbSet(\'lane\',0)">'
			+ '<span class="qb-seg-name">' + q.lanes[0].name + qbBadge(q.recMost) + '</span>'
			+ '<span class="qb-seg-price">' + q.laneStdSub.replace("{n}", qbStdSpan()).replace("{r}", stdRange) + '</span></button>'
			+ '<button class="qb-seg-btn' + (qbState.lane === 1 ? " active" : "") + '" onclick="qbSet(\'lane\',1)">'
			+ '<span class="qb-seg-name">' + q.lanes[1].name + '</span>'
			+ '<span class="qb-seg-price">' + q.laneSpecSub + '</span></button>';
		var laneBody = '<div class="qb-seg two">' + laneBtns + '</div>';
		if (qbState.lane === 1) {
			var info = q.laneDatePrompt, cls = "qb-date-info";
			if (qbState.targetDate) {
				var effDays = qbDaysUntil(qbState.targetDate) - cut, rr = qbRushRate(effDays);
				if (rr === null) { info = q.laneMinNote; cls += " warn"; }
				else if (rr === 0) { info = q.laneNoRush; cls += " ok"; }
				else { info = q.laneDaysLeft.replace("{d}", effDays) + " · " + q.rushName + " +" + Math.round(rr * 100) + "%"; cls += " fee"; }
			}
			var face = qbState.targetDate ? qbFmtDate(qbState.targetDate, currentLang) : q.laneDatePick;
				var setCls = qbState.targetDate ? " set" : "";
				var cta = qbState.targetDate ? q.laneDateChange : q.laneDateCta;
				var dIcon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="8" y1="2.5" x2="8" y2="6"></line><line x1="16" y1="2.5" x2="16" y2="6"></line></svg>';
				laneBody += '<div class="qb-date"><label class="qb-date-field' + setCls + '">'
					+ '<span class="qb-date-ic">' + dIcon + '</span>'
					+ '<span class="qb-date-face">' + face + '</span>'
					+ '<span class="qb-date-cta">' + cta + ' \u203a</span>'
					+ '<input type="date" class="qb-date-native" min="' + minISO + '" value="' + (qbState.targetDate || "") + '" onclick="try{this.showPicker()}catch(e){}" onchange="qbSetDate(this.value)">'
					+ '</label><div class="' + cls + '">' + info + '</div></div>';
		}
		html += qbRow("lane", idx.lane, q.laneLabel, laneBody, "", q.hints.lane, q.laneNote.replace("{n}", qbStdSpan()));
	}

	// 全部作答完毕，报价单才登场
	if (done) {
		var baseName = stems ? c.baseItem.name : q.tierNames[0];
		var lines = '<div class="qb-bd-line"><span>' + baseName + (c.count > 1 ? ' · ' + q.baseIncl : '') + '</span><span class="qb-bd-val">' + qbFmt(q, c.base) + (c.from ? "+" : "") + '</span></div>';
		for (var p3 = 0; p3 < q.prods.length; p3++) {
			if (c.prodCounts[p3] > 0 && q.prods[p3].price > 0)
			lines += '<div class="qb-bd-line"><span>' + q.prods[p3].name + ' × ' + c.prodCounts[p3] + '</span><span class="qb-bd-val">+' + qbFmt(q, q.prods[p3].price * c.prodCounts[p3]) + '</span></div>';
		}
		if (c.harmony.price > 0) {
			lines += '<div class="qb-bd-line"><span>' + q.harmonyBd + ' · ' + c.harmony.name + '</span><span class="qb-bd-val">+' + qbFmt(q, c.harmony.price) + '</span></div>';
		}
		if (c.count > 1) {
			lines += '<div class="qb-bd-line"><span>' + q.bdExtra.replace('{n}', c.count - 1) + '</span><span class="qb-bd-val">+' + qbFmt(q, c.mixExtra) + '</span></div>';
		}
		for (var e3 = 0; e3 < q.edits.length; e3++) {
			if (c.editCounts[e3] > 0 && q.edits[e3].price > 0) {
				lines += '<div class="qb-bd-line"><span>' + q.edits[e3].name + ' × ' + c.editCounts[e3] + '</span><span class="qb-bd-val">+' + qbFmt(q, q.edits[e3].price * c.editCounts[e3]) + '</span></div>';
			}
		}
		if (c.rush > 0) {
			lines += '<div class="qb-bd-line rush"><span>' + q.rushName + ' +' + Math.round(c.rushRate * 100) + '%</span><span class="qb-bd-val">+' + qbFmt(q, c.rush) + '</span></div>';
		}
		if (c.discount > 0) {
			lines += '<div class="qb-bd-line discount"><span>' + q.memberLine + (c.memCount > 1 ? ' × ' + c.memCount : "") + '</span><span class="qb-bd-val">−' + qbFmt(q, c.discount) + '</span></div>';
		}
		if (c.joinFee > 0) {
			lines += '<div class="qb-bd-line"><span>' + q.joinLine + (c.joinCount > 1 ? ' × ' + c.joinCount : "") + '</span><span class="qb-bd-val">+' + qbFmt(q, c.joinFee) + '</span></div>';
		}
		if (c.producer > 0) {
			lines += '<div class="qb-bd-line"><span>' + q.producerLine + ' +' + Math.round(PRODUCER_RATE * 100) + '%</span><span class="qb-bd-val">+' + qbFmt(q, c.producer) + '</span></div>';
		}
		var eq = stems ? "" : '<div class="qb-eq">' + q.eqPrefix + ' <strong>' + q.tierNames[c.maxProd] + '</strong></div>';
		var fromTag = c.from ? '<span class="qb-from">' + q.fromSuffix + '</span>' : '';
		var noteText = (stems ? q.stemsNote : q.note);
		if (c.fast && c.discount > 0) noteText += ' ' + q.memberFastNote;
		// AA 账单：多人时才有意义，折叠收起，避免手机信息过载
		var aaHtml = "";
		if (c.count > 1) {
			var shares = qbShares(q, c), aaRows = "";
			for (var a = 0; a < c.count; a++) {
				var aTag = q.edits[qbState.edits[a]].name;
				if (qbState.prods[a] > 0) aTag = q.prods[qbState.prods[a]].name + ' · ' + aTag;
				if (qbMemState(a) > 0) aTag += ' · ' + (qbMemState(a) === 2 ? q.mState2 : q.mState1);
				aaRows += '<div class="qb-aa-row"><span>' + q.vocalistLabel + ' ' + (a + 1)
					+ '<span class="qb-aa-tag">' + aTag + '</span></span>'
					+ '<span class="qb-aa-val">' + qbFmt(q, shares[a]) + (c.from ? "+" : "") + '</span></div>';
			}
			var aaOn = qbState.aaCopy !== false;
			aaHtml = '<details class="qb-fold"' + (qbState.aaOpen ? " open" : "") + ' ontoggle="qbState.aaOpen=this.open">'
				+ '<summary>' + q.aaTitle + '</summary>'
				+ '<div class="qb-fold-body">' + aaRows
				+ '<button class="qb-check' + (aaOn ? ' on' : '') + '" onclick="qbToggleAaCopy()" aria-pressed="' + aaOn + '">'
				+ '<span class="qb-check-box">' + (aaOn ? '\u2713' : '') + '</span>' + q.aaCopyLabel + '</button>'
				+ '<div class="qb-fold-note">' + q.aaNote + '</div></div></details>';
		}
		var fineHtml = '<details class="qb-fold"' + (qbState.fineOpen ? " open" : "") + ' ontoggle="qbState.fineOpen=this.open">'
			+ '<summary>' + q.fineTitle + '</summary>'
			+ '<div class="qb-fold-body"><div class="qb-fold-note">' + noteText + '</div></div></details>';
		var delivStr = c.fast ? qbFmtDate(qbState.targetDate, currentLang) : stdRange;
			var splitHtml = '<div class="qb-split">'
			+ '<div class="qb-split-row deposit"><span>' + q.depositLabel + '</span><span class="qb-split-val">' + qbFmt(q, c.deposit) + (c.from ? "+" : "") + '</span></div>'
			+ '<div class="qb-split-row"><span>' + q.balanceLabel + '</span><span class="qb-split-val">' + qbFmt(q, c.balance) + (c.from ? "+" : "") + '</span></div>'
			+ '<div class="qb-split-note">' + q.depositNote + '</div>'
			+ '</div>';
		// 刀门会员：逐位选（非会员 / 已是会员 / 本单加入），只有会员那份享 8 折
		var memStates = [q.mState0, q.mState1, q.mState2 + " +" + qbFmt(q, q.memberFee)];
		var memRows = "";
		if (c.count > 1) {
			var mSame = qbAllSame(qbState.mem, c.count), mAllBtns = "";
			for (var mab = 0; mab < 3; mab++) {
				mAllBtns += '<button class="qb-mini-btn' + (mab === mSame ? " active" : "") + '" onclick="qbSetAllMem(' + mab + ')">' + memStates[mab] + '</button>';
			}
			memRows += '<div class="qb-voc-row qb-all-row"><span class="qb-voc-name">' + q.allLabel + '</span><div class="qb-mini-seg">' + mAllBtns + '</div></div>';
		}
		for (var mv = 0; mv < c.count; mv++) {
			var mchips = "";
			for (var ms = 0; ms < 3; ms++) {
				mchips += '<button class="qb-mini-btn' + (qbMemState(mv) === ms ? " active" : "") + '" onclick="qbSetMem(' + mv + ',' + ms + ')">' + memStates[ms] + '</button>';
			}
			memRows += '<div class="qb-voc-row">' + (c.count > 1 ? '<span class="qb-voc-name">' + q.vocalistLabel + ' ' + (mv + 1) + '</span>' : "")
				+ '<div class="qb-mini-seg">' + mchips + '</div></div>';
		}
		// 回本提示：挑出「加入后能省最多」的那位非会员，一键加入
		var pbSave = -1, pbIdx = -1;
		for (var pb = 0; pb < c.count; pb++) {
			if (qbMemState(pb) > 0) continue;
			var sv = Math.round(c.gShares[pb] * MEMBER_OFF);
			if (sv > pbSave) { pbSave = sv; pbIdx = pb; }
		}
		var pbHtml = "";
		if (pbIdx >= 0) {
			var pbNet = pbSave - q.memberFee, pbGood = pbNet > 0;
			var fill = function (t) {
				return t.replace("{fee}", qbFmt(q, q.memberFee)).replace("{save}", qbFmt(q, pbSave))
					.replace("{net}", qbFmt(q, Math.abs(pbNet))).replace("{d}", qbMemSpan()).replace("{fast}", qbFastGain());
			};
			var pbMain = fill(pbGood ? q.pbYesMain : q.pbNoMain);
			if (c.count > 1) pbMain = q.vocalistLabel + " " + (pbIdx + 1) + " · " + pbMain;
			pbHtml = '<button class="qb-payback' + (pbGood ? "" : " dim") + '" onclick="qbSetMem(' + pbIdx + ',2)">'
				+ '<span class="qb-pb-main">' + pbMain + '</span>'
				+ '<span class="qb-pb-sub">' + fill(pbGood ? q.pbYesSub : q.pbNoSub) + '</span></button>';
		}
		// 单人单（绝大多数）只显示「一张要约卡 + 一个小字切换」；
		// 三档按钮与逐位说明只在多人合作时才有意义，那时才出现。
		var memBody;
		if (c.count === 1) {
			if (qbMemState(0) > 0) {
				memBody = '<div class="qb-mem-on">' + q.memOnLine.replace("{d}", qbMemSpan()) + '</div>'
					+ '<button class="qb-mem-link" onclick="qbSetMem(0,0)">' + q.memOff + '</button>';
			} else {
				memBody = pbHtml + '<button class="qb-mem-link" onclick="qbSetMem(0,1)">' + q.memAlready + '</button>';
			}
		} else {
			memBody = '<div class="qb-voc-list">' + memRows + '</div>'
				+ '<div class="qb-member-sub" style="margin-top:9px">' + q.memberPerNote + '</div>' + pbHtml;
		}
		var memberHtml = '<div class="qb-memblock' + (c.discount > 0 ? " on" : "") + '">'
			+ '<span class="qb-member-label">' + q.memberTitle
			+ ' <span class="qb-help" role="button" tabindex="0" title="' + q.memberHelp + '" onclick="qbScrollTo(\'svc-daomen\')">?</span></span>'
			+ memBody + '</div>';
		// 附加服务：担任制作人（按小计 +X%），打开后附一句 producer points 说明
		var producerHtml = '<button class="qb-member qb-producer' + (qbState.producer ? " on" : "") + '" onclick="qbSet(\'producer\',' + (!qbState.producer) + ')" aria-pressed="' + qbState.producer + '">'
			+ '<span><span class="qb-member-label">' + q.producerTitle + ' <span class="qb-plus">+' + Math.round(PRODUCER_RATE * 100) + '%</span></span>'
			+ '<span class="qb-member-sub">' + q.producerSub + '</span></span>'
			+ '<span class="qb-switch"></span></button>'
			+ (qbState.producer ? '<div style="margin-top:-8px;margin-bottom:16px">' + qbWhy(q.whyLabel, q.producerNote) + '</div>' : '');

		html += '<div class="qb-step" data-qstep="summary">' + memberHtml + producerHtml
			+ '<div class="qb-summary">' + eq + lines
			+ '<div class="qb-total-row"><span class="qb-total-label">' + q.totalLabel + '</span><span class="qb-total">' + qbFmt(q, c.total) + fromTag + '</span></div>'
			+ (c.count > 1 ? '<div class="qb-percap"><span>' + q.perHeadTotal + '</span><span class="qb-percap-v">' + qbFmt(q, Math.round(c.total / c.count)) + (c.from ? '+' : '') + '</span></div>' : '')
			+ '<div class="qb-bd-line deliver' + (qbHasMember() ? ' fast' : '') + '"><span>' + q.copyDeliver
				+ (qbHasMember() ? '<span class="qb-fast-tag">' + q.fastTag + '</span>' : '')
				+ '</span><span class="qb-bd-val">' + delivStr + '</span></div>'
				+ splitHtml + aaHtml + fineHtml + '</div>'
			+ '<button class="qb-cta" onclick="qbCopy()">' + q.cta + '</button>'
			+ (c.count > 1 ? '<button class="qb-share" onclick="qbShareLink()">' + q.share + '</button>' : '')
			+ '<button class="qb-reset" onclick="qbReset()">' + q.reset + '</button>'
			+ '</div>';
	}

	var tt = I18N[currentLang];
	var schedHtml = '<div class="qb-sched"><span class="qb-sched-dot"></span><span class="qb-sched-live">' + tt.schedLive + '</span>'
		+ '<span class="qb-sched-item">' + tt.schedStd.replace("{r}", stdRange) + '</span>'
		+ '<span class="qb-sched-sep">·</span>'
		+ '<span class="qb-sched-item">' + tt.schedRush.replace("{r}", rushRange) + '</span></div>';

	// 进度：已答步数 / 总步数——逐步展开时客户看不到还剩几步
	var progDone = 0;
	for (var pg = 0; pg < steps.length; pg++) if (qbAnswered(steps[pg])) progDone++;
	var progPct = Math.round(progDone / steps.length * 100);
	var progTxt = done ? q.progDone : q.progStep.replace("{n}", Math.min(progDone + 1, steps.length)).replace("{m}", steps.length);
	var progHtml = '<div class="qb-prog' + (done ? " done" : "") + '">'
		+ '<div class="qb-prog-bar"><div class="qb-prog-fill" style="width:' + progPct + '%"></div></div>'
		+ '<span class="qb-prog-txt">' + progTxt + '</span></div>';
	// 还没开始选时，把上次的报价亮出来——回访客户不用从头再点一遍
	var lastHtml = "";
	if (qbState.mode === null) {
		var od = qbOrders();
		if (od.length) {
			lastHtml = '<div class="qb-last"><span class="qb-last-l">' + q.lastLabel + ' · ' + od[0].dateTxt
				+ '<span class="qb-last-t">' + od[0].totalTxt + '　' + od[0].label + '</span></span>'
				+ '<span class="qb-last-a">'
				+ '<button class="qb-last-btn" onclick="qbLoadOrder()">' + q.lastResume + '</button>'
				+ '<button class="qb-last-btn ghost" onclick="qbClearOrders()">' + q.lastClear + '</button>'
				+ '</span></div>';
		}
	}
	mount.innerHTML = lastHtml + progHtml + '<div class="quote-builder">' + schedHtml + html + '</div>';

	// 首次出现的步骤淡入；已出现过的（含每次重渲染）立刻可见，避免整块重播动画
	var nodes = mount.querySelectorAll("[data-qstep]"), present = {};
	for (var m = 0; m < nodes.length; m++) {
		var key = nodes[m].getAttribute("data-qstep");
		present[key] = true;
		if (qbMounted[key]) nodes[m].classList.add("qb-in");
		else { qbMounted[key] = true; qbFadeIn(nodes[m]); }
	}
	// 被收回的步骤（改了前面的选择）忘掉它，下次再露面时重新淡入
	for (var k in qbMounted) { if (!present[k]) delete qbMounted[k]; }
	qbSaveState();
}
function qbFadeIn(el) {
	requestAnimationFrame(function() { requestAnimationFrame(function() { el.classList.add("qb-in"); }); });
}
// 复制成一张排版清爽的纯文本报价单：分区、缩进、留白——微信/任何输入框粘贴都稳。
// 不做列对齐（微信是比例字体，空格对不齐），靠分隔线与缩进营造层次。
function qbCopy() {
	var q = I18N[currentLang].quote;
	var c = qbCompute(q);
	var stems = qbState.mode === "stems";
	var baseName = stems ? c.baseItem.name : q.tierNames[0];
	var sfx = c.from ? "+" : "";
	// 微信是比例字体，列对不齐——所以不做对齐，靠「【】小节 + · 项目符 + 空行」分层
	var HH = "━━━━━━━━━━━━";
	var L = [];
	var d = new Date();
	var pad = function (n) { return (n < 10 ? "0" : "") + n; };
	L.push(q.brand + " ｜ " + q.copyTitle);
	L.push(d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()));
	L.push(HH);
	// 小节标题：混音类型 · 人数
	L.push((stems ? q.modeStems : q.modeVocal) + " · " + c.count + q.countUnit + q.vocalistLabel);
	L.push("");
	// 金额在前：一列数字最好扫。品类在前缀里补回来——
	// 「执行向」单独出现是黑话，「人声制作 · 执行向」才对得上计算器里的第 03 步
	// 第三个参数放算式（¥100 × 2 位），多人单里「×2」到底是几个人、单价多少，一眼看清
	var item = function (amount, name, note) { L.push(amount + "　" + name + (note ? "　" + note : "")); };
	// 单价 × 人数，仅在多于一份时才标，单人单保持干净
	var per = function (unit, n) { return n > 1 ? qbFmt(q, unit) + " × " + n + q.countUnit : ""; };
	// 多人单里必须点明基础价已含 1 位，否则下面那笔加价看着像糊涂账
	item(qbFmt(q, c.base) + sfx, baseName + (c.count > 1 ? " · " + q.baseIncl : ""));
	for (var p = 0; p < q.prods.length; p++) {
		if (c.prodCounts[p] > 0 && q.prods[p].price > 0)
			item("+" + qbFmt(q, q.prods[p].price * c.prodCounts[p]), q.catProd + " · " + q.prods[p].name, per(q.prods[p].price, c.prodCounts[p]));
	}
	for (var e = 0; e < q.edits.length; e++) {
		if (c.editCounts[e] > 0 && q.edits[e].price > 0)
			item("+" + qbFmt(q, q.edits[e].price * c.editCounts[e]), q.catEdit + " · " + q.edits[e].name, per(q.edits[e].price, c.editCounts[e]));
	}
	if (c.harmony.price > 0) item("+" + qbFmt(q, c.harmony.price), q.harmonyBd + " · " + c.harmony.name);
	if (c.count > 1) item("+" + qbFmt(q, c.mixExtra), q.bdExtra.replace("{n}", c.count - 1),
		qbFmt(q, q.perHead) + " × " + (c.count - 1) + q.countUnit);
	if (c.producer > 0) item("+" + qbFmt(q, c.producer), q.producerLine + " +" + Math.round(PRODUCER_RATE * 100) + "%");
	if (c.rush > 0) item("+" + qbFmt(q, c.rush), q.rushName + " +" + Math.round(c.rushRate * 100) + "%");
	if (c.joinFee > 0) item("+" + qbFmt(q, c.joinFee), q.joinLine + mul(c.joinCount));
	if (c.discount > 0) item("−" + qbFmt(q, c.discount), q.memberLine, c.memCount > 1 ? c.memCount + q.countUnit : "");
	L.push(HH);
	L.push("▍" + q.totalLabel + "　" + qbFmt(q, c.total) + sfx);
	// 多人单的关键卖点：人均比单独做更便宜，但客户只看得到总价
	if (c.count > 1) L.push("　" + q.perHeadTotal + "　" + qbFmt(q, Math.round(c.total / c.count)) + sfx);
	L.push(q.depositLabel + " " + qbFmt(q, c.deposit) + sfx + " ／ " + q.balanceLabel + " " + qbFmt(q, c.balance) + sfx);
	// 交付日期：按所选通道现算，含 18:00 顺延
	var cut = qbCutoff();
	var range = c.fast
		? qbFmtDate(qbState.targetDate, currentLang)
		: qbFmtRange(qbAddWorkdays(qbStdMinDays()), qbAddWorkdays(qbStdMaxDays()), currentLang);
	L.push(q.copyDeliver + " " + range);
	// 一个人付全款时不带分摊明细，由 AA 折叠里的勾选决定
	if (c.count > 1 && qbState.aaCopy !== false) {
		var shares = qbShares(q, c);
		L.push(HH);
		L.push(q.aaTitle);
		L.push("");
		for (var a = 0; a < c.count; a++) {
			var cTag = q.edits[qbState.edits[a]].name;
			if (qbState.prods[a] > 0) cTag = q.prods[qbState.prods[a]].name + " · " + cTag;
			if (qbMemState(a) > 0) cTag += " · " + (qbMemState(a) === 2 ? q.mState2 : q.mState1);
			L.push(qbFmt(q, shares[a]) + sfx + "　" + q.vocalistLabel + " " + (a + 1));
			L.push("　　　" + cTag);
		}
	}
	L.push(HH);
	L.push(q.copyWeChat + " · " + CONTACT.wechat);
	qbArchiveOrder(q, c);
	var txt = L.join("\n");
	var btn = document.querySelector(".qb-cta");
	var done = function() {
		if (btn) { btn.textContent = q.copied; setTimeout(function() { btn.textContent = q.cta; }, 2000); }
		window.location.href = "weixin://";
	};
	navigator.clipboard.writeText(txt).then(done).catch(done);
}

// ── Section rendering ───────────────────────────────────────
function renderCard(item) {
	var tags = "";
	if (item.tags && item.tags.length) {
		for (var i = 0; i < item.tags.length; i++) tags += '<span class="tag">' + item.tags[i] + '</span>';
	}
	var unit = item.unit ? '<span class="card-price-unit">' + item.unit + '</span>' : "";
	return '<div class="price-card">'
		+ '<div class="card-price"><span class="card-price-num">' + item.price + '</span>' + unit + '</div>'
		+ '<div class="card-title">' + item.title + '</div>'
		+ '<div class="card-desc">' + item.desc + '</div>'
		+ (tags ? '<div class="card-tags">' + tags + '</div>' : "")
		+ '</div>';
}
function renderProjectLead(svc) {
	var tags = "";
	for (var t = 0; t < svc.tags.length; t++) tags += '<span class="tag">' + svc.tags[t] + '</span>';
	var highlightsHtml = "";
	if (svc.highlights) {
		for (var h = 0; h < svc.highlights.length; h++) {
			highlightsHtml += '<div class="pl-highlight-item">'
				+ '<div class="pl-highlight-label">' + svc.highlights[h].label + '</div>'
				+ '<div class="pl-highlight-value">' + svc.highlights[h].value + '</div>'
				+ '</div>';
		}
	}
	return '<div class="service-section reveal" id="svc-' + svc.id + '">'
		+ '<div class="section-head"><div class="step-tag">' + svc.step + '</div><h2>' + svc.title + '</h2></div>'
		+ '<div class="projectlead-card">'
		+ (highlightsHtml ? '<div class="pl-highlights">' + highlightsHtml + '</div>' : "")
		+ '<span class="pl-deposit-label">' + svc.depositLabel + '</span>'
		+ '<span class="pl-deposit-num">' + svc.deposit + '</span>'
		+ '<div class="pl-desc">' + svc.desc + '</div>'
		+ '<div class="pl-tags card-tags">' + tags + '</div>'
		+ '<div class="pl-cta">' + svc.cta + '</div>'
		+ '</div></div>';
}
function renderMembership(svc) {
	var joins = "";
	for (var j = 0; j < svc.joins.length; j++) {
		joins += '<div class="mj-row"><span class="mj-num">' + svc.joins[j].num + '</span>'
			+ '<span><span class="mj-main">' + svc.joins[j].main + '</span><span class="mj-sub">' + svc.joins[j].sub + '</span></span></div>';
	}
	var perks = "";
	for (var p = 0; p < svc.perks.length; p++) {
		perks += '<div class="perk"><div class="perk-title">' + svc.perks[p].t + '</div><div class="perk-desc">' + svc.perks[p].d + '</div></div>';
	}
	return '<div class="member-card">'
		+ '<div class="member-intro">' + svc.intro + '</div>'
		+ '<div class="mj-label">' + svc.joinLabel + '</div>' + joins
		+ '<div class="mj-label" style="margin-top:26px">' + svc.perksLabel + '</div>'
		+ '<div class="perk-list">' + perks + '</div>'
		+ '</div>';
}
function renderRecording(svc) {
	var cards = "";
	for (var i = 0; i < svc.locations.length; i++) {
		var loc = svc.locations[i];
		var rates = "";
		for (var r = 0; r < loc.rates.length; r++) {
			rates += '<div class="loc-rate"><span class="loc-rate-label">' + loc.rates[r].label + '</span><span class="loc-rate-price">' + loc.rates[r].price + '</span></div>';
		}
		var venue = "";
		if (loc.venue) {
			venue = '<div class="loc-meta"><strong>' + loc.venue + '</strong>'
				+ (loc.address ? '<br>' + (loc.mapUrl ? '<a class="loc-map" href="' + loc.mapUrl + '" target="_blank" rel="noopener">' + loc.address + '</a>' : loc.address) : "")
				+ '</div>';
		}
		var gear = "";
		if (loc.gear && loc.gear.length) {
			for (var g = 0; g < loc.gear.length; g++) gear += '<span class="tag">' + loc.gear[g] + '</span>';
			gear = '<div class="loc-gear">' + gear + '</div>';
		}
		cards += '<div class="loc-card">'
			+ '<div class="loc-head"><span class="loc-city">' + loc.city + '</span><span class="loc-engineer">' + loc.engineer + '</span></div>'

			+ venue + gear + '</div>';

	return '<div class="loc-grid">' + cards + '</div>' + (svc.note ? '<div class="qb-addon-note">' + svc.note + '</div>' : "");

function renderCourse(svc) {
	var h = "";
	for (var i = 0; i < svc.stages.length; i++) {
		var st = svc.stages[i];
		h += '<div class="course-stage' + (st.soon ? " soon" : "") + '">'
			+ '<div class="course-head"><span class="course-tag">' + st.tag + '</span>'
			+ (st.badge ? '<span class="course-badge">' + st.badge + '</span>' : "") + '</div>'
			+ '<div class="course-name">' + st.name + '</div>';
		if (st.desc) h += '<div class="course-desc">' + st.desc + '</div>';
		if (st.fit || st.unfit) {
			var c = "";
			for (var a = 0; a < (st.fit || []).length; a++) c += '<span class="course-chip">' + st.fit[a] + '</span>';
			for (var b = 0; b < (st.unfit || []).length; b++) c += '<span class="course-chip off">' + st.unfit[b] + '</span>';
			h += '<div class="course-fit">' + c + '</div>';
		}
		if (st.modules) {
			var m = "";
			for (var k = 0; k < st.modules.length; k++) m += '<div class="course-mod">' + st.modules[k] + '</div>';
			h += '<div class="course-mods">' + m + '</div>';
		}
		if (st.prices) {
			var pr = "";
			for (var q2 = 0; q2 < st.prices.length; q2++) pr += '<div><span class="course-p">' + st.prices[q2].p + '</span><span class="course-l">' + st.prices[q2].l + '</span></div>';
			h += '<div class="course-prices">' + pr + '</div>';
		}
		if (st.soon) h += '<div class="course-soon">' + st.soon + '</div>';
		h += '</div>';
	}
	return h;
}
function renderFlow(svc) {
	var h = "";
	for (var i = 0; i < svc.steps.length; i++) {
		h += '<div class="flow-step"><span class="flow-n">' + (i + 1) + '</span>'
			+ '<span class="flow-c"><span class="flow-t">' + svc.steps[i].t + '</span>'
			+ '<span class="flow-d">' + svc.steps[i].d + '</span></span></div>';
	}

}
function renderService(svc) {
	var groupHead = svc.groupHead ? '<div class="group-head reveal">' + svc.groupHead + '</div>' : "";
	if (svc.type === "projectlead") return groupHead + renderProjectLead(svc);
	if (svc.type === "course") {
		return groupHead + '<div class="service-section reveal" id="svc-course">'
			+ '<div class="section-head"><div class="step-tag">' + svc.step + '</div><h2>' + svc.title + '</h2>'
			+ (svc.sub ? '<span class="sub-desc">' + svc.sub + '</span>' : "") + '</div>'
			+ renderCourse(svc) + '</div>';
	}
	if (svc.type === "flow") {
		return groupHead + '<div class="service-section reveal" id="svc-flow">'
			+ '<div class="section-head"><div class="step-tag">' + svc.step + '</div><h2>' + svc.title + '</h2>'
			+ (svc.sub ? '<span class="sub-desc">' + svc.sub + '</span>' : "") + '</div>'
			+ renderFlow(svc) + '</div>';
	}
	var head = '<div class="section-head"><div class="step-tag">' + svc.step + '</div><h2>' + svc.title + '</h2>'
		+ (svc.sub ? '<span class="sub-desc">' + svc.sub + '</span>' : "") + '</div>';
	var body;
	if (svc.type === "recording") {
		body = renderRecording(svc);
	} else if (svc.type === "membership") {
		body = renderMembership(svc);
	} else if (svc.builder) {
		body = '<div id="qb-mount"></div>';
	} else {
		var cards = "";
		for (var i = 0; i < svc.items.length; i++) cards += renderCard(svc.items[i]);
		body = '<div class="card-grid' + (svc.items.length === 1 ? " solo" : "") + '">' + cards + '</div>';
	}
	return groupHead + '<div class="service-section reveal" id="svc-' + svc.id + '">' + head + body + '</div>';
}
// FAQ 分组：21 条一字排开没人扫得完，切成 5 组、每组 ≤5 条。
// 索引是 0 基，三语言条目顺序一致，所以一份映射通用。
var FAQ_GROUPS = [
	[0, 1, 2, 19],
	[8, 9, 12, 18, 21],
	[3, 13, 14, 15, 16],
	[4, 5, 10, 20],
	[6, 7, 11, 17]
];
function renderFAQ(t) {
	if (!t.faqItems || !t.faqItems.length) return "";
	var items = "", shown = 0;
	for (var gi = 0; gi < FAQ_GROUPS.length; gi++) {
		var label = (t.faqGroups && t.faqGroups[gi]) || "";
		if (label) items += '<div class="faq-group">' + label + '</div>';
		for (var gj = 0; gj < FAQ_GROUPS[gi].length; gj++) {
			var i = FAQ_GROUPS[gi][gj];
			if (!t.faqItems[i]) continue;
			items += qbFaqItem(t.faqItems[i], i, ++shown);
		}
	}
	return '<div class="faq-section reveal">'
		+ '<div class="faq-head section-head"><div class="step-tag">' + t.faqStep + '</div><h2>' + t.faqTitle + '</h2></div>'
		+ items + '</div>';
}
// id / toggleFaq 用原始索引（保持锚点稳定），显示编号用展示顺序
function qbFaqItem(item, i, seq) {
	{
		var num = (seq < 10 ? "0" : "") + seq;
		var bodyHtml = "";
		if (item.a) bodyHtml += "<p>" + item.a + "</p>";
		if (item.list && item.list.length) {
			bodyHtml += "<ul>";
			for (var j = 0; j < item.list.length; j++) bodyHtml += "<li>" + item.list[j] + "</li>";
			bodyHtml += "</ul>";
		}
		return '<div class="faq-item" id="faq-item-' + i + '">'
			+ '<div class="faq-question" onclick="toggleFaq(' + i + ')" role="button" tabindex="0" aria-expanded="false">'
			+ '<div class="faq-q-inner"><span class="faq-num">' + num + '</span><span class="faq-q-text">' + item.q + '</span></div>'
			+ '<span class="faq-toggle">+</span></div>'
			+ '<div class="faq-answer" id="faq-answer-' + i + '"><div class="faq-answer-inner">' + bodyHtml + '</div></div>'
			+ '</div>';
	}
}
function toggleFaq(index) {
	var item = document.getElementById("faq-item-" + index);
	var answer = document.getElementById("faq-answer-" + index);
	var inner = answer.querySelector(".faq-answer-inner");
	var isOpen = item.classList.contains("open");
	var allItems = document.querySelectorAll(".faq-item");
	var allAnswers = document.querySelectorAll(".faq-answer");
	for (var i = 0; i < allItems.length; i++) {
		allItems[i].classList.remove("open");
		allAnswers[i].style.maxHeight = "0";
		var btn = allItems[i].querySelector(".faq-question");
		if (btn) btn.setAttribute("aria-expanded", "false");
	}
	if (!isOpen) {
		item.classList.add("open");
		answer.style.maxHeight = inner.scrollHeight + "px";
		item.querySelector(".faq-question").setAttribute("aria-expanded", "true");
	}
}

// ── Entry gate ──────────────────────────────────────────────
function entryGo(target) {
	var gate = document.getElementById("entry-gate");
	gate.classList.add("leaving");
	setTimeout(function() { gate.style.display = "none"; }, 560);
	if (target === "browse") return;
	setTimeout(function() {
		var el = document.getElementById("svc-" + target);
		if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
	}, 250);
}
function renderGate(t) {
	document.getElementById("gate-kicker").innerHTML = t.heroKicker;
	document.getElementById("gate-title").innerHTML = t.gateTitle;
	document.getElementById("gate-sub").textContent = t.gateSub;
	var html = "";
	for (var i = 0; i < t.entry.length; i++) {
		html += '<button class="gate-card" onclick="entryGo(\'' + t.entry[i].go + '\')">'
			+ '<span class="gate-card-title">' + t.entry[i].t + '</span>'
			+ '<span class="gate-card-desc">' + t.entry[i].d + '</span>'
			+ '<span class="gate-arrow">→</span>'
			+ '</button>';
	}
	document.getElementById("gate-grid").innerHTML = html;
}

// ── Reveal-on-scroll ────────────────────────────────────────
function setupReveal() {
	var els = document.querySelectorAll(".reveal");
	if (!("IntersectionObserver" in window)) {
		for (var i = 0; i < els.length; i++) els[i].classList.add("in");
		return;
	}
	var io = new IntersectionObserver(function(entries) {
		for (var j = 0; j < entries.length; j++) {
			if (entries[j].isIntersecting) {
				entries[j].target.classList.add("in");
				io.unobserve(entries[j].target);
			}
		}
	}, { threshold: 0.08 });
	for (var k = 0; k < els.length; k++) io.observe(els[k]);
}

// ── 区块导航 ────────────────────────────────────────────────
// 6 个锚点覆盖全部内容（词曲 + 项目负责人合并成「延伸」）
var SEC_NAV = [
	{ id: "svc-recording", k: "navRec" },
	{ id: "svc-mixing", k: "navMix" },
	{ id: "svc-mastering", k: "navMaster" },
	{ id: "svc-creation", k: "navExtra" },
	{ id: "svc-course", k: "navCourse" },
	{ id: "svc-daomen", k: "navMember" },
	{ id: "svc-flow", k: "navFlow" },
	{ id: "faq-container", k: "navFaq" }
];
// 进度条要吸在导航条正下方，高度实测写入 CSS 变量（字号/换行都会影响）
function syncNavH() {
	var nav = document.getElementById("sec-nav");
	if (!nav) return;
	var h = Math.round(nav.getBoundingClientRect().height);
	if (h > 0) document.documentElement.style.setProperty("--navh", h + "px");
}
window.addEventListener("resize", syncNavH);
function renderSecNav(t) {
	var box = document.getElementById("sec-nav-in");
	if (!box) return;
	var h = "";
	for (var i = 0; i < SEC_NAV.length; i++) {
		h += '<button class="sec-nav-btn" data-sec="' + SEC_NAV[i].id + '" onclick="secJump(\'' + SEC_NAV[i].id + '\')">' + (t[SEC_NAV[i].k] || "") + '</button>';
	}
	box.innerHTML = h;
	syncNavH();
	secSpy();
}
function secJump(id) {
	var el = document.getElementById(id);
	if (!el) return;
	var nav = document.getElementById("sec-nav");
	var off = (nav ? nav.getBoundingClientRect().height : 0) + 14;
	var y = el.getBoundingClientRect().top + (window.pageYOffset || document.documentElement.scrollTop) - off;
	window.scrollTo({ top: y < 0 ? 0 : y, behavior: qbReduceMotion() ? "auto" : "smooth" });
}
// 当前区块高亮：取「已滚过导航条」的最后一个区块
function secSpy() {
	var btns = document.querySelectorAll(".sec-nav-btn");
	if (!btns.length) return;
	var nav = document.getElementById("sec-nav");
	var line = (nav ? nav.getBoundingClientRect().height : 0) + 24;
	var active = SEC_NAV[0].id;
	for (var i = 0; i < SEC_NAV.length; i++) {
		var el = document.getElementById(SEC_NAV[i].id);
		if (el && el.getBoundingClientRect().top <= line) active = SEC_NAV[i].id;
	}
	for (var b = 0; b < btns.length; b++) {
		var on = btns[b].getAttribute("data-sec") === active;
		btns[b].classList.toggle("on", on);
		if (on) btns[b].scrollIntoView({ block: "nearest", inline: "nearest" });
	}
}
window.addEventListener("scroll", function () {
	if (window.__secTick) return;
	window.__secTick = requestAnimationFrame(function () { window.__secTick = 0; secSpy(); });
}, { passive: true });

// ── Top-level render ────────────────────────────────────────
function render(lang) {
	var t = I18N[lang];
	var i, html = "";
	document.documentElement.lang = t.lang;
	document.getElementById("hero-kicker").innerHTML = t.heroKicker;
	document.getElementById("hero-title").innerHTML = t.heroTitle;
	document.getElementById("hero-sub").innerHTML = t.heroSub;
	document.getElementById("footer-text").textContent = t.footer;
	document.getElementById("cta-label").textContent = t.ctaLabel;
	document.getElementById("back-link").textContent = t.back;
	renderGate(t);
	for (i = 0; i < t.services.length; i++) html += renderService(t.services[i]);
	document.getElementById("services-container").innerHTML = html;
	document.getElementById("faq-container").innerHTML = renderFAQ(t);
	renderSecNav(t);
	renderQuoteBuilder();
	setupReveal();
}
function switchLang(lang) {
	if (lang === currentLang) return;
	currentLang = lang;
	var btns = document.querySelectorAll(".lang-btn");
	for (var i = 0; i < btns.length; i++) {
		if (btns[i].getAttribute("data-lang") === lang) btns[i].classList.add("active");
		else btns[i].classList.remove("active");
	}
	var container = document.getElementById("services-container");
	container.classList.add("fading");
	setTimeout(function() {
		render(lang);
		container.classList.remove("fading");
	}, 160);
}
function copyContact() {
	var t = I18N[currentLang];
	var label = document.getElementById("cta-label");
	navigator.clipboard.writeText(CONTACT.wechat).then(function() {
		label.textContent = t.ctaCopied;
		window.location.href = "weixin://";
		setTimeout(function() { label.textContent = t.ctaLabel; }, 2200);
	}).catch(function() {
		label.textContent = CONTACT.wechat;
		window.location.href = "weixin://";
		setTimeout(function() { label.textContent = t.ctaLabel; }, 2200);
	});
}
document.addEventListener("DOMContentLoaded", function() {
	qbInitTheme();
	// 链接里带配置优先（别人分享过来的），否则恢复本机上次的
	var hq = (location.hash || "").match(/[#&]q=([^&]+)/);
	if (!(hq && qbDecodeState(hq[1]))) qbRestoreState();
	render("zh");
});
