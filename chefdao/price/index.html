<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Rates | ChefDao</title>
	<style>
		/* ── Dark canvas · 黑白极简 + 墨绿只做面（呼应 ChefDao 绿标）── */
		:root {
			--bg: #080808;
			--surface: #111111;
			--surface-hover: #161616;
			--text-primary: #f0f0f0;
			--text-secondary: #888;
			--text-dim: #555;
			--green-deep: #0d1f16;
			--green-line: rgba(96, 176, 134, 0.25);
			--green-soft: #8fc3a9;
			--border: rgba(255, 255, 255, 0.08);
			--border-hover: rgba(255, 255, 255, 0.2);
			--font: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
			--ease: cubic-bezier(0.16, 1, 0.3, 1);
			--r: 14px;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
		html { scroll-behavior: smooth; }
		body { background: var(--bg); color: var(--text-primary); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.6; }
		.container { max-width: 960px; margin: 0 auto; padding: 72px 24px; padding-bottom: calc(130px + env(safe-area-inset-bottom)); }

		/* reveal animation */
		.reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.9s var(--ease), transform 0.9s var(--ease); }
		.reveal.in { opacity: 1; transform: none; }
		@media (prefers-reduced-motion: reduce) {
			html { scroll-behavior: auto; }
			.reveal { opacity: 1; transform: none; transition: none; }
			#entry-gate { transition: none !important; }
		}

		/* ── Entry gate (开屏选择) ─────────────────────────── */
		#entry-gate { position: fixed; inset: 0; z-index: 200; background: rgba(8,8,8,0.94); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 1; transition: opacity 0.55s var(--ease); }
		#entry-gate.leaving { opacity: 0; pointer-events: none; }
		.gate-inner { max-width: 720px; width: 100%; }
		.gate-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 16px; }
		.gate-title { font-size: clamp(30px, 7vw, 52px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; margin-bottom: 12px; }
		.gate-sub { color: var(--text-secondary); font-size: 14px; max-width: 420px; line-height: 1.7; margin-bottom: 36px; }
		.gate-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
		.gate-card { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 24px 22px; cursor: pointer; font-family: var(--font); transition: transform 0.4s var(--ease), border-color 0.3s, background 0.3s; min-height: 120px; opacity: 0; transform: translateY(18px); animation: gateIn 0.7s var(--ease) forwards; }
		.gate-card:nth-child(2) { animation-delay: 0.08s; }
		.gate-card:nth-child(3) { animation-delay: 0.16s; }
		@keyframes gateIn { to { opacity: 1; transform: none; } }
		.gate-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.3); background: var(--surface-hover); }
		.gate-card:active { transform: translateY(-1px); }
		.gate-card-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); }
		.gate-card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; flex-grow: 1; }
		.gate-arrow { font-size: 14px; color: var(--text-secondary); transition: transform 0.3s var(--ease); }
		.gate-card:hover .gate-arrow { transform: translateX(4px); }

		/* ── Top bar ───────────────────────────────────────── */
		.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; gap: 12px; }
		.back-nav { display: inline-flex; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; transition: color 0.2s; min-height: 44px; flex-shrink: 0; }
		.back-nav:hover { color: var(--text-primary); }
		.lang-switcher { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 100px; padding: 4px; }
		.lang-btn { background: none; border: none; color: var(--text-secondary); font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; padding: 6px 12px; border-radius: 100px; cursor: pointer; transition: background 0.2s, color 0.2s; min-height: 32px; white-space: nowrap; }
		.lang-btn:hover { color: var(--text-primary); }
		.lang-btn.active { background: var(--surface-hover); color: var(--text-primary); border: 0.5px solid var(--border-hover); }

		/* ── Hero ──────────────────────────────────────────── */
		.hero { margin-bottom: 80px; }
		.hero-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 14px; }
		.hero h1 { font-size: clamp(36px, 9vw, 72px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; margin-bottom: 16px; }
		.hero-sub { color: var(--text-secondary); font-size: 15px; max-width: 480px; line-height: 1.7; }

		/* ── Schedule line (排期，计算器顶部，克制细线) ─────── */
		.qb-sched { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 0 2px 16px; margin-bottom: 22px; border-bottom: 0.5px solid var(--border); }
		.qb-sched-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-soft); flex-shrink: 0; animation: qpulse 2.6s var(--ease) infinite; }
		@keyframes qpulse { 0% { box-shadow: 0 0 0 0 rgba(143,195,169,0.45); } 70% { box-shadow: 0 0 0 5px rgba(143,195,169,0); } 100% { box-shadow: 0 0 0 0 rgba(143,195,169,0); } }
		.qb-sched-live { font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--green-soft); margin-right: 4px; }
		.qb-sched-item { font-size: 12px; color: var(--text-dim); }
		.qb-sched-item strong { color: var(--text-primary); font-weight: 600; }
		.qb-sched-sep { color: var(--text-dim); opacity: 0.45; font-size: 11px; }
		@media (prefers-reduced-motion: reduce) { .qb-sched-dot { animation: none; } }
		@media (max-width: 640px) { .qb-sched-item { font-size: 11.5px; } .qb-sched-sep { display: none; } }

		/* ── Help "?" (跳转到刀门) ─────────────────────────── */
		.qb-help { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 0.5px solid var(--border-hover); color: var(--text-secondary); font-size: 10px; font-weight: 700; line-height: 1; margin-left: 6px; cursor: pointer; transition: border-color 0.2s, color 0.2s; vertical-align: middle; }
		.qb-help:hover { border-color: var(--green-soft); color: var(--green-soft); }

		/* ── Sections ──────────────────────────────────────── */
		.service-section { margin-bottom: 72px; scroll-margin-top: 32px; }
		.section-head { margin-bottom: 28px; }
		.step-tag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; gap: 6px; }
		.step-tag::before { content: ""; display: block; width: 18px; height: 1px; background: currentColor; opacity: 0.6; }
		.section-head h2 { font-size: clamp(22px, 5vw, 30px); font-weight: 700; letter-spacing: -0.02em; }
		.sub-desc { display: block; font-size: 12px; color: var(--text-dim); margin-top: 8px; max-width: 560px; line-height: 1.65; }

		/* ── Cards ─────────────────────────────────────────── */
		.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: stretch; }
		.card-grid.solo { max-width: 380px; }
		.price-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.3s var(--ease), background 0.3s var(--ease), transform 0.3s var(--ease); }
		.price-card:hover { border-color: var(--border-hover); background: var(--surface-hover); transform: translateY(-3px); }
		.card-price { display: flex; align-items: baseline; gap: 2px; line-height: 1; }
		.card-price-num { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
		.card-price-unit { font-size: 13px; color: var(--text-secondary); margin-left: 1px; }
		.card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-top: 4px; }
		.card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.65; flex-grow: 1; }
		.card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
		.tag { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: 0.5px solid var(--border); color: var(--text-secondary); }

		/* ── Quote Builder ─────────────────────────────────── */
		.quote-builder { background: var(--surface); border: 0.5px solid rgba(255,255,255,0.12); border-radius: var(--r); padding: 28px; position: relative; overflow: hidden; }
		.quote-builder > * { position: relative; }
		.qb-mode { display: flex; gap: 4px; background: rgba(0,0,0,0.4); border: 0.5px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 26px; }
		.qb-mode-btn { flex: 1; background: none; border: 0.5px solid transparent; border-radius: 9px; padding: 11px 10px; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: background 0.25s, color 0.25s, border-color 0.25s; }
		.qb-mode-btn.active { background: var(--surface-hover); color: var(--text-primary); border-color: var(--border-hover); }
		.qb-row { margin-bottom: 24px; }
		.qb-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; }
		.qb-base-line { display: flex; justify-content: space-between; align-items: baseline; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 15px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 24px; }
		.qb-base-line strong { font-size: 16px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
		.qb-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
		.qb-seg-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 13px; cursor: pointer; transition: border-color 0.25s, background 0.25s; font-family: var(--font); text-align: left; min-height: 60px; }
		.qb-seg-btn:hover { border-color: var(--border-hover); }
		.qb-seg-btn.active { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.04); }
		.qb-seg-name { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
		.qb-seg-price { font-size: 12px; color: var(--text-secondary); }
		.qb-seg-btn.active .qb-seg-price { color: var(--green-soft); font-weight: 600; }
		.qb-tier-desc { font-size: 11.5px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; }
		.qb-stepper { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
		.qb-step-btn { width: 40px; height: 40px; border-radius: 50%; border: 0.5px solid var(--border-hover); background: rgba(255,255,255,0.03); color: var(--text-primary); font-size: 19px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.2s, background 0.2s, transform 0.12s; flex-shrink: 0; }
		.qb-step-btn:hover { border-color: #fff; }
		.qb-step-btn:active { transform: scale(0.94); }
		.qb-count { font-size: 22px; font-weight: 700; min-width: 30px; text-align: center; }
		.qb-perhead { font-size: 11px; color: var(--text-dim); }
		.qb-more-note { font-size: 11.5px; color: var(--text-secondary); margin-top: 10px; }
		.qb-voc-list { display: flex; flex-direction: column; gap: 8px; }
		.qb-voc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 9px 12px 9px 15px; flex-wrap: wrap; }
		.qb-voc-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); flex-shrink: 0; }
		.qb-mini-seg { display: flex; gap: 4px; flex-wrap: wrap; }
		.qb-mini-btn { background: none; border: 0.5px solid var(--border); border-radius: 100px; padding: 6px 12px; font-family: var(--font); font-size: 11.5px; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: border-color 0.2s, color 0.2s, background 0.2s; white-space: nowrap; }
		.qb-mini-btn:hover { border-color: var(--border-hover); }
		.qb-mini-btn.active { border-color: rgba(255,255,255,0.45); color: var(--text-primary); background: rgba(255,255,255,0.05); }
		/* summary panel */
		.qb-summary { background: var(--green-deep); border: 0.5px solid var(--green-line); border-radius: 12px; padding: 20px; margin-top: 4px; }
		.qb-bd-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--text-secondary); padding: 5px 0; }
		.qb-bd-line .qb-bd-val { color: var(--text-primary); white-space: nowrap; font-variant-numeric: tabular-nums; }
		.qb-eq { font-size: 11.5px; color: var(--text-dim); margin-bottom: 8px; }
		.qb-eq strong { color: var(--text-secondary); font-weight: 600; }
		.qb-total-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-top: 13px; border-top: 0.5px solid var(--border); }
		.qb-total-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); }
		.qb-total { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; color: #fff; }
		.qb-total .qb-from { font-size: 12px; font-weight: 500; color: var(--text-dim); margin-left: 4px; }
		.qb-note { font-size: 11px; color: var(--text-dim); margin-top: 11px; line-height: 1.7; }
		.qb-cta { display: block; width: 100%; margin-top: 16px; background: #f0f0f0; color: #0a0a0a; border: none; border-radius: 10px; padding: 15px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer; font-family: var(--font); transition: background 0.2s, transform 0.15s; }
		.qb-cta:hover { background: #fff; }
		.qb-cta:active { transform: scale(0.985); }
		.qb-addon-note { font-size: 11px; color: var(--text-dim); margin-top: 14px; line-height: 1.7; }
		/* member toggle */
		.qb-member { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px 15px; cursor: pointer; margin-bottom: 16px; font-family: var(--font); text-align: left; transition: border-color 0.2s, background 0.2s; }
		.qb-member:hover { border-color: var(--border-hover); }
		.qb-member.on { border-color: var(--green-line); background: rgba(96,176,134,0.05); }
		.qb-member-label { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
		.qb-member-sub { display: block; font-size: 11px; color: var(--text-dim); font-weight: 400; margin-top: 2px; }
		.qb-switch { width: 36px; height: 22px; border-radius: 100px; background: rgba(255,255,255,0.12); position: relative; flex-shrink: 0; transition: background 0.25s; }
		.qb-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #f0f0f0; transition: transform 0.25s var(--ease); }
		.qb-member.on .qb-switch { background: var(--green-soft); }
		.qb-member.on .qb-switch::after { transform: translateX(14px); background: #0d1f16; }
		.qb-bd-line.discount span, .qb-bd-line.discount .qb-bd-val { color: var(--green-soft); }
		.qb-bd-line.rush .qb-bd-val { color: #f0f0f0; }
		.qb-seg.two { grid-template-columns: repeat(2, 1fr); }
		.qb-split { margin-top: 13px; padding-top: 13px; border-top: 0.5px dashed var(--green-line); display: flex; flex-direction: column; gap: 7px; }
		.qb-split-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--text-secondary); }
		.qb-split-row .qb-split-val { font-variant-numeric: tabular-nums; white-space: nowrap; }
		.qb-split-row.deposit .qb-split-val, .qb-split-row.deposit span { color: #fff; font-weight: 600; }

		/* ── Group headers ─────────────────────────────────── */
		.group-head { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); border-top: 0.5px solid var(--border); padding-top: 32px; margin-bottom: 36px; }

		/* ── Recording locations ───────────────────────────── */
		.loc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; align-items: stretch; }
		.loc-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 14px; transition: border-color 0.3s var(--ease), background 0.3s var(--ease), transform 0.3s var(--ease); }
		.loc-card:hover { border-color: var(--border-hover); background: var(--surface-hover); transform: translateY(-3px); }
		.loc-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
		.loc-city { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
		.loc-engineer { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--green-soft); padding: 3px 9px; border: 0.5px solid var(--green-line); border-radius: 100px; }
		.loc-rates { display: flex; flex-direction: column; gap: 7px; }
		.loc-rate { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
		.loc-rate:last-child { border-bottom: none; }
		.loc-rate-label { font-size: 12.5px; color: var(--text-secondary); }
		.loc-rate-price { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
		.loc-meta { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
		.loc-meta strong { color: var(--text-secondary); font-weight: 600; }
		.loc-map { color: var(--green-soft); text-decoration: none; border-bottom: 0.5px solid var(--green-line); padding-bottom: 1px; }
		.loc-map:hover { color: #fff; }
		.loc-gear { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
		.loc-gear .tag { text-transform: none; letter-spacing: 0; }
		@media (max-width: 640px) { .loc-grid { grid-template-columns: 1fr; } .loc-card { padding: 20px 18px; } }

		/* ── Membership (刀门) ─────────────────────────────── */
		.member-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); padding: 28px; }
		.member-intro { font-size: 13.5px; color: var(--text-secondary); line-height: 1.85; margin-bottom: 8px; max-width: 560px; }
		.member-intro strong { color: var(--text-primary); }
		.mj-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-top: 24px; }
		.mj-row { display: flex; gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 0.5px solid var(--border); }
		.mj-num { font-size: 26px; font-weight: 700; color: var(--text-dim); letter-spacing: -0.02em; flex-shrink: 0; }
		.mj-main { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
		.mj-sub { display: block; font-size: 12px; color: var(--text-secondary); margin-top: 2px; font-weight: 400; }
		.perk-list { margin-top: 26px; display: flex; flex-direction: column; gap: 16px; }
		.perk { border-left: 2px solid var(--green-soft); padding-left: 14px; }
		.perk-title { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
		.perk-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; }

		/* ── Project Lead ──────────────────────────────────── */
		.projectlead-card { background: var(--surface); border: 0.5px solid rgba(255,255,255,0.15); border-radius: var(--r); padding: 28px 32px; }
		.pl-highlights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
		.pl-highlight-item { padding: 12px 14px; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; }
		.pl-highlight-label { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 5px; }
		.pl-highlight-value { font-size: 12px; color: var(--text-primary); font-weight: 500; line-height: 1.4; }
		.pl-deposit-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; display: block; margin-bottom: 3px; }
		.pl-deposit-num { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; color: #fff; display: block; margin-bottom: 14px; }

// ── Quote Builder state & logic ─────────────────────────────
// mode: 'vocal' | 'stems'; prod: prods index; edits: per-vocalist edit index array
var qbState = { mode: "vocal", prod: 1, count: 1, edits: [2], stems: 1, member: false, lane: 0 };

function qbFmt(q, n) {
	var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
	return q.cur + s;
}
function qbSet(key, val) { qbState[key] = val; renderQuoteBuilder(); }
function qbScrollTo(id) { var el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
function qbSetEdit(i, val) { qbState.edits[i] = val; renderQuoteBuilder(); }
function qbStep(delta) {
	var q = I18N[currentLang].quote;
	var n = qbState.count + delta;
	if (n < 1) n = 1;
	if (n > q.countMax) n = q.countMax;
	while (qbState.edits.length < n) qbState.edits.push(qbState.edits[qbState.edits.length - 1]);
	qbState.edits.length = n;
	qbState.count = n;
	renderQuoteBuilder();
}
function qbCompute(q) {
	var stems = qbState.mode === "stems";
	var baseItem = stems ? q.stems[qbState.stems] : null;
	var base = stems ? baseItem.price : q.base;
	var prod = q.prods[qbState.prod];
	var count = qbState.count;
	var mixExtra = q.perHead * (count - 1);
	var editTotal = 0, editCounts = [];
	for (var e = 0; e < q.edits.length; e++) editCounts.push(0);
	for (var i = 0; i < count; i++) {
		var idx = qbState.edits[i] || 0;
		editCounts[idx]++;
		editTotal += q.edits[idx].price;
	}
	var gross = base + prod.price + mixExtra + editTotal;
	// 刀门会员：混音服务终身 8 折——只作用在【标准交付价】上，不含加急费
	var discount = qbState.member ? Math.round(gross * 0.2) : 0;
	// 快速通道：加急费 = 标准价 ×50%（不打折）；速度是可选付费项，不是默认承诺
	var fast = qbState.lane === 1;
	var rush = fast ? Math.round(gross * q.laneFeeRate) : 0;
	var total = gross - discount + rush;
	// 半半模式：定金 50% 向上取整（略大的那一半先收），尾款为剩余，两者精确相加
	var deposit = Math.ceil(total / 2);
	var balance = total - deposit;
	return { base: base, baseItem: baseItem, from: stems && baseItem.from, prod: prod, count: count,
		mixExtra: mixExtra, editTotal: editTotal, editCounts: editCounts,
		gross: gross, discount: discount, fast: fast, rush: rush,
		total: total, deposit: deposit, balance: balance };
}
function renderQuoteBuilder() {
	var mount = document.getElementById("qb-mount");
	if (!mount) return;
	var q = I18N[currentLang].quote;
	if (qbState.prod >= q.prods.length) qbState.prod = q.prods.length - 1;
	if (qbState.count > q.countMax) { qbState.count = q.countMax; qbState.edits.length = q.countMax; }
	for (var f = 0; f < qbState.edits.length; f++) { if (qbState.edits[f] >= q.edits.length) qbState.edits[f] = q.edits.length - 1; }
	if (qbState.stems >= q.stems.length) qbState.stems = q.stems.length - 1;
	var stems = qbState.mode === "stems";
	var c = qbCompute(q);

	var modeHtml = '<div class="qb-mode">'
		+ '<button class="qb-mode-btn' + (!stems ? " active" : "") + '" onclick="qbSet(\'mode\',\'vocal\')">' + q.modeVocal + '</button>'
		+ '<button class="qb-mode-btn' + (stems ? " active" : "") + '" onclick="qbSet(\'mode\',\'stems\')">' + q.modeStems + '</button>'
		+ '</div>';

	// base row: fixed line (vocal) or scale selector (stems)
	var baseHtml;
	if (stems) {
		var stemBtns = "";
		for (var s = 0; s < q.stems.length; s++) {
			var sp = qbFmt(q, q.stems[s].price) + (q.stems[s].from ? "+" : "");
			stemBtns += '<button class="qb-seg-btn' + (s === qbState.stems ? " active" : "") + '" onclick="qbSet(\'stems\',' + s + ')">'
				+ '<span class="qb-seg-name">' + q.stems[s].name + '</span>'
				+ '<span class="qb-seg-price">' + sp + '</span></button>';
		}
		baseHtml = '<div class="qb-row"><div class="qb-label">' + q.stemsLabel + '</div>'
			+ '<div class="qb-seg">' + stemBtns + '</div>'
			+ '<div class="qb-tier-desc">' + c.baseItem.desc + '</div></div>';
	} else {
		baseHtml = '<div class="qb-base-line"><span>' + q.baseLabel + '</span><strong>' + qbFmt(q, q.base) + '</strong></div>';
	}

	var prodBtns = "";
	for (var i = 0; i < q.prods.length; i++) {
		var pp = q.prods[i].price ? "+" + qbFmt(q, q.prods[i].price) : "—";
		prodBtns += '<button class="qb-seg-btn' + (i === qbState.prod ? " active" : "") + '" onclick="qbSet(\'prod\',' + i + ')">'
			+ '<span class="qb-seg-name">' + q.prods[i].name + '</span>'
			+ '<span class="qb-seg-price">' + pp + '</span></button>';
	}
	var vocRows = "";
	for (var v = 0; v < c.count; v++) {
		var chips = "";
		for (var e2 = 0; e2 < q.edits.length; e2++) {
			var label = q.edits[e2].name + (q.edits[e2].price ? " +" + qbFmt(q, q.edits[e2].price) : "");
			chips += '<button class="qb-mini-btn' + (qbState.edits[v] === e2 ? " active" : "") + '" onclick="qbSetEdit(' + v + ',' + e2 + ')">' + label + '</button>';
		}
		vocRows += '<div class="qb-voc-row"><span class="qb-voc-name">' + q.vocalistLabel + ' ' + (v + 1) + '</span><div class="qb-mini-seg">' + chips + '</div></div>';
	}

	var baseName = stems ? c.baseItem.name : q.tierNames[0];
	var lines = '<div class="qb-bd-line"><span>' + baseName + '</span><span class="qb-bd-val">' + qbFmt(q, c.base) + (c.from ? "+" : "") + '</span></div>';
	if (c.prod.price > 0) {
		lines += '<div class="qb-bd-line"><span>' + q.prodLabel + ' · ' + c.prod.name + '</span><span class="qb-bd-val">+' + qbFmt(q, c.prod.price) + '</span></div>';
	}
	if (c.count > 1) {
		lines += '<div class="qb-bd-line"><span>' + q.bdExtra + ' × ' + (c.count - 1) + '</span><span class="qb-bd-val">+' + qbFmt(q, c.mixExtra) + '</span></div>';
	}
	for (var e3 = 1; e3 < q.edits.length; e3++) {
		if (c.editCounts[e3] > 0) {
			lines += '<div class="qb-bd-line"><span>' + q.edits[e3].name + ' × ' + c.editCounts[e3] + '</span><span class="qb-bd-val">+' + qbFmt(q, q.edits[e3].price * c.editCounts[e3]) + '</span></div>';
		}
	}
	if (c.rush > 0) {
		lines += '<div class="qb-bd-line rush"><span>' + q.laneFeeLabel + '</span><span class="qb-bd-val">+' + qbFmt(q, c.rush) + '</span></div>';
	}
	if (c.discount > 0) {
		lines += '<div class="qb-bd-line discount"><span>' + q.memberLine + '</span><span class="qb-bd-val">−' + qbFmt(q, c.discount) + '</span></div>';
	}
	var eq = stems ? "" : '<div class="qb-eq">' + q.eqPrefix + ' <strong>' + q.tierNames[qbState.prod] + '</strong></div>';
	var moreNote = c.count >= q.countMax ? '<div class="qb-more-note">' + q.countMoreNote + '</div>' : '';
	var fromTag = c.from ? '<span class="qb-from">' + q.fromSuffix + '</span>' : '';
	var noteText = (stems ? q.stemsNote : q.note) + ' ' + q.depositNote;
	if (c.fast && c.discount > 0) noteText += ' ' + q.memberFastNote;
	// 交付日期：标准 stdMin–stdMax 工作日（跳周日）+积压；加急 rushMin–rushMax 自然日（含周日）
	var stdRange = qbFmtRange(qbAddWorkdays(SCHEDULE.stdMin + SCHEDULE.backlogDays), qbAddWorkdays(SCHEDULE.stdMax + SCHEDULE.backlogDays), currentLang);
	var rushRange = qbFmtRange(qbAddDays(SCHEDULE.rushMin), qbAddDays(SCHEDULE.rushMax), currentLang);
	var laneSubs = [ q.laneStdSub.replace("{r}", stdRange), q.laneRushSub.replace("{r}", rushRange) ];
	var laneBtns = "";
	for (var L = 0; L < q.lanes.length; L++) {
		laneBtns += '<button class="qb-seg-btn' + (L === qbState.lane ? " active" : "") + '" onclick="qbSet(\'lane\',' + L + ')">'
			+ '<span class="qb-seg-name">' + q.lanes[L].name + '</span>'
			+ '<span class="qb-seg-price">' + laneSubs[L] + '</span></button>';
	}
	var laneHtml = '<div class="qb-row"><div class="qb-label">' + q.laneLabel + '</div><div class="qb-seg two">' + laneBtns + '</div><div class="qb-tier-desc">' + q.laneNote + '</div></div>';
	var tt = I18N[currentLang];
	var schedHtml = '<div class="qb-sched"><span class="qb-sched-dot"></span><span class="qb-sched-live">' + tt.schedLive + '</span>'
		+ '<span class="qb-sched-item">' + tt.schedStd.replace("{r}", stdRange) + '</span>'
		+ '<span class="qb-sched-sep">·</span>'
		+ '<span class="qb-sched-item">' + tt.schedRush.replace("{r}", rushRange) + '</span></div>';
	var splitHtml = '<div class="qb-split">'
		+ '<div class="qb-split-row deposit"><span>' + q.depositLabel + '</span><span class="qb-split-val">' + qbFmt(q, c.deposit) + (c.from ? "+" : "") + '</span></div>'
		+ '<div class="qb-split-row"><span>' + q.balanceLabel + '</span><span class="qb-split-val">' + qbFmt(q, c.balance) + (c.from ? "+" : "") + '</span></div>'
		+ '</div>';
	var memberHtml = '<button class="qb-member' + (qbState.member ? " on" : "") + '" onclick="qbSet(\'member\',' + (!qbState.member) + ')" aria-pressed="' + qbState.member + '">'
		+ '<span><span class="qb-member-label">' + q.memberTitle
		+ ' <span class="qb-help" role="button" tabindex="0" title="' + q.memberHelp + '" onclick="event.stopPropagation();qbScrollTo(\'svc-daomen\')">?</span></span>'
		+ '<span class="qb-member-sub">' + q.memberSub + '</span></span>'
		+ '<span class="qb-switch"></span></button>';

	mount.innerHTML = '<div class="quote-builder">' + schedHtml + modeHtml + baseHtml
		+ '<div class="qb-row"><div class="qb-label">' + q.prodLabel + '</div><div class="qb-seg">' + prodBtns + '</div><div class="qb-tier-desc">' + c.prod.desc + '</div></div>'
		+ '<div class="qb-row"><div class="qb-label">' + q.countLabel + '</div>'
			+ '<div class="qb-stepper"><button class="qb-step-btn" onclick="qbStep(-1)" aria-label="-">−</button>'
			+ '<span class="qb-count">' + c.count + '</span>'
			+ '<button class="qb-step-btn" onclick="qbStep(1)" aria-label="+">+</button>'
			+ '<span class="qb-perhead">' + q.perHeadLabel + '</span></div>' + moreNote + '</div>'
		+ '<div class="qb-row"><div class="qb-label">' + q.editLabel + '</div><div class="qb-voc-list">' + vocRows + '</div></div>'
		+ laneHtml
		+ memberHtml
		+ '<div class="qb-summary">' + eq + lines
			+ '<div class="qb-total-row"><span class="qb-total-label">' + q.totalLabel + '</span><span class="qb-total">' + qbFmt(q, c.total) + fromTag + '</span></div>'
			+ splitHtml
			+ '<div class="qb-note">' + noteText + '</div></div>'
		+ '<button class="qb-cta" onclick="qbCopy()">' + q.cta + '</button>'
		+ '<div class="qb-addon-note">' + q.addonNote + '</div>'
		+ '</div>';
}
function qbCopy() {
	var q = I18N[currentLang].quote;
	var c = qbCompute(q);
	var stems = qbState.mode === "stems";
	var baseName = stems ? c.baseItem.name : q.tierNames[0];
	var txt = "ChefDao — " + q.title + "\n"
		+ "· " + (stems ? q.modeStems : q.modeVocal) + " · " + baseName + " " + qbFmt(q, c.base) + (c.from ? "+" : "") + "\n";
	if (c.prod.price > 0) txt += "· " + q.prodLabel + " · " + c.prod.name + " +" + qbFmt(q, c.prod.price) + "\n";
	txt += "· " + q.vocalistLabel + " × " + c.count + (c.count > 1 ? " (+" + qbFmt(q, c.mixExtra) + ")" : "") + "\n";
	for (var e = 1; e < q.edits.length; e++) {
		if (c.editCounts[e] > 0) txt += "· " + q.edits[e].name + " × " + c.editCounts[e] + " (+" + qbFmt(q, q.edits[e].price * c.editCounts[e]) + ")\n";
	}
	if (c.rush > 0) txt += "· " + q.laneFeeLabel + " (+" + qbFmt(q, c.rush) + ")\n";
	if (c.discount > 0) txt += "· " + q.memberLine + " (−" + qbFmt(q, c.discount) + ")\n";
	txt += q.totalLabel + ": " + qbFmt(q, c.total) + (c.from ? "+" : "") + "\n"
		+ q.depositLabel + ": " + qbFmt(q, c.deposit) + (c.from ? "+" : "") + " · " + q.balanceLabel + ": " + qbFmt(q, c.balance) + (c.from ? "+" : "") + "\n"
		+ "WeChat: " + CONTACT.wechat;
	var btn = document.querySelector(".qb-cta");
	var done = function() {
		if (btn) { btn.textContent = q.copied; setTimeout(function() { btn.textContent = q.cta; }, 2000); }
		window.location.href = "weixin://";
	};
	navigator.clipboard.writeText(txt).then(done).catch(done);
}

function renderCard(item) {
	var tags = "";
	if (item.tags && item.tags.length) {
		for (var i = 0; i < item.tags.length; i++) tags += '<span class="tag">' + item.tags[i] + '</span>';
	}
	var unit = item.unit ? '<span class="card-price-unit">' + item.unit + '</span>' : "";
	return '<div class="price-card">'
		+ '<div class="card-price"><span class="card-price-num">' + item.price + '</span>' + unit + '</div>'
		+ '<div class="card-title">' + item.title + '</div>'
		+ '<div class="card-desc">' + item.desc + '</div>'
		+ (tags ? '<div class="card-tags">' + tags + '</div>' : "")
		+ '</div>';
}
function renderProjectLead(svc) {
	var tags = "";
	for (var t = 0; t < svc.tags.length; t++) tags += '<span class="tag">' + svc.tags[t] + '</span>';
	var highlightsHtml = "";
	if (svc.highlights) {
		for (var h = 0; h < svc.highlights.length; h++) {
			highlightsHtml += '<div class="pl-highlight-item">'
				+ '<div class="pl-highlight-label">' + svc.highlights[h].label + '</div>'

	}
	return '<div class="service-section reveal" id="svc-' + svc.id + '">'
		+ '<div class="section-head"><div class="step-tag">' + svc.step + '</div><h2>' + svc.title + '</h2></div>'
		+ '<div class="projectlead-card">'
		+ (highlightsHtml ? '<div class="pl-highlights">' + highlightsHtml + '</div>' : "")
		+ '<span class="pl-deposit-label">' + svc.depositLabel + '</span>'
		+ '<span class="pl-deposit-num">' + svc.deposit + '</span>'
		+ '<div class="pl-desc">' + svc.desc + '</div>'
		+ '<div class="pl-tags card-tags">' + tags + '</div>'
		+ '<div class="pl-cta">' + svc.cta + '</div>'
		+ '</div></div>';
}
function renderMembership(svc) {
	var joins = "";
	for (var j = 0; j < svc.joins.length; j++) {
		joins += '<div class="mj-row"><span class="mj-num">' + svc.joins[j].num + '</span>'
			+ '<span><span class="mj-main">' + svc.joins[j].main + '</span><span class="mj-sub">' + svc.joins[j].sub + '</span></span></div>';
	}
	var perks = "";
	for (var p = 0; p < svc.perks.length; p++) {
		perks += '<div class="perk"><div class="perk-title">' + svc.perks[p].t + '</div><div class="perk-desc">' + svc.perks[p].d + '</div></div>';
	}
	return '<div class="member-card">'
		+ '<div class="member-intro">' + svc.intro + '</div>'
		+ '<div class="mj-label">' + svc.joinLabel + '</div>' + joins
		+ '<div class="mj-label" style="margin-top:26px">' + svc.perksLabel + '</div>'
		+ '<div class="perk-list">' + perks + '</div>'
		+ '</div>';
}
function renderRecording(svc) {
	var cards = "";
	for (var i = 0; i < svc.locations.length; i++) {
		var loc = svc.locations[i];
		var rates = "";
		for (var r = 0; r < loc.rates.length; r++) {
			rates += '<div class="loc-rate"><span class="loc-rate-label">' + loc.rates[r].label + '</span><span class="loc-rate-price">' + loc.rates[r].price + '</span></div>';
		}
		var venue = "";
		if (loc.venue) {
			venue = '<div class="loc-meta"><strong>' + loc.venue + '</strong>'
				+ (loc.address ? '<br>' + (loc.mapUrl ? '<a class="loc-map" href="' + loc.mapUrl + '" target="_blank" rel="noopener">' + loc.address + '</a>' : loc.address) : "")
				+ '</div>';
		}
		var gear = "";
		if (loc.gear && loc.gear.length) {
			for (var g = 0; g < loc.gear.length; g++) gear += '<span class="tag">' + loc.gear[g] + '</span>';
			gear = '<div class="loc-gear">' + gear + '</div>';
		}
		cards += '<div class="loc-card">'
			+ '<div class="loc-head"><span class="loc-city">' + loc.city + '</span><span class="loc-engineer">' + loc.engineer + '</span></div>'
			+ '<div class="loc-rates">' + rates + '</div>'
			+ venue + gear + '</div>';
	}
	return '<div class="loc-grid">' + cards + '</div>' + (svc.note ? '<div class="qb-addon-note">' + svc.note + '</div>' : "");
}
function renderService(svc) {
	var groupHead = svc.groupHead ? '<div class="group-head reveal">' + svc.groupHead + '</div>' : "";
	if (svc.type === "projectlead") return groupHead + renderProjectLead(svc);
	var head = '<div class="section-head"><div class="step-tag">' + svc.step + '</div><h2>' + svc.title + '</h2>'
		+ (svc.sub ? '<span class="sub-desc">' + svc.sub + '</span>' : "") + '</div>';
	var body;
	if (svc.type === "recording") {
		body = renderRecording(svc);
	} else if (svc.type === "membership") {
		body = renderMembership(svc);
	} else if (svc.builder) {
		body = '<div id="qb-mount"></div>';
	} else {
		var cards = "";
		for (var i = 0; i < svc.items.length; i++) cards += renderCard(svc.items[i]);
		body = '<div class="card-grid' + (svc.items.length === 1 ? " solo" : "") + '">' + cards + '</div>';
	}
	return groupHead + '<div class="service-section reveal" id="svc-' + svc.id + '">' + head + body + '</div>';
}
function renderFAQ(t) {
	if (!t.faqItems || !t.faqItems.length) return "";
	var items = "";
	for (var i = 0; i < t.faqItems.length; i++) {
		var item = t.faqItems[i];
		var num = (i + 1 < 10 ? "0" : "") + (i + 1);
		var bodyHtml = "";
		if (item.a) bodyHtml += "<p>" + item.a + "</p>";
		if (item.list && item.list.length) {
			bodyHtml += "<ul>";
			for (var j = 0; j < item.list.length; j++) bodyHtml += "<li>" + item.list[j] + "</li>";
			bodyHtml += "</ul>";
		}
		items += '<div class="faq-item" id="faq-item-' + i + '">'
			+ '<div class="faq-question" onclick="toggleFaq(' + i + ')" role="button" tabindex="0" aria-expanded="false">'
			+ '<div class="faq-q-inner"><span class="faq-num">' + num + '</span><span class="faq-q-text">' + item.q + '</span></div>'
			+ '<span class="faq-toggle">+</span></div>'
			+ '<div class="faq-answer" id="faq-answer-' + i + '"><div class="faq-answer-inner">' + bodyHtml + '</div></div>'
			+ '</div>';
	}
	return '<div class="faq-section reveal">'
		+ '<div class="faq-head section-head"><div class="step-tag">' + t.faqStep + '</div><h2>' + t.faqTitle + '</h2></div>'
		+ items + '</div>';
}
function toggleFaq(index) {
	var item = document.getElementById("faq-item-" + index);
	var answer = document.getElementById("faq-answer-" + index);
	var inner = answer.querySelector(".faq-answer-inner");
	var isOpen = item.classList.contains("open");
	var allItems = document.querySelectorAll(".faq-item");
	var allAnswers = document.querySelectorAll(".faq-answer");
	for (var i = 0; i < allItems.length; i++) {
		allItems[i].classList.remove("open");
		allAnswers[i].style.maxHeight = "0";
		var btn = allItems[i].querySelector(".faq-question");
		if (btn) btn.setAttribute("aria-expanded", "false");
	}
	if (!isOpen) {
		item.classList.add("open");
		answer.style.maxHeight = inner.scrollHeight + "px";
		item.querySelector(".faq-question").setAttribute("aria-expanded", "true");
	}
}

// ── Entry gate ──────────────────────────────────────────────
function entryGo(target) {
	var gate = document.getElementById("entry-gate");
	gate.classList.add("leaving");
	setTimeout(function() { gate.style.display = "none"; }, 560);
	if (target === "browse") return;
	setTimeout(function() {
		var el = document.getElementById("svc-" + target);
		if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
	}, 250);
}
function renderGate(t) {
	document.getElementById("gate-kicker").textContent = t.heroKicker;
	document.getElementById("gate-title").innerHTML = t.gateTitle;
	document.getElementById("gate-sub").textContent = t.gateSub;
	var html = "";
	for (var i = 0; i < t.entry.length; i++) {
		html += '<button class="gate-card" onclick="entryGo(\'' + t.entry[i].go + '\')">'
			+ '<span class="gate-card-title">' + t.entry[i].t + '</span>'
			+ '<span class="gate-card-desc">' + t.entry[i].d + '</span>'
			+ '<span class="gate-arrow">→</span>'
			+ '</button>';
	}
	document.getElementById("gate-grid").innerHTML = html;
}

// ── Reveal-on-scroll ────────────────────────────────────────
function setupReveal() {
	var els = document.querySelectorAll(".reveal");
	if (!("IntersectionObserver" in window)) {
		for (var i = 0; i < els.length; i++) els[i].classList.add("in");
		return;
	}
	var io = new IntersectionObserver(function(entries) {
		for (var j = 0; j < entries.length; j++) {
			if (entries[j].isIntersecting) {
				entries[j].target.classList.add("in");
				io.unobserve(entries[j].target);
			}
		}
	}, { threshold: 0.08 });
	for (var k = 0; k < els.length; k++) io.observe(els[k]);
}

// ── Top-level render ────────────────────────────────────────
function render(lang) {
	var t = I18N[lang];
	var i, html = "";
	document.documentElement.lang = t.lang;
	document.getElementById("hero-kicker").textContent = t.heroKicker;
	document.getElementById("hero-title").innerHTML = t.heroTitle;
	document.getElementById("hero-sub").innerHTML = t.heroSub;
	document.getElementById("footer-text").textContent = t.footer;
	document.getElementById("cta-label").textContent = t.ctaLabel;
	document.getElementById("back-link").textContent = t.back;
	renderGate(t);
	for (i = 0; i < t.services.length; i++) html += renderService(t.services[i]);
	document.getElementById("services-container").innerHTML = html;
	document.getElementById("faq-container").innerHTML = renderFAQ(t);
	renderQuoteBuilder();
	setupReveal();
}
function switchLang(lang) {
	if (lang === currentLang) return;
	currentLang = lang;
	var btns = document.querySelectorAll(".lang-btn");
	for (var i = 0; i < btns.length; i++) {
		if (btns[i].getAttribute("data-lang") === lang) btns[i].classList.add("active");
		else btns[i].classList.remove("active");
	}
	var container = document.getElementById("services-container");
	container.classList.add("fading");
	setTimeout(function() {
		render(lang);
		container.classList.remove("fading");
	}, 160);
}
function copyContact() {
	var t = I18N[currentLang];
	var label = document.getElementById("cta-label");
	navigator.clipboard.writeText(CONTACT.wechat).then(function() {
		label.textContent = t.ctaCopied;
		window.location.href = "weixin://";
		setTimeout(function() { label.textContent = t.ctaLabel; }, 2200);
	}).catch(function() {
		label.textContent = CONTACT.wechat;
		window.location.href = "weixin://";
		setTimeout(function() { label.textContent = t.ctaLabel; }, 2200);
	});
}
document.addEventListener("DOMContentLoaded", function() { render("zh"); });
</script>
