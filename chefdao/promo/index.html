<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#18392b"><title>本月福利 · 刀大厨</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<style>
:root{--bg:#18392b;--ink:#eeeee6;--dim:rgba(238,238,230,.66);--faint:rgba(238,238,230,.46);--line:rgba(238,238,230,.2);--acc:#9cc9b2;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(900px 600px at 15% -10%,rgba(156,201,178,.14),transparent 70%),var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;
 padding:max(28px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;font:400 12px var(--mono);letter-spacing:.22em;color:var(--faint);padding-bottom:18px;border-bottom:1px solid var(--line)}
h1{margin-top:34px;font-size:46px;line-height:1.15;font-weight:200;letter-spacing:.01em}
.card{border:1px solid var(--line);border-radius:16px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
.card .k{font-size:14px;letter-spacing:.14em;color:var(--faint)}
.card .v{font-size:38px;font-weight:200;letter-spacing:-.01em}
.card .v small{font-size:17px;color:var(--dim);margin-left:8px;font-weight:300;letter-spacing:.04em}
.card .n{font-size:14px;color:var(--dim)}
button.go,a.go{display:block;text-align:center;padding:14px;border-radius:12px;border:0;background:var(--ink);color:#0f1f18;font:600 16px inherit;text-decoration:none;cursor:pointer}
button.go:disabled{opacity:.35;cursor:default}
.code{font:300 40px var(--mono);letter-spacing:.16em;color:var(--acc);text-align:center;padding:10px 0;user-select:all}
.row{display:flex;gap:10px}.row>*{flex:1}
button.sub{padding:12px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:500 15px inherit;cursor:pointer}
.empty{color:var(--dim);padding:30px 0}
</style></head><body><main>
<div class="top"><span>CHEFDAO AUDIO</span><span>PRIVILEGE</span></div>
<h1>本月福利</h1>
<div id="box"><div class="empty">读取中…</div></div>
</main>
<script>
(() => {
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://stats.cumusic.work';
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let lid = ls.get('review:lid'); if (!lid) { lid = Math.random().toString(36).slice(2, 5).toUpperCase(); ls.set('review:lid', lid); }
let sid = ''; while (sid.length < 12) sid += Math.random().toString(36).slice(2); sid = sid.slice(0, 12);
const ua = navigator.userAgent, device = (/iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? '安卓' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '设备') + (/MicroMessenger/i.test(ua) ? ' · 微信' : '');
const esc = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); };
const box = document.getElementById('box'), K = (new URLSearchParams(location.search).get('k') || '').slice(0, 40);
const mine = c => ({ ...c, mine: c.mine });
function mineCard(c, code, exp, used) {
  return '<div class="card"><div class="k">' + esc(c.label || '优惠') + '</div><div class="v">立减 ¥' + c.value + '<small>满 ¥' + c.min + '</small></div>'
    + '<div class="code">' + esc(code) + '</div>'
    + (used ? '<div class="n">这个码已使用</div>' : '<div class="n">' + day(exp) + ' 前有效 · 一次性</div><div class="row"><button class="sub" data-copy="' + esc(code) + '">复制</button><a class="go" href="/chefdao/price/?code=' + esc(code) + '&from=moments">去下单</a></div>') + '</div>';
}
function render(list) {
  if (!list.length) { box.innerHTML = '<div class="empty">本月福利暂未开放</div>'; return; }
  box.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' + list.map(c => {
    if (c.mine) return mineCard(c, c.mine.code, c.mine.expires, c.mine.used);
    const full = c.left === 0;
    return '<div class="card"><div class="k">' + esc(c.label || '优惠') + '</div><div class="v">立减 ¥' + c.value + '<small>满 ¥' + c.min + '</small></div>'
      + '<div class="n">' + (c.left == null ? '' : full ? '本月已领完' : '剩 ' + c.left + ' 个') + '</div>'
      + '<button class="go" data-k="' + esc(c.k) + '"' + (full ? ' disabled' : '') + '>' + (full ? '已领完' : '领取') + '</button></div>';
  }).join('') + '</div>';
  box.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { const t = b.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { b.textContent = '已复制'; }, () => { b.textContent = t; }); });
  box.querySelectorAll('button.go[data-k]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '…';
    try {
      const j = await (await fetch(API + '/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: b.dataset.k, lid, sid, device }) })).json();
      if (j.ok) return load();
      b.textContent = j.e === 'full' ? '已领完' : '暂时领不了';
    } catch (e) { b.disabled = false; b.textContent = '网络不好，再点一次'; }
  });
}
async function load() {
  try { const j = await (await fetch(API + '/claim/info?lid=' + lid + (K ? '&k=' + encodeURIComponent(K) : ''), { cache: 'no-store' })).json(); render(j.ok ? j.campaigns : []); }
  catch (e) { box.innerHTML = '<div class="empty">读取失败，刷新再试</div>'; }
}
load();
})();
</script></body></html>
