<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0e10">
<title>匿名咨询 · CU MUSIC</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<link rel="icon" href="/chefdao/assets/cu-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/chefdao/assets/cu-180.png">
<style>
:root{--bg:#0d0e10;--other:#26282c;--me:#2f9a5c;--me-text:#f3f7f4;--text:#e4e2dd;--dim:#8d8b86;--line:rgba(228,226,221,.1);--accent:#5fcf8c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
header{flex:none;text-align:center;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid var(--line);background:rgba(13,14,16,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.av{width:44px;height:44px;margin:0 auto 4px;border-radius:50%;background:linear-gradient(160deg,#3b3f45,#1f2125);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:.06em;color:#e9e7e2}
h1{margin:0;font-size:16px;font-weight:600;line-height:1.4}
h1 span{color:var(--accent);font-weight:500}
#log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:720px;width:100%;margin:0 auto;padding:6px 14px 10px}
.anon{margin:18px auto 8px;max-width:420px;padding:16px 18px;border-radius:20px;background:rgba(95,207,140,.08);border:1px solid rgba(95,207,140,.22);text-align:center}
.anon b{display:block;margin-bottom:4px;font-size:17px;color:var(--accent);font-weight:600}
.anon p{margin:0;font-size:15.5px;line-height:1.75;color:#cfcdc7}
.sep{margin:14px 0 8px;text-align:center;font-size:13px;color:var(--dim)}
.m{display:flex;margin:0 0 2px}
.m.me{justify-content:flex-end}
.m.tail{margin-bottom:8px}
.b{position:relative;max-width:78%;padding:8px 14px;border-radius:20px;background:var(--other);white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.55}
.m.me .b{background:var(--me);color:var(--me-text)}
.m.tail .b::before,.m.tail .b::after{content:'';position:absolute;bottom:0}
.m.o.tail .b::before{left:-7px;width:20px;height:18px;background:var(--other);border-bottom-right-radius:16px 14px}
.m.o.tail .b::after{left:-26px;width:26px;height:20px;background:var(--bg);border-bottom-right-radius:10px}
.m.me.tail .b::before{right:-7px;width:20px;height:18px;background:var(--me);border-bottom-left-radius:16px 14px}
.m.me.tail .b::after{right:-26px;width:26px;height:20px;background:var(--bg);border-bottom-left-radius:10px}
.m.pend .b{opacity:.6}
.m.fail .b{background:#8a4a3e}
.rd{margin:-4px 4px 8px 0;text-align:right;font-size:12.5px;color:var(--dim);font-weight:500}
.fl{margin:-4px 6px 8px 0;text-align:right;font-size:12.5px;color:#d28a7a}
form{flex:none;max-width:720px;width:100%;margin:0 auto;padding:6px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.tog{display:block;margin:0 auto 6px;padding:2px 8px;background:none;border:0;color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
.more{display:none;gap:8px;margin:0 2px 8px}
.more.on{display:flex}
.more input{flex:1;min-width:0;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--other);color:var(--text);font:inherit;font-size:16px;outline:none}
.pill{position:relative;display:flex;align-items:flex-end;border:1px solid rgba(228,226,221,.22);border-radius:22px;background:transparent;padding:3px 3px 3px 14px}
textarea{flex:1;min-width:0;resize:none;max-height:140px;min-height:38px;padding:7px 0;border:0;background:transparent;color:var(--text);font:inherit;font-size:17px;line-height:1.5;outline:none}
textarea::placeholder{color:#6f6d69}
button.send{flex:none;width:32px;height:32px;margin:3px 3px 3px 6px;border:0;border-radius:50%;background:var(--me);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .15s,transform .15s}
button.send:disabled{opacity:0;pointer-events:none;transform:scale(.7)}
button.send:active{transform:scale(.92)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<header>
  <div class="av">CU</div>
  <h1>刀大厨 · <span>匿名咨询</span></h1>
</header>
<div id="log" aria-live="polite">
  <div class="anon" id="anon">
    <b>🔒 完全匿名</b>
    <p>不用留名字，不用加微信，我看不到你是谁，只看得到你写的字。这是一次文字咨询，混音、制作、编曲、接下来怎么走，都可以聊。</p>
  </div>
</div>
<form id="f" autocomplete="off">
  <button type="button" class="tog" id="tog">想让我能找到你？可以留个称呼 / 联系方式（可不填）</button>
  <div class="more" id="more">
    <input id="nm" maxlength="20" placeholder="称呼" aria-label="称呼">
    <input id="ct" maxlength="60" placeholder="微信 / 邮箱 / 其他" aria-label="联系方式">
  </div>
  <input class="hp" id="hp" tabindex="-1" aria-hidden="true">
  <div class="pill">
    <textarea id="tx" rows="1" maxlength="1500" placeholder="匿名信息" aria-label="消息"></textarea>
    <button class="send" id="go" type="submit" disabled aria-label="发送"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
  </div>
</form>
<script>
(function () {
  var API = 'https://stats.cumusic.work', $ = function (i) { return document.getElementById(i); };
  var log = $('log'), tx = $('tx'), go = $('go'), f = $('f');
  var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var tid = LS.get('chat:tid');
  if (!tid || !/^[a-z0-9]{12,40}$/.test(tid)) {
    var a = new Uint8Array(12); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach(function (_, i) { a[i] = Math.random() * 256; });
    tid = Array.prototype.map.call(a, function (x) { return (x % 36).toString(36); }).join('') + Date.now().toString(36);
    LS.set('chat:tid', tid);
  }
  $('nm').value = LS.get('chat:name') || ''; $('ct').value = LS.get('chat:contact') || '';
  if ($('nm').value || $('ct').value) $('more').classList.add('on');
  $('tog').onclick = function () { $('more').classList.toggle('on'); };

  var last = 0, seen = {}, busy = false, oseen = 0, lastTs = 0;
  var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
  function hm(ts) { var d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function dayLabel(ts) { var d = new Date(ts), n = new Date(); return (d.toDateString() === n.toDateString() ? '今天' : (d.getMonth() + 1) + '月' + d.getDate() + '日') + ' ' + hm(ts); }
  function near() { return log.scrollHeight - log.scrollTop - log.clientHeight < 120; }
  // 已读：你打开过这个会话后，最后一条消息下面显示「已读 时间」
  function mark() {
    var old = log.querySelector('.rd'); if (old) old.remove();
    var last_ = log.lastElementChild;
    if (!last_ || !last_.classList.contains('me') || !last_.dataset.ts) return;
    if (oseen && +last_.dataset.ts <= oseen) { var r = document.createElement('div'); r.className = 'rd'; r.textContent = '已读 ' + hm(oseen); last_.after(r); }
  }
  function add(m, cls) {
    var rd = log.querySelector('.rd'); if (rd) rd.remove();
    var side = m.who === 'v' ? 'me' : 'o', prev = log.lastElementChild;
    if (!lastTs || m.ts - lastTs > 15 * 60 * 1000) { var s = document.createElement('div'); s.className = 'sep'; s.textContent = dayLabel(m.ts); log.appendChild(s); prev = null; }
    lastTs = m.ts;
    if (prev && prev.classList.contains('m') && prev.classList.contains(side)) prev.classList.remove('tail');
    var row = document.createElement('div'), b = document.createElement('div');
    row.className = 'm ' + side + ' tail' + (cls ? ' ' + cls : '');
    b.className = 'b'; b.textContent = m.text; row.appendChild(b); log.appendChild(row); return row;
  }
  function pull(first) {
    return fetch(API + '/chat/get?tid=' + tid + '&after=' + last).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) return;
      var stick = near() || first, added = false;
      oseen = j.oseen || 0;
      j.list.forEach(function (m) {
        if (m.id > last) last = m.id;
        if (seen[m.id]) return; seen[m.id] = 1;
        if (m.who === 'v') {   // 轮询赶在发送回调前拿到自己的消息：认领本地那个气泡，不重复画
          var mine = [].slice.call(log.querySelectorAll('.m.me:not([data-id])')).filter(function (x) { return x.firstChild.textContent === m.text; })[0];
          if (mine) { mine.dataset.id = m.id; mine.dataset.ts = m.ts; mine.classList.remove('pend'); return; }
        }
        var el = add(m); el.dataset.id = m.id; el.dataset.ts = m.ts; added = true;
      });
      mark();
      if (added && stick) log.scrollTop = log.scrollHeight;
    }).catch(function () {});
  }
  function fit() { tx.style.height = 'auto'; tx.style.height = Math.min(tx.scrollHeight, 140) + 'px'; go.disabled = !tx.value.trim() || busy; }
  tx.addEventListener('input', fit);
  tx.addEventListener('keydown', function (e) {
    var touch = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !touch) { e.preventDefault(); f.requestSubmit(); }
  });
  function fail(el, text, msg) {
    el.classList.remove('pend'); el.classList.add('fail');
    var n = document.createElement('div'); n.className = 'fl'; n.textContent = msg + '，点气泡重试'; el.after(n);
    el.onclick = function () { tx.value = text; fit(); n.remove(); el.remove(); tx.focus(); };
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = tx.value.trim(); if (!text || busy) return;
    busy = true; go.disabled = true;
    var name = $('nm').value.trim(), contact = $('ct').value.trim();
    LS.set('chat:name', name); LS.set('chat:contact', contact);
    tx.value = ''; fit();
    pull(false).then(function () {   // 先把你已经回的消息拉下来，再画自己这条，保证顺序
    var el = add({ who: 'v', text: text, ts: Date.now() }, 'pend'); log.scrollTop = log.scrollHeight;
    fetch(API + '/chat/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tid: tid, text: text, name: name, contact: contact, hp: $('hp').value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (j) {
        busy = false;
        if (j && j.ok) { el.classList.remove('pend'); if (j.id) { el.dataset.id = j.id; el.dataset.ts = j.ts; seen[j.id] = 1; } mark(); }
        else fail(el, text, j && j.e === 'rate' ? '发得太快了' : '没发出去');
        fit();
      }).catch(function () { busy = false; fail(el, text, '网络不通'); fit(); });
    });
  });
  pull(true).then(function () { log.scrollTop = log.scrollHeight; });
  setInterval(function () { if (!document.hidden) pull(false); }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(false); });
  window.addEventListener('focus', function () { pull(false); });
})();
</script>
</body>
</html>
