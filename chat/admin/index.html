<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a1c20">
<title>私信收件箱</title>
<link rel="icon" href="/chefdao/assets/cu.svg" type="image/svg+xml">
<style>
:root{--bg:#1a1c20;--card:#23262b;--line:rgba(214,211,205,.1);--text:#d6d3cd;--dim:#9a978f;--dim-2:#74726c;--me:#3b4b44;--accent:#b9c9bb;--dot:#d9a86c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;display:flex;-webkit-text-size-adjust:100%}
#side{width:320px;flex:none;border-right:1px solid var(--line);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 0 16px}
#side h1{margin:0 18px 10px;font-size:20px;font-weight:600;color:#ebe8e1}
.th{display:block;width:100%;text-align:left;padding:10px 18px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer}
.th:hover,.th.on{background:var(--card)}
.th b{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.th b i{width:8px;height:8px;border-radius:50%;background:var(--dot);flex:none}
.th b em{margin-left:auto;font-style:normal;font-weight:400;font-size:12.5px;color:var(--dim-2)}
.th span{display:block;font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px;color:var(--dim-2)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;border-bottom:1px solid var(--line)}
#bar h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar small{display:block;font-size:13px;font-weight:400;color:var(--dim-2)}
#bar button{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim);font:inherit;font-size:14px;cursor:pointer}
#back{display:none}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 8px}
.m{display:flex;margin:0 0 12px}
.m.o{justify-content:flex-end}
.b{max-width:80%;padding:9px 14px;border-radius:18px;background:var(--card);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.m.o .b{background:var(--me);border-bottom-right-radius:6px}
.m.v .b{border-bottom-left-radius:6px}
.t{display:block;margin-top:2px;font-size:12px;color:var(--dim-2)}
.m.o .t{text-align:right}
.rd{margin:-6px 4px 12px 0;text-align:right;font-size:12.5px;color:var(--dim-2)}
form{flex:none;display:flex;gap:10px;align-items:flex-end;padding:8px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
textarea{flex:1;min-width:0;resize:none;max-height:150px;min-height:46px;padding:10px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;line-height:1.55;outline:none}
button.send{flex:none;height:46px;padding:0 20px;border:0;border-radius:23px;background:var(--accent);color:#1a1c20;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
button.send:disabled{opacity:.35}
.ph{margin:auto;color:var(--dim-2);padding:20px;text-align:center}
@media (max-width:760px){
  #side{width:100%;border-right:0}
  #main{display:none;width:100%}
  body.open #side{display:none}
  body.open #main{display:flex}
  #back{display:inline-block}
}
</style>
</head>
<body>
<aside id="side"><h1>私信收件箱</h1><div id="ls"></div></aside>
<section id="main">
  <div id="bar"><button id="back">‹ 返回</button><h2 id="ttl">选一个会话</h2><button id="del" style="display:none">删除</button></div>
  <div id="log"><div class="ph">左边选一个会话</div></div>
  <form id="f" style="display:none"><textarea id="tx" rows="1" maxlength="1500" placeholder="回复…" aria-label="回复"></textarea><button class="send" id="go" type="submit" disabled>发送</button></form>
</section>
<script>
(function () {
  var API = 'https://stats.cumusic.work', $ = function (i) { return document.getElementById(i); };
  var KEY = ''; try { KEY = localStorage.getItem('insights:key') || ''; } catch (e) {}
  if (!KEY) { KEY = prompt('粘贴管理钥匙（同 Insights 的钥匙）') || ''; if (KEY) try { localStorage.setItem('insights:key', KEY); } catch (e) {} }
  var H = { Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
  var cur = '', last = 0, seen = {}, tm, vseen = 0;
  // 已读：访客打开页面后，你最后一条回复下面显示「对方已读」
  function mark() {
    var old = $('log').querySelector('.rd'); if (old) old.remove();
    var mine = $('log').querySelectorAll('.m.o'), r = mine[mine.length - 1];
    if (r && +r.dataset.ts <= vseen) { var d = el('div', 'rd', '对方已读'); r.after(d); }
  }
  function hm(ts) { var d = new Date(ts), p = function (n) { return (n < 10 ? '0' : '') + n; }, n = new Date(); return (d.toDateString() === n.toDateString() ? '' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + p(d.getHours()) + ':' + p(d.getMinutes()); }
  function api(path, opt) { return fetch(API + path, Object.assign({ headers: H }, opt || {})).then(function (r) { if (r.status === 401) { try { localStorage.removeItem('insights:key'); } catch (e) {} throw new Error('key'); } return r.json(); }); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function title(t) { return t.name || '匿名访客'; }
  function loadList() {
    return api('/chat/list').then(function (j) {
      var ls = $('ls'); ls.textContent = '';
      if (!j.list.length) { ls.appendChild(el('div', 'empty', '还没有人来聊。链接：cumusic.work/chat')); return; }
      j.list.forEach(function (t) {
        var b = el('button', 'th' + (t.tid === cur ? ' on' : '')), h = el('b'), un = t.last_who === 'v' && t.last > t.o_seen;
        if (un) h.appendChild(el('i'));
        h.appendChild(el('span', '', title(t))); h.lastChild.style.cssText = 'color:inherit;font-size:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
        h.appendChild(el('em', '', hm(t.last)));
        b.appendChild(h); b.appendChild(el('span', '', (t.last_who === 'o' ? '我：' : '') + (t.lt || '')));
        b.onclick = function () { open(t.tid, t); };
        ls.appendChild(b);
      });
    }).catch(function (e) { if (e.message === 'key') $('ls').textContent = '钥匙不对，刷新后重新粘贴'; });
  }
  function addMsg(m) {
    var row = el('div', 'm ' + m.who), b = el('div', 'b', m.text); row.dataset.ts = m.ts; b.appendChild(el('span', 't', hm(m.ts))); row.appendChild(b); $('log').appendChild(row);
  }
  function pull(first) {
    if (!cur) return Promise.resolve();
    var tid = cur;
    return api('/chat/get?tid=' + tid + '&after=' + last).then(function (j) {
      if (tid !== cur || !j.ok) return;
      if (first) { $('log').textContent = ''; var th = j.th || {}; $('ttl').textContent = ''; var s = el('span', '', (th.name || '匿名访客')); $('ttl').appendChild(s); var info = [th.contact, th.geo].filter(Boolean).join(' · '); if (info) $('ttl').appendChild(el('small', '', info)); }
      vseen = (j.th && j.th.v_seen) || 0;
      var stick = first || $('log').scrollHeight - $('log').scrollTop - $('log').clientHeight < 120, add = false;
      j.list.forEach(function (m) { if (m.id > last) last = m.id; if (seen[m.id]) return; seen[m.id] = 1; addMsg(m); add = true; });
      mark();
      if ((add && stick) || first) $('log').scrollTop = $('log').scrollHeight;
    }).catch(function () {});
  }
  function open(tid) {
    cur = tid; last = 0; seen = {}; location.hash = tid;
    document.body.classList.add('open'); $('f').style.display = 'flex'; $('del').style.display = '';
    pull(true).then(loadList);
  }
  $('back').onclick = function () { document.body.classList.remove('open'); cur = ''; history.replaceState(null, '', location.pathname); loadList(); };
  $('del').onclick = function () {
    if (!cur || !confirm('删除整个会话？删除后无法恢复。')) return;
    api('/chat/del', { method: 'POST', body: JSON.stringify({ tid: cur }) }).then(function () { cur = ''; $('log').innerHTML = '<div class="ph">已删除</div>'; $('f').style.display = 'none'; $('del').style.display = 'none'; $('ttl').textContent = '选一个会话'; document.body.classList.remove('open'); loadList(); });
  };
  var tx = $('tx'), go = $('go');
  function fit() { tx.style.height = 'auto'; tx.style.height = Math.min(tx.scrollHeight, 150) + 'px'; go.disabled = !tx.value.trim(); }
  tx.addEventListener('input', fit);
  tx.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('f').requestSubmit(); } });
  $('f').addEventListener('submit', function (e) {
    e.preventDefault(); var text = tx.value.trim(); if (!text || !cur) return; go.disabled = true;
    api('/chat/send', { method: 'POST', body: JSON.stringify({ tid: cur, text: text }) }).then(function (j) {
      if (j && j.ok) { tx.value = ''; fit(); pull(false).then(loadList); } else { go.disabled = false; alert('发送失败'); }
    }).catch(function () { go.disabled = false; alert('发送失败'); });
  });
  loadList().then(function () { var h = (location.hash || '').slice(1); if (/^[a-z0-9]{12,40}$/.test(h)) open(h); });
  setInterval(function () { if (document.hidden) return; pull(false); loadList(); }, 5000);
})();
</script>
</body>
</html>
