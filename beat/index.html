<style>
/* 深红暖黑：不用纯黑纯白，强调色是压低饱和的酒红 */
:root{
  --bg:#150d0e;
  --bg-soft:#1e1415;
  --bg-card:#211617;
  --surface:rgba(255,232,226,.04);
  --surface-hi:rgba(255,232,226,.075);
  --surface-on:rgba(255,232,226,.12);
  --text:#ede3dd;
  --text-2:#a99791;
  --text-3:#7a6863;
  --border:rgba(237,227,221,.09);
  --border-hi:rgba(237,227,221,.2);
  --red:#b8282f;
  --red-hi:#cf363d;
  --red-soft:rgba(184,40,47,.16);
  --red-deep:#4a1215;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,1,.3,1);
  --ios:cubic-bezier(.32,.72,0,1);
  --maxw:1120px;
  --bar:84px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:720px;pointer-events:none;z-index:-1;
  background:radial-gradient(70% 60% at 20% 0%,rgba(150,34,40,.14),transparent 70%)}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;-webkit-user-drag:none;user-select:none}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px;border-radius:6px}
.press{transition:transform .14s ease-out,background-color .2s,color .2s,border-color .2s,opacity .2s}
.press:active{transform:scale(.96)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* ── 顶栏 ── */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:max(14px,env(safe-area-inset-top));height:70px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:14px}
.brand svg{width:26px;height:26px}
.top nav{display:flex;gap:6px;font-size:13px;font-weight:600;letter-spacing:.08em}
.top nav a{padding:6px 12px;border-radius:16px;color:var(--text-2)}
.top nav a:hover{color:var(--text);background:var(--surface-hi)}
.top nav a.on{color:var(--text);background:var(--surface-hi)}

/* ── 头部 ── */
.hero{padding:44px 0 34px;max-width:720px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--text-3);text-transform:uppercase}
.hero h1{font-size:clamp(40px,7vw,68px);line-height:1;font-weight:850;letter-spacing:-.035em;margin:12px 0 14px}
.hero h1 span{color:var(--text-2);font-weight:300}
.hero p{color:var(--text-2);font-size:17px}
.big-search{display:block;position:relative;margin-top:26px}
.big-search input{width:100%;height:56px;border-radius:28px;border:1px solid var(--border-hi);background:rgba(30,20,21,.7);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:0 22px 0 52px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .3s}
.big-search input:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.big-search svg{position:absolute;z-index:1;pointer-events:none;left:20px;top:19px;width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:2}
.hero .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:22px;font-weight:650;font-size:15px;white-space:nowrap}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.primary:hover{background:#f3e9e3}
.btn.ghost{background:var(--surface-hi)}
.btn.ghost:hover{background:var(--surface-on)}


/* ── 封面（没传封面的自动生成一张） ── */
.art{position:relative;overflow:hidden;background:var(--bg-soft);aspect-ratio:1;container-type:inline-size}
.art img{width:100%;height:100%;object-fit:cover}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10%;
  background:radial-gradient(120% 90% at var(--x,30%) 0%,hsl(var(--h) 38% 26%),hsl(calc(var(--h) + 8) 30% 11%) 72%)}
.gen b{font-size:calc(var(--fs,20) * 1cqw);overflow-wrap:anywhere;font-weight:850;letter-spacing:-.03em;line-height:1;color:#f1e6e1;word-break:break-word;text-transform:uppercase}
.gen.mini{justify-content:center;align-items:center;padding:0}.gen.mini b{font-size:46cqw;overflow-wrap:normal}
.gen i{font-style:normal;font-size:max(6px,6cqw);font-weight:700;letter-spacing:.2em;color:rgba(241,230,225,.6)}


.play-o{position:absolute;inset:0;z-index:1;display:grid;place-items:center;background:rgba(21,13,14,.4);opacity:0;transition:opacity .25s}
.play-o span{width:30px;height:30px;border-radius:50%;background:var(--text);display:grid;place-items:center;transform:scale(.8);transition:transform .35s var(--ease)}
.play-o svg{width:13px;height:13px;fill:var(--bg)}
.play-o .pa{display:none}

/* ── 筛选 ── */
.filters{position:sticky;top:0;z-index:5;padding:12px 0 10px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left)));
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));
  background:rgba(21,13,14,.84);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid transparent;transition:border-color .2s}
.filters.stuck{border-bottom-color:var(--border)}
.row1{display:flex;gap:10px;align-items:center}
.row1 h2{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.row1 h2 small{font-size:14px;font-weight:500;color:var(--text-3);margin-left:8px;font-variant-numeric:tabular-nums;letter-spacing:0}
select.sort{height:38px;border-radius:19px;border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:14px;color:var(--text-2);cursor:pointer}
.chips{display:flex;gap:8px;align-items:center;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;font-size:14px;font-weight:550;border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.chip:hover{border-color:var(--border-hi);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip small{font-size:12px;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.clear{border-style:dashed}

/* ── 曲目表 ── */
.trk{display:grid;grid-template-columns:52px minmax(0,1fr) 72px 44px 48px 96px;gap:16px;align-items:center}
.list{list-style:none;padding:6px 0 calc(var(--bar) + 60px + env(safe-area-inset-bottom))}
.trk{padding:9px 10px;border-radius:12px;cursor:pointer;transition:background-color .2s;opacity:0;transform:translateY(10px);animation:up .5s var(--ease) forwards;animation-delay:calc(var(--i,0) * 28ms)}
.trk:hover{background:var(--surface)}
.trk.on{background:var(--surface-hi)}
.trk.flash{animation:up .5s var(--ease) forwards,flash 1.8s var(--ease)}
@keyframes flash{0%,40%{background:var(--surface-on)}}
.trk .art{width:52px;border-radius:8px}
.trk:hover .play-o{opacity:1}.trk:hover .play-o span{transform:none}
.trk.on .play-o{opacity:1}.trk.on .play-o span{transform:none}
.trk.on.playing .play-o .pl{display:none}
.trk.on.playing .play-o .eq{display:flex}
.eq{display:none;gap:2px;align-items:flex-end;justify-content:center;height:12px}
.eq i{width:2.5px;background:var(--bg);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.trk .t{min-width:0}
.trk .t b{display:block;font-weight:650;font-size:16px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk.on .t b{color:#e7a9a6}
.trk .t .sub{font-size:13px;color:var(--text-3);margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trk .c{text-align:center;font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.buy{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;font-size:14px;font-weight:600;
  border:1px solid var(--border-hi);color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:hover,.trk.on .buy{border-color:var(--red);background:var(--red-soft)}
.buy svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;color:var(--text-2);padding:60px 0;font-size:15px}
.empty button{margin-top:14px}
footer{color:var(--text-3);font-size:13px;text-align:center;padding:0 0 calc(var(--bar) + 40px + env(safe-area-inset-bottom));margin-top:-40px;letter-spacing:.04em}

/* ── 底部播放条 ── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(26,17,18,.9);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border-top:1px solid var(--border);transform:translateY(110%);transition:transform .55s var(--ios)}
.bar.show{transform:none}
.bar .seekwrap{position:absolute;left:0;right:0;top:-11px}
.bar .in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;
  padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.now .art{width:52px;flex:none;border-radius:8px}
.now .t{min-width:0}
.now .t b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.now .t span{display:block;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ctl button:hover{background:var(--surface-hi)}
.ctl button svg{width:20px;height:20px;fill:currentColor}
.ctl .pp{width:48px;height:48px;background:var(--text);color:var(--bg)}
.ctl .pp:hover{background:#f3e9e3}
.ctl .pp .pa{display:none}
.bar.playing .pp .pl{display:none}
.bar.playing .pp .pa{display:block}
.right{display:flex;align-items:center;justify-content:flex-end;gap:14px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.track{height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track .rail2{position:relative;width:100%;height:3px;background:var(--surface-on);transition:height .2s}
.track .buf,.track .fill{position:absolute;left:0;top:0;bottom:0;width:0}
.track .buf{background:rgba(237,227,221,.14)}
.track .fill{background:var(--red-hi)}
.track .fill::after{content:"";position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#f3e9e3;transform:scale(0);transition:transform .2s}
.track:hover .rail2,.track.drag .rail2{height:5px}
.track:hover .fill::after,.track.drag .fill::after{transform:scale(1)}

/* ── 授权弹窗 ── */
.lic{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(12,6,7,.7);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.lic.show{opacity:1;pointer-events:auto}
.lic .box{width:min(900px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:20px;
  padding:26px 28px 24px;transform:translateY(18px) scale(.98);transition:transform .5s var(--ios)}
.lic.show .box{transform:none}
.lic .hd{display:flex;align-items:center;gap:16px}
.lic .hd .art{width:64px;border-radius:10px;flex:none}
.lic .hd div.tt{flex:1;min-width:0}
.lic h2{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.lic .hd p{font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lic .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);flex:none;align-self:flex-start}
.lic .x:hover{background:var(--surface-hi);color:var(--text)}
.lic .x svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0 4px}
.tier{text-align:left;padding:16px 18px;border-radius:14px;background:var(--surface-hi);border:1.5px solid transparent;transition:border-color .2s,background-color .2s,transform .2s var(--ease)}
.tier:hover{background:var(--surface-on)}
.tier[aria-checked="true"]{border-color:var(--red-hi);background:var(--red-soft)}
.tier b{display:block;font-size:16px;font-weight:700}
.tier .p{display:block;font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tier small{display:block;font-size:12.5px;color:var(--text-2);margin-top:2px}
.terms{border-top:1px solid var(--border);margin-top:18px;padding-top:16px}
.terms h3{font-size:15px;font-weight:700;margin-bottom:12px}
.terms ul{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.terms li{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--text-2);line-height:1.45}
.terms li svg{width:20px;height:20px;flex:none;stroke:#e7a9a6;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lic .ft{display:flex;align-items:center;gap:12px;border-top:1px solid var(--border);margin-top:18px;padding-top:18px}
.lic .ft .tot{flex:1;font-size:13px;color:var(--text-2)}
.lic .ft .tot b{display:block;font-size:24px;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.3}
.lic .ft .btn{height:48px;padding:0 28px}
.lic .note{font-size:12.5px;color:var(--text-3);margin-top:10px;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:30;
  background:var(--text);color:var(--bg);font-size:14px;font-weight:600;padding:10px 18px;border-radius:20px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .35s var(--ios);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .trk{grid-template-columns:52px minmax(0,1fr) 72px 96px}
  .trk .c.d,.trk .c.k{display:none}
}
@media (max-width:640px){
  .hero{padding:22px 0 18px}
  .hero p{font-size:15px}
  .big-search input{height:50px}
  .big-search svg{top:16px}
  .trk{grid-template-columns:48px minmax(0,1fr) auto;gap:12px;padding:8px 6px;margin:0 -6px}
  .trk .art{width:48px}
  .trk .c{display:none}
  .trk .t .sub .mm{display:inline}
  .buy{height:34px;padding:0 12px}
  .bar .in{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .right{display:none}
  .ctl .prev{display:none}
  .lic{place-items:end center;padding:0}
  .lic .box{border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-height:92vh}
  .lic h2{font-size:20px}
  .tiers{grid-template-columns:1fr;gap:8px;margin-top:16px}
  .tier{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 14px}
  .tier .p{grid-column:2;grid-row:1/3;margin:0;font-size:17px}
  .terms ul{grid-template-columns:1fr 1fr;gap:10px 12px}
  .terms li{font-size:13px}
}
.mm{display:none}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.trk{opacity:1;transform:none}}
</style>
</head>
<body oncontextmenu="return false">
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" aria-label="CU MUSIC 主页">
      <svg viewBox="272 164 456 456" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="none" stroke="#ede3dd" stroke-width="46" stroke-linecap="round">
          <path d="M 592.06,203.25 A 210,210 0 1 1 407.94,203.25"/>
          <path d="M 619.61,478.90 A 147.84,147.84 0 1 1 619.61,305.10"/>
        </g>
      </svg>CU MUSIC
    </a>
    <nav><a class="on" href="/beat/">BEATS</a><a href="/uin/">UIN</a></nav>
  </header>

  <section class="hero">
    <div class="eyebrow">CU MUSIC × Uin 尤因</div>
    <h1>Beats <span id="stat"></span></h1>
    <label class="big-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜曲名、风格、艺人、BPM、调性" autocomplete="off"></label>
    <div class="actions">
      <button class="btn primary press" id="playAll"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>全部播放</button>
      <button class="btn ghost press" id="shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-2.4 3.2-1.25-1.67L13.4 6H17V3zM3 6h4l9.4 12H17v-3l4 4-4 4v-3h-1.6L6 8H3V6zm0 10h3l2.35-3.13 1.25 1.66L7 18H3v-2z"/></svg>随机</button>
    </div>
  </section>

  <section class="filters" id="filters" aria-label="筛选">
    <div class="row1"><h2>全部伴奏<small id="count"></small></h2>
      <select class="sort" id="sort" aria-label="排序">
        <option value="new">最新</option>
        <option value="pop">最热门</option>
        <option value="bpm-asc">BPM 从慢到快</option>
        <option value="bpm-desc">BPM 从快到慢</option>
      </select>
    </div>
    <div class="chips" id="genreChips" aria-label="风格"></div>
  </section>
  <ol class="list" id="list"></ol>
  <footer>CU MUSIC × UIN</footer>
</div>

<div class="bar" id="bar">
  <div class="seekwrap"><div class="track" id="seek"><div class="rail2"><div class="buf" id="buf"></div><div class="fill" id="fill"></div></div></div></div>
  <div class="in">
    <div class="now"><div class="art" id="barCv"></div><div class="t"><b id="barT"></b><span id="barS"></span></div></div>
    <div class="ctl">
      <button class="prev press" id="prev" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="pp press" id="pp" aria-label="播放/暂停"><svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button class="next press" id="next" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div class="right"><span><span id="cur">0:00</span> / <span id="dur">0:00</span></span><button class="buy press" id="barAsk"></button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const GENRE_ORDER = ['Trap','R&B','Hyperpop','K-Pop','UK Rap','Drill','Lofi','EDM','House','Pop','Plugg','Jersey','Afro','Boom Bap','Rage'];
// 伴奏列表和音频在 stats.cumusic.work（在 /beat/admin/ 上传管理）
const API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787' : 'https://stats.cumusic.work';
const ARTIST = 'Uin';   // 前台只署 Uin，品牌是 CU MUSIC
let BEATS = [];
const st = {genres:new Set(), tags:new Set(), q:'', sort:'new', tagsOpen:false};
let view = [];          // 当前筛选后的列表
let queue = [];         // 播放队列（开始播放时的列表）
let cur = null;         // 正在播放的 beat
let firstPaint = true;
const audio = new Audio();

// ── 匿名播放统计（stats.cumusic.work，Insights 的「伴奏」页看）──
// 编号沿用审听页和价格页的 review:lid；打开过 Insights 或伴奏管理的设备不统计
const trk = (() => {
  let off = false, lid = 'ANON';
  try {
    off = localStorage.getItem('review:me') === '1' || !!localStorage.getItem('insights:key');
    lid = localStorage.getItem('review:lid') || '';
    if (!lid) { lid = Math.random().toString(36).slice(2, 5).toUpperCase(); localStorage.setItem('review:lid', lid); }
  } catch (e) {}
  const ua = navigator.userAgent;
  let device = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '其他';
  if (/MicroMessenger/i.test(ua)) device += ' · 微信';
  const send = (path, o, beacon) => {
    if (off) return;
    const body = JSON.stringify({ lid, ...o });
    try {
      if (beacon && navigator.sendBeacon) navigator.sendBeacon(API + path, new Blob([body], { type: 'text/plain' }));
      else fetch(API + path, { method: 'POST', body, keepalive: true }).catch(() => {});
    } catch (e) {}
  };
  let s = null;   // 当前这次播放：{pid, beat, heard, sent, last}
  const flush = beacon => {
    if (!s || s.heard - s.sent < 1 || s.heard < 10) return;
    s.sent = s.heard;
    send('/bp', { pid: s.pid, beat: s.beat, sec: Math.round(s.heard), dur: Math.round(audio.duration || 0), device }, beacon);
  };
  addEventListener('pagehide', () => flush(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(true); });
  return {
    start(b) { flush(true); s = { pid: Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6), beat: b.id, heard: 0, sent: 0, last: null }; },
    // 只累计真正播过的时间，拖进度条不算
    tick() {
      if (!s) return;
      const t = audio.currentTime, d = s.last == null ? 0 : t - s.last; s.last = t;
      if (d > 0 && d < 1.5 && !audio.paused) s.heard += d;
      if ((s.sent < 10 && s.heard >= 10) || s.heard - s.sent >= 30) flush(false);
    },
    flush() { if (s) s.last = null; flush(false); },
    buy(b, kind, license) { send('/bb', { beat: b.id, kind, license }, kind === 'copy'); },
  };
})();
audio.preload = 'none';

const fmt = s => { s = Math.max(0, Math.round(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const PLAY_O = '<div class="play-o"><span><svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><div class="eq"><i></i><i></i><i></i></div></span></div>';
// 封面：传了就用，没传按曲名生成一张深红系的字封面（每首色相略不同）
function art(b, size, extra = ''){
  if (b.cover) return `<img src="${API}/bc/${esc(b.cover)}" alt="" loading="lazy" draggable="false">${extra}`;
  const h = hash(b.id), hue = 345 + h % 30, x = 20 + h % 60;
  // 小图只放首字，大图放全名
  if (size <= 64) return `<div class="gen mini" style="--h:${hue % 360};--x:${x}%"><b>${esc([...b.title][0].toUpperCase())}</b></div>${extra}`;
  return `<div class="gen" style="--h:${hue % 360};--x:${x}%;--fs:${b.title.length > 12 ? 12 : b.title.length > 7 ? 15 : 20}"><b>${esc(b.title)}</b><i>CU MUSIC</i></div>${extra}`;
}
const meta = b => [b.bpm ? b.bpm + ' BPM' : '', b.key || ''].filter(Boolean).join(' · ');

fetch(API + '/beats', {cache:'no-cache'}).then(r => r.json()).then(d => {
  BEATS = (d.beats || []).filter(b => b && b.file);
  BEATS.forEach(b => { b.genres = b.genres || []; b.tags = b.tags || []; });
  init();
}).catch(() => { $('list').innerHTML = '<li class="empty">加载失败，请刷新</li>'; });

function init(){
  $('stat').textContent = BEATS.length ? BEATS.length : '';
  $('q').oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
  $('sort').onchange = e => { st.sort = e.target.value; render(); };
  render();
  if (location.hash.length > 1) {
    const b = BEATS.find(x => x.id === decodeURIComponent(location.hash.slice(1)));
    const li = b && document.querySelector(`.trk[data-id="${CSS.escape(b.id)}"]`);
    if (li) { setTimeout(() => li.scrollIntoView({block:'center', behavior:'smooth'}), 300); li.classList.add('flash'); }
  }
}

function clearAll(){ st.genres.clear(); st.tags.clear(); st.q=''; $('q').value=''; render(); }

function matches(b, skip){
  if (skip !== 'g' && st.genres.size && !b.genres.some(g => st.genres.has(g))) return false;
  if (skip !== 't' && st.tags.size && !b.tags.some(t => st.tags.has(t))) return false;
  if (st.q) {
    const hay = [b.title, ...b.genres, ...b.tags, b.key||'', b.bpm ? b.bpm+'bpm '+b.bpm : '', ARTIST].join(' ').toLowerCase();
    if (!st.q.split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

// 每个标签旁边的数字 = 选它之后能看到几首（按其他筛选条件算）
function chipRow(el, key, all, sel, order, limit, clear){
  const pool = BEATS.filter(b => matches(b, key));
  const cnt = {}; all.forEach(x => cnt[x] = 0);
  pool.forEach(b => b[key==='g'?'genres':'tags'].forEach(x => cnt[x] = (cnt[x]||0) + 1));
  let items = [...all].sort((a,b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia >= 0 || ib >= 0) return (ia<0?99:ia) - (ib<0?99:ib);
    return cnt[b] - cnt[a] || a.localeCompare(b);
  });
  items = items.filter(x => cnt[x] > 0 || sel.has(x));
  if (!items.length && !clear) { el.hidden = true; return; }
  el.hidden = false;
  const more = limit && items.length > limit && !st.tagsOpen;
  const shown = more ? items.slice(0, limit) : items;
  el.innerHTML = (clear ? '<button class="chip clear press" data-clear>清除筛选</button>' : '') + shown.map(x =>
    `<button class="chip press" data-v="${esc(x)}" aria-pressed="${sel.has(x)}">${esc(x)}<small>${cnt[x]}</small></button>`).join('')
    + (more ? `<button class="chip press" data-more>更多 +${items.length - limit}</button>` : '');
  el.onclick = e => {
    const c = e.target.closest('button'); if (!c) return;
    if (c.hasAttribute('data-clear')) return clearAll();
    if (c.hasAttribute('data-more')) { st.tagsOpen = true; render(); return; }
    const v = c.dataset.v; sel.has(v) ? sel.delete(v) : sel.add(v); render();
  };
}

function render(){
  const allG = new Set(), allT = new Set();
  BEATS.forEach(b => { b.genres.forEach(g => allG.add(g)); b.tags.forEach(t => allT.add(t)); });
  const filtered = st.genres.size || st.tags.size || st.q;
  chipRow($('genreChips'), 'g', allG, st.genres, GENRE_ORDER, 0, filtered);

  view = BEATS.filter(b => matches(b));
  const byDate = (a,b) => (b.date||'').localeCompare(a.date||'');
  if (st.sort === 'new') view.sort(byDate);
  else if (st.sort === 'pop') view.sort((a,b) => (b.pop||0) - (a.pop||0) || (b.plays||0) - (a.plays||0) || byDate(a,b));
  else view.sort((a,b) => ((a.bpm||999) - (b.bpm||999)) * (st.sort==='bpm-asc' ? 1 : -1) || byDate(a,b));
  $('count').textContent = BEATS.length ? (filtered ? `${view.length} / ${BEATS.length}` : `${view.length}`) : '';

  if (!BEATS.length) { $('list').innerHTML = '<li class="empty">暂无伴奏</li>'; return; }
  if (!view.length) { $('list').innerHTML = '<li class="empty">没有符合条件的伴奏<br><button class="btn ghost press" data-clearall>清除筛选</button></li>';
    $('list').querySelector('[data-clearall]').onclick = clearAll; return; }

  $('list').innerHTML = view.map((b,i) => {
    const sub = [b.genres[0], ...b.tags.slice(0, 1)].filter(Boolean).join(' · ');
    const mm = meta(b);
    return `<li class="trk" data-id="${esc(b.id)}" style="--i:${firstPaint ? Math.min(i, 16) : Math.min(i, 8)}">
      <div class="art">${art(b, 56, PLAY_O)}</div>
      <div class="t"><b>${esc(b.title)}</b><div class="sub">${mm ? `<span class="mm">${esc(mm)}${sub ? ' · ' : ''}</span>` : ''}${esc(sub)}</div></div>
      <span class="c">${b.bpm ? b.bpm + ' BPM' : ''}</span>
      <span class="c k">${esc(b.key || '')}</span>
      <span class="c d">${b.duration ? fmt(b.duration) : ''}</span>
      <span style="text-align:right"><button class="buy press" data-ask aria-label="购买 ${esc(b.title)}">${LICENSES[0].price}</button></span>
    </li>`;
  }).join('');
  firstPaint = false;
  markPlaying();
}

$('list').addEventListener('click', e => {
  const li = e.target.closest('.trk'); if (!li) return;
  const b = BEATS.find(x => x.id === li.dataset.id);
  if (e.target.closest('[data-ask]')) { openLic(b); return; }
  if (cur === b) { toggle(); return; }
  queue = view.slice(); play(b);
});

function play(b){
  trk.start(b);
  cur = b;
  audio.src = API + '/ba/' + b.file;
  audio.play().catch(() => {});
  $('bar').classList.add('show');
  $('barCv').innerHTML = art(b, 52);
  $('barT').textContent = b.title;
  $('barS').textContent = [ARTIST, meta(b)].filter(Boolean).join(' · ');
  $('barAsk').textContent = '购买 ' + LICENSES[0].price;
  $('fill').style.width = $('buf').style.width = '0';
  $('cur').textContent = '0:00'; $('dur').textContent = b.duration ? fmt(b.duration) : '0:00';
  if ('mediaSession' in navigator) {
    const src = b.cover ? API + '/bc/' + b.cover : new URL('img/uin.jpg', location.href).href;
    navigator.mediaSession.metadata = new MediaMetadata({title:b.title, artist:ARTIST, album:'CU MUSIC Beats', artwork:[{src, sizes:'600x600', type:'image/jpeg'}]});
  }
  if (window.gtag) gtag('event', 'beat_play', {beat: b.id});
  markPlaying();
}
function toggle(){ if (!cur) { $('playAll').click(); return; } audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
function step(d){
  if (!cur) return;
  const q = queue.length ? queue : view;
  if (d < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
  const i = q.indexOf(cur);
  const nb = q[(i + d + q.length) % q.length];
  if (nb) play(nb);
}
function markPlaying(){
  document.querySelectorAll('.trk').forEach(li => {
    const on = cur && li.dataset.id === cur.id;
    li.classList.toggle('on', !!on); li.classList.toggle('playing', !!on && !audio.paused);
  });
  $('bar').classList.toggle('playing', !audio.paused);
}

$('playAll').onclick = () => { if (!view.length) return; queue = view.slice(); play(queue[0]); };
$('shuffle').onclick = () => {
  if (!view.length) return;
  queue = view.slice();
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [queue[i], queue[j]] = [queue[j], queue[i]]; }
  play(queue[0]);
};
$('pp').onclick = toggle;
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('barAsk').onclick = () => cur && openLic(cur);

audio.addEventListener('play', markPlaying);
audio.addEventListener('pause', () => { markPlaying(); trk.flush(); });
audio.addEventListener('ended', () => { trk.flush(); step(1); });
audio.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  trk.tick();
  if (dragging || !audio.duration) return;
  $('fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
  $('cur').textContent = fmt(audio.currentTime);
});
audio.addEventListener('progress', () => {
  if (audio.buffered.length && audio.duration) $('buf').style.width = (audio.buffered.end(audio.buffered.length - 1) / audio.duration * 100) + '%';
});
audio.addEventListener('error', () => { if (cur) toast('无法播放'); });

// 拖动进度条
let dragging = false;
const seek = $('seek');
const ratio = e => { const r = seek.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
seek.addEventListener('pointerdown', e => { if (!audio.duration) return; dragging = true; seek.classList.add('drag'); seek.setPointerCapture(e.pointerId); move(e); });
seek.addEventListener('pointermove', e => dragging && move(e));
seek.addEventListener('pointerup', e => { if (!dragging) return; dragging = false; seek.classList.remove('drag'); audio.currentTime = ratio(e) * audio.duration; });
function move(e){ const p = ratio(e); $('fill').style.width = p * 100 + '%'; $('cur').textContent = fmt(p * audio.duration); }

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea,button') || document.querySelector('.lic.show')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.code === 'ArrowRight' && e.shiftKey) step(1);
  else if (e.code === 'ArrowLeft' && e.shiftKey) step(-1);
});

// ── 授权：三档价格和条款，选好后复制一句话到微信付款 ──
const IC = {
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>',
  copies:'<svg viewBox="0 0 24 24"><path d="M5 5l6 7-6 7M11 5l6 7-6 7M17 5l3 3.5M17 19l3-3.5"/></svg>',
  stream:'<svg viewBox="0 0 24 24"><circle cx="12" cy="11" r="2"/><path d="M12 13v8M8.5 7.5a5 5 0 0 0 0 7M15.5 7.5a5 5 0 0 1 0 7M5.5 4.5a9 9 0 0 0 0 13M18.5 4.5a9 9 0 0 1 0 13"/></svg>',
  video:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>',
  live:'<svg viewBox="0 0 24 24"><circle cx="15.5" cy="8.5" r="4.5"/><path d="M12.3 11.7L4 20M6 15l3 3"/></svg>',
  radio:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l9-5M3 13h18M8 17h.01M12 17h.01"/></svg>',
};
const LICENSES = [
  { id:'basic', name:'Basic License', price:'¥168', files:'MP3',
    terms:[['mic','可用于录制歌曲'],['copies','发行最多 2,000 份'],['stream','线上播放 500,000 次'],['video','1 支 MV'],['live','可用于商业演出'],['radio','2 个电台播放']] },
  { id:'premium', name:'Premium License', price:'¥299', files:'MP3、WAV',
    terms:[['mic','可用于录制歌曲'],['copies','发行最多 3,000 份'],['stream','线上播放 500,000 次'],['video','1 支 MV'],['live','可用于商业演出'],['radio','2 个电台播放']] },
  { id:'exclusive', name:'Exclusive License', price:'议价', files:'MP3、WAV',
    terms:[['mic','可用于录制歌曲'],['copies','发行份数不限'],['stream','线上播放不限'],['video','MV 不限'],['live','可用于商业演出'],['radio','电台播放不限']] },
];
const lic = document.createElement('div');
lic.className = 'lic'; lic.setAttribute('role', 'dialog'); lic.setAttribute('aria-modal', 'true'); lic.setAttribute('aria-labelledby', 'licT');
lic.innerHTML = `<div class="box">
  <div class="hd"><div class="art" id="licCv"></div><div class="tt"><h2 id="licT">选择授权</h2><p id="licB"></p></div><button class="x" id="licX" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="tiers" role="radiogroup" aria-label="授权">${LICENSES.map((l, i) =>
    `<button class="tier" role="radio" data-i="${i}"><b>${l.name}</b><span class="p">${l.price}</span><small>${l.files}</small></button>`).join('')}</div>
  <div class="terms"><h3 id="licH"></h3><ul id="licU"></ul></div>
  <div class="ft"><div class="tot">合计<b id="licP"></b></div><button class="btn primary press" id="licGo"></button></div>
  <p class="note">点按钮复制购买信息，粘贴到微信发给我们</p>
</div>`;
document.body.appendChild(lic);
let licBeat = null, licI = 0;
function pickLic(i){
  licI = i; const l = LICENSES[i];
  lic.querySelectorAll('.tier').forEach((t, j) => t.setAttribute('aria-checked', j === i));
  $('licH').textContent = l.name + (l.id === 'exclusive' ? '' : `（${l.price}）`);
  $('licU').innerHTML = l.terms.map(([ic, t]) => `<li>${IC[ic]}<span>${t}</span></li>`).join('');
  $('licP').textContent = l.price;
  $('licGo').textContent = l.id === 'exclusive' ? '微信议价' : '微信购买';
}
function openLic(b){
  licBeat = b;
  $('licCv').innerHTML = art(b, 64);
  $('licT').textContent = b.title;
  $('licB').textContent = [ARTIST, meta(b)].filter(Boolean).join(' · ');
  pickLic(licI); lic.classList.add('show');
  setTimeout(() => lic.querySelector(`.tier[data-i="${licI}"]`).focus(), 50);
  trk.buy(b, 'open');
  if (window.gtag) gtag('event', 'beat_ask', {beat: b.id});
}
const closeLic = () => lic.classList.remove('show');
lic.addEventListener('click', e => {
  if (e.target === lic || e.target.closest('#licX')) return closeLic();
  const t = e.target.closest('.tier'); if (t) pickLic(+t.dataset.i);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && lic.classList.contains('show')) closeLic(); });
$('licGo').onclick = () => {
  const b = licBeat, l = LICENSES[licI];
  const text = `购买伴奏：《${b.title}》${ARTIST}\n授权：${l.name}（${l.price}，${l.files}）\ncumusic.work/beat#${b.id}`;
  const done = () => { closeLic(); toast('已复制，可粘贴到微信'); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  else fallback(text, done);
  trk.buy(b, 'copy', l.id);
  if (window.gtag) gtag('event', 'beat_buy', {beat: b.id, license: l.id});
};
function fallback(text, done){
  const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch { toast(text); } t.remove();
}
let tt;
function toast(s){ const t = $('toast'); t.textContent = s; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }

// 筛选栏吸顶后加一条细线
new IntersectionObserver(([e]) => $('filters').classList.toggle('stuck', e.intersectionRatio < 1), {threshold:[1], rootMargin:'-1px 0px 0px 0px'}).observe($('filters'));
})();
</script>
</body>
</html>
